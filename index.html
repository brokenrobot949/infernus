    if (act === 'temper') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const r = temperItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Tempered to +' + r.to + '.');
      refresh();
      return;
    }

    if (act === 'detail') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      town2OpenItemDetail(hero, item);
      return;
    }

    if (act === 'reforgeOpen') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const gate = canReforge(item);
      if (!gate.ok) { toast(gate.reason); return; }
      const cost = reforgeCost(item);
      const afford = hero.gold >= cost.gold && hero.ash >= cost.ash;
      openSheet({
        title: 'Reforge',
        body:
          '<div class="stack-s">' +
            '<div class="row" style="gap:8px">' + townBadge(item) + town2ChainIcon(item) + '<div>' + town2ItemLabel(item) + '</div></div>' +
            '<p class="small muted">Pick one affix to replace. Costs ' + fmtNum(cost.gold) + ' gold and ' + fmtNum(cost.ash) + ' Ash' +
              (afford ? '.' : ' — not enough to reforge.') +
            '</p>' +
            '<div class="stack-s">' +
              item.affixes.map(function (a, i) {
                return '<button type="button" class="row-between panel card-tap" data-act="reforgePick" data-idx="' + i + '"' +
                  (afford ? '' : ' disabled') + ' style="min-height:44px;width:100%">' +
                  '<span class="small">' + esc(town2AffixText(a)) + '</span>' +
                  '<span class="tiny muted">Replace</span>' +
                '</button>';
              }).join('') +
            '</div>' +
          '</div>',
        foot: '<button class="btn btn-block" data-act="close">Cancel</button>',
        onAct: function (a, n) {
          if (a === 'close') { closeSheet(); return; }
          if (a === 'reforgePick') {
            const idx = parseInt(n.dataset.idx, 10);
            const r = reforgeAffix(hero, item, idx);
            if (!r.ok) { toast(r.reason); return; }
            toast('Reforged: ' + town2AffixText(r.from) + ' → ' + town2AffixText(r.to));
            closeSheet();
            refresh();
          }
        }
      });
      return;
    }

    if (act === 'autosalvage') {
      if (!state.settings) state.settings = {};
      if (!state.settings.autoSalvage) state.settings.autoSalvage = { common: false, magic: false, rare: false };
      const r = node.dataset.rarity;
      state.settings.autoSalvage[r] = !state.settings.autoSalvage[r];
      save();
      refresh();
      return;
    }

    if (act === 'craft') {
      const slot = node.dataset.slot;
      const r = craftItem(hero, slot);
      if (!r.ok) { toast(r.reason); return; }
      toast('Crafted ' + (town2ItemName(r.item) || r.item.baseType) + '.');
      refresh();
      town2OpenItemDetail(hero, r.item);
      return;
    }

    if (act === 'rekindle') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const r = rekindleItem(hero, item);
      if (!r.ok) { toast(r.reason); return; }
      toast('Rekindled to ilvl ' + fmtNum(r.to) + '.');
      refresh();
      return;
    }

    if (act === 'markettab') { townMarketTab = node.dataset.tab; refresh(); return; }

    if (act === 'buy') {
      const item = (hero.market.stock || []).find(function (i) { return i.id === node.dataset.id; });
      if (!item) return;
      const r = buyItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Bought ' + (town2ItemName(item) || item.baseType) + '.');
      refresh();
      return;
    }

    if (act === 'sell') {
      const item = townFindInvItem(hero, node.dataset.id);
      if (!item) return;
      const r = sellItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Sold for ' + fmtNum(r.gold) + ' gold.');
      refresh();
      return;
    }

    if (act === 'sellbulk') {
      const rarity = node.dataset.rarity;
      const p = town4BulkSellPreview(hero, rarity);
      if (p.count <= 0) { toast('Nothing to sell.'); return; }
      confirmSheet({
        title: 'Sell ' + fmtNum(p.count) + ' item' + (p.count === 1 ? '' : 's') + '?',
        body: 'Sells for ' + fmtNum(p.gold) + ' gold total.',
        yes: 'Sell',
        danger: true,
        onYes: function () {
          let total = 0, sold = 0;
          p.items.forEach(function (it) {
            const r = sellItem(hero, it);
            if (r.ok) { total += r.gold; sold++; }
          });
          refresh();
          toast('Sold ' + fmtNum(sold) + ' item' + (sold === 1 ? '' : 's') + ' for ' + fmtNum(total) + ' gold.');
        }
      });
      return;
    }

    if (act === 'buySupply') {
      const id = node.dataset.id;
      const r = buySupply(hero, id);
      if (!r.ok) toast(r.reason); else toast('Bought ' + BALANCE.town.supplies[id].name + '.');
      refresh();
      return;
    }

    if (act === 'earlyRestock') {
      const r = buyEarlyRestock(hero);
      if (!r.ok) toast(r.reason); else toast('The Market restocked.');
      refresh();
      return;
    }

    if (act === 'buyBlackMarket') {
      const bm = hero.market.blackMarket;
      const boughtItem = bm && bm.item;
      const r = buyBlackMarket(hero);
      if (!r.ok) { toast(r.reason); return; }
      toast('Bought ' + (boughtItem ? (town2ItemName(boughtItem) || boughtItem.baseType) : 'the item') + '.');
      refresh();
      return;
    }

    if (act === 'claimContract') {
      const idx = parseInt(node.dataset.idx, 10);
      const r = claimContract(hero, idx);
      if (!r.ok) { toast(r.reason); return; }
      let msg = 'Contract complete: ' + fmtNum(r.gold) + ' gold, ' + fmtNum(r.starshards) + ' Starshard' + (r.starshards === 1 ? '' : 's');
      if (r.renown && r.renown.amount) msg += ', ' + fmtNum(r.renown.amount) + ' Renown';
      toast(msg);
      refresh();
      return;
    }

    if (act === 'startTask') {
      const id = node.dataset.id;
      const r = startTask(hero, id);
      if (!r.ok) { toast(r.reason); return; }
      const def = taskDef(id);
      if (def) toast('Started: ' + def.name + '.');
      refresh();
      return;
    }

    if (act === 'collectTask') {
      const r = collectTask(hero);
      if (!r) return;
      toast('Collected ' + taskAmountText(r.reward, r.amount) + '.');
      refresh();
      return;
    }
  }
};
function attachTabResets() {
  if (VIEWS.town) VIEWS.town.reset = function () { townPlace = null; };
  if (VIEWS.hero) VIEWS.hero.reset = function () { heroTab = 'gear'; };
  if (VIEWS.halls) VIEWS.halls.reset = function () {
    if (typeof halls2Tab !== 'undefined') halls2Tab = 'codex';
    if (typeof halls3Tab !== 'undefined') halls3Tab = 'codex';
  };
}

/* ============================================================
   BOOT
   ============================================================ */
function initUI() {
  delegate(el('tabs'), function (act, node) {
    if (act === 'tab') setTab(node.dataset.tab);
  });
  delegate(el('strip'), function (act, node) {
    if (act === 'settings') openSettings();
    if (act === 'help') openHelp();
    if (act === 'tab') setTab(node.dataset.tab);
  });
  // Each view handles its own actions, including those in its dock.
  function viewAct(act, node, ev) {
    const v = VIEWS[ui.tab];
    if (v && v.onAct) v.onAct(act, node, ev);
  }
  delegate(el('view'), viewAct);
  delegate(el('dock'), viewAct);
  attachTabResets();
  renderTabs();
  refresh();
  startTick();
  mountDebug();
}

function boot() {
  const existed = load();
  applyMotionSetting();

  // Work out what happened while the game was closed, before settling.
  const hero = state.hero;
  const away = existed && state.savedAt ? elapsed(state.savedAt) : 0;
  let facts = null;
  if (hero && away > BALANCE.awayThresholdMs) {
    const stBefore = heroStats(hero);
    facts = {
      away: away,
      hpBefore: currentHpAtStamp(hero, stBefore, state.savedAt),
      hadDescent: !!hero.descent,
      wasFallen: hero.fallenUntil > now(),
      marketDue: hero.market && hero.market.restockAt <= now() && hero.market.stock.length > 0
    };
  }

  settle();

  if (facts) {
    const stAfter = heroStats(hero);
    facts.results = pendingResults;
    pendingResults = null;
    facts.hpGained = Math.max(0, currentHp(hero, stAfter) - facts.hpBefore);
    facts.fallenEnded = facts.wasFallen && !(hero.fallenUntil > now());
    facts.restocked = !!facts.marketDue;
  }

  startAutosave();
  initUI();

  if (facts) showAway(facts);
  else showPendingResults();
}

/* HP as it stood at a past moment, for the away summary. */
function currentHpAtStamp(hero, st, stamp) {
  if (hero.descent) return clamp(Math.floor(hero.descent.hp), 0, st.maxHp);
  if (hero.fallenUntil > stamp) return clamp(Math.floor(hero.hp), 0, st.maxHp);
  const ms = Math.max(0, stamp - hero.hpAt) + offeringRegenBonusMs(hero, hero.hpAt, stamp);
  return clamp(Math.floor(hero.hp + regenPerMs(hero, st) * ms), 0, st.maxHp);
}

/* ============================================================
   ACHIEVEMENT PROGRESS TRACKERS
   Added per Rob's request: show a running tally under unearned
   achievements that have a meaningful number to show (e.g. "4 / 10").

   NOTHING OUTSIDE THIS FILE NEEDS TO CHANGE. No new CSS class was
   needed — the progress bar reuses the existing ".bar bar-xp" /
   ".bar-fill" idiom (corona fill on the track colour, same as the
   Renown bar just above this in halls3RenderRenown), and the figure
   reuses ".tiny" + ".num" the same way the existing achievement
   description line does. If Rob ever wants the bar visually
   distinguished from the Renown bar, that would be the one thing to
   add by hand, but nothing below requires it.

   This file redeclares halls3AchievementRow(id). The codebase's
   "later definition wins" override pattern means this version runs
   instead of the one earlier in the script, once spliced in near
   the end of the file (immediately before the DOMContentLoaded
   listener, as instructed).
   ============================================================ */

/* achievementProgress(check, hero) -> { cur, max } | null
   Mirrors achievementMet's switch on check.k, using the exact same
   sources of truth (totalOf, getRecord, uniquesFound, lorePagesFound,
   state.account.*, hero.counters.*) so the bar can never disagree
   with whether the achievement has actually been earned.

   Returns null for checks with no meaningful running tally:
     - banes_cleared, boss_low_hp: a single-moment condition about
       one specific path just cleared, not a persistent count.
     - full_set: boolean, no number to show.

   cur is always clamped to max, so a finished tracker never reads
   "34 / 25" in the moment between the value crossing the threshold
   and checkAchievements() marking it earned (at which point the row
   stops showing progress entirely and shows "Earned <date>" instead).

   Every lookup is guarded; a fresh save missing counters/records
   must never throw here. */
function achievementProgress(check, hero) {
  try {
    if (!check || !hero) return null;
    const acct = state.account || {};

    function clamped(cur, max) {
      cur = (typeof cur === 'number' && isFinite(cur)) ? cur : 0;
      max = (typeof max === 'number' && isFinite(max) && max > 0) ? max : 1;
      if (cur < 0) cur = 0;
      if (cur > max) cur = max;
      return { cur: cur, max: max };
    }

    switch (check.k) {
      case 'deepest':
        return clamped(acct.deepestEver || 1, check.value);

      case 'guardian_kills':
        return clamped(totalOf('guardian:' + check.guardian), check.value);

      case 'horrors':
        return clamped(totalOf('horrors'), check.value);

      case 'clear_streak':
        return clamped((hero.counters && hero.counters.clearStreak) || 0, check.value);

      case 'total_gold':
        return clamped(totalOf('goldEarned'), check.value);

      case 'temper': {
        // Highest temper level on any item the hero currently holds or
        // wears, exactly like achievementMet's own .some() scan.
        let items = [];
        try {
          items = (hero.inventory || []).concat(hero.equipment ? equippedItems(hero) : []);
        } catch (e) { items = []; }
        let maxTemper = 0;
        for (const it of items) {
          const t = it && it.temper;
          if (typeof t === 'number' && t > maxTemper) maxTemper = t;
        }
        return clamped(maxTemper, check.value);
      }

      case 'uniques_found':
        return clamped(uniquesFound(), check.value);

      case 'lore_pages':
        return clamped(lorePagesFound(), check.value);

      case 'ascensions':
        return clamped(acct.ascensions || 0, check.value);

      case 'class_depth': {
        const rec = getRecord('deepest', check.classId);
        return clamped(rec ? rec.value : 0, check.value);
      }

      case 'horrors_named':
        return clamped(namedHorrorsKilled(), check.value);

      case 'deep_guardians':
        return clamped(deepGuardiansKilled(), check.value);

      // No meaningful running tally for these — deliberately untracked.
      case 'banes_cleared':
      case 'boss_low_hp':
      case 'full_set':
      default:
        return null;
    }
  } catch (e) {
    return null;
  }
}

/* Redeclares the earlier halls3AchievementRow(id) (~line 11640).
   Identical for earned achievements and for achievements with no
   trackable progress. For an unearned achievement with progress,
   adds a thin bar + "cur / max" figure beneath the description. */
function halls3AchievementRow(id) {
  const a = ACHIEVEMENTS[id];
  const earnedAt = state.account.achievements && state.account.achievements[id];
  /* An earned achievement is marked in verdant, the same "done" green a
     claimed contract uses, so the earned ones read down the list at a
     glance instead of differing from the rest only by a line of text. */
  if (earnedAt) {
    return '<div class="card" style="padding:10px 12px;border-color:var(--verdant)">' +
      '<div class="row" style="gap:8px">' +
        '<span style="color:var(--verdant);display:inline-flex;flex:0 0 auto">' + icon('ico-star') + '</span>' +
        '<div class="grow" style="min-width:0">' +
          '<div style="font-weight:600;color:var(--verdant)">' + esc(a.name) + '</div>' +
          // What it took stays on the card: the name alone rarely says it.
          '<div class="tiny" style="margin-top:2px">' + esc(a.desc) + '</div>' +
          '<div class="tiny muted" style="margin-top:2px">Earned ' + esc(halls3DateStr(earnedAt)) +
            ' · <span class="num">' + fmtNum(a.renown) + '</span> Renown</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  let progHtml = '';
  const hero = state.hero;
  const prog = hero ? achievementProgress(a.check, hero) : null;
  /* A target of 1 is a yes-or-no condition, not a tally. "0 / 1" under a
     bar that can only be empty or full says nothing the description does
     not already say, so those rows stay plain. */
  if (prog && prog.max > 1) {
    const pct = Math.max(0, Math.min(100, (prog.cur / prog.max) * 100));
    progHtml =
      '<div class="bar bar-xp" style="margin-top:6px">' +
        '<div class="bar-fill" style="width:' + pct + '%"></div>' +
      '</div>' +
      '<div class="tiny num" style="margin-top:2px">' +
        esc(fmtNum(prog.cur) + ' / ' + fmtNum(prog.max)) +
      '</div>';
  }

  return '<div class="card muted" style="padding:10px 12px">' +
    '<div style="font-weight:600">' + esc(a.name) + '</div>' +
    '<div class="tiny" style="margin-top:2px">' + esc(a.desc) + ' · ' + fmtNum(a.renown) + ' Renown</div>' +
    progHtml +
  '</div>';
}

/* ============================================================
   CHAPEL OFFERINGS - SPEC 13.1
   A timed, town-only buff bought with gold. One runs at a time.
   Stored as hero.offering = { id, from, until }, or null.

   Named apart from account.blessings, the permanent bonus an ascended
   champion leaves to every hero after them (SPEC 15.3), which is a
   different system entirely.

   Expiry is read, never written: an Offering is over when until <= now(),
   the same way a descent's progress is read from its stamps. Nothing
   here counts ticks, so a sleeping phone changes nothing.
   ============================================================ */
function offeringDef(id) {
  return (BALANCE.town.offerings && BALANCE.town.offerings.list[id]) || null;
}

/* The Offering in force, or null. Reading never clears an expired one;
   it is simply ignored, as hero.fallenUntil is until Revive touches it. */
function activeOffering(hero) {
  if (!hero || !hero.offering) return null;
  if (hero.offering.until <= now()) return null;
  return hero.offering;
}

/* 1 when no Offering of this kind is in force, otherwise its value, so
   every call site is a single multiplication. */
function offeringMult(hero, kind) {
  const b = activeOffering(hero);
  if (!b) return 1;
  const def = offeringDef(b.id);
  if (!def || def.effect.k !== kind) return 1;
  return def.effect.value;
}

function offeringCost(hero, id) {
  const def = offeringDef(id);
  if (!def) return 0;
  return Math.round(def.coef * g(hero.deepest));
}

/* Making an Offering replaces whatever is running, with nothing back for
   the time left on it - the confirmation says so. Barred during a descent
   for the same reason healing is: the hero is not in town. */
function buyOffering(hero, id) {
  const def = offeringDef(id);
  if (!def) return { ok: false, reason: 'No such Offering.' };
  if (hero.descent) return { ok: false, reason: 'Not during a descent.' };
  const cost = offeringCost(hero, id);
  if (hero.gold < cost) return { ok: false, reason: 'Not enough gold.' };

  /* A Vigil pays out over the window since HP was last written down, so
     the moment it starts has to be on record before that window moves on.
     Settling HP here means the time before the Offering is banked at the
     ordinary rate and only what follows is doubled. */
  setHp(hero, currentHp(hero, heroStats(hero)));
  hero.gold -= cost;
  hero.offering = { id: id, from: now(), until: now() + BALANCE.town.offerings.durationMs };
  save();
  return { ok: true, offering: hero.offering, cost: cost };
}

/* Renewing restarts the running Offering's two hours from now. It costs
   the share of the full price that the time already used up represents,
   so renewing early costs exactly what keeping it going would have: the
   same rate per hour, and the time left on it is never wasted. */
function offeringRenewCost(hero) {
  const b = activeOffering(hero);
  if (!b) return 0;
  const D = BALANCE.town.offerings.durationMs;
  const used = clamp(D - (b.until - now()), 0, D);
  return Math.max(BALANCE.town.offerings.renewMinGold, Math.ceil(offeringCost(hero, b.id) * used / D));
}

/* `quoted` is the price the player was shown. The price only rises while
   they read, so if it has moved past the quote nothing is charged and the
   caller shows the new price instead - never more than was shown, and a
   sheet left open for an hour can't renew at the old price. */
function renewOffering(hero, quoted) {
  const b = activeOffering(hero);
  if (!b) return { ok: false, reason: 'That Offering has already ended.' };
  if (hero.descent) return { ok: false, reason: 'Not during a descent.' };
  const cost = offeringRenewCost(hero);
  if (quoted !== undefined && cost > quoted) return { ok: false, repriced: true, cost: cost };
  if (hero.gold < cost) return { ok: false, reason: 'Not enough gold.' };
  // Bank the HP earned so far first, as buyOffering does, so a Vigil's
  // doubled stretch up to now is kept when its window restarts.
  setHp(hero, currentHp(hero, heroStats(hero)));
  hero.gold -= cost;
  hero.offering = { id: b.id, from: now(), until: now() + BALANCE.town.offerings.durationMs };
  save();
  return { ok: true, offering: hero.offering, cost: cost };
}

/* Ashen Favour lifts the Ash from salvaging, never the Starshards, and
   only in town. It wraps salvageYield, which stays untouched and pure, so
   the auto-salvage of a drop that will not fit - which happens inside a
   descent - can never see an Offering. */
function heroSalvageYield(hero, item) {
  const y = salvageYield(item);
  return { ash: Math.round(y.ash * offeringMult(hero, 'salvage_ash_mult')), shards: y.shards };
}

/* ============================================================
   THE CHAPEL - the Offerings section
   ============================================================ */
function townRenderOfferings(hero) {
  const B = BALANCE.town.offerings;
  const active = activeOffering(hero);
  let out = '<div class="section-title">Offerings</div>';

  if (active) {
    const def = offeringDef(active.id);
    const left = Math.max(0, active.until - now());
    out += '<div class="card" style="border-left:3px solid ' + townAccent('chapel') + '">' +
        '<div class="row" style="gap:10px">' +
          '<span style="color:' + townAccent('chapel') + ';display:inline-flex">' + icon(def.icon) + '</span>' +
          '<div class="grow">' +
            '<div style="font-weight:600">' + esc(def.name) + '</div>' +
            '<div class="small muted">' + esc(def.text) + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="row-between" style="margin-top:10px;gap:10px">' +
          '<div class="small" style="color:' + townAccent('chapel') + '"' +
            ' data-town-cd="' + active.until + '" data-town-cd-tmpl="offering">' +
            'Ends in ' + fmtTime(left) +
          '</div>' +
          townRenewButton(hero) +
        '</div>' +
      '</div>' +
      '<p class="tiny muted" style="margin-top:8px">Renew to reset it to ' + fmtTime(B.durationMs) +
        '; you pay only for the time used up. Making a different one ends this one early.</p>';
  } else {
    out += '<p class="tiny muted">Each lasts ' + fmtTime(B.durationMs) +
      '. Only one at a time, and none of them follow you into the pit.</p>';
  }

  out += '<div class="stack-s" style="margin-top:10px">';
  for (const id in B.list) {
    // The one that is running is already shown in full above.
    if (active && active.id === id) continue;
    const def = B.list[id];
    const cost = offeringCost(hero, id);
    const afford = hero.gold >= cost;
    const disabled = !afford;
    out += '<div class="row-between panel">' +
        '<div class="row grow" style="gap:10px;min-width:0">' +
          '<span style="color:var(--ash);display:inline-flex;flex:0 0 auto">' + icon(def.icon) + '</span>' +
          '<div style="min-width:0">' +
            '<div style="font-weight:600">' + esc(def.name) + '</div>' +
            '<div class="small muted">' + esc(def.text) + '</div>' +
          '</div>' +
        '</div>' +
        '<button class="btn btn-sm' + (disabled ? '' : ' btn-primary') + '" data-act="offering" data-id="' +
          esc(id) + '"' + (disabled ? ' disabled' : '') + ' style="flex:0 0 auto">' +
          '<span class="num">' + fmtNum(cost) + '</span> gold' +
        '</button>' +
      '</div>';
  }
  out += '</div>';
  return out;
}

/* The running Offering's Renew button. Its price climbs as the Offering's
   time is used up, so the town tick rewrites it in place (see below). */
function townRenewButton(hero) {
  const cost = offeringRenewCost(hero);
  const afford = hero.gold >= cost;
  return '<button class="btn btn-sm' + (afford ? ' btn-primary' : '') + '" data-act="offering-renew"' +
    ' data-renew-btn="1"' + (afford ? '' : ' disabled') + ' style="flex:0 0 auto">' +
    'Renew · <span class="num" data-renew-cost="1">' + fmtNum(cost) + '</span> gold</button>';
}

/* Redeclares townRenderChapel to seat Offerings between Heal and Respec.
   A Fallen hero sees it too: making a Vigil while waiting out the timer is
   exactly the sort of thing a player stuck in town wants to do. */
function townRenderChapel(hero) {
  let out = townHeader('The Last Chapel', 'chapel') + townCurrencyRow(hero);

  if (hero.fallenUntil > now()) {
    const left = hero.fallenUntil - now();
    const cost = reviveCost(hero);
    const afford = hero.gold >= cost;
    out += '<div class="section-title">Fallen</div>' +
      '<div class="card">' +
        '<div class="risk risk-deadly">' + icon('ico-deadly') + '<span>Fallen</span></div>' +
        '<div class="small muted" style="margin-top:6px" data-town-cd="' + hero.fallenUntil + '" data-town-cd-tmpl="fallen">' +
          'Time left: ' + fmtTime(left) +
        '</div>' +
        '<div style="margin-top:14px">' +
          '<button class="btn btn-primary btn-block btn-lg" data-act="revive"' + (afford ? '' : ' disabled') + '>' +
            'Revive — ' + fmtNum(cost) + ' gold' +
          '</button>' +
        '</div>' +
      '</div>';
    out += townRenderOfferings(hero);
    out += townRenderRespec(hero);
    return out;
  }

  const gate = canHeal(hero);
  out += '<div class="section-title">Heal</div>';
  if (!gate.ok) {
    out += '<p class="small muted">' + esc(gate.reason) + '</p>';
  } else {
    out += '<p class="tiny muted">Healing costs more each time you heal within a day.</p>';
    const options = [ [0.25, 'Heal 25%'], [0.5, 'Heal 50%'], [1, 'Heal to full'] ];
    out += '<div class="stack-s">';
    options.forEach(function (opt) {
      const frac = opt[0], label = opt[1];
      const q = healQuote(hero, frac);
      const disabled = q.restored <= 0 || hero.gold < q.gold;
      out += '<div class="row-between panel">' +
        '<div>' +
          '<div style="font-weight:600">' + esc(label) + '</div>' +
          '<div class="small muted">Restores ' + fmtNum(q.restored) + ' HP</div>' +
        '</div>' +
        '<button class="btn btn-sm' + (disabled ? '' : ' btn-primary') + '" data-act="heal" data-frac="' + frac + '"' +
          (disabled ? ' disabled' : '') + '>' + fmtNum(q.gold) + ' gold</button>' +
      '</div>';
    });
    out += '</div>';
  }

  out += townRenderOfferings(hero);
  out += townRenderRespec(hero);
  return out;
}

/* The Town view's dispatcher is declared five times over the phases, so
   rather than guess which copy is live, this wraps whichever one ended up
   on VIEWS.town and hands everything it does not own straight back. */
(function () {
  const inherited = VIEWS.town.onAct;
  VIEWS.town.onAct = function (act, node, ev) {
    if (act === 'offering') {
      const hero = state && state.hero;
      if (!hero) return;
      const id = node.dataset.id;
      const def = offeringDef(id);
      if (!def) return;
      const cost = offeringCost(hero, id);
      const current = activeOffering(hero);
      confirmSheet({
        title: current ? 'Replace the Offering?' : 'Make this Offering',
        body: 'Offer ' + fmtNum(cost) + ' gold for <strong>' + esc(def.name) + '</strong>. ' +
          esc(def.text) + '. Lasts ' + fmtTime(BALANCE.town.offerings.durationMs) + '.' +
          (current ? ' This ends <strong>' + esc(offeringDef(current.id).name) +
            '</strong> early, with nothing back for the time left on it.' : ''),
        yes: 'Offer it',
        onYes: function () {
          const r = buyOffering(hero, id);
          if (!r.ok) { toast(r.reason); return; }
          toast(def.name + ' is upon you.');
          refresh();
        }
      });
      return;
    }
    if (act === 'offering-renew') {
      const hero = state && state.hero;
      if (!hero) return;
      townConfirmRenew(hero);
      return;
    }
    return inherited.call(this, act, node, ev);
  };
})();

/* Renewing, confirmed. If the price moved while the sheet was open, nothing
   is charged; the sheet opens again with the new price. */
function townConfirmRenew(hero) {
  const b = activeOffering(hero);
  if (!b) { toast('That Offering has already ended.'); refresh(); return; }
  const def = offeringDef(b.id);
  const D = BALANCE.town.offerings.durationMs;
  // Whole minutes, rounded the way the countdown shows them, so "left" and
  // "used up" always add up to the full duration on screen.
  const left = Math.ceil(Math.max(0, b.until - now()) / 60000) * 60000;
  const quoted = offeringRenewCost(hero);
  confirmSheet({
    title: 'Renew the Offering?',
    body: 'Offer ' + fmtNum(quoted) + ' gold to restart <strong>' + esc(def.name) + '</strong>. ' +
      'It will last ' + fmtTime(D) + ' from now. It has ' + fmtTime(left) + ' left, so you pay only for the ' +
      fmtTime(Math.max(0, D - left)) + ' used up.',
    yes: 'Renew',
    onYes: function () {
      const r = renewOffering(hero, quoted);
      if (r.repriced) { toast('The price is now ' + fmtNum(r.cost) + ' gold.'); townConfirmRenew(hero); return; }
      if (!r.ok) { toast(r.reason); refresh(); return; }
      toast(def.name + ' is renewed.');
      refresh();
    }
  });
}

/* The Renew price climbs as the Offering is used up, so rewrite it in place
   once a second, alongside the countdowns. Re-render only; the price is
   always worked out from the stored stamps. */
(function () {
  const inherited = VIEWS.town.tick;
  VIEWS.town.tick = function () {
    const out = inherited ? inherited.apply(this, arguments) : undefined;
    const hero = state && state.hero;
    const btn = document.querySelector('#view [data-renew-btn]');
    if (hero && btn) {
      if (!activeOffering(hero)) { renderView(); return out; }
      const cost = offeringRenewCost(hero);
      const costEl = btn.querySelector('[data-renew-cost]');
      if (costEl) costEl.textContent = fmtNum(cost);
      const afford = hero.gold >= cost;
      btn.disabled = !afford;
      btn.classList.toggle('btn-primary', afford);
    }
    return out;
  };
})();


/* ============================================================
   THE VAULT - per-hero stash for gear the player wants to keep but
   not wear, without it crowding out the inventory.

   hero.vault lives on the HERO, not the account. ascend() sets
   state.hero = null, which wipes a hero's inventory outright - only
   the chosen heirloom relic and the account survive an Ascension
   (SPEC 15.6: "Resets for each new hero: ... gear and inventory ...").
   An account-wide Vault would quietly become a second, unlimited
   heirloom slot - a way to carry any amount of gear across
   Ascensions by stashing it first - which breaks pillar 6 ("Legacy
   always carries over" names only blessings and the heirloom as
   legacy) and the "one heirloom at a time" rule (SPEC 15.4). Rob's
   own framing - "stash gear you don't want to get rid of yet" - is
   about inventory pressure during a single hero's life, so the
   Vault empties along with everything else on Ascension, exactly
   like the inventory it sits beside.
   ============================================================ */

function vaultCap(hero) {
  const V = BALANCE.town.vault;
  return Math.min(V.maxSlots, V.baseSlots + V.slotsPerUpgrade * (hero.vaultUpgrades || 0));
}

function vaultFree(hero) {
  return vaultCap(hero) - (hero.vault || []).length;
}

/* null once the Vault is already at maxSlots - nothing more to buy. */
function vaultUpgradeCost(hero) {
  const V = BALANCE.town.vault;
  if (vaultCap(hero) >= V.maxSlots) return null;
  return Math.round(V.upgradeCoef * g(hero.deepest) * Math.pow(V.upgradeGrowth, hero.vaultUpgrades || 0));
}

function buyVaultSlots(hero) {
  const cost = vaultUpgradeCost(hero);
  if (cost === null) return { ok: false, reason: 'Already at maximum.' };
  if (hero.gold < cost) return { ok: false, reason: 'Not enough gold.' };
  hero.gold -= cost;
  hero.vaultUpgrades = (hero.vaultUpgrades || 0) + 1;
  save();
  return { ok: true, cap: vaultCap(hero) };
}

/* Moves an item from the inventory into the Vault. Free, no cooldown
   either direction (Rob: "freely send gear between... inventory and
   storage"). An equipped item can't be stored - unequip it first.
   Locked only guards Sell/Salvage (SPEC 11.9), never the Vault, so a
   locked item can be stashed same as any other. */
function vaultStore(hero, item) {
  if (townIsEquipped(hero, item)) return { ok: false, reason: 'Unequip it first.' };
  if (vaultFree(hero) <= 0) return { ok: false, reason: 'The Vault is full.' };
  removeFromInventory(hero, item);
  hero.vault.push(item);
  save();
  return { ok: true };
}

/* Moves an item from the Vault back into the inventory. Not through
   addItem(hero, item) - addItem applies the auto-salvage filters and
   records the Armory, and an item coming back from the Vault has
   already been recorded and was never up for auto-salvage. */
function vaultWithdraw(hero, item) {
  if (inventoryFree(hero) <= 0) return { ok: false, reason: 'Inventory full.' };
  const i = hero.vault.indexOf(item);
  if (i >= 0) hero.vault.splice(i, 1);
  hero.inventory.push(item);
  save();
  return { ok: true };
}

/* ============================================================
   THE VAULT - UI, SPEC 13 / 19.4 idiom (townTile, townHeader,
   town2RarityBorderStyle / town2ItemLabel / townBadge, the one-line
   card used throughout the Forge's Salvage and Temper lists).
   ============================================================ */

function townVaultStatus(hero) {
  return fmtNum((hero.vault || []).length) + ' / ' + fmtNum(vaultCap(hero)) + ' stored';
}

function townFindVaultItem(hero, id) {
  return (hero.vault || []).find(function (i) { return i.id === id; }) || null;
}

function townRenderVault(hero) {
  let out = townHeader('The Vault', 'vault') + townCurrencyRow(hero);

  const vault = hero.vault || [];
  const cap = vaultCap(hero);
  const cost = vaultUpgradeCost(hero);
  const atMax = cost === null;
  const afford = !atMax && hero.gold >= cost;

  out += '<div class="section-title">Storage</div>';
  out += '<div class="row-between panel">' +
    '<div>' +
      '<div style="font-weight:600" class="num">' + fmtNum(vault.length) + ' / ' + fmtNum(cap) + ' slots</div>' +
      '<div class="tiny muted">' + esc(TOWN_KEEPERS.vault) + ' keeps what you cannot carry.</div>' +
    '</div>' +
    '<button class="btn btn-sm' + (afford ? ' btn-primary' : '') + '" data-act="vaultUpgrade"' +
      (atMax || !afford ? ' disabled' : '') + '>' +
      (atMax ? 'Maximum' : fmtNum(cost) + ' gold') +
    '</button>' +
  '</div>';
  if (atMax) {
    out += '<p class="tiny muted" style="margin-top:6px">The Vault cannot hold more than ' + fmtNum(BALANCE.town.vault.maxSlots) + ' items.</p>';
  } else if (!afford) {
    out += '<p class="tiny muted" style="margin-top:6px">Not enough gold to add ' + fmtNum(BALANCE.town.vault.slotsPerUpgrade) + ' more slots.</p>';
  }

  out += '<div class="section-title">Stored</div>';
  if (!vault.length) {
    out += '<p class="small muted">Nothing stashed. Gear you send here stays safe until you take it back.</p>';
  } else {
    out += '<div class="stack-s">';
    vault.forEach(function (item) {
      out += '<div class="row-between panel" style="' + town2RarityBorderStyle(item) + '">' +
        '<button type="button" class="row grow" data-act="vaultDetail" data-id="' + esc(item.id) + '" style="gap:8px;min-height:44px;text-align:left">' +
          townBadge(item) + town2ChainIcon(item) +
          '<div>' + town2ItemLabel(item) + '</div>' +
        '</button>' +
        '<button class="btn btn-sm" data-act="vaultTake" data-id="' + esc(item.id) + '">Take</button>' +
      '</div>';
    });
    out += '</div>';
  }

  out += '<div class="section-title">In your pack</div>';
  const carried = hero.inventory || [];
  if (!carried.length) {
    out += '<p class="small muted">Nothing worth storing right now.</p>';
  } else {
    const vaultIsFull = vaultFree(hero) <= 0;
    out += '<div class="stack-s">';
    carried.forEach(function (item) {
      out += '<div class="row-between panel" style="' + town2RarityBorderStyle(item) + '">' +
        '<button type="button" class="row grow" data-act="detail" data-id="' + esc(item.id) + '" style="gap:8px;min-height:44px;text-align:left">' +
          townBadge(item) + town2ChainIcon(item) +
          '<div>' + town2ItemLabel(item) + '</div>' +
        '</button>' +
        '<button class="btn btn-sm" data-act="vaultPut" data-id="' + esc(item.id) + '"' +
          (vaultIsFull ? ' disabled' : '') + '>Store</button>' +
      '</div>';
    });
    out += '</div>';
  }

  return out;
}

/* The Town view's dispatcher is declared several times across the
   build phases, so rather than guess which copy is live, this wraps
   whichever one ended up on VIEWS.town and hands everything it does
   not own straight back - same pattern the Chapel Offerings feature
   uses just above this. Opening the place itself needs no new case:
   the hub's Vault tile is built with townTile(), whose generic
   data-act="open" / data-place="vault" is already handled by the
   base onAct. */
(function () {
  const inherited = VIEWS.town.onAct;
  VIEWS.town.onAct = function (act, node, ev) {
    if (act === 'vaultPut') {
      const hero = state && state.hero;
      if (!hero) return;
      const item = townFindInvItem(hero, node.dataset.id);
      if (!item) return;
      const r = vaultStore(hero, item);
      if (!r.ok) toast(r.reason); else toast('Stored in the Vault.');
      refresh();
      return;
    }

    if (act === 'vaultTake') {
      const hero = state && state.hero;
      if (!hero) return;
      const item = townFindVaultItem(hero, node.dataset.id);
      if (!item) return;
      const r = vaultWithdraw(hero, item);
      if (!r.ok) toast(r.reason); else toast('Back in your pack.');
      refresh();
      return;
    }

    if (act === 'vaultDetail') {
      const hero = state && state.hero;
      if (!hero) return;
      const item = townFindVaultItem(hero, node.dataset.id);
      if (!item) return;
      town2OpenItemDetail(hero, item);
      return;
    }

    if (act === 'vaultUpgrade') {
      const hero = state && state.hero;
      if (!hero) return;
      const cost = vaultUpgradeCost(hero);
      if (cost === null) { toast('The Vault is already at maximum.'); return; }
      if (hero.gold < cost) { toast('Not enough gold.'); return; }
      confirmSheet({
        title: 'Expand the Vault?',
        body: 'Adds ' + fmtNum(BALANCE.town.vault.slotsPerUpgrade) + ' storage slots for ' +
          fmtNum(cost) + ' gold. This cannot be undone.',
        yes: 'Expand',
        onYes: function () {
          const r = buyVaultSlots(hero);
          if (!r.ok) { toast(r.reason); return; }
          toast('The Vault now holds ' + fmtNum(r.cap) + '.');
          refresh();
        }
      });
      return;
    }

    return inherited.call(this, act, node, ev);
  };
})();


/* ---- The next-goal line, SCOPES.md §4 ----

   A compact card between the floor stepper and the path cards on the
   Descend tab, showing up to three tappable nudges in priority order:

     1. Something to spend right now (unspent skill points, then
        unspent Abyssal points — counted separately).
     2. The next Guardian this hero hasn't beaten.
     3. The unearned achievement closest to done.
     4. Lore pages still missing in the act of the floor being viewed.

   nextGoals(hero) is the pure selection logic (SPEC/CLAUDE.md "a pure
   engine" spirit — no DOM, easy to test standalone). renderNextGoals()
   turns its output into HTML, and the onAct wrapper below routes taps.
   Reads only data that already exists; writes nothing, so it needs no
   save() and no state.version bump. */

/* The first floor at/after hero.deepest carrying a Guardian this hero
   has not yet killed. Bounded scan (10 floors) rather than an infinite
   one — Deep Guardians below floor 40 are a later feature and will be
   picked up automatically through guardianOnFloor(), same as the
   floors 10/20/30/40 story Guardians, since this never hardcodes which
   floors carry one. Returns null if none turns up in range (normal
   once every Guardian within reach is cleared). */
function nextGuardianFloor(hero) {
  if (!hero) return null;
  const from = hero.deepest || 1;
  for (let f = from; f <= from + 10; f++) {
    const gd = guardianOnFloor(f);
    if (gd && ((hero.guardianKills && hero.guardianKills[gd.id]) || 0) === 0) return f;
  }
  return null;
}

/* Up to three goals, in priority order. Returns
   [{ kind, text, data }], where kind is one of
   'skill' | 'abyssal' | 'guardian' | 'achievement' | 'lore' and data
   carries whatever the tap handler needs (only 'guardian' needs one:
   the floor to jump to). */
function nextGoals(hero) {
  const goals = [];
  if (!hero) return goals;

  // 1. Something to spend right now — skill points and Abyssal points
  // are separate goals, so a hero sitting on both sees both.
  const sp = unspentSkillPoints(hero);
  if (sp > 0) {
    goals.push({
      kind: 'skill',
      text: fmtNum(sp) + ' skill point' + (sp === 1 ? '' : 's') + ' to spend',
      data: {}
    });
  }
  const ap = abyssalUnspent(hero);
  if (ap > 0) {
    goals.push({
      kind: 'abyssal',
      text: fmtNum(ap) + ' Abyssal point' + (ap === 1 ? '' : 's') + ' to spend',
      data: {}
    });
  }

  // 2. The next Guardian this hero hasn't beaten.
  if (goals.length < 3) {
    const gf = nextGuardianFloor(hero);
    if (gf !== null) {
      const gd = guardianOnFloor(gf);
      const name = (gd && GUARDIAN_NAMES[gd.id]) || 'the Guardian';
      const from = hero.deepest || 1;
      const diff = gf - from;
      goals.push({
        kind: 'guardian',
        text: diff > 0
          ? (fmtNum(diff) + ' floor' + (diff === 1 ? '' : 's') + ' to ' + name)
          : (name + ' waits on floor ' + fmtNum(gf)),
        data: { f: gf }
      });
    }
  }

  // 3. The unearned achievement closest to done, by percentage. Only
  // achievements with a real running tally (max > 1) and some progress
  // already made (cur > 0) count as a nudge — a 0% one isn't.
  if (goals.length < 3) {
    const earned = (state.account && state.account.achievements) || {};
    let best = null, bestPct = -1;
    for (const id in ACHIEVEMENTS) {
      if (earned[id]) continue;
      const a = ACHIEVEMENTS[id];
      const prog = achievementProgress(a.check, hero);
      // cur >= max means met but not yet awarded - achievements are only
      // checked when a descent ends, so tempering to +10 at the Forge sits
      // at 10 / 10 until the next one. Finished is not a goal.
      if (!prog || prog.max <= 1 || prog.cur <= 0 || prog.cur >= prog.max) continue;
      const pct = prog.cur / prog.max;
      if (pct > bestPct) { bestPct = pct; best = { a: a, prog: prog }; }
    }
    if (best) {
      goals.push({
        kind: 'achievement',
        text: best.a.name + ' · ' + fmtNum(best.prog.cur) + ' / ' + fmtNum(best.prog.max),
        data: {}
      });
    }
  }

  // 4. Lore pages still missing in the act of the floor being viewed
  // (not the hero's deepest — the floor currently selected in the
  // stepper). Floors past 40 all fall under Act IV via actForFloor()'s
  // own fallback.
  if (goals.length < 3) {
    const act = actForFloor(selectedFloor(hero));
    const missing = missingLorePages(act.id).length;
    if (missing > 0) {
      // act.display is e.g. "III. The Shattered Cage" — the roman
      // numeral is the part before the period. Reusing that existing
      // content field keeps the numeral itself out of code, per
      // CLAUDE.md's "content as data."
      const numeral = (act.display.split('.')[0] || '').trim();
      goals.push({
        kind: 'lore',
        text: fmtNum(missing) + ' page' + (missing === 1 ? '' : 's') + ' left in Act ' + numeral,
        data: {}
      });
    }
  }

  return goals.slice(0, 3);
}

const NEXT_GOAL_ICON = {
  skill: 'ico-plus',
  abyssal: 'ico-plus',
  guardian: 'ico-boss',
  achievement: 'ico-star',
  lore: 'ico-halls'
};

/* Renders the card, or '' when there is nothing to nudge the player
   toward (no empty card — SCOPES.md §4). Each goal is its own 44px+
   tap target with 8px between them; text is a single ellipsised line
   so three goals can never push the Descend button down at 360px. */
function renderNextGoals(hero) {
  const goals = nextGoals(hero);
  if (!goals.length) return '';

  return '<div class="card" style="margin-top:10px">' +
    goals.map(function (g, i) {
      const fAttr = (g.data && g.data.f !== undefined) ? ' data-f="' + g.data.f + '"' : '';
      return '<button type="button" class="card-tap row" data-act="goal" data-kind="' + esc(g.kind) + '"' + fAttr +
        ' style="min-height:44px' + (i ? ';margin-top:8px' : '') + '">' +
        icon(NEXT_GOAL_ICON[g.kind] || 'ico-star') +
        '<div class="grow small" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
          esc(g.text) +
        '</div>' +
        icon('ico-chevron-right') +
      '</button>';
    }).join('') +
  '</div>';
}

/* Wraps VIEWS.descend.onAct so the taps route where SCOPES.md §4 says:
   skill points -> Hero/Skills, Abyssal points -> Hero/Stats, a
   Guardian goal -> selects its floor (or the deepest unlocked one, if
   its floor isn't reachable yet), an achievement -> Halls/Renown, lore
   pages -> Halls/Codex. Same pattern as the Town dispatcher wrap
   further down the file (search "const inherited = VIEWS.town.onAct"):
   keep the inherited handler and hand back anything not owned here. */
(function () {
  const inherited = VIEWS.descend.onAct;
  VIEWS.descend.onAct = function (act, node, ev) {
    if (act === 'goal') {
      const hero = state && state.hero;
      if (!hero) return;
      const kind = node.dataset.kind;
      if (kind === 'skill') { heroTab = 'skills'; setTab('hero'); return; }
      if (kind === 'abyssal') { heroTab = 'stats'; setTab('hero'); return; }
      if (kind === 'guardian') {
        const f = Math.min(parseInt(node.dataset.f, 10) || 1, maxSelectableFloor(hero));
        descendUi.floor = f;
        descendUi.path = 0;
        refresh();
        return;
      }
      if (kind === 'achievement') { halls3Tab = 'renown'; setTab('halls'); return; }
      if (kind === 'lore') { halls3Tab = 'codex'; setTab('halls'); return; }
      return;
    }
    return inherited.call(this, act, node, ev);
  };
})();


/* Drop reveals (SCOPES.md 5): the results-sheet showcase card for the
   best unique or set piece found this descent. Larger than a list row,
   and never colour-alone — the letter badge and the rarity border (both
   read from RARITIES, via the existing town2* helpers) carry the rarity
   as well as the text colour. `isFirstFind` adds the "New to the Armory"
   line; it comes from r.firstFinds, which hand edits 3-4 populate. */
function resultsShowcaseHtml(item, isFirstFind) {
  const rd = RARITIES[item.rarity];
  if (!rd) return '';
  const border = town2RarityBorderStyle(item); // e.g. "border:3px double var(--r-unique)"
  const glow = '--glow:var(--r-' + item.rarity + ')';
  const slotLabel = (typeof heroSlotLabel !== 'undefined' && heroSlotLabel[item.slot]) || '';

  let powerHtml = '';
  if (item.rarity === 'unique' && item.uniqueId && UNIQUES[item.uniqueId]) {
    powerHtml = '<p class="showcase-power">' + esc(UNIQUES[item.uniqueId].power.text) + '</p>';
  } else if (item.rarity === 'set' && item.setId && SETS[item.setId]) {
    powerHtml = '<p class="showcase-power">' + esc(SETS[item.setId].name) + '</p>';
  }

  return (
    '<div class="showcase-card showcase-glow" style="' + border + ';' + glow + '">' +
      '<div class="showcase-row">' + townBadge(item) + town2ChainIcon(item) + '</div>' +
      '<div class="showcase-name ' + rarityClass(item.rarity) + '">' + esc(item.name) + '</div>' +
      (slotLabel ? '<div class="showcase-slot">' + esc(slotLabel) + '</div>' : '') +
      powerHtml +
      (isFirstFind ? '<div class="showcase-new">New to the Armory</div>' : '') +
    '</div>'
  );
}

/* Drop reveals (SCOPES.md 5): the away card's item line —
   "Found: Bellmaw's Grasp — 4 magic · 2 rare · 1 unique." — with the
   best item named first. Set and unique rank equally for "best"; both
   outrank rare, which outranks magic, which outranks common. */
function awayBestRank(rarity) {
  return RARITY_ORDER.indexOf(rarity === 'set' ? 'unique' : rarity);
}
function awayItemsSummaryHtml(items) {
  if (!items || !items.length) return '';
  let best = items[0];
  for (let i = 1; i < items.length; i++) {
    if (awayBestRank(items[i].rarity) > awayBestRank(best.rarity)) best = items[i];
  }
  const counts = {};
  for (const it of items) counts[it.rarity] = (counts[it.rarity] || 0) + 1;
  const parts = RARITY_ORDER
    .filter(function (r) { return counts[r]; })
    .map(function (r) { return fmtNum(counts[r]) + ' ' + r; });
  return '<p class="small" style="margin:10px 0 0">Found: ' +
    '<span class="' + rarityClass(best.rarity) + '" style="font-weight:600">' + esc(best.name) + '</span>' +
    ' — ' + parts.join(' · ') + '.</p>';
}

/* Descent log (SCOPES.md 5): redeclared in full, per your note that this
   is fine since it's short. Reproduces every existing behaviour (the
   death/save classes, the "Found: a, b." join, the lore-page line) and
   adds one thing: a star icon in the item's rarity colour before the
   name of any unique or set piece, so the line stands out while
   scrolling. The icon sits inside the same coloured <span> as the name,
   so it inherits the rarity colour via currentColor — no new colour
   rule needed, and rarity is still never colour-alone since the badge
   and border already carry it everywhere this item is shown in full. */
function logLine(entry) {
  let cls = 'small';
  // SCOPES-DESCENT D6: a crit is a tag, not a word run into the sentence.
  // Lines written before carry "Crit! " in their text; it becomes the tag.
  let raw = entry.text || '';
  if (entry.crit && raw.indexOf('Crit! ') === 0) raw = raw.slice(6);
  // The HP an encounter cost sits at the end of its line; it reads in danger
  // red so the numbers stand apart from the prose.
  const costAt = raw.match(/ (-[\d,]+ HP)\.$/);
  const body = costAt ? raw.slice(0, costAt.index) : raw;
  let text = (entry.crit ? '<span class="log-tag">Crit</span> ' : '') + esc(body) +
    (costAt ? ' <span class="num val-loss" style="font-weight:600">' + esc(costAt[1]) + '</span>.' : '');
  if (entry.kind === 'death') cls += ' risk-deadly';
  if (entry.kind === 'save') cls += ' risk-risky';
  if (entry.kind === 'level') cls += ' log-level';
  let items = '';
  if (entry.items && entry.items.length) {
    items = ' <span class="small">Found: ' + entry.items.map(function (i) {
      const notable = i.rarity === 'unique' || i.rarity === 'set';
      return '<span class="' + rarityClass(i.rarity) + '"' +
        (i.rarity === 'rare' ? ' style="font-weight:600"' : '') + '>' +      // a rare stands out a little
        (notable ? icon('ico-star', 'ico-mark') + ' ' : '') + esc(i.name) + '</span>';
    }).join(', ') + '.</span>';
  }
  let pages = '';
  if (entry.pages && entry.pages.length) {
    pages = ' <span class="small" style="color:var(--corona)">Lore page: ' +
      entry.pages.map(esc).join(', ') + '.</span>';
  }
  return '<div class="' + cls + '" style="padding:3px 0">' + text + items + pages + '</div>';
}

// ============================================================
// D5 - a readable track (SCOPES-DESCENT.md D5)
//
// JS section below is ready to paste before:
//   document.addEventListener('DOMContentLoaded', boot);
// CSS section (further down, clearly marked) is plain CSS - paste
// it into the <style> element, near the other "---- bars ----" rules.
//
// Provides:
//   liveTrackHtml(hero, d)  - full markup for the time bar + marks.
//                             Call wherever renderLiveDescent builds
//                             the bar + markers block.
//   liveTrackTick(d)        - once-a-second clock-only update. Call
//                             from VIEWS.descend.tick() in place of
//                             (or alongside) the existing inline
//                             '#live-progress' width update.
//
// Reads only hero.descent's timeline/resolved/log/startedAt/endsAt.
// Writes nothing to state. Pure presentation.
// ============================================================

// ---- pixel layout ----
// The bar is positioned absolutely inside a fixed-height wrapper so
// marks above (crit stars) and below (loot pips) the bar have their
// own reserved bands, independent of the bar's own 14px (.bar-lg)
// height. Everything else is centred on TRACK_BAR_MID.
//
//   0 ............... 8   crit star band
//   9 ............... 25  bar band (the bar itself spans 10-24; boss
//                          badges are 16px and spill ~1px over each
//                          side of the bar - see report)
//   29 .............. 32  loot pip band
//   0 ............... 34  wrapper (TRACK_H)
const TRACK_H = 34;
const TRACK_BAR_TOP = 10;
const TRACK_BAR_MID = TRACK_BAR_TOP + 7; // 14px bar, so its own centre

function trackPct(d, t) {
  return clamp((t - d.startedAt) / Math.max(d.endsAt - d.startedAt, 1), 0, 1);
}

// Finds the one log entry an already-resolved encounter produced, so
// the track can tell whether it dropped loot. Encounters that ended
// in a death or a save leave no matching entry (applyEncounter logs
// kind 'death'/'save' instead of the encounter's own kind in that
// case), which correctly draws no pip for them.
// Only ever called for i < d.resolved - never for a pending
// encounter, so a still-to-come crit or drop can never leak early.
function trackLogEntryFor(d, enc) {
  for (let i = 0; i < d.log.length; i++) {
    const e = d.log[i];
    if (e.t === enc.endsAt && e.kind === enc.kind) return e;
  }
  return null;
}

function trackMarkHtml(d, enc, i) {
  const resolved = i < d.resolved;
  const at = trackPct(d, enc.endsAt) * 100;
  const boss = enc.kind === 'guardian' || enc.kind === 'horror';

  // enc.crit is decided in advance by the seed. Gating it on `resolved`
  // is what keeps a not-yet-fought encounter from spoiling its own
  // result on the track.
  const crit = resolved && enc.crit;
  const entry = resolved ? trackLogEntryFor(d, enc) : null;
  const looted = !!(entry && entry.items && entry.items.length);

  let mark;
  if (boss) {
    const iconId = enc.kind === 'guardian' ? 'ico-boss' : 'ico-horror';
    mark = '<span class="track-boss is-' + enc.kind + (resolved ? ' resolved' : '') + '" style="left:' +
      at + '%;top:' + TRACK_BAR_MID + 'px">' + icon(iconId) + '</span>';
  } else if (enc.kind === 'elite') {
    mark = '<i class="track-elite' + (resolved ? ' resolved' : '') + '" style="left:' +
      at + '%;top:' + TRACK_BAR_MID + 'px"></i>';
  } else {
    mark = '<i class="track-pack' + (resolved ? ' resolved' : '') + '" style="left:' +
      at + '%;top:' + TRACK_BAR_MID + 'px"></i>';
  }

  const star = crit
    ? '<i class="track-crit" style="left:' + at + '%">' + icon('ico-star') + '</i>'
    : '';
  const pip = looted ? '<i class="track-pip" style="left:' + at + '%"></i>' : '';

  return mark + star + pip;
}

// The whole track: time bar + every encounter's mark. Re-render from
// scratch each time an encounter resolves (d.resolved changes) - it
// only ever draws the state it's handed.
function liveTrackHtml(hero, d) {
  const total = d.timeline.length;
  const done = d.resolved;
  const pct = trackPct(d, now()) * 100;

  const marks = d.timeline.map(function (enc, i) {
    return trackMarkHtml(d, enc, i);
  }).join('');

  return '<div class="live-track" style="position:relative;height:' + TRACK_H +
      'px;margin:14px 0 10px" role="img" aria-label="' +
      esc(fmtNum(done) + ' of ' + fmtNum(total) + ' encounters done') + '">' +
    '<div class="bar bar-lg" style="position:absolute;left:0;right:0;top:' +
      TRACK_BAR_TOP + 'px">' +
      '<div class="bar-fill" id="live-progress" style="width:' + pct +
        '%;background:var(--corona)"></div>' +
    '</div>' +
    marks +
    '<span id="live-hero-mark" class="track-hero" style="left:' + pct +
      '%;top:' + TRACK_BAR_MID + 'px"></span>' +
  '</div>';
}

// Once a second: move the fill and the hero marker from the clock.
// Never touches the encounter marks themselves - those only change
// when liveTrackHtml is re-run on resolve.
function liveTrackTick(d) {
  const pct = trackPct(d, now()) * 100;
  const bar = el('live-progress');
  if (bar) bar.style.width = pct + '%';
  const hero = el('live-hero-mark');
  if (hero) hero.style.left = pct + '%';
}

/* The sentence for a resolved encounter, chosen by seed so a replay reads
   the same. enc.index is the encounter's fixed place in the descent's
   timeline (already used elsewhere for ':cost:'/':loot:'/':lore:' seeds),
   so ':voice:' + enc.index gives a stream of its own that never collides
   with those. Falls back to the plain name for anything unrecognised —
   an old saved path, a family/Horror/Guardian id LOG_VOICE doesn't have a
   line for yet, or a future addition — so the log can never break. */
/* Which of a family's lines each encounter gets. A path often holds several
   packs of one family, and with three lines each a straight pick repeats
   back to back too often; so an encounter never repeats the line the same
   family and kind used last. Worked forward along the timeline from the
   seed, it comes out the same every time. */
function voiceLineIndex(timeline, pos, seed) {
  const last = {};
  let pick = 0;
  for (let j = 0; j <= pos; j++) {
    const e = timeline[j];
    const fam = LOG_VOICE.families[e.family];
    const lines = fam && fam[e.kind];
    if ((e.kind !== 'pack' && e.kind !== 'elite') || !lines || !lines.length) continue;
    const key = e.family + ':' + e.kind;
    let i = Math.floor(rngFrom(seed + ':voice:' + e.index).next() * lines.length);
    if (lines.length > 1 && i === last[key]) i = (i + 1) % lines.length;
    last[key] = i;
    if (j === pos) pick = i;
  }
  return pick;
}

function encounterVoiceLine(enc, seed, timeline) {
  if (!enc) return '';
  try {
    if (enc.kind === 'pack' || enc.kind === 'elite') {
      const fam = LOG_VOICE.families[enc.family];
      const lines = fam && fam[enc.kind];
      const pos = timeline ? timeline.indexOf(enc) : -1;
      if (lines && lines.length) {
        return pos >= 0 ? lines[voiceLineIndex(timeline, pos, seed)]
                        : rngFrom(seed + ':voice:' + enc.index).pick(lines);
      }
    } else if (enc.kind === 'horror') {
      const hid = horrorIdOf(enc);
      const line = hid && LOG_VOICE.horrors[hid];
      if (line) return line;
    } else if (enc.kind === 'guardian') {
      const gid = enc.guardianId && deepBaseId(enc.guardianId);
      const line = gid && LOG_VOICE.guardians[gid];
      if (line) return line;
    }
  } catch (e) { /* fall through to the plain name below */ }
  return enc.name + '.';
}

/* ============================================================
   THE MAP OF EMBERHOLD - SCOPES-TOWNMAP.md, SPEC 19.4
   An ink-and-ember survey map at the top of the Town tab. The art is inline
   SVG coloured only from the palette's variables. Each place has an
   invisible button laid over it, at least 44px, opening it exactly as its
   tile does; the Breach opens the Descend tab. Pins on the buildings read
   the same live state as the tiles, and the per-second tick keeps them
   current without redrawing the map, so the movement never restarts.
   ============================================================ */

/* The map's drawing space; everything below is placed in these units. At
   360px the map is drawn at 336px wide, so one unit is one pixel and the
   12-unit labels are 12px. */
const TOWN_MAP_W = 336, TOWN_MAP_H = 268;

/* Where each place is, as a tap box in map units. Boxes are at least 54
   units and at least 8 apart, so each is a proper tap target at 360px. */
const TOWN_MAP_SPOTS = {
  chapel: { x: 36,  y: 28,  w: 68,  h: 94, label: 'The Last Chapel' },
  vault:  { x: 236, y: 54,  w: 64,  h: 64, label: 'The Vault' },
  bounty: { x: 134, y: 100, w: 68,  h: 82, label: 'The Bounty Board' },
  market: { x: 30,  y: 142, w: 82,  h: 52, label: 'The Market' },
  forge:  { x: 232, y: 126, w: 72,  h: 76, label: 'The Forge' },
  labour: { x: 84,  y: 202, w: 72,  h: 54, label: 'Commissions' },
  breach: { x: 196, y: 212, w: 138, h: 54, label: 'The Breach: descend' }
};

/* Fill and stroke from palette tokens, so the map follows the palette. */
function tmPaint(fill, stroke, width) {
  return ' style="fill:' + (fill ? 'var(--' + fill + ')' : 'none') + ';' +
    (stroke ? 'stroke:var(--' + stroke + ');stroke-width:' + (width || 1.5) + ';' : '') + '"';
}
function tmLabel(x, y, text) {
  return '<text x="' + x + '" y="' + y + '" text-anchor="middle" font-size="12" font-weight="600"' +
    tmPaint('bone') + '>' + esc(text) + '</text>';
}

/* A pin: a disc in a meaning's colour with a symbol or number on it, so
   colour is never the only signal. */
function tmPin(cx, cy, colour, inner) {
  return '<g><circle cx="' + cx + '" cy="' + cy + '" r="9"' + tmPaint(colour, 'abyss', 2) + '/>' + inner + '</g>';
}
function tmPinText(cx, cy, text) {
  return '<text x="' + cx + '" y="' + (cy + 4.2) + '" text-anchor="middle" font-size="12" font-weight="800"' +
    tmPaint('abyss') + '>' + esc(text) + '</text>';
}
function tmPinIcon(cx, cy, id, colour) {
  return '<use href="#' + id + '" x="' + (cx - 6) + '" y="' + (cy - 6) + '" width="12" height="12"' +
    ' style="color:var(--' + (colour || 'abyss') + ')"/>';
}

/* The live pins. Returns the markup and a key that changes whenever any of
   them should, so the tick only redraws the pins when there is news. */
function townMapPins(hero) {
  const out = [];
  const key = [];

  // The Bounty Board: locked, or contracts ready to claim.
  if (!hasUnlock('bounty')) {
    out.push(tmPin(188, 110, 'edge', tmPinIcon(188, 110, 'ico-lock', 'bone')));
    key.push('bl');
  } else {
    const list = (state.account.contracts && state.account.contracts.list) || [];
    const ready = list.filter(function (c) { return c.done && !c.claimed; }).length;
    if (ready) out.push(tmPin(188, 110, 'brass', tmPinText(188, 110, fmtNum(ready))));
    key.push('b' + ready);
  }

  // The Chapel: Fallen first, then an Offering burning; stacked if both.
  let chapelY = 58;
  if (hero.fallenUntil > now()) {
    out.push(tmPin(94, chapelY, 'blood-light', tmPinIcon(94, chapelY, 'ico-deadly')));
    chapelY += 20;
    key.push('f');
  }
  if (activeOffering(hero)) {
    out.push(tmPin(94, chapelY, 'corona',
      '<path d="M94 ' + (chapelY - 5) + ' C97 ' + (chapelY - 1) + ' 97 ' + (chapelY + 2) + ' 94 ' + (chapelY + 4) +
      ' C91 ' + (chapelY + 2) + ' 91 ' + (chapelY - 1) + ' 94 ' + (chapelY - 5) + ' Z"' + tmPaint('abyss') + '/>'));
    key.push('o');
  }

  // Commissions: a job running, or one that has stopped at its cap.
  if (hero.task) {
    if (taskAtCap(hero)) { out.push(tmPin(124, 200, 'brass', tmPinText(124, 200, '!'))); key.push('tc'); }
    else { out.push(tmPin(124, 200, 'ash', tmPinIcon(124, 200, 'ico-clock'))); key.push('tr'); }
  }

  return { svg: out.join(''), key: key.join('|') };
}

/* The champions' statues in the square: none until they unlock, then one
   figure per champion, up to three. */
function townMapStatues() {
  if (!hasUnlock('statues')) return '';
  const n = Math.min(3, ((state.account && state.account.champions) || []).length);
  const spots = [[146, 120], [190, 120], [168, 152]];
  let s = '';
  for (let i = 0; i < n; i++) {
    const x = spots[i][0], y = spots[i][1];
    s += '<circle cx="' + x + '" cy="' + y + '" r="2.6"' + tmPaint('ash') + '/>' +
      '<rect x="' + (x - 2.5) + '" y="' + (y + 2) + '" width="5" height="7" rx="1"' + tmPaint('ash') + '/>';
  }
  return s;
}

function townMapSvg(hero) {

  return '<svg viewBox="0 0 ' + TOWN_MAP_W + ' ' + TOWN_MAP_H + '" aria-hidden="true" focusable="false">' +

/* The map with its tap targets laid over it. */
function townRenderMap(hero) {
  const pct = function (v, of) { return (v / of * 100).toFixed(3) + '%'; };
  const hits = Object.keys(TOWN_MAP_SPOTS).map(function (place) {
    const s = TOWN_MAP_SPOTS[place];
    let act = 'data-act="open" data-place="' + place + '"';
    let label = s.label;
    if (place === 'breach') act = 'data-act="mapbreach"';
    if (place === 'bounty' && !hasUnlock('bounty')) {
      act = 'data-act="maplocked"';
      label += ', opens at Renown rank ' + town2UnlockRank('bounty');
    }
    return '<button type="button" class="tmap-hit" ' + act + ' aria-label="' + esc(label) + '" style="' +
      'left:' + pct(s.x, TOWN_MAP_W) + ';top:' + pct(s.y, TOWN_MAP_H) + ';' +
      'width:' + pct(s.w, TOWN_MAP_W) + ';height:' + pct(s.h, TOWN_MAP_H) + ';' +
      '--accent:' + (place === 'breach' ? 'var(--corona)' : townAccent(place)) + '"></button>';
  }).join('');
  return '<div class="tmap" role="group" aria-label="Map of Emberhold" data-pins="' +
      esc(townMapPins(hero).key) + '">' +
    townMapSvg(hero) + hits +
  '</div>';
}

/* The map's two taps that aren't places, wrapped onto the Town dispatcher in
   the same way as the Offerings and the Vault. */
(function () {
  const inherited = VIEWS.town.onAct;
  VIEWS.town.onAct = function (act, node, ev) {

    if (act === 'maplocked') {

      return;

})();

/* Keep the pins current once a second: a job reaching its cap, Fallen
   ending, an Offering running out. Only the pins are redrawn, and only when
   they change, so the map's movement is never restarted. */
(function () {
  const inherited = VIEWS.town.tick;
  VIEWS.town.tick = function () {
    if (inherited) inherited.apply(this, arguments);
    const hero = state && state.hero;
    const map = document.querySelector('#view .tmap');
    if (!hero || !map) return;
    const pins = townMapPins(hero);
    if (map.dataset.pins === pins.key) return;
    map.dataset.pins = pins.key;

    if (g) g.innerHTML = pins.svg;
  };
})();
/* ============================================================
   THE HERO TAB REWORK - SCOPES-HERO.md H1-H10, SPEC 19.3
   Core: the helpers the banner, the reminder dots, the paper doll,
   Equip upgrades and the Power breakdown all share. Nothing here
   changes a rule; every figure comes from the game's own stat
   calculation (heroStats) run on copies of the hero.
   ============================================================ */

/* Extra actions and tick hooks the Hero tab's pages add. Each page part
   registers into these rather than redeclaring heroOnAct, so the parts
   never overwrite one another. */
const HERO_ACTS = {};
const HERO_TICKS = [];

(function () {
  const inherited = VIEWS.hero.onAct;
  VIEWS.hero.onAct = function (act, node, ev) {
    const hero = state && state.hero;
    if (hero && HERO_ACTS[act]) { HERO_ACTS[act](hero, node, ev); return; }
    return inherited.call(this, act, node, ev);
  };
  // Re-render only: rite countdowns and the like. Progress still comes
  // from timestamps, never from counting ticks.
  VIEWS.hero.tick = function () {
    for (const fn of HERO_TICKS) fn(state.hero);
  };
})();

/* ---- H4: upgrades waiting in the bag ---- */

/* The bag item that raises Power most for one slot, as
   { item, gainPct }, or null. Relics are left out: a relic trades one stat
   for another, which is a choice rather than an upgrade. */
function heroBestUpgrade(hero, slot) {
  if (slot === 'relic') return null;
  let best = null;
  for (const item of hero.inventory) {
    if (item.slot !== slot || !canEquip(hero, item)) continue;
    const gain = heroPowerDeltaSafe(hero, item);
    if (gain >= BALANCE.heroTab.upgradeMinPct && (!best || gain > best.gainPct)) {
      best = { item: item, gainPct: gain };
    }
  }
  return best;
}

/* What a swap would cost beyond Power: set bonuses it would end, and a
   unique power the replaced item would take with it. Plain text lines. */
function heroSwapLosses(hero, item) {
  const clone = heroEquipPreview(hero, item, false).clone;
  const out = heroSetBonusChanges(hero, clone)
    .filter(function (c) { return !c.gain; })
    .map(function (c) { return 'Ends ' + c.text; });
  const replaced = hero.equipment[item.slot];
  if (replaced && replaced.rarity === 'unique' && replaced.uniqueId && UNIQUES[replaced.uniqueId]) {
    out.push('Loses ' + replaced.name + ': ' + UNIQUES[replaced.uniqueId].power.text);
  }
  return out;
}

/* Every suggested swap, one per slot, in slot order:
   { slot, item, replaced, gainPct, losses }. A swap with losses should
   start unticked in the Equip upgrades sheet. */
function heroUpgradeList(hero) {
  const out = [];
  for (const slot of BALANCE.items.slots) {
    const best = heroBestUpgrade(hero, slot);
    if (!best) continue;
    out.push({
      slot: slot,
      item: best.item,
      replaced: hero.equipment[slot] || null,
      gainPct: best.gainPct,
      losses: heroSwapLosses(hero, best.item)
    });
  }
  return out;
}

/* The hero's stats with several swaps made at once, for the sheet's
   "Power before and after". */
function heroStatsWithSwaps(hero, items) {
  const clone = JSON.parse(JSON.stringify(hero));
  for (const item of items) clone.equipment[item.slot] = item;
  return heroStats(clone);
}

/* Make the swaps, one at a time through the normal equip rule, so nothing
   here can do what a player couldn't do by hand. Returns how many landed. */
function heroApplyUpgrades(hero, items) {
  let done = 0, reason = '';
  for (const item of items) {
    if (hero.inventory.indexOf(item) < 0) continue;
    const res = equipItem(hero, item);
    if (res.ok) done++;
    else if (!reason) reason = res.reason || '';
  }
  return { done: done, reason: reason };
}

/* ---- H2: what needs the player's attention ---- */

/* A new (unopened) item in the bag that would raise Power. Opening an
   item clears its "new" mark, so a lower-Power item kept on purpose
   never keeps the dot lit. Cached on a cheap signature, because the
   check runs every second from the tick. */
let heroNewUpgradeCache = { sig: '', value: false };
function heroHasNewUpgrade(hero) {
  const fresh = hero.inventory.filter(function (it) { return it.isNew && it.slot !== 'relic'; });
  if (!fresh.length) return false;
  const sig = fresh.map(function (it) { return it.id; }).join(',') + '|' +
    BALANCE.items.slots.map(function (s) { return hero.equipment[s] ? hero.equipment[s].id : '-'; }).join(',') + '|' +
    hero.level + '|' + spentSkillPoints(hero) + '|' + abyssalSpent(hero);
  if (sig === heroNewUpgradeCache.sig) return heroNewUpgradeCache.value;
  let value = false;
  for (const item of fresh) {
    if (canEquip(hero, item) && heroPowerDeltaSafe(hero, item) >= BALANCE.heroTab.upgradeMinPct) { value = true; break; }
  }
  heroNewUpgradeCache = { sig: sig, value: value };
  return value;
}

/* { skill, abyssal, upgrade, any, key, label }. `label` is the spoken
   reason for the Hero tab button; `key` changes whenever the dots do. */
function heroAttention(hero) {
  if (!hero) return { skill: 0, abyssal: 0, upgrade: false, any: false, key: '', label: '' };
  const skill = Math.max(0, unspentSkillPoints(hero));
  const abyssal = Math.max(0, abyssalUnspent(hero));
  const upgrade = heroHasNewUpgrade(hero);
  const bits = [];
  if (skill) bits.push(fmtNum(skill) + ' skill point' + (skill === 1 ? '' : 's') + ' to spend');
  if (abyssal) bits.push(fmtNum(abyssal) + ' Abyssal point' + (abyssal === 1 ? '' : 's') + ' to spend');
  if (upgrade) bits.push('a new upgrade in your bag');
  return {
    skill: skill, abyssal: abyssal, upgrade: upgrade,
    any: bits.length > 0,
    key: skill + '|' + abyssal + '|' + (upgrade ? 1 : 0),
    label: bits.join(', ')
  };
}

/* The tab bar, with the Hero tab's dot. Redeclared from the shell's
   version: same buttons, plus the dot and its spoken reason. */
function renderTabs() {
  const host = el('tabs');
  const attn = heroAttention(state && state.hero);
  host.innerHTML = TAB_LIST.map(function (t) {
    const cur = t.id === ui.tab;
    const dot = t.id === 'hero' && attn.any;
    return '<button class="tab" data-act="tab" data-tab="' + t.id + '"' +
      (cur ? ' aria-current="page"' : '') +
      (dot ? ' aria-label="' + esc(t.label + ', ' + attn.label) + '"' : '') + '>' +
      icon(t.icon) + '<span>' + t.label + '</span>' +
      (dot ? '<span class="tab-dot" aria-hidden="true"></span>' : '') +
    '</button>';
  }).join('');
  ui.heroAttnKey = attn.key;
}

/* Once a second, from the strip's redraw: when the dots change (a level-up
   mid-descent, say), redraw the tab bar, and the Hero tab too if it is
   showing, so its page buttons agree. */
(function () {
  const inherited = renderStrip;
  renderStrip = function () {
    inherited.apply(this, arguments);
    const attn = heroAttention(state && state.hero);
    if (attn.key === ui.heroAttnKey) return;
    renderTabs();
    if (ui.tab === 'hero') renderView();
  };
})();

/* ---- H7: where Power comes from ---- */

/* Power built up in a fixed order - level and class, then Abyssal ranks,
   then skills, then gear - by running the stat calculation on copies of
   the hero with each layer added in turn. Power is Guard^0.7 x Might^0.3,
   so what a layer adds depends on what is already there; gear goes last so
   its figure answers "what is my gear worth?" exactly.
   Returns { total, parts: [{ id, label, value }] } with whole numbers that
   always add up to the rounded total. A part can be negative (a keystone
   that trades Guard away, say). Abyssal ranks appear only when they add
   something: Blessings never touch Might or Guard, so they never move Power. */
function heroPowerLayers(hero) {
  const strip = function (keepAbyssal, keepSkills) {
    const c = JSON.parse(JSON.stringify(hero));
    c.equipment = { weapon: null, helm: null, armor: null, gloves: null, boots: null, relic: null };
    if (!keepSkills) { c.skills = {}; c.timed = []; c.primed = []; }
    if (!keepAbyssal) c.abyssal = { ranks: (hero.abyssal && hero.abyssal.ranks) || 0, spent: {} };
    return heroStats(c).power;
  };
  const p0 = Math.round(strip(false, false));
  const p1 = Math.round(strip(true, false));
  const p2 = Math.round(strip(true, true));
  const pt = Math.round(heroStats(hero).power);
  const parts = [{ id: 'base', label: 'Level and class', value: p0 }];
  if (p1 !== p0) parts.push({ id: 'abyssal', label: 'Abyssal ranks', value: p1 - p0 });
  parts.push({ id: 'skills', label: 'Skills', value: p2 - p1 });
  parts.push({ id: 'gear', label: 'Gear', value: pt - p2 });
  return { total: pt, parts: parts };
}
/* ============================================================
   Infernus — Hero tab rework, part "banner" (X = banner)

   dots/pill on Gear/Stats/Skills — the tab-bar dot itself is

     heroHeader(hero)        - H1

     hero2StatTile(key, raw) - H6

   New top-level names, all prefixed hb/hs per the brief:
     HERO_STAT_LOOK  - {colour, icon} per stat, used by hero2StatTile
     hbCountPhrase(n, singular, plural)
     hbRecordLine(hero)
   ============================================================ */

/* Per-stat colour token (matches a CSS var name) and sprite icon id,

const HERO_STAT_LOOK = {

  crit:      { colour: 'blood-light', icon: 'ico-stat-crit' },
  goldFind:  { colour: 'brass',       icon: 'ico-coin' },
  itemFind:  { colour: 'bone',        icon: 'ico-stat-itemfind' },
  xpBonus:   { colour: 'corona',      icon: 'ico-stat-xp' },

function hbCountPhrase(n, singular, plural) {
