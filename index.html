        '</select></label>' +
        '<label class="field" style="width:92px"><span>Runs</span>' +
          '<input id="sim-runs" type="number" min="10" max="5000" value="' + BALANCE.debug.simDefaultRuns + '"></label>' +
      '</div>' +
      '<label class="row" style="gap:8px;margin-top:6px;min-height:44px">' +
        '<input type="checkbox" id="sim-omens" style="width:22px;height:22px">' +
        '<span class="small">Random omens</span></label>' +
      '<div class="btn-row" style="margin-top:8px">' +
        '<button class="btn btn-sm btn-primary" data-act="sim-run">Run</button>' +
        '<button class="btn btn-sm" data-act="sim-targets">Check §21.2</button>' +
        '<button class="btn btn-sm" data-act="pace">Pace table</button>' +
      '</div>' +
      '<div id="sim-out" class="dbg-out" style="margin-top:10px">Ready.</div>' +

      '<div class="divider"></div>' +
      '<div class="section-title">Save</div>' +
      '<button class="btn btn-sm btn-danger btn-block" data-act="reset">Reset save</button>',

    onAct: function (act, node) {
      const out = document.getElementById('sim-out');
      const h2 = state.hero;
      const reopen = function () { closeSheet(); refresh(); openDebug(); };

      if (act === 'skip') { addDebugOffset(parseInt(node.dataset.ms, 10)); reopen(); }
      if (act === 'skipreset') { setDebugOffset(0); reopen(); }

      if (act === 'grant-level') { grantXp(h2, xpToNext(h2.level)); save(); reopen(); }
      if (act === 'grant-gold') { h2.gold += tenParDescentsOfGold(h2); save(); reopen(); }
      if (act === 'grant-ash') { h2.ash += 100; save(); reopen(); }
      if (act === 'grant-shards') { h2.starshards += 20; save(); reopen(); }
      if (act === 'grant-floors') {
        const v = clamp(parseInt(document.getElementById('dbg-floor').value, 10) || 1, 1, DEBUG_MAX_FLOOR);
        h2.deepest = Math.max(h2.deepest, v);
        if (h2.deepest > state.account.deepestEver) state.account.deepestEver = h2.deepest;
        save(); reopen();
      }
      if (act === 'grant-item') {
        const slot = document.getElementById('dbg-slot').value;
        const rar = document.getElementById('dbg-rar').value;
        const ilvl = Math.max(1, parseInt(document.getElementById('dbg-ilvl').value, 10) || 1);
        const it = rollItem(rngFrom(newSeed('dbg')), {
          floor: ilvl, ilvl: ilvl, classId: h2.classId, slot: slot, rarity: rar
        });
        const res = addItem(h2, it);
        toast(res.added ? it.name + ' added.' : 'Inventory full, salvaged.');
        save(); reopen();
      }
      if (act === 'hp-full') { const st = heroStats(h2); setHp(h2, st.maxHp); save(); reopen(); }
      if (act === 'hp-one') { setHp(h2, 1); save(); reopen(); }
      if (act === 'clear-fallen') { h2.fallenUntil = 0; save(); reopen(); }

      if (act === 'sim-run' || act === 'sim-targets' || act === 'pace') {
        out.textContent = 'Running...';
        // let the paint land before the blocking run
        setTimeout(function () {
          try {
            if (act === 'pace') { out.textContent = debugPaceText(); return; }
            if (act === 'sim-targets') { out.textContent = debugTargetsText(); return; }
            const who = document.getElementById('sim-hero').value;
            const floor = clamp(parseInt(document.getElementById('sim-floor').value, 10) || 1, 1, 40);
            const runs = clamp(parseInt(document.getElementById('sim-runs').value, 10) || 100, 10, 5000);
            const pathType = document.getElementById('sim-path').value;
            const omens = document.getElementById('sim-omens').checked;
            const makeHero = who === 'current'
              ? function () { const c = JSON.parse(JSON.stringify(state.hero)); c.slotsOverride = 100000; return c; }
              : function () { return parHero(floor, who); };
            const r = simulate({ floor: floor, runs: runs, tag: 'ui', pathType: pathType,
                                 randomOmens: omens, makeHero: makeHero });
            out.textContent = debugSimText(r);
          } catch (e) { out.textContent = 'Error: ' + e.message; }
        }, 30);
      }

      if (act === 'reset') {
        closeSheet();
        openSheet({
          title: 'Reset save',
          body: '<p>This erases everything. Type RESET to confirm.</p>' +
                '<label class="field"><span>Confirm</span><input id="dbg-reset" autocapitalize="characters"></label>',
          foot: '<button class="btn btn-block btn-danger" data-act="go">Erase everything</button>',
          onAct: function (a) {
            if (a !== 'go') return;
            if (document.getElementById('dbg-reset').value.trim().toUpperCase() !== 'RESET') {
              toast('Type RESET to confirm.'); return;
            }
            try { localStorage.removeItem(BALANCE.save.key); } catch (e) {}
            setDebugOffset(0);
            location.reload();
          }
        });
      }
    }
  });
}

function debugSimText(r) {
  const rc = r.rarityCounts;
  return 'Floor ' + r.floor + ', ' + r.runs + ' runs\n' +
    'HP cost   mean ' + r.meanCostPct.toFixed(1) + '%   p90 ' + r.p90CostPct.toFixed(1) + '%\n' +
    'Deaths    ' + r.deathRate.toFixed(2) + '%\n' +
    'Duration  ' + fmtTime(r.meanDuration) + '\n' +
    'Gold      ' + fmtNum(Math.round(r.meanGold)) + '\n' +
    'XP        ' + fmtNum(Math.round(r.meanXp)) + '\n' +
    'Items     ' + r.meanItems.toFixed(2) + '\n' +
    'Rarities  C ' + rc.common + '  M ' + rc.magic + '  R ' + rc.rare +
      '  U ' + rc.unique + '  S ' + rc.set;
}

/* The SPEC 21.2 targets that apply to Phase 1, checked in one press. */
function debugTargetsText() {
  const lines = [];
  const mark = function (ok) { return ok ? 'PASS' : 'FAIL'; };

  const normals = [6, 8, 12, 14, 16, 18];
  let sum = 0, worst = null;
  for (const f of normals) {
    const r = simulate({ floor: f, runs: 200, tag: 'tg', makeHero: function () { return parHero(f, 'neutral'); } });
    sum += r.meanCostPct;
    if (!worst || r.meanCostPct < worst.v || r.meanCostPct > worst.v) worst = { f: f, v: r.meanCostPct };
    lines.push('  f' + f + ' ' + r.meanCostPct.toFixed(1) + '%  deaths ' + r.deathRate.toFixed(2) +
               '%  items ' + r.meanItems.toFixed(2));
  }
  const avg = sum / normals.length;
  lines.unshift('Normal path cost 36-48%: ' + mark(avg >= 36 && avg <= 48) + ' (avg ' + avg.toFixed(1) + '%)');

  for (const f of [10, 20]) {
    const r = simulate({ floor: f, runs: 200, tag: 'tgg', makeHero: function () { return parHero(f, 'neutral'); } });
    lines.push('Guardian f' + f + ' 60-82%: ' + mark(r.meanCostPct >= 60 && r.meanCostPct <= 82) +
               ' (' + r.meanCostPct.toFixed(1) + '%)');
  }

  const fresh = function () {
    const x = freshHero('Par', 'juggernaut');
    const rng = rngFrom('starter');
    for (const slot of ['weapon', 'helm', 'armor', 'gloves', 'boots']) {
      x.equipment[slot] = rollItem(rng, { floor: 1, ilvl: 1, classId: 'juggernaut', rarity: 'common', slot: slot });
    }
    x.slotsOverride = 100000; x.deepest = 3; return x;
  };
  for (const f of [1, 2, 3]) {
    const r = simulate({ floor: f, runs: 200, tag: 'tgf', makeHero: fresh });
    lines.push('Fresh Juggernaut f' + f + ' 5-20%: ' +
      mark(r.meanCostPct >= 5 && r.meanCostPct <= 20) + ' (' + r.meanCostPct.toFixed(1) + '%)');
  }

  const f15 = 15;
  const r15 = simulate({ floor: f15, runs: 150, tag: 'tgh', makeHero: function () { return parHero(f15, 'neutral'); } });
  const st15 = heroStats(parHero(f15, 'neutral'));
  const spent = st15.maxHp * r15.meanCostPct / 100;
  const toFull = spent / (regenRatePerHour(15, 0) / HOUR);
  lines.push('Time to full at L15 ~2.5h: ' + fmtTime(toFull));

  return lines.join('\n');
}

function debugPaceText() {
  const rows = paceTable();
  const out = ['Level  descents  target  off'];
  for (const r of rows) {
    if (r.level % 5 !== 0 && r.level > 5) continue;      // keep it readable
    const off = (r.descents / r.target - 1) * 100;
    out.push(String(r.level).padStart(5) + '  ' + r.descents.toFixed(2).padStart(8) + '  ' +
             r.target.toFixed(2).padStart(6) + '  ' + (off >= 0 ? '+' : '') + off.toFixed(0) + '%');
  }
  return out.join('\n');
}

/* ============================================================
   VIEWS.town (Phase 2) - SPEC 13, 16.1, 19.4
   COMPLETE replacement of the Phase 1 town view. This is spliced
   in after the Phase 1 file, so this VIEWS.town assignment wins.

   Reused as-is from the Phase 1 file (not redeclared, since they
   are already `let`/`const`/`function` bindings in the same
   script and redeclaring `let`/`const` would throw): the
   `townPlace` / `townMarketTab` state, the `TOWN_KEEPERS` object
   (extended below with a new key), and the helpers
   townCurrencyRow, townHeader, townBadge, townAffixLines,
   townFindInvItem, townFindOwnedItem, townIsEquipped,
   townChapelStatus, townForgeStatus, townMarketStatus, townTile,
   townRenderChapel and townRenderRespec (Chapel is unchanged in
   Phase 2, so it is not touched here at all).

   Redeclared on purpose (same name, last one wins - the whole
   point of the splice): townRenderHub, townRenderForge,
   townRenderMarket, and the VIEWS.town object itself, because
   each needs new sections.

   Brand new pieces (Bounty Board, Reforge, Auto-salvage,
   Supplies, Early restock, Black Market, unique/set display) all
   use a `town2` prefix so they can never collide with a
   same-named helper in the Phase 1 file.
   ============================================================ */

/* The Bounty Board's keeper, added to the existing keeper map. */
TOWN_KEEPERS.bounty = 'Warden Hask';
TOWN_KEEPERS.vault = 'Doss the Quiet';
TOWN_ACCENTS.vault = 'edge';

/* ============================================================
   SHARED NEW HELPERS (town2 prefix)
   ============================================================ */

/* The rank a named unlock opens at, read from BALANCE so the
   number is never hardcoded twice (SPEC 16.1). */
function town2UnlockRank(id) {
  for (const r in BALANCE.renownUnlocks) {
    if (BALANCE.renownUnlocks[r].id === id) return r;
  }
  return '?';
}

/* The display name for an item: a unique or set piece's proper
   name (looked up in UNIQUES/SETS, per API-PHASE2), a rare's
   rolled name, or null for common/magic (which show only their
   base type, same as Phase 1). */
/* SPEC 11.7 - a common item is just its base type; everything else carries
   its own rolled or fixed name. A set piece is named for the PIECE
   ("Oathbound Greathelm"), not for its set. */
function town2ItemName(item) {
  if (item.rarity === 'common') return null;
  return item.name || item.baseType;
}

/* Replacement for the Phase 1 townItemLabel that also names
   uniques and set pieces, not just rares. */
function town2ItemLabel(item) {
  const nm = town2ItemName(item);
  const cls = 'rar-' + item.rarity;
  if (!nm) return '<div class="' + cls + '" style="font-weight:600">' + esc(item.baseType) + '</div>';
  // Only a rare hides its base type inside its name, so only a rare repeats it
  // beneath (SPEC 11.7). A magic name already ends in its base type.
  const showBase = item.rarity === 'rare' || item.rarity === 'unique' || item.rarity === 'set';
  return '<div class="' + cls + '" style="font-weight:600">' + esc(nm) + '</div>' +
    (showBase ? '<div class="tiny muted">' + esc(item.baseType) + '</div>' : '');
}

/* A border style string from RARITIES[r].border (e.g. "3px double"),
   paired with that rarity's colour token. Never a hardcoded value -
   both pieces come from the engine's RARITIES table. */
function town2RarityBorderStyle(item) {
  const r = RARITIES[item.rarity];
  if (!r || !r.border) return '';
  return 'border:' + r.border + ' var(--r-' + item.rarity + ')';
}

/* The chain icon that SPEC 11.3 pairs with the Set border, shown
   next to the badge so rarity is never colour-alone. */
function town2ChainIcon(item) {
  const r = RARITIES[item.rarity];
  return (r && r.chain) ? icon('ico-chain') : '';
}

/* One affix, formatted the same way townAffixLines formats a list. */
function town2AffixText(a) {
  const def = a && AFFIXES[a.id];
  if (!def) return '';
  return def.text.replace('X', fmtNum(a.value));
}

/* Full detail body for an item sheet: badge, name, affixes, and -
   for uniques and set pieces - the power text / lore line, or the
   set name, worn-piece count and both bonuses (inactive one dimmed). */
function town2ItemDetailBody(hero, item) {
  let out = '<div class="stack-s">';
  out += '<div class="row" style="gap:8px">' +
    townBadge(item) + town2ChainIcon(item) +
    '<div class="grow">' + town2ItemLabel(item) + '</div>' +
  '</div>';
  out += '<div class="tiny muted">ilvl ' + fmtNum(item.ilvl) +
    (item.temper ? ' · +' + fmtNum(item.temper) : '') + '</div>';
  out += townAffixLines(item);

  if (item.rarity === 'unique') {
    const u = item.uniqueId && UNIQUES[item.uniqueId];
    if (u) {
      out += '<p class="small" style="margin-top:10px">' + esc(u.power.text) + '</p>';
      out += '<p class="small" style="font-style:italic;color:var(--ash);margin-top:8px">' + esc(u.lore) + '</p>';
    }
  }

  if (item.rarity === 'set') {
    const s = item.setId && SETS[item.setId];
    if (s) {
      const counts = equippedSetCounts(hero);
      const worn = (counts && counts[item.setId]) || 0;
      const has2 = heroHasSetBonus(hero, item.setId, 2);
      const has3 = heroHasSetBonus(hero, item.setId, 3);
      out += '<div class="small" style="margin-top:10px;font-weight:600">' + esc(s.name) + '</div>';
      out += '<div class="tiny muted">Worn: ' + fmtNum(worn) + ' / ' + fmtNum(s.pieces.length) + '</div>';
      out += '<div class="small' + (has2 ? '' : ' muted') + '" style="margin-top:8px">(2) ' + esc(s.bonus2.text) + '</div>';
      out += '<div class="small' + (has3 ? '' : ' muted') + '" style="margin-top:4px">(3) ' + esc(s.bonus3.text) + '</div>';
    }
  }

  out += '</div>';
  return out;
}

/* Open the read-only detail sheet for an owned item (equipped or
   in the inventory). Used from Salvage, Temper and Sell rows. */
function town2OpenItemDetail(hero, item) {
  openSheet({
    title: esc(town2ItemName(item) || item.baseType),
    body: town2ItemDetailBody(hero, item),
    foot: '<button class="btn btn-block" data-act="close">Close</button>',
    onAct: function (a) { if (a === 'close') closeSheet(); }
  });
}

/* ============================================================
   HUB - Bounty Board tile, SPEC 19.4 / 13.4
   ============================================================ */

function town2BountyStatus(hero) {
  const contracts = (state.account.contracts && state.account.contracts.list) || [];
  const claimable = contracts.filter(function (c) { return c.done && !c.claimed; }).length;
  if (claimable > 0) {
    return claimable + ' of ' + contracts.length + ' ready to claim';
  }
  const nextAt = (state.account.contracts && state.account.contracts.nextAt) || 0;
  const left = Math.max(0, nextAt - now());
  return 'New contracts in ' + fmtTime(left);
}

function town2RenderHubTile(hero) {
  if (!hasUnlock('bounty')) {
    return '<div class="card" style="min-height:44px;opacity:0.75">' +
      '<div class="row" style="gap:10px">' +
        icon('ico-lock') +
        '<div class="grow">' +
          '<div style="font-weight:600">The Bounty Board</div>' +
          '<div class="tiny muted">' + esc(TOWN_KEEPERS.bounty) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="divider" style="margin:10px 0 8px"></div>' +
      '<div class="small muted">Opens at Renown rank ' + town2UnlockRank('bounty') + '</div>' +
    '</div>';
  }

  const contracts = (state.account.contracts && state.account.contracts.list) || [];
  const claimable = contracts.filter(function (c) { return c.done && !c.claimed; }).length;
  const nextAt = (state.account.contracts && state.account.contracts.nextAt) || 0;
  // Only wire the live per-second countdown when we are showing a countdown
  // (not the "N ready to claim" text, which only changes on refresh()).
  const cd = claimable > 0 ? 0 : nextAt;
  return townTile('bounty', 'The Bounty Board', town2BountyStatus(hero), 'ico-star', cd);
}

/* Redeclares the Phase 1 townRenderHub to add the fourth tile. */
function townRenderHub(hero) {
  return '<div class="stack">' +
    townTile('chapel', 'The Last Chapel', townChapelStatus(hero), 'ico-chapel') +
    townTile('forge', 'The Forge', townForgeStatus(hero), 'ico-salvage') +
    townTile('market', 'The Market', townMarketStatus(hero), 'ico-market', hero.market.restockAt) +
    town2RenderHubTile(hero) +
  '</div>';
}

/* ============================================================
   THE BOUNTY BOARD - SPEC 13.4
   ============================================================ */

function town2RenderBounty(hero) {
  if (!hasUnlock('bounty')) {
    return townHeader('The Bounty Board', 'bounty') +
      '<p class="small muted">Opens at Renown rank ' + town2UnlockRank('bounty') + '.</p>';
  }

  let out = townHeader('The Bounty Board', 'bounty') + townCurrencyRow(hero, { shards: true });

  const contracts = (state.account.contracts && state.account.contracts.list) || [];
  const nextAt = (state.account.contracts && state.account.contracts.nextAt) || 0;
  const left = Math.max(0, nextAt - now());
  out += '<p class="small muted" data-town-cd="' + nextAt + '" data-town-cd-tmpl="bounty">' +
    'New contracts in ' + fmtTime(left) +
  '</p>';

  if (!contracts.length) {
    out += '<p class="small muted">No contracts posted yet.</p>';
    return out;
  }

  out += '<div class="stack-s">';
  contracts.forEach(function (c, idx) {
    const pct = c.goal > 0 ? Math.max(0, Math.min(1, c.progress / c.goal)) : 0;
    out += '<div class="card' + (c.claimed ? ' muted' : '') + '">' +
      '<div style="font-weight:600">' + esc(c.text) + '</div>';

    if (c.goal === 1) {
      out += '<div class="small' + (c.done ? '' : ' muted') + '" style="margin-top:8px">' +
        (c.done ? 'Done' : 'Not done') +
      '</div>';
    } else {
      // bar-xp fills in corona; blood is reserved for HP.
      out += '<div class="bar bar-xp" style="margin-top:8px"><div class="bar-fill" style="width:' + Math.round(pct * 100) + '%"></div></div>' +
        '<div class="tiny muted" style="margin-top:4px">' + fmtNum(Math.min(c.progress, c.goal)) + ' / ' + fmtNum(c.goal) + '</div>';
    }

    if (c.claimed) {
      out += '<div class="tiny muted" style="margin-top:10px">Claimed</div>';
    } else if (c.done) {
      out += '<div style="margin-top:10px">' +
        '<button class="btn btn-primary btn-block" data-act="claimContract" data-idx="' + idx + '">Claim</button>' +
      '</div>';
    }

    out += '</div>';
  });
  out += '</div>';

  return out;
}

/* ============================================================
   THE FORGE - SPEC 13.2 / 11.9
   Redeclares the Phase 1 townRenderForge: keeps Salvage and
   Temper as they were (now item-rarity aware), adds Reforge and
   Auto-salvage below.
   ============================================================ */

function townRenderForge(hero) {
  let out = townHeader('The Forge', 'forge') +
    townCurrencyRow(hero, { ash: true, shards: true, sticky: true });

  // ---- Salvage ----
  out += '<div class="section-title">Salvage</div>';
  const salvageable = hero.inventory.filter(function (i) { return !i.locked; });
  if (!salvageable.length) {
    out += '<p class="small muted">Nothing unlocked to salvage.</p>';
  } else {
    out += '<div class="stack-s">';
    salvageable.forEach(function (item) {
      const y = heroSalvageYield(hero, item);
      out += '<div class="row-between panel" style="' + town2RarityBorderStyle(item) + '">' +
        '<button type="button" class="row grow" data-act="detail" data-id="' + esc(item.id) + '" style="gap:8px;min-height:44px;text-align:left">' +
          townBadge(item) + town2ChainIcon(item) +
          '<div>' + town2ItemLabel(item) + '</div>' +
        '</button>' +
        '<button class="btn btn-sm" data-act="salvage" data-id="' + esc(item.id) + '">' +
          fmtNum(y.ash) + ' Ash' + (y.shards ? ', ' + fmtNum(y.shards) + ' Starshards' : '') +
        '</button>' +
      '</div>';
    });
    out += '</div>';

    out += '<div class="stack-s" style="margin-top:10px">';
    ['common', 'magic', 'rare'].forEach(function (r) {
      out += '<button class="btn btn-sm btn-block" data-act="bulk" data-rarity="' + r + '">' +
        'Salvage all unlocked ' + RARITIES[r].name.toLowerCase() + ' and below' +
      '</button>';
    });
    out += '</div>';
  }

  // ---- Temper ----
  out += '<div class="section-title">Temper</div>' +
    '<p class="tiny muted">Each level adds 8% to base stats, up to +' + BALANCE.items.temperMax + '.</p>';
  const owned = [];
  for (const slot in hero.equipment) { if (hero.equipment[slot]) owned.push(hero.equipment[slot]); }
  hero.inventory.forEach(function (i) { owned.push(i); });
  if (!owned.length) {
    out += '<p class="small muted">No items to temper.</p>';
  } else {
    out += '<div class="stack-s">';
    owned.forEach(function (item) {
      const c = temperCost(item);
      const equippedTag = townIsEquipped(hero, item) ? ' <span class="tiny muted">(equipped)</span>' : '';
      out += '<div class="row-between panel" style="' + town2RarityBorderStyle(item) + '">' +
        '<button type="button" class="row grow" data-act="detail" data-id="' + esc(item.id) + '" style="gap:8px;min-height:44px;text-align:left">' +
          townBadge(item) + town2ChainIcon(item) +
          '<div>' + town2ItemLabel(item) + '<div class="tiny muted">+' + (item.temper || 0) + equippedTag + '</div></div>' +
        '</button>';
      if (!c) {
        out += '<span class="small muted">+' + BALANCE.items.temperMax + ', maximum</span>';
      } else {
        const afford = hero.gold >= c.gold && hero.ash >= c.ash && hero.starshards >= c.shards;
        out += '<button class="btn btn-sm" data-act="temper" data-id="' + esc(item.id) + '"' +
          (afford ? '' : ' disabled') + '>' +
          '+' + c.to + ': ' + fmtNum(c.gold) + 'g' +
          (c.ash ? ', ' + fmtNum(c.ash) + ' Ash' : '') +
          (c.shards ? ', ' + fmtNum(c.shards) + ' Starshards' : '') +
        '</button>';
      }
      out += '</div>';
    });
    out += '</div>';
  }

  // ---- Reforge (Phase 2, Renown rank 7) ----
  out += '<div class="section-title">Reforge</div>';
  if (!hasUnlock('reforge')) {
    out += '<p class="small muted">Opens at Renown rank ' + town2UnlockRank('reforge') + '.</p>';
  } else {
    const candidates = owned.filter(function (i) { return canReforge(i).ok; });
    if (!candidates.length) {
      out += '<p class="small muted">No magic or rare items to reforge.</p>';
    } else {
      out += '<p class="tiny muted">Replaces one affix with a new one. The cost doubles each time that item is reforged.</p>';
      out += '<div class="stack-s">';
      candidates.forEach(function (item) {
        const c = reforgeCost(item);
        const equippedTag = townIsEquipped(hero, item) ? ' <span class="tiny muted">(equipped)</span>' : '';
        out += '<button type="button" class="row-between panel card-tap" data-act="reforgeOpen" data-id="' + esc(item.id) + '" style="min-height:44px;width:100%;' + town2RarityBorderStyle(item) + '">' +
          '<span class="row" style="gap:8px">' +
            townBadge(item) +
            '<span>' + town2ItemLabel(item) + equippedTag + '</span>' +
          '</span>' +
          '<span class="small">' + fmtNum(c.gold) + 'g, ' + fmtNum(c.ash) + ' Ash</span>' +
        '</button>';
      });
      out += '</div>';
    }
  }

  // ---- Auto-salvage (Phase 2, Renown rank 3) ----
  out += '<div class="section-title">Auto-salvage</div>';
  if (!hasUnlock('autosalvage')) {
    out += '<p class="small muted">Opens at Renown rank ' + town2UnlockRank('autosalvage') + '.</p>';
  } else {
    out += '<p class="tiny muted">Uniques and sets are never auto-salvaged.</p>';
    const AS = (state.settings && state.settings.autoSalvage) || { common: false, magic: false, rare: false };
    out += '<div class="stack-s">';
    ['common', 'magic', 'rare'].forEach(function (r) {
      const on = !!AS[r];
      out += '<button type="button" class="row-between panel card-tap" data-act="autosalvage" data-rarity="' + r + '" style="min-height:44px;width:100%">' +
        '<span class="row" style="gap:8px">' + townBadge({ rarity: r }) + '<span>Auto-salvage ' + esc(RARITIES[r].name.toLowerCase()) + '</span></span>' +
        '<span class="small">' + (on ? 'On' : 'Off') + '</span>' +
      '</button>';
    });
    out += '</div>';
  }

  return out;
}

/* ============================================================
   THE MARKET - SPEC 13.3
   Redeclares the Phase 1 townRenderMarket: keeps the Buy/Sell
   toggle and lists as they were (now item-rarity aware), adds
   Supplies, Early restock and the Black Market below.
   ============================================================ */

function townRenderMarket(hero) {
  let out = townHeader('The Market', 'market') + townCurrencyRow(hero);

  const left = Math.max(0, (hero.market.restockAt || 0) - now());
  out += '<p class="small muted" data-town-cd="' + hero.market.restockAt + '" data-town-cd-tmpl="market">' +
    'Restocks in ' + fmtTime(left) + '</p>';

  out += '<div class="btn-row" style="margin:10px 0">' +
    '<button class="btn btn-sm' + (townMarketTab === 'buy' ? ' btn-primary' : '') + '" data-act="markettab" data-tab="buy">Buy</button>' +
    '<button class="btn btn-sm' + (townMarketTab === 'sell' ? ' btn-primary' : '') + '" data-act="markettab" data-tab="sell">Sell</button>' +
  '</div>';

  if (townMarketTab === 'buy') {
    const stock = hero.market.stock || [];
    if (!stock.length) {
      out += '<p class="small muted">Nothing in stock.</p>';
    } else {
      out += '<div class="stack-s">';
      stock.forEach(function (item) {
        const price = buyPrice(item);
        const afford = hero.gold >= price && inventoryFree(hero) > 0;
        const delta = Math.round(powerDelta(hero, item));
        out += '<div class="card" style="' + town2RarityBorderStyle(item) + '">' +
          '<div class="row" style="gap:8px">' +
            townBadge(item) + town2ChainIcon(item) +
            '<div class="grow">' + town2ItemLabel(item) +
              '<div class="tiny muted">ilvl ' + fmtNum(item.ilvl) + '</div>' +
              townAffixLines(item) +
              '<div>' + powerArrow(delta) + '</div>' +
            '</div>' +
          '</div>' +
          '<div style="margin-top:10px">' +
            '<button class="btn btn-block' + (afford ? ' btn-primary' : '') + '" data-act="buy" data-id="' + esc(item.id) + '"' +
              (afford ? '' : ' disabled') + '>Buy — ' + fmtNum(price) + ' gold</button>' +
          '</div>' +
        '</div>';
      });
      out += '</div>';
    }
  } else {
    const sellable = hero.inventory.filter(function (i) { return !i.locked; });
    if (!sellable.length) {
      out += '<p class="small muted">Nothing unlocked to sell.</p>';
    } else {
      out += '<div class="stack-s">';
      sellable.forEach(function (item) {
        const price = sellPrice(hero, item);
        out += '<div class="row-between panel" style="' + town2RarityBorderStyle(item) + '">' +
          '<button type="button" class="row grow" data-act="detail" data-id="' + esc(item.id) + '" style="gap:8px;min-height:44px;text-align:left">' +
            townBadge(item) + town2ChainIcon(item) +
            '<div>' + town2ItemLabel(item) + '</div>' +
          '</button>' +
          '<button class="btn btn-sm" data-act="sell" data-id="' + esc(item.id) + '">' +
            'Sell — ' + fmtNum(price) + ' gold' +
          '</button>' +
        '</div>';
      });
      out += '</div>';
    }
  }

  // ---- Supplies (Phase 2, always available) ----
  out += '<div class="section-title">Supplies</div>';
  out += '<div class="stack-s">';
  ['candle', 'ward', 'oil'].forEach(function (id) {
    const s = BALANCE.town.supplies[id];
    const held = (hero.supplies && hero.supplies[id]) || 0;
    const price = supplyPrice(hero, id);
    const atMax = held >= s.max;
    const afford = hero.gold >= price;
    out += '<div class="row-between panel">' +
      '<div class="grow">' +
        '<div style="font-weight:600">' + esc(s.name) + '</div>' +
        '<div class="tiny muted">' + esc(s.text) + '</div>' +
        '<div class="tiny muted">' + fmtNum(held) + ' / ' + fmtNum(s.max) + ' held</div>' +
      '</div>' +
      '<button class="btn btn-sm' + (!atMax && afford ? ' btn-primary' : '') + '" data-act="buySupply" data-id="' + id + '"' +
        (atMax || !afford ? ' disabled' : '') + '>' +
        (atMax ? 'Max' : fmtNum(price) + ' gold') +
      '</button>' +
    '</div>';
  });
  out += '</div>';

  // ---- Early restock (Phase 2, Renown rank 5) ----
  if (hasUnlock('restock')) {
    out += '<div class="section-title">Early restock</div>';
    const cost = earlyRestockCost(hero);
    const afford = hero.gold >= cost;
    out += '<button class="btn btn-block' + (afford ? ' btn-primary' : '') + '" data-act="earlyRestock"' +
      (afford ? '' : ' disabled') + '>' +
      'Restock now — ' + fmtNum(cost) + ' gold' +
    '</button>';
  }

  // ---- Black Market (Phase 2, Renown rank 12) ----
  if (hasUnlock('blackmarket')) {
    out += '<div class="section-title">Black Market</div>';
    const bm = hero.market.blackMarket;
    if (!bm || !bm.item) {
      out += '<p class="small muted">Nothing on offer. Check back after it refreshes.</p>';
    } else {
      const item = bm.item;
      const price = blackMarketPrice(item);
      const afford = hero.gold >= price && inventoryFree(hero) > 0;
      const bmLeft = Math.max(0, (bm.expiresAt || 0) - now());
      const u = item.uniqueId && UNIQUES[item.uniqueId];
      out += '<div class="card" style="' + town2RarityBorderStyle(item) + '">' +
        '<div class="row" style="gap:8px">' +
          townBadge(item) + town2ChainIcon(item) +
          '<div class="grow">' + town2ItemLabel(item) +
            '<div class="tiny muted">ilvl ' + fmtNum(item.ilvl) + '</div>' +
            townAffixLines(item) +
          '</div>' +
        '</div>';
      if (u) {
        out += '<p class="small" style="margin-top:10px">' + esc(u.power.text) + '</p>' +
          '<p class="small" style="font-style:italic;color:var(--ash);margin-top:8px">' + esc(u.lore) + '</p>';
      }
      out += '<div class="small muted" style="margin-top:10px" data-town-cd="' + (bm.expiresAt || 0) + '" data-town-cd-tmpl="blackmarket">' +
          'Expires in ' + fmtTime(bmLeft) +
        '</div>' +
        '<div style="margin-top:10px">' +
          '<button class="btn btn-block' + (afford ? ' btn-primary' : '') + '" data-act="buyBlackMarket"' +
            (afford ? '' : ' disabled') + '>Buy — ' + fmtNum(price) + ' gold</button>' +
        '</div>' +
      '</div>';
    }
  }

  return out;
}

VIEWS.town = {
  render: function () {
    const hero = state && state.hero;
    if (!hero) {
      return '<div class="card"><p class="muted small">No hero yet.</p></div>';
    }
    if (townPlace === 'chapel') return townRenderChapel(hero);
    if (townPlace === 'forge') return townRenderForge(hero);
    if (townPlace === 'market') return townRenderMarket(hero);
    if (townPlace === 'bounty') return town2RenderBounty(hero);
    return townRenderHub(hero);
  },

  tick: function () {
    const host = el('view');
    if (!host) return;
    const nodes = host.querySelectorAll('[data-town-cd]');
    nodes.forEach(function (n) {
      const target = parseInt(n.getAttribute('data-town-cd'), 10) || 0;
      const tmpl = n.getAttribute('data-town-cd-tmpl');
      const left = Math.max(0, target - now());
      let prefix = 'Restocks in ';
      if (tmpl === 'fallen') prefix = 'Time left: ';
      else if (tmpl === 'bounty') prefix = 'New contracts in ';
      else if (tmpl === 'blackmarket') prefix = 'Expires in ';
      else if (tmpl === 'offering') prefix = 'Ends in ';
      n.textContent = prefix + fmtTime(left);
    });
  },

  onAct: function (act, node) {
    const hero = state && state.hero;
    if (!hero) return;

    if (act === 'open') { townPlace = node.dataset.place; townMarketTab = 'buy'; refresh(); return; }
    if (act === 'back') { townPlace = null; refresh(); return; }

    if (act === 'heal') {
      const r = healHero(hero, parseFloat(node.dataset.frac));
      if (!r.ok) toast(r.reason); else toast('Healed ' + fmtNum(r.restored) + ' HP.');
      refresh();
      return;
    }

    if (act === 'revive') {
      const r = reviveHero(hero);
      if (!r.ok) toast(r.reason); else toast('Revived.');
      refresh();
      return;
    }

    if (act === 'respec') {
      const cost = respecCost(hero);
      confirmSheet({
        title: 'Respec your skills?',
        body: 'This refunds every skill point and empties your rite slots.' +
          (cost > 0 ? ' It costs ' + fmtNum(cost) + ' gold.' : ' It is free below level ' + BALANCE.tree.respecFreeBelowLevel + '.'),
        yes: 'Respec',
        danger: true,
        onYes: function () {
          const r = respec(hero);
          if (!r.ok) toast(r.reason); else toast('Skills reset.');
          refresh();
        }
      });
      return;
    }

    if (act === 'salvage') {
      const item = townFindInvItem(hero, node.dataset.id);
      if (!item) return;
      const r = salvageItem(hero, item);
      if (!r.ok) toast(r.reason);
      else toast('Salvaged for ' + fmtNum(r.yield.ash) + ' Ash' + (r.yield.shards ? ' and ' + fmtNum(r.yield.shards) + ' Starshards' : '') + '.');
      refresh();
      return;
    }

    if (act === 'bulk') {
      const rarity = node.dataset.rarity;
      const p = bulkSalvagePreview(hero, rarity);
      if (p.count <= 0) { toast('Nothing to salvage.'); return; }
      confirmSheet({
        title: 'Salvage ' + fmtNum(p.count) + ' item' + (p.count === 1 ? '' : 's') + '?',
        body: 'Yields ' + fmtNum(p.ash) + ' Ash' + (p.shards ? ' and ' + fmtNum(p.shards) + ' Starshards' : '') + '.',
        yes: 'Salvage',
        danger: true,
        onYes: function () {
          bulkSalvage(hero, rarity);
          refresh();
          toast('Salvaged.');
        }
      });
      return;
    }

    if (act === 'temper') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const r = temperItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Tempered to +' + r.to + '.');
      refresh();
      return;
    }

    if (act === 'detail') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      town2OpenItemDetail(hero, item);
      return;
    }

    if (act === 'reforgeOpen') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const gate = canReforge(item);
      if (!gate.ok) { toast(gate.reason); return; }
      const cost = reforgeCost(item);
      const afford = hero.gold >= cost.gold && hero.ash >= cost.ash;
      openSheet({
        title: 'Reforge',
        body:
          '<div class="stack-s">' +
            '<div class="row" style="gap:8px">' + townBadge(item) + town2ChainIcon(item) + '<div>' + town2ItemLabel(item) + '</div></div>' +
            '<p class="small muted">Pick one affix to replace. Costs ' + fmtNum(cost.gold) + ' gold and ' + fmtNum(cost.ash) + ' Ash' +
              (afford ? '.' : ' — not enough to reforge.') +
            '</p>' +
            '<div class="stack-s">' +
              item.affixes.map(function (a, i) {
                return '<button type="button" class="row-between panel card-tap" data-act="reforgePick" data-idx="' + i + '"' +
                  (afford ? '' : ' disabled') + ' style="min-height:44px;width:100%">' +
                  '<span class="small">' + esc(town2AffixText(a)) + '</span>' +
                  '<span class="tiny muted">Replace</span>' +
                '</button>';
              }).join('') +
            '</div>' +
          '</div>',
        foot: '<button class="btn btn-block" data-act="close">Cancel</button>',
        onAct: function (a, n) {
          if (a === 'close') { closeSheet(); return; }
          if (a === 'reforgePick') {
            const idx = parseInt(n.dataset.idx, 10);
            const r = reforgeAffix(hero, item, idx);
            if (!r.ok) { toast(r.reason); return; }
            toast('Reforged: ' + town2AffixText(r.from) + ' → ' + town2AffixText(r.to));
            closeSheet();
            refresh();
          }
        }
      });
      return;
    }

    if (act === 'autosalvage') {
      if (!state.settings) state.settings = {};
      if (!state.settings.autoSalvage) state.settings.autoSalvage = { common: false, magic: false, rare: false };
      const r = node.dataset.rarity;
      state.settings.autoSalvage[r] = !state.settings.autoSalvage[r];
      save();
      refresh();
      return;
    }

    if (act === 'markettab') { townMarketTab = node.dataset.tab; refresh(); return; }

    if (act === 'buy') {
      const item = (hero.market.stock || []).find(function (i) { return i.id === node.dataset.id; });
      if (!item) return;
      const r = buyItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Bought ' + (town2ItemName(item) || item.baseType) + '.');
      refresh();
      return;
    }

    if (act === 'sell') {
      const item = townFindInvItem(hero, node.dataset.id);
      if (!item) return;
      const r = sellItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Sold for ' + fmtNum(r.gold) + ' gold.');
      refresh();
      return;
    }

    if (act === 'buySupply') {
      const id = node.dataset.id;
      const r = buySupply(hero, id);
      if (!r.ok) toast(r.reason); else toast('Bought ' + BALANCE.town.supplies[id].name + '.');
      refresh();
      return;
    }

    if (act === 'earlyRestock') {
      const r = buyEarlyRestock(hero);
      if (!r.ok) toast(r.reason); else toast('The Market restocked.');
      refresh();
      return;
    }

    if (act === 'buyBlackMarket') {
      const bm = hero.market.blackMarket;
      const boughtItem = bm && bm.item;
      const r = buyBlackMarket(hero);
      if (!r.ok) { toast(r.reason); return; }
      toast('Bought ' + (boughtItem ? (town2ItemName(boughtItem) || boughtItem.baseType) : 'the item') + '.');
      refresh();
      return;
    }

    if (act === 'claimContract') {
      const idx = parseInt(node.dataset.idx, 10);
      const r = claimContract(hero, idx);
      if (!r.ok) { toast(r.reason); return; }
      let msg = 'Contract complete: ' + fmtNum(r.gold) + ' gold, ' + fmtNum(r.starshards) + ' Starshard' + (r.starshards === 1 ? '' : 's');
      if (r.renown && r.renown.amount) msg += ', ' + fmtNum(r.renown.amount) + ' Renown';
      toast(msg);
      refresh();
      return;
    }
  }
};

/* ============================================================
   HALLS TAB - Phase 2 (SPEC 17.1, 19.5, 16.1).
   Replaces the Phase 1 VIEWS.halls (view-halls.js). This file is
   spliced in AFTER it, so this assignment wins.

   Reuses, unchanged, the card-sheet helpers already defined earlier
   in the script by view-halls.js: hallsActForCard, hallsCardTitle,
   hallsCardSheetOpts, hallsCardRow, hallsOpenSeenCard, and
   showStoryCard. They are already generic across any story-card id
   (act1..god), so all eight Phase 2 cards work through them with no
   changes. showStoryCard's signature and behaviour are untouched -
   it is not redefined here at all.

   New helpers in this file are prefixed halls2 so they cannot
   collide with the halls-prefixed ones still in the file, or with
   anything the Records/Champions/Armory parts add later.

   Two segments: Codex (story cards + lore pages, grouped by act) and
   Renown (rank, progress, the unlock ladder). Records, Champions,
   Armory, achievements and titles are Phase 3 and are not built here.

/* All story cards that exist in Phase 2 (SPEC 14.3), in per-act
   order: an act's intro card before its Guardian card. This is the
   Phase 2 superset of the Phase-1-only HALLS_PHASE1_CARDS list. */
const HALLS2_ALL_CARDS = ['act1', 'warden', 'act2', 'vael', 'act3', 'champion', 'act4', 'god'];

/* Which segment is showing. Module-level so it survives refresh()
   re-rendering this view. */
let halls2Tab = 'codex';

/* Resolve an act from either an act id string ('act1') or a 1-based
   act number (1-4), since we don't get to assume which shape a lore
   page's `act` field uses. Returns null if neither matches. */
function halls2ActByRef(actRef) {
  for (let i = 0; i < ACTS.length; i++) {
    if (ACTS[i].id === actRef) return ACTS[i];
  }
  const n = Number(actRef);
  if (!isNaN(n) && ACTS[n - 1]) return ACTS[n - 1];
  return null;
}

/* Every lore page in the game (Phase 2 only - guarded, since
   LORE_PAGES may not exist yet). */
function halls2AllLorePages() {
  if (typeof LORE_PAGES === 'undefined') return [];
  return Object.keys(LORE_PAGES).map(function (id) { return LORE_PAGES[id]; });
}

/* This act's five lore pages, in reading order. */
function halls2LorePagesForAct(act) {
  return halls2AllLorePages().filter(function (p) {
    const a = halls2ActByRef(p.act);
    return a && a.id === act.id;
  }).sort(function (a, b) { return a.n - b.n; });
}

/* One lore-page row: found (tappable, opens a sheet with its title
   and text) or missing (locked, reveals nothing - not even the
   title, matching how hallsCardRow treats an unfound story card). */
function halls2LoreRow(page) {
  const codex = (state.account && state.account.codex) || [];
  const found = codex.indexOf(page.id) >= 0;

  if (!found) {
    return (
      '<div class="row muted" style="min-height:44px">' +
        icon('ico-lock') +
        '<div class="grow">Missing page</div>' +
      '</div>'
    );
  }

  return (
    '<button type="button" class="card-tap row row-indent" data-act="lore" data-page="' + esc(page.id) + '">' +
      '<div class="grow">' + esc(page.title) + '</div>' +
      icon('ico-chevron-right') +
    '</button>'
  );
}

/* Open a found lore page in a sheet, styled like a found story card
   (SPEC 14.4): title, then the page's text as the payoff. Read-only -
   lore pages are never re-added to the codex or saved here, they are
   simply displayed. */
function halls2OpenLorePage(pageId) {
  if (typeof LORE_PAGES === 'undefined') return;
  const page = LORE_PAGES[pageId];
  if (!page) return;
  const act = halls2ActByRef(page.act);

  openSheet({
    title: act ? act.display : 'Lore',
    body:
      '<div class="stack">' +
        '<h3 class="display" style="font-size:1.4rem;margin:0">' + esc(page.title) + '</h3>' +
        '<p style="line-height:1.75;background:var(--raised);' +
          'border-radius:var(--radius);padding:14px;max-width:34em">' +
          esc(page.text) +
        '</p>' +
      '</div>',
    foot: '<button class="btn btn-primary btn-block btn-lg" data-act="close">Close</button>',
    onAct: function (a) { if (a === 'close') closeSheet(); }
  });
}

/* Codex segment: progress line, then one section per act with its
   story cards (via the existing hallsCardRow) and, once LORE_PAGES
   exists, that act's lore pages beneath them. */
function halls2RenderCodex() {
  const codex = (state.account && state.account.codex) || [];
  const cardsFound = HALLS2_ALL_CARDS.filter(function (id) { return codex.indexOf(id) >= 0; }).length;
  const lorePages = halls2AllLorePages();
  const pagesFound = lorePages.filter(function (p) { return codex.indexOf(p.id) >= 0; }).length;

  const progressText = lorePages.length
    ? ('Cards ' + cardsFound + ' of ' + HALLS2_ALL_CARDS.length + ' · Pages ' + pagesFound + ' of ' + lorePages.length)
    : ('Cards ' + cardsFound + ' of ' + HALLS2_ALL_CARDS.length);

  let html = '<p class="muted small" style="margin:10px 2px 0">' + esc(progressText) + '</p>';

  ACTS.forEach(function (act) {
    const cardIds = HALLS2_ALL_CARDS.filter(function (id) {
      const a = hallsActForCard(id);
      return a && a.id === act.id;
    });
    const pages = halls2LorePagesForAct(act);
    if (!cardIds.length && !pages.length) return;

    html += '<h3 class="display" style="font-size:1.125rem;margin:18px 0 8px">' + esc(act.display) + '</h3>';

    if (cardIds.length) {
      html += '<div class="card stack-s">' + cardIds.map(hallsCardRow).join('') + '</div>';
    }

    if (pages.length) {
      html += '<div class="section-title" style="margin-top:10px">Lore pages</div>' +
        '<div class="card stack-s">' + pages.map(halls2LoreRow).join('') + '</div>';
    }
  });

  return html;
}

/* One row of the rank ladder: rank number, the unlock's label, the
   Renown needed for that rank (renownForRank), and a status word.
   - Reached and active: not dimmed, unlock icon, "Unlocked".
   - Not yet reached: dimmed, lock icon, "Locked" (with the Renown
     figure shown either way so the player can see what it takes).
   Superseded by halls3RankRow; every rank pays out from Phase 3 on. */
function halls2RankRow(r, entry) {
  const needed = renownForRank(r);
  const active = hasUnlock(entry.id);
  const dim = !active;
  const ic = active ? 'ico-unlock' : 'ico-lock';
  const status = active ? 'Unlocked' : 'Locked';

  return (
    '<div class="row' + (dim ? ' muted' : '') + '" style="min-height:44px">' +
      icon(ic) +
      '<div class="grow">' +
        '<div>Rank ' + fmtNum(r) + ' · ' + esc(entry.label) + '</div>' +
        '<div class="tiny">' + esc(fmtNum(needed) + ' Renown · ' + status) + '</div>' +
      '</div>' +
    '</div>'
  );
}

/* Renown segment: current rank and total, progress within the rank
   (or "max rank" once there), a plain-language note on where Renown
   comes from, then the full unlock ladder. */
function halls2RenderRenown() {
  const rank = currentRank();
  const total = currentRenown();
  const prog = renownProgress();

  let html = '<div class="card">' +
    '<div class="row-between">' +
      '<div>' +
        '<h2 style="font-size:1.5rem;margin:0">Rank ' + fmtNum(rank) + '</h2>' +
        '<p class="muted small" style="margin-top:4px">' + fmtNum(total) + ' Renown total</p>' +
      '</div>' +
      icon('ico-star') +
    '</div>';

  if (prog.atMax) {
    html += '<p class="small" style="margin-top:10px">Max rank reached.</p>';
  } else {
    const pct = prog.needed > 0 ? Math.min(100, Math.max(0, (prog.into / prog.needed) * 100)) : 0;
    // bar-xp fills in corona; blood is reserved for HP.
    html += '<div class="bar bar-lg bar-xp" style="margin-top:12px">' +
        '<div class="bar-fill" style="width:' + pct + '%"></div>' +
      '</div>' +
      '<p class="muted small num" style="margin-top:6px">' +
        esc(fmtNum(prog.into) + ' / ' + fmtNum(prog.needed) + ' to rank ' + fmtNum(rank + 1)) +
      '</p>';
  }

  html += '</div>';

  html += '<p class="muted small" style="margin:14px 2px 0">' +
    'Renown grows automatically: reaching a new deepest floor for the account, a hero’s ' +
    'first kill of each Guardian, and every Bounty Board contract you complete.' +
  '</p>';

  html += '<div class="section-title" style="margin-top:14px">Ranks</div><div class="card stack-s">';
  Object.keys(BALANCE.renownUnlocks)
    .map(Number)
    .sort(function (a, b) { return a - b; })
    .forEach(function (r) { html += halls2RankRow(r, BALANCE.renownUnlocks[r]); });
  html += '</div>';

  return html;
}

VIEWS.halls = {
  render: function () {
    const tabs = [{ id: 'codex', label: 'Codex' }, { id: 'renown', label: 'Renown' }];

    let html = '<div class="row" style="gap:8px">' +
      tabs.map(function (t) {
        const sel = halls2Tab === t.id;
        // Match the Hero tab's segmented control rather than plain text.
        return '<button type="button" class="btn grow' + (sel ? ' btn-primary' : '') + '" ' +
          'data-act="tab" data-tab="' + t.id + '">' + esc(t.label) + '</button>';
      }).join('') +
    '</div>';

    html += halls2Tab === 'renown' ? halls2RenderRenown() : halls2RenderCodex();
    return html;
  },

  onAct: function (act, node) {
    if (act === 'tab') {
      halls2Tab = node.dataset.tab;
      refresh();
      return;
    }
    if (act === 'card') {
      hallsOpenSeenCard(node.dataset.card);
      return;
    }
    if (act === 'lore') {
      halls2OpenLorePage(node.dataset.page);
      return;
    }
  }
};

/* ============================================================
   HALLS TAB - Phase 3 (SPEC 16.1, 16.3, 16.4, 17, 19.5).
   Replaces the Phase 2 VIEWS.halls (view-halls2.js). Spliced in AFTER
   it, so this assignment wins.

   Reuses, unchanged: hallsActForCard, hallsCardTitle, hallsCardRow,
   hallsOpenSeenCard, showStoryCard (all from view-halls.js) and
   HALLS2_ALL_CARDS, halls2AllLorePages, halls2LorePagesForAct,
   halls2LoreRow, halls2OpenLorePage, halls2ActByRef (from
   view-halls2.js). None of those are redefined here.

   Five segments, two rows so they fit at 360px without any page-level
   horizontal scroll: Codex / Records / Champions on row one, Armory /
   Renown on row two. Every segment button uses .btn-sm inside a
   .btn-row, so each is 44px tall and the row shares width evenly
   (label wraps instead of overflowing if it's ever too long for the
   column - it never scrolls the page sideways).

   New helpers here are prefixed halls3 so they cannot collide with
   the halls/halls2-prefixed helpers still in the file.
   ============================================================ */

/* Which segment is showing. Module-level so it survives refresh(). */
let halls3Tab = 'codex';

const HALLS3_SEGMENTS = [
  { id: 'codex',     label: 'Codex' },
  { id: 'records',   label: 'Records' },
  { id: 'champions', label: 'Champions' },
  { id: 'armory',    label: 'Armory' },
  { id: 'renown',    label: 'Renown' }
];

function halls3SegButton(seg) {
  const sel = halls3Tab === seg.id;
  return '<button type="button" class="btn btn-sm' + (sel ? ' btn-primary' : '') + '" ' +
    'data-act="tab" data-tab="' + seg.id + '">' + esc(seg.label) + '</button>';
}

/* Two rows of three-then-two so five segments fit at 360px without a
   sideways-scrolling page (CLAUDE.md, mobile-first). */
function halls3SegControl() {
  const row1 = HALLS3_SEGMENTS.slice(0, 3);
  const row2 = HALLS3_SEGMENTS.slice(3);
  return '<div class="stack-s" style="margin-bottom:14px">' +
    '<div class="btn-row">' + row1.map(halls3SegButton).join('') + '</div>' +
    '<div class="btn-row">' + row2.map(halls3SegButton).join('') + '</div>' +
  '</div>';
}

/* Capitalized slot name, e.g. "weapon" -> "Weapon". */
function halls3SlotName(slot) {
  return slot ? slot.charAt(0).toUpperCase() + slot.slice(1) : '';
}

/* The class sigil, optionally ringed in a sigil-frame colour (SPEC
   18.3). With no classId (Aldric Venn has none) draws a plain empty
   ring instead of an empty/missing <use> - never nothing at all. */
function halls3SigilHtml(classId, size, frame) {
  const s = size || 40;
  if (!classId) {
    return '<div style="width:' + s + 'px;height:' + s + 'px;border-radius:50%;' +
      'border:2px solid var(--edge);flex:0 0 auto"></div>';
  }
  const ring = frame && FRAME_COLOURS[frame] ? ('border:2px solid ' + FRAME_COLOURS[frame] + ';') : '';
  const inner = Math.round(s * 0.6);
  return '<div style="width:' + s + 'px;height:' + s + 'px;border-radius:50%;' + ring +
    'display:flex;align-items:center;justify-content:center;flex:0 0 auto">' +
    '<svg class="ico" style="width:' + inner + 'px;height:' + inner + 'px" aria-hidden="true">' +
      '<use href="#sig-' + esc(classId) + '"></use>' +
    '</svg>' +
  '</div>';
}

function halls3DateStr(ts) {
  return new Date(ts).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
}

/* ============================================================
   CODEX - story cards + lore pages (unchanged, via the shared
   helpers) plus Echoes from Below (SPEC 14.5, new in Phase 3).
   ============================================================ */

/* Every Echo floor to show: the six drafted ones in ECHOES, plus any
   echo_<n> id the account has already found above floor 100 (those
   are generated at the time they're first seen - see maybeShowEcho). */
function halls3EchoFloors() {
  const codex = (state.account && state.account.codex) || [];
  const set = {};
  [50, 60, 70, 80, 90, 100].forEach(function (n) { set[n] = true; });
  codex.forEach(function (id) {
    const m = /^echo_(\d+)$/.exec(id);
    if (m) { const n = Number(m[1]); if (n > 100) set[n] = true; }
  });
  return Object.keys(set).map(Number).sort(function (a, b) { return a - b; });
}

/* Title/text for a found Echo. Floors 50-100 are the drafted ECHOES
   entries; past 100 they're generated by seed (BALANCE.echoes, same
   as maybeShowEcho uses), so re-reading one here reproduces the exact
   line the player already saw - seeded randomness never changes on
   reload (CLAUDE.md). */
function halls3EchoInfo(n) {
  if (typeof ECHOES !== 'undefined' && ECHOES[n]) {
    return { title: ECHOES[n].title, text: ECHOES[n].text };
  }
  return { title: 'Floor ' + fmtNum(n), text: rngFrom('echo:' + n).pick(ECHO_POOL) };
}

function halls3EchoRow(n) {
  const codex = (state.account && state.account.codex) || [];
  const found = codex.indexOf('echo_' + n) >= 0;
  if (!found) {
    return '<div class="row muted" style="min-height:44px">' +
      icon('ico-lock') +
      '<div class="grow">Not yet found</div>' +
    '</div>';
  }
  const info = halls3EchoInfo(n);
  return '<button type="button" class="card-tap row row-indent" data-act="echo" data-floor="' + n + '">' +
    '<div class="grow">' + esc(info.title) + '</div>' +
    icon('ico-chevron-right') +
  '</button>';
}

function halls3OpenEcho(n) {
  const info = halls3EchoInfo(n);
  openSheet({
    title: 'Echoes from Below',
    body: '<div class="stack">' +
        '<h3 class="display" style="font-size:1.4rem;margin:0">' + esc(info.title) + '</h3>' +
        '<p style="line-height:1.75;background:var(--raised);border-radius:var(--radius);' +
          'padding:14px;max-width:34em">' + esc(info.text) + '</p>' +
      '</div>',
    foot: '<button class="btn btn-primary btn-block btn-lg" data-act="close">Close</button>',
    onAct: function (a) { if (a === 'close') closeSheet(); }
  });
}

function halls3RenderCodex() {
  const codex = (state.account && state.account.codex) || [];
  const cardsFound = HALLS2_ALL_CARDS.filter(function (id) { return codex.indexOf(id) >= 0; }).length;
  const lorePages = halls2AllLorePages();
  const pagesFound = lorePages.filter(function (p) { return codex.indexOf(p.id) >= 0; }).length;
  const echoFloors = halls3EchoFloors();
  const echoesFound = echoFloors.filter(function (n) { return codex.indexOf('echo_' + n) >= 0; }).length;

  const bits = ['Cards ' + cardsFound + ' of ' + HALLS2_ALL_CARDS.length];
  if (lorePages.length) bits.push('Pages ' + pagesFound + ' of ' + lorePages.length);
  bits.push('Echoes ' + echoesFound + ' of ' + echoFloors.length);
  bits.push('Horrors ' + namedHorrorsKilled() + ' of ' + HORROR_ORDER.length);

  let html = '<p class="muted small" style="margin:10px 2px 0">' + esc(bits.join(' · ')) + '</p>';

  ACTS.forEach(function (act) {
    const cardIds = HALLS2_ALL_CARDS.filter(function (id) {
      const a = hallsActForCard(id);
      return a && a.id === act.id;
    });
    const pages = halls2LorePagesForAct(act);
    if (!cardIds.length && !pages.length) return;

    html += '<h3 class="display" style="font-size:1.125rem;margin:18px 0 8px">' + esc(act.display) + '</h3>';
    if (cardIds.length) html += '<div class="card stack-s">' + cardIds.map(hallsCardRow).join('') + '</div>';
    if (pages.length) {
      html += '<div class="section-title" style="margin-top:10px">Lore pages</div>' +
        '<div class="card stack-s">' + pages.map(halls2LoreRow).join('') + '</div>';
    }
  });

  // Collections take the reading face; the blackletter is kept for act
  // names, which is all CLAUDE.md allows it for on this screen.
  html += '<h3 style="font-size:1.125rem;margin:18px 0 8px">Echoes from Below</h3>';
  html += '<div class="card stack-s">' + echoFloors.map(halls3EchoRow).join('') + '</div>';

  html += '<h3 style="font-size:1.125rem;margin:18px 0 8px">Bestiary</h3>';
  html += '<div class="card stack-s">' + HORROR_ORDER.map(hallsBestiaryRow).join('') + '</div>';

  return html;
}

/* One named Wandering Horror (SCOPES.md 3). Unmet, it stays a locked row
   and gives nothing away. Once killed, it shows its twist, its lore and how
   many times the account has killed it. Found rows carry no icon, like the
   rest of the Codex. */
function hallsBestiaryRow(id) {
  const h = HORRORS[id];
  const kills = totalOf('horror:' + id);
  if (!kills) {
    return '<div class="row muted" style="min-height:44px">' +
      icon('ico-lock') +
      '<div class="grow">Unknown Horror</div>' +
    '</div>';
  }
  return '<div class="row-indent" style="padding-top:6px;padding-bottom:6px">' +
    '<div class="row-between" style="gap:10px">' +
      '<span style="font-weight:600">' + esc(h.name) + '</span>' +
      '<span class="tiny muted num" style="flex:0 0 auto">Slain ' + fmtNum(kills) + '</span>' +
    '</div>' +
    '<div class="small" style="margin-top:2px;color:var(--ash)">' + esc(h.twist) + '</div>' +
    '<div class="small" style="margin-top:4px">' + esc(h.lore) + '</div>' +
  '</div>';
}

/* ============================================================
   RECORDS - Hall of Records (SPEC 17.2).
   ============================================================ */

function halls3RecordRow(label, rec, kind) {
  if (!rec) {
    return '<div class="card" style="padding:10px 12px">' +
      '<div class="row-between"><div>' + esc(label) + '</div><div class="muted small">Not set yet</div></div>' +
    '</div>';
  }
  const val = kind === 'time' ? fmtTime(rec.value) : fmtNum(rec.value);
  const who = rec.heroName || 'Unknown';
  return '<div class="card" style="padding:10px 12px">' +
    '<div class="row-between"><div>' + esc(label) + '</div><div class="num">' + esc(val) + '</div></div>' +
    '<div class="tiny muted" style="margin-top:2px">' + esc(who) + ' · ' + esc(halls3DateStr(rec.at)) + '</div>' +
  '</div>';
}

function halls3RenderRecords() {
  let html = '<div class="section-title">Personal bests</div><div class="stack-s">';
  html += halls3RecordRow('Deepest floor', getRecord('deepest'));
  BALANCE.phase.unlockedClasses.forEach(function (cid) {
    html += halls3RecordRow('Deepest floor · ' + heroClassName(cid), getRecord('deepest', cid));
  });
  ['warden', 'vael', 'champion', 'god'].forEach(function (gid) {
    html += halls3RecordRow('Fastest clear · ' + hallsCardTitle(gid), getRecord('guardian_time', gid), 'time');
  });
  html += halls3RecordRow('Most gold from one descent', getRecord('gold_descent'));
  html += halls3RecordRow('Longest run without falling', getRecord('clear_streak'));
  html += '</div>';

  html += '<div class="section-title" style="margin-top:18px">Lifetime totals</div><div class="card stack-s">';
  Object.keys(TOTAL_DEFS).forEach(function (id) {
    const def = TOTAL_DEFS[id];
    const val = def.kind === 'time' ? fmtTime(totalOf(id)) : fmtNum(totalOf(id));
    html += '<div class="row-between" style="min-height:36px">' +
      '<div class="small">' + esc(def.name) + '</div><div class="num small">' + esc(val) + '</div>' +
    '</div>';
  });
  html += '</div>';
  return html;
}

/* ============================================================
   CHAMPIONS - Hall of Champions (SPEC 17.3).
   ============================================================ */

function halls3ChampionsList() {
  const champions = (state.account && state.account.champions) || [];
  return [firstChampionPlaque()].concat(champions);
}

function halls3FindPlaque(id) {
  if (id === 'aldric_venn') return firstChampionPlaque();
  const champions = (state.account && state.account.champions) || [];
  return champions.find(function (p) { return p.id === id; }) || null;
}

function halls3PlaqueRow(p) {
  const nameTitle = p.name + (p.title ? ' ' + p.title : '');
  const meta = [];
  if (p.classId) meta.push(heroClassName(p.classId));
  if (p.ascension) meta.push('Ascension ' + fmtNum(p.ascension));
  meta.push('Floor ' + fmtNum(p.deepest));

  return '<button type="button" class="card card-tap row" data-act="plaque" data-id="' + esc(p.id) + '" ' +
    'style="gap:10px;align-items:flex-start;text-align:left">' +
    halls3SigilHtml(p.classId, 40) +
    '<div class="grow">' +
      '<div style="font-weight:600">' + esc(nameTitle) + '</div>' +
      '<div class="tiny muted" style="margin-top:2px">' + esc(meta.join(' · ')) + '</div>' +
      '<div class="small" style="margin-top:6px">' + esc(p.epitaph) + '</div>' +
    '</div>' +
  '</button>';
}

function halls3StatLine(label, val) {
  return '<div class="row-between" style="min-height:32px">' +
    '<div class="tiny muted">' + esc(label) + '</div><div class="small num">' + esc(val) + '</div>' +
  '</div>';
}

function halls3OpenPlaque(id) {
  const p = halls3FindPlaque(id);
  if (!p) return;

  let body = '<div class="stack">';
  body += '<div class="row" style="gap:10px">' +
    halls3SigilHtml(p.classId, 44) +
    '<div class="grow">' +
      '<div style="font-weight:600;font-size:1.125rem">' + esc(p.name + (p.title ? ' ' + p.title : '')) + '</div>' +
      (p.classId ? '<div class="tiny muted">' + esc(heroClassName(p.classId)) +
        (p.ascension ? ' · Ascension ' + fmtNum(p.ascension) : '') + '</div>' : '') +
    '</div>' +
  '</div>';
  body += '<p style="line-height:1.6;background:var(--raised);border-radius:var(--radius);padding:14px">' +
    esc(p.epitaph) + '</p>';

  if (!p.founder) {
    body += '<div class="card stack-s">' +
      halls3StatLine('Level', fmtNum(p.level)) +
      halls3StatLine('Deepest floor', fmtNum(p.deepest)) +
      halls3StatLine('Days served', fmtNum(p.daysServed)) +
      halls3StatLine('Descents', fmtNum(p.descents)) +
      halls3StatLine('Times fallen', fmtNum(p.deaths)) +
    '</div>';

    const gear = p.equipment || {};
    const gearRows = BALANCE.items.slots.map(function (slot) {
      const it = gear[slot];
      const label = it ? (town2ItemName(it) || it.baseType) : '—';
      return '<div class="row-between" style="min-height:32px">' +
        '<div class="tiny muted">' + esc(halls3SlotName(slot)) + '</div>' +
        '<div class="small">' + esc(label) + '</div>' +
      '</div>';
    }).join('');
    body += '<div class="section-title" style="margin-top:10px">Gear</div><div class="card stack-s">' + gearRows + '</div>';
  }
  body += '</div>';

  openSheet({
    title: 'Hall of Champions',
    body: body,
    foot: '<button class="btn btn-block" data-act="close">Close</button>',
    onAct: function (a) { if (a === 'close') closeSheet(); }
  });
}

function halls3RenderChampions() {
  let html = '';
  if ((state.account.ascensions || 0) === 0) {
    html += '<p class="muted small" style="margin:10px 2px 14px">' +
      'No hero has ascended yet. Their plaque will join this Hall the moment they do.</p>';
  }
  html += '<div class="stack-s">' + halls3ChampionsList().map(halls3PlaqueRow).join('') + '</div>';
  return html;
}

/* ============================================================
   ARMORY - every unique and set piece, by class (SPEC 17.4).
   ============================================================ */

function halls3SetsForClass(classId) {
  const out = [];
  for (const sid in SETS) if (SETS[sid].classId === classId) out.push(SETS[sid]);
  return out;
}

function halls3ArmoryTotalForClass(classId) {
  return uniquesForClass(classId).length +
    halls3SetsForClass(classId).reduce(function (n, s) { return n + s.pieces.length; }, 0);
}

function halls3ArmoryFoundForClass(classId, armory) {
  let n = 0;
  uniquesForClass(classId).forEach(function (u) { if (armory.indexOf(u.id) >= 0) n++; });
  halls3SetsForClass(classId).forEach(function (s) {
    s.pieces.forEach(function (p) { if (armory.indexOf(p.name) >= 0) n++; });
  });
  return n;
}

function halls3UniqueRow(u, armory) {
  const found = armory.indexOf(u.id) >= 0;
  if (!found) {

        '<span class="badge rar-unique">' + esc(RARITIES.unique.badge) + '</span>' +
        '<span style="font-weight:600" class="rar-unique">' + esc(u.name) + '</span>' +
      '</div>' +
      '<div class="tiny muted" style="margin-top:2px">' + esc(halls3SlotName(u.slot)) + ' · ' + esc(u.baseType) + '</div>' +

function halls3SetPieceRow(p, armory) {

    return '<div class="row muted" style="min-height:44px">' +

      '<div class="grow">' + esc(halls3SlotName(p.slot)) + ' · Undiscovered</div>' +
    '</div>';

  return '<div class="row row-indent" style="min-height:44px">' +

      '<div class="tiny muted" style="margin-top:2px">' + esc(halls3SlotName(p.slot)) + '</div>' +

function halls3RenderArmory() {
  const armory = (state.account && state.account.armory) || [];
  let html = '';

  BALANCE.phase.unlockedClasses.forEach(function (cid) {
    const uniques = uniquesForClass(cid);
    const sets = halls3SetsForClass(cid);
    const total = halls3ArmoryTotalForClass(cid);
    const found = halls3ArmoryFoundForClass(cid, armory);

    html += '<div class="row" style="gap:10px;margin-top:18px;align-items:center">' +

    html += '<div class="section-title" style="margin-top:10px">Uniques</div>' +
      '<div class="card stack-s">' + uniques.map(function (u) { return halls3UniqueRow(u, armory); }).join('') + '</div>';

}

/* ============================================================
   RENOWN - rank, progress, ranks ladder, Titles, sigil frames and
   Achievements (SPEC 16.1, 16.3, 16.4).
   ============================================================ */

function halls3TitleRow(id) {
  const label = id ? (TITLES[id] ? TITLES[id].name : id) : 'None';
  const activeId = state.account.activeTitle || null;
  const isActive = (id || null) === activeId;
  return '<button type="button" class="card card-tap' + (isActive ? ' sel' : '') + '" ' +
    'data-act="title" data-id="' + esc(id || '') + '" style="min-height:44px;padding:10px 14px;text-align:left;width:100%">' +
    esc(label) + (isActive ? ' (worn)' : '') +
  '</button>';
}

function halls3RenderTitlesSection() {
  const earned = (state.account && state.account.titles) || [];
  let html = '<div class="section-title" style="margin-top:18px">Titles</div>';
  if (!earned.length) {
    html += '<p class="tiny muted" style="margin:2px 2px 6px">Earn achievements to unlock titles.</p>';
  }
  html += '<div class="stack-s">' + [null].concat(earned).map(halls3TitleRow).join('') + '</div>';
  return html;
}

function halls3RenderFramesSection() {
  const frames = (state.account && state.account.frames) || [];
  if (!frames.length) return '';
  const ordered = FRAME_ORDER.filter(function (f) { return frames.indexOf(f) >= 0; });
  let html = '<div class="section-title" style="margin-top:18px">Sigil frames</div>';
  html += '<div class="row" style="gap:16px;flex-wrap:wrap">' +
    ordered.map(function (f) {
      return '<div style="text-align:center">' +
        halls3SigilHtml(state.hero.classId, 44, f) +
        '<div class="tiny muted" style="margin-top:4px">' + esc(f.charAt(0).toUpperCase() + f.slice(1)) + '</div>' +
      '</div>';
    }).join('') +
  '</div>';
  return html;
}

/* A reached rank carries no icon: the open padlock read too much like the
   closed one, and a ladder of them was busy. Reached rows indent to the
   same text column instead, the way the Codex does. */
function halls3RankRow(r, entry) {
  const needed = renownForRank(r);
  const active = hasUnlock(entry.id);
  const status = active ? 'Unlocked' : 'Locked';
  return '<div class="row' + (active ? ' row-indent' : ' muted') + '" style="min-height:44px">' +
    (active ? '' : icon('ico-lock')) +
    '<div class="grow">' +
      '<div>Rank ' + fmtNum(r) + ' · ' + esc(entry.label) + '</div>' +
      '<div class="tiny">' + esc(fmtNum(needed) + ' Renown · ' + status) + '</div>' +
    '</div>' +
  '</div>';
}

function halls3AchievementRow(id) {
  const a = ACHIEVEMENTS[id];
  const earnedAt = state.account.achievements && state.account.achievements[id];
  if (earnedAt) {
    return '<div class="card" style="padding:10px 12px">' +
      '<div style="font-weight:600">' + esc(a.name) + '</div>' +
      '<div class="tiny muted" style="margin-top:2px">Earned ' + esc(halls3DateStr(earnedAt)) + '</div>' +
    '</div>';
  }
  return '<div class="card muted" style="padding:10px 12px">' +
    '<div style="font-weight:600">' + esc(a.name) + '</div>' +
    '<div class="tiny" style="margin-top:2px">' + esc(a.desc) + ' · ' + fmtNum(a.renown) + ' Renown</div>' +
  '</div>';
}

function halls3RenderAchievements() {
  const ids = Object.keys(ACHIEVEMENTS);
  const earnedIds = ids.filter(function (id) { return state.account.achievements && state.account.achievements[id]; });
  const unearnedIds = ids.filter(function (id) { return !(state.account.achievements && state.account.achievements[id]); });
  let html = '<div class="section-title" style="margin-top:18px">Achievements</div>' +
    '<p class="tiny muted" style="margin:2px 2px 8px">' + fmtNum(earnedIds.length) + ' of ' + fmtNum(ids.length) + ' earned</p>';
  html += '<div class="stack-s">' + earnedIds.concat(unearnedIds).map(halls3AchievementRow).join('') + '</div>';
  return html;
}

function halls3RenderRenown() {
  const hero = state.hero;
  const rank = currentRank();
  const total = currentRenown();
  const prog = renownProgress();

  // The worn title, shown under the hero's name (SPEC 16.4). The full
  // "name + title" string also comes from heroDisplayName so this and
  // every other place that names the hero (plaques, etc.) agree.
  let html = '<div class="card" style="margin-bottom:14px">' +
    '<span class="sr">' + esc(heroDisplayName(hero)) + '</span>' +
    '<div style="font-weight:600;font-size:1.125rem">' + esc(hero.name) + '</div>' +
    '<div class="muted small" style="margin-top:2px">' + esc(activeTitleName() || 'No title worn') + '</div>' +
  '</div>';

  html += '<div class="card">' +
    '<div class="row-between">' +
      '<div>' +
        '<h2 style="font-size:1.5rem;margin:0">Rank ' + fmtNum(rank) + '</h2>' +
        '<p class="muted small" style="margin-top:4px">' + fmtNum(total) + ' Renown total</p>' +
      '</div>' +
      icon('ico-star') +
    '</div>';

  if (prog.atMax) {
    html += '<p class="small" style="margin-top:10px">Max rank reached.</p>';
  } else {
    const pct = prog.needed > 0 ? Math.min(100, Math.max(0, (prog.into / prog.needed) * 100)) : 0;
    html += '<div class="bar bar-lg bar-xp" style="margin-top:12px">' +
        '<div class="bar-fill" style="width:' + pct + '%"></div>' +
      '</div>' +
      '<p class="muted small num" style="margin-top:6px">' +
        esc(fmtNum(prog.into) + ' / ' + fmtNum(prog.needed) + ' to rank ' + fmtNum(rank + 1)) +
      '</p>';
  }
  html += '</div>';

  html += '<p class="muted small" style="margin:14px 2px 0">' +
    'Renown grows automatically: reaching a new deepest floor for the account, a hero’s ' +
    'first kill of each Guardian, and every Bounty Board contract you complete.' +
  '</p>';

  html += halls3RenderTitlesSection();
  html += halls3RenderFramesSection();

  html += '<div class="section-title" style="margin-top:18px">Ranks</div><div class="card stack-s">';
  Object.keys(BALANCE.renownUnlocks)
    .map(Number)
    .sort(function (a, b) { return a - b; })
    .forEach(function (r) { html += halls3RankRow(r, BALANCE.renownUnlocks[r]); });
  html += '</div>';

  html += halls3RenderAchievements();

  return html;
}

/* ============================================================
   VIEW
   ============================================================ */
VIEWS.halls = {
  render: function () {
    let html = halls3SegControl();
    if (halls3Tab === 'records') html += halls3RenderRecords();
    else if (halls3Tab === 'champions') html += halls3RenderChampions();
    else if (halls3Tab === 'armory') html += halls3RenderArmory();
    else if (halls3Tab === 'renown') html += halls3RenderRenown();
    else html += halls3RenderCodex();
    return html;
  },

  onAct: function (act, node) {
    if (act === 'tab') { halls3Tab = node.dataset.tab; refresh(); return; }
    if (act === 'card') { hallsOpenSeenCard(node.dataset.card); return; }
    if (act === 'lore') { halls2OpenLorePage(node.dataset.page); return; }
    if (act === 'echo') { halls3OpenEcho(parseInt(node.dataset.floor, 10) || 0); return; }
    if (act === 'plaque') { halls3OpenPlaque(node.dataset.id); return; }
    if (act === 'title') {
      state.account.activeTitle = node.dataset.id || null;
      save();
      refresh();
      return;
    }
  }
};
/* ============================================================

   COMPLETE replacement of the Phase 2 town view. This is spliced
   in after the Phase 2 file (view-town2 material already in
   index.html), so this VIEWS.town assignment wins.

   Reused as-is (not redeclared - they are already `let`/`const`/
   `function` bindings earlier in the same script, and redeclaring
   `let`/`const` would throw): the `townPlace` / `townMarketTab`
   state, `TOWN_KEEPERS`, and the helpers townCurrencyRow,
   townHeader, townBadge, townAffixLines, townFindInvItem,
   townFindOwnedItem, townIsEquipped, townChapelStatus,
   townForgeStatus, townMarketStatus, townTile, townRenderChapel,
   townRenderRespec, townRenderMarket, town2UnlockRank,
   town2ItemName, town2ItemLabel, town2RarityBorderStyle,

   town2OpenItemDetail, town2RenderHubTile, town2RenderBounty, and
   heroSlotLabel / heroClassName from the Hero view. The Chapel,
   Market and Bounty Board are unchanged in Phase 3, so none of

   Redeclared on purpose (same name, last one wins - the whole
