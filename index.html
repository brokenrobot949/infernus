/* The banner's quiet record line, from the hero's existing counters
   (SCOPES-HERO H1). "No descents yet" replaces the whole line rather
   than showing "0 falls · 0 bosses slain" for a brand new hero. */
function hbRecordLine(hero) {
  const c = hero.counters || {};
  const descents = c.descents || 0;
  if (descents <= 0) return 'No descents yet';
  const deaths = c.deaths || 0;
  const bosses = c.bossesSlain || 0;
  return hbCountPhrase(descents, 'descent', 'descents') + ' &middot; ' +
    hbCountPhrase(deaths, 'fall', 'falls') + ' &middot; ' +
    hbCountPhrase(bosses, 'boss slain', 'bosses slain');
}

/* ---- H1: the hero banner ----
   A crypt card at the top of all three Hero pages. Replaces the small
   header that used to show only the sigil, class and deepest floor. */
function heroHeader(hero) {
  const frame = bestFrame();
  const ringColour = frame ? FRAME_COLOURS[frame] : 'var(--track)';
  const title = activeTitleName();
  const xpNext = xpToNext(hero.level);

  let html = '<div class="card" style="margin-bottom:12px">';

  html += '<div class="row" style="gap:14px;align-items:flex-start">';
  html += '<div class="hb-sigil-wrap">' +
      '<div class="hb-sigil-glow" aria-hidden="true"></div>' +
      '<div class="hb-sigil-ring" style="border-color:' + ringColour + '">' +
        '<svg class="ico" style="width:52px;height:52px;color:var(--corona)" aria-hidden="true">' +
          '<use href="#sig-' + esc(hero.classId) + '"></use>' +
        '</svg>' +
      '</div>' +
    '</div>';
  html += '<div class="grow" style="min-width:0">' +
    '<div style="font-size:1.25rem;font-weight:700;color:var(--bone)">' + esc(hero.name) + '</div>' +
    '<div class="small" style="margin-top:2px;color:var(--ash)">' +
      esc(heroClassName(hero.classId)) +
      (title ? ' &middot; <span style="color:var(--brass)">' + esc(title) + '</span>' : '') +
    '</div>' +
    '<div class="small" style="margin-top:2px;color:var(--ash)">' +
      'Deepest: Floor ' + fmtNum(hero.deepest) + ' &middot; ' +
      '<span class="display">' + esc(floorLabel(hero.deepest)) + '</span>' +
    '</div>' +
    '<div class="tiny" style="margin-top:6px;color:var(--ash)">' + hbRecordLine(hero) + '</div>' +
  '</div>';
  html += '</div>'; // row

  /* The progress bar that used to sit at the top of Stats now lives here,
     so it shows on Gear and Skills too. Same logic as before: below the
     level cap it is XP toward the next level; at the cap it is XP toward
     the next Abyssal Rank (SPEC 4). */
  if (isFinite(xpNext)) {
    const xpPct = xpNext > 0 ? Math.max(0, Math.min(1, hero.xp / xpNext)) * 100 : 0;
    html += '<div class="row-between" style="margin-top:14px">' +
      '<span class="small" style="font-weight:700;color:var(--bone)">Level ' + fmtNum(hero.level) + '</span>' +
      '<span class="small num" style="color:var(--ash)">' + fmtNum(hero.xp) + ' / ' + fmtNum(xpNext) + ' XP</span>' +
    '</div>';
    html += '<div class="bar bar-xp hb-bar-slim" style="margin-top:6px">' +
      '<div class="bar-fill" style="width:' + xpPct + '%"></div></div>';
  } else {
    const per = abyssalPer();
    const pct = per > 0 ? Math.max(0, Math.min(1, hero.xp / per)) * 100 : 0;
    html += '<div class="row-between" style="margin-top:14px">' +
      '<span class="small" style="font-weight:700;color:var(--bone)">Abyssal Rank ' +
        fmtNum((hero.abyssal && hero.abyssal.ranks) || 0) + '</span>' +
      '<span class="small num" style="color:var(--ash)">' + fmtNum(hero.xp) + ' / ' + fmtNum(per) + ' XP</span>' +
    '</div>';
    html += '<div class="bar bar-xp hb-bar-slim" style="margin-top:6px">' +
      '<div class="bar-fill" style="width:' + pct + '%"></div></div>';
  }

  html += '</div>'; // card
  return html;
}

/* ---- H2: the page buttons, with reminders ----
   Same three buttons as before; the tab-bar dot itself is handled by
   heroAttention/renderTabs (already in the core). This adds the
   per-button reminder: a dot on Gear/Stats, a count pill on Skills. On
   the active (corona) button the dot/pill flip to abyss colouring so
   they still show against the corona background. */
function heroSegControl() {
  const attn = heroAttention(state && state.hero);
  const skillReason = hbCountPhrase(attn.skill, 'skill point', 'skill points') + ' to spend';
  const abyssalReason = hbCountPhrase(attn.abyssal, 'Abyssal point', 'Abyssal points') + ' to spend';
  const segs = [
    { id: 'gear', label: 'Gear', marked: attn.upgrade, kind: 'dot', reason: 'a new upgrade in your bag' },
    { id: 'stats', label: 'Stats', marked: attn.abyssal > 0, kind: 'dot', reason: abyssalReason },
    { id: 'skills', label: 'Skills', marked: attn.skill > 0, kind: 'pill', count: attn.skill, reason: skillReason }
  ];
  return '<div class="btn-row" style="margin-bottom:14px">' +
    segs.map(function (s) {
      const active = heroTab === s.id;
      let mark = '';
      if (s.marked && s.kind === 'pill') {
        mark = '<span class="hb-pill" style="background:' + (active ? 'var(--abyss)' : 'var(--corona)') +
          ';color:' + (active ? 'var(--corona)' : 'var(--abyss)') + '">' + fmtNum(s.count) + '</span>';
      } else if (s.marked) {
        mark = '<span class="hb-dot" aria-hidden="true" style="background:' +
          (active ? 'var(--abyss)' : 'var(--corona)') + '"></span>';
      }
      return '<button class="btn' + (active ? ' btn-primary' : '') + '" data-act="seg" data-seg="' + s.id + '"' +
        (s.marked ? ' aria-label="' + esc(s.label + ', ' + s.reason) + '"' : '') + '>' +
        esc(s.label) + mark +
      '</button>';
    }).join('') +
  '</div>';
}

/* ---- Stats page: H7 (where Power comes from) then H6 (stat tiles) ---- */
function heroRenderStats(hero) {
  const st = heroStats(hero);
  let html = '';

  /* Abyssal points, only when there are any to spend. The XP/level card
     that used to open this page is gone — it now lives in the banner. */
  const unspent = abyssalUnspent(hero);
  if (unspent > 0) {
    html += '<div class="card">' +
      '<div class="small" style="font-weight:700;color:var(--bone)">' +
        hbCountPhrase(unspent, 'Abyssal point', 'Abyssal points') + ' to spend</div>' +
      '<div class="row wrap" style="gap:6px;margin-top:10px">' +
        Object.keys(BALANCE.abyssal.options).map(function (id) {
          const o = BALANCE.abyssal.options[id];
          return '<button class="btn btn-sm" data-act="abyssal" data-opt="' + id + '">+' +
            fmtPct(o.per) + ' ' + esc(o.label) + '</button>';
        }).join('') +
      '</div>' +
    '</div>';
  }

  /* H7: Power built up in a fixed order. heroPowerLayers (in the core)
     does the real work; this just draws the bar and legend. */
  const layers = heroPowerLayers(hero);
  const segColour = { base: 'edge', abyssal: 'ash', skills: 'corona', gear: 'brass' };
  const positiveSum = layers.parts.reduce(function (sum, p) { return sum + (p.value > 0 ? p.value : 0); }, 0);

  html += '<div class="section-title">Where your Power comes from</div>';
  html += '<div class="card">' +
    '<div class="small" style="color:var(--ash)">Power</div>' +
    '<div class="num" style="font-size:1.75rem;font-weight:700;line-height:1.1;color:var(--bone)">' +
      fmtNum(layers.total) + '</div>' +
    '<div class="hs-stackbar">' +
      layers.parts.filter(function (p) { return p.value > 0; }).map(function (p) {
        const w = positiveSum > 0 ? (p.value / positiveSum * 100) : 0;
        return '<div style="width:' + w + '%;background:var(--' + (segColour[p.id] || 'edge') + ')"></div>';
      }).join('') +
    '</div>' +
    '<div class="hs-legend">' +
      layers.parts.map(function (p, i) {
        const val = i === 0 ? fmtNum(p.value) : fmtSigned(p.value);
        return '<span class="hs-legend-item">' +
          '<span class="hs-legend-sw" style="background:var(--' + (segColour[p.id] || 'edge') + ')"></span>' +
          esc(p.label) + '&nbsp;<b class="num">' + val + '</b>' +
        '</span>';
      }).join('') +
    '</div>' +
    '<div class="tiny" style="margin-top:10px;color:var(--ash)">' +
      'Built up in this order, so Gear shows what your gear adds on top of everything else.</div>' +
  '</div>';

  /* H6: Combat, then Attributes. Same grouping and help button as before. */
  html += '<div class="row-between" style="margin:22px 0 8px">' +
    '<span class="section-title" style="margin:0">Combat</span>' +
    '<button class="btn btn-sm btn-ghost" data-act="stathelp" aria-label="What the stats do" ' +
      'style="width:44px;padding:0">' + icon('ico-help') + '</button>' +
  '</div>';
  html += '<div class="grid-2 grid-fill-last">' +
    ['power'].concat(heroCoreStats).map(function (key) {
      return hero2StatTile(key, key === 'power' ? st.power : st[key]);
    }).join('') +
  '</div>';

  html += '<div class="section-title">Attributes</div>';
  html += '<div class="grid-2 grid-fill-last">' +
    heroPercentStats.map(function (key) { return hero2StatTile(key, st[key]); }).join('') +
  '</div>';

  return html;
}

/* ---- H6: one compact, tappable stat tile ----
   Label top-left, icon (in the stat's colour) top-right, value below in
   bone always — colour lives on the icon only. A percent stat pinned at
   ~0 dims: label and value go ash, the icon goes edge. Combat stats
   (Power/Might/Guard/Max HP) never dim. */
function hero2StatTile(key, raw) {
  const look = HERO_STAT_LOOK[key] || { colour: 'ash', icon: 'ico-help' };
  const isCombat = key === 'power' || heroIsCore(key);
  const display = isCombat ? fmtNum(Math.round(raw)) : fmtPct(raw);
  const dim = !isCombat && Math.abs(raw) < 0.05;
  const iconColour = dim ? 'var(--edge)' : 'var(--' + look.colour + ')';
  return '<button class="card card-tap" data-act="stat" data-stat="' + key + '" style="padding:10px 12px">' +
    '<div class="row-between">' +
      '<span class="hs-stat-label' + (dim ? ' muted' : '') + '">' + esc(heroStatLabel[key]) + '</span>' +
      '<svg class="ico" style="width:18px;height:18px;color:' + iconColour + '" aria-hidden="true">' +
        '<use href="#' + look.icon + '"></use></svg>' +
    '</div>' +
    '<div class="hs-stat-value num' + (dim ? ' muted' : '') + '">' + display + '</div>' +
  '</button>';
}
/* ============================================================
   HERO TAB REWORK - Skills page (SCOPES-HERO.md H8, H9, H10)
   SPEC 19.3 (rite slots now sit above the tree, not below it;
   the tree shows one branch at a time instead of three columns
   side by side - both changes approved in SCOPES-HERO.md).

   Overrides heroRenderSkills, heroRiteSlotsBlock and
   heroRiteSlotRow. Leaves heroNodeSheet, heroRiteSlotSheet,
   canLearn and learnNode untouched; the old heroBranchColumn and
   heroNodeTile simply stop being called.

   Prefix: ht (top-level names), .ht- (CSS classes), ico-ht-
   (sprite icons).
   ============================================================ */

/* Which branch the tree is showing. UI-only: never saved, and
   reset to "pick the best one" every time the hero has no
   opinion (null) or the remembered branch isn't in this class's
   tree (e.g. after a respec onto a different class's save). */
let htBranch = null;

/* Node type -> its shape symbol in the sprite. */
const htShapeIds = { minor: 'ico-ht-minor', notable: 'ico-ht-notable', rite: 'ico-ht-rite', keystone: 'ico-ht-keystone' };

/* Rite kind, in words, for the H10 cards (heroRiteKindLabel appends
   " rite", which reads wrong stacked with "cooldown" - this doesn't). */
const htKindWords = { primed: 'Primed', timed: 'Timed', emergency: 'Emergency', instant: 'Instant' };

/* A node-shape icon at a given size, filled or outlined. The symbols in
   hero-skills-sprite.svg are drawn stroke-only with no fill attribute of
   their own, so this is what actually turns them solid or hollow. */
function htShape(id, size, filled) {
  return '<svg aria-hidden="true" style="width:' + size + 'px;height:' + size + 'px;flex:0 0 auto;' +
    'display:inline-block;vertical-align:-0.15em;fill:' + (filled ? 'currentColor' : 'none') + '">' +
    '<use href="#' + id + '"></use></svg>';
}

/* ============================================================
   H9 - the points bar
   ============================================================ */
function htPointsBar(hero) {
  const pts = unspentSkillPoints(hero);
  let right;
  if (pts > 0) {
    right = '<span class="ht-sp-pill num">' + fmtNum(pts) + ' to spend</span>';
  } else if (!isFinite(xpToNext(hero.level))) {
    right = '<span class="small muted">All spent</span>';
  } else {
    right = '<span class="small muted">All spent &middot; next at level ' + fmtNum(hero.level + 1) + '</span>';
  }
  return '<div class="row-between res-sticky">' +
    '<span class="small" style="color:var(--bone)">Skill points</span>' +
    right +
  '</div>';
}

/* ============================================================
   H10 - rite slots, now above the tree
   ============================================================ */
function heroRiteSlotsBlock(hero) {
  let html = '<div class="section-title">Rites</div>';
  if (!learnedRites(hero).length) {
    html += '<div class="card ht-rite-card ht-rite-dashed">' +
      '<p class="small muted" style="margin:0">Rites you learn go here. Each branch has its first rite in row 2.</p>' +
    '</div>';
    return html;
  }
  html += '<div class="stack-s">';
  const slots = heroRiteSlots(hero);
  for (let i = 0; i < slots.length; i++) html += heroRiteSlotRow(hero, i, slots[i]);
  if (riteSlotCount() < BALANCE.tree.riteSlotsRenown) {
    html += '<div class="card ht-rite-card ht-rite-dashed">' +
      '<span class="small muted row" style="gap:6px">' + heroIco('ico-lock', 16) +
        'Opens at Renown rank ' + esc(String(town2UnlockRank('riteslot'))) +
      '</span>' +
    '</div>';
  }
  html += '</div>';
  return html;
}

function heroRiteSlotRow(hero, slotIdx, riteId) {
  if (!riteId) {
    return '<button class="card card-tap ht-rite-card ht-rite-dashed row-between" data-act="riteSlot" data-slot="' + slotIdx + '">' +
      '<span class="small muted">Empty slot</span>' +
      '<span style="color:var(--corona);flex:0 0 auto">' + icon('ico-plus') + '</span>' +
    '</button>';
  }
  const st = riteState(hero, riteId);
  if (!st) return '<div class="card ht-rite-card row-between"><span class="small muted">Unknown rite</span></div>';
  const node = st.node;

  let right;
  if (st.primed) {
    right = '<span class="small num" style="color:var(--corona);font-weight:600;flex:0 0 auto">&#10003; Armed</span>';
  } else if (st.activeUntil && st.activeUntil > now()) {
    right = '<span class="small num" style="color:var(--corona);font-weight:600;flex:0 0 auto">Active &middot; ' + fmtTime(st.activeUntil - now()) + '</span>';
  } else if (st.cooldown > 0) {
    right = '<span class="small num row" style="gap:4px;color:var(--ash);flex:0 0 auto" data-ht-cd="' + riteId + '">' +
      heroIco('ico-clock', 14) + fmtTime(st.cooldown) +
    '</span>';
  } else {
    right = '<span class="small num" style="color:var(--verdant);font-weight:600;flex:0 0 auto">&#10003; Ready</span>';
  }

  return '<button class="card card-tap ht-rite-card row-between" data-act="riteSlot" data-slot="' + slotIdx + '">' +
    '<span style="min-width:0">' +
      '<span class="small" style="display:block;font-weight:600;color:var(--bone)">' + esc(node.name) + '</span>' +
      '<span class="tiny muted" style="display:block;margin-top:2px">' +
        (htKindWords[node.rite.kind] || node.rite.kind) + ' &middot; ' + fmtTime(riteCooldownMs(hero, node)) + ' cooldown' +
      '</span>' +
    '</span>' +
    right +
  '</button>';
}

/* Once a second: rewrite the recharging rite cards' countdowns in place.
   When one finishes, the whole view is re-rendered so it flips to Ready
   (with the verdant colour and the icon-less label), rather than trying to
   patch that structural change in place. */
HERO_TICKS.push(function (hero) {
  const els = document.querySelectorAll('#view [data-ht-cd]');
  if (!els.length) return;
  let done = false;
  els.forEach(function (elCd) {
    const riteId = elCd.dataset.htCd;
    const st = riteState(hero, riteId);
    if (!st) return;
    if (st.cooldown > 0) {
      elCd.innerHTML = heroIco('ico-clock', 14) + fmtTime(st.cooldown);
    } else {
      done = true;
    }
  });
  if (done) renderView();
});

/* ============================================================
   H8 - the tree, one branch at a time
   ============================================================ */

/* The branch to show: the remembered one if it still applies to this
   class's tree, else whichever has the most points (first on a tie). */
function htPickBranch(hero, tree) {
  if (htBranch && tree.branches.some(function (b) { return b.id === htBranch; })) return htBranch;
  let best = tree.branches[0], bestPts = -1;
  for (const br of tree.branches) {
    const pts = pointsInBranch(hero, br.id);
    if (pts > bestPts) { bestPts = pts; best = br; }
  }
  return best.id;
}

function htBranchMax(br) {
  let n = 0;
  for (const node of br.nodes) n += node.maxRank;
  return n;
}

function htBranchTabs(hero, tree, selId) {
  let html = '<div class="row" style="gap:8px">';
  for (const br of tree.branches) {
    const sel = br.id === selId;
    const pts = pointsInBranch(hero, br.id);
    const max = htBranchMax(br);
    const dot = unspentSkillPoints(hero) > 0 && br.nodes.some(function (n) { return canLearn(hero, n.id).ok; });
    html += '<button class="ht-branch-tab' + (sel ? ' ht-branch-tab-active' : '') + '" data-act="branch" data-branch="' + br.id + '"' +
      ' aria-pressed="' + (sel ? 'true' : 'false') + '">' +
      (dot ? '<span class="ht-branch-dot" aria-hidden="true"></span>' : '') +
      '<div class="small ht-branch-name" style="font-weight:600">' + esc(br.name) + '</div>' +
      '<div class="tiny num" style="margin-top:2px">' + fmtNum(pts) + ' / ' + fmtNum(max) + '</div>' +
    '</button>';
  }
  html += '</div>';
  return html;
}

function htLegend() {
  return '<div class="ht-legend2">' +
    '<span class="row" style="gap:5px">' + htShape('ico-ht-minor', 12, true) + 'Minor</span>' +
    '<span class="row" style="gap:5px">' + htShape('ico-ht-notable', 12, true) + 'Notable</span>' +
    '<span class="row" style="gap:5px">' + htShape('ico-ht-rite', 12, true) + 'Rite</span>' +
    '<span class="row" style="gap:5px">' + htShape('ico-ht-keystone', 12, true) + 'Keystone</span>' +
  '</div>';
}

function htGate(hero, branchId, row) {
  const need = BALANCE.tree.rowRequirements[row] || 0;
  const have = pointsInBranch(hero, branchId);
  const open = have >= need;
  const inner = open
    ? '<span style="color:var(--verdant)" aria-hidden="true">&#10003;</span><span>Row ' + row + ' &middot; ' + fmtNum(need) + ' points</span>'
    : heroIco('ico-lock', 12) + '<span>Row ' + row + ' &middot; ' + fmtNum(need) + ' points (you have ' + fmtNum(have) + ')</span>';
  return '<div class="ht-gate"><span class="ht-gate-pill">' + inner + '</span></div>';
}

function htNodeCard(hero, br, node) {
  const rank = hero.skills[node.id] || 0;
  const maxed = rank >= node.maxRank;
  const open = rowOpen(hero, br.id, node.row);
  const learnable = canLearn(hero, node.id).ok;
  const shapeId = htShapeIds[node.type] || 'ico-ht-minor';

  let border, shapeFilled, shapeColor, corner = '';
  if (maxed) {
    border = '1px solid var(--corona)';
    shapeFilled = true; shapeColor = 'var(--corona)';
  } else if (!open) {
    border = '1px dashed var(--edge)';
    shapeFilled = false; shapeColor = 'var(--edge)';
    corner = '<svg class="ht-node-lock" aria-hidden="true"><use href="#ico-lock"></use></svg>';
  } else if (learnable) {
    border = '2px solid var(--corona)';
    shapeFilled = false; shapeColor = 'var(--corona)';
    corner = '<span class="ht-node-badge" aria-hidden="true">+</span>';
  } else if (rank > 0) {
    border = '1px solid var(--edge)';
    shapeFilled = false; shapeColor = 'var(--corona)';
  } else {
    border = '1px solid var(--edge)';
    shapeFilled = false; shapeColor = 'var(--edge)';
  }

  let pips = '';
  for (let i = 0; i < node.maxRank; i++) pips += '<span class="ht-pip ' + (i < rank ? 'ht-pip-on' : 'ht-pip-off') + '"></span>';

  const solo = node.type === 'keystone';
  return '<button class="ht-node' + (solo ? ' ht-node-solo' : '') + '" data-act="node" data-node="' + node.id + '" style="border:' + border + '">' +
    corner +
    '<span class="ht-node-shape" style="color:' + shapeColor + '">' +
      htShape(shapeId, 28, shapeFilled) +
      (maxed ? '<svg class="ht-node-check" viewBox="0 0 24 24" aria-hidden="true">' +
        '<path fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5L10 17L19 6.5"/></svg>' : '') +
    '</span>' +
    '<span class="ht-node-body">' +
      '<span class="ht-node-name" style="display:block' + (!open ? ';color:var(--ash)' : '') + '">' + esc(node.name) + '</span>' +
      '<span class="ht-node-effect ht-clamp2">' + esc(node.text) + '</span>' +
      '<span class="ht-pips">' + pips + '</span>' +
    '</span>' +
  '</button>';
}

function htTreeSection(hero, tree) {
  const branchId = htPickBranch(hero, tree);
  const br = tree.branches.find(function (b) { return b.id === branchId; });

  let html = '<div class="section-title">Tree</div>';
  html += htBranchTabs(hero, tree, branchId);
  html += '<div class="small muted" style="margin-top:10px">' + esc(br.blurb) + '</div>';
  html += htLegend();

  html += '<div class="ht-tree"><div class="ht-tree-line" aria-hidden="true"></div>';
  for (let row = 1; row <= 6; row++) {
    if (row > 1) html += htGate(hero, br.id, row);
    const nodes = br.nodes.filter(function (n) { return n.row === row; });
    if (!nodes.length) continue;
    const solo = nodes.length === 1;
    html += '<div class="ht-trow"' + (solo ? ' style="justify-content:center"' : '') + '>' +
      nodes.map(function (n) { return htNodeCard(hero, br, n); }).join('') +
    '</div>';
  }
  html += '</div>';
  return html;
}

/* ============================================================
   Top-level render (H8 + H9 + H10 assembled in order)
   ============================================================ */
function heroRenderSkills(hero) {
  const tree = TREES[hero.classId];
  if (!tree) return '<div class="card"><p class="small muted">No skill tree for this class yet.</p></div>';

  let html = htPointsBar(hero);
  html += heroRiteSlotsBlock(hero);
  html += htTreeSection(hero, tree);
  return html;
}

HERO_ACTS.branch = function (hero, node, ev) {
  htBranch = node.dataset.branch;
  renderView();
};
/* ============================================================
   HERO TAB REWORK - GEAR PART (X = gear)
   SCOPES-HERO.md H3 (paper doll), H4 (upgrade arrows + Equip
   upgrades), H5 (set tracker). SPEC 19.3.

   Overrides heroRenderGear(hero) (last declaration wins). Its
   Inventory half is copied byte-for-byte from the live "GEAR -
   redeclared" version already in index.html: the heading with
   slot count, heroSortRow() and the list of heroInvTile rows.
   Only the "Equipped" stack of heroEquipRow rows is replaced,
   with, in order: the paper doll (hdDoll), the Equip upgrades
   button (hdUpgradesButton) and the set tracker (hdSetTracker).

   Reused as-is, not reimplemented: heroSortRow, heroInvTile,
   heroSortedIndices, inventoryCap, inventoryFree, heroBestUpgrade,
   heroSwapLosses, heroUpgradeList, heroStatsWithSwaps,
   heroApplyUpgrades, heroStats, canEquip, heroPowerDeltaSafe,
   equippedSetCounts, heroHasSetBonus, RARITIES, SETS, heroSlotLabel,
   heroIco, icon, esc, fmtNum, fmtPct, openSheet, closeSheet, toast,
   refresh, save.

   All new top-level names are prefixed `hd`; all new classes `.hd-`.
   ============================================================ */

/* ---- H3: the paper doll ---- */

/* The hooded, cloaked silhouette from HERO-CONCEPT.html's
   .h-silhouette, redrawn with style-attribute colours (the way
   tmPaint does for the town map) instead of fill="var(..)"
   presentation attributes, and with the hero's own class sigil
   on the chest. Purely decorative. */
function hdSilhouette(hero) {
  return '<svg viewBox="0 0 96 250" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<g style="stroke:var(--track)" stroke-width="1">' +
      '<line x1="0" y1="39" x2="14" y2="39"/>' +
      '<line x1="0" y1="125" x2="14" y2="125"/>' +
      '<line x1="0" y1="211" x2="14" y2="211"/>' +
      '<line x1="96" y1="39" x2="82" y2="39"/>' +
      '<line x1="96" y1="125" x2="82" y2="125"/>' +
      '<line x1="96" y1="211" x2="82" y2="211"/>' +
    '</g>' +
    '<path d="M36 222 L44 222 L44 240 Q44 244 40 244 L33 244 Q30 244 31 241 L36 236 Z" ' +
      'style="fill:var(--track);stroke:var(--edge)" stroke-width="1.5" stroke-linejoin="round"/>' +
    '<path d="M52 222 L60 222 L60 236 L65 241 Q66 244 63 244 L56 244 Q52 244 52 240 Z" ' +
      'style="fill:var(--track);stroke:var(--edge)" stroke-width="1.5" stroke-linejoin="round"/>' +
    '<path d="M48 6 C60 10 70 24 70 40 C70 50 74 56 82 62 L88 150 L92 222 L82 216 L74 226 L64 218 ' +
      'L56 228 L48 219 L40 228 L32 218 L22 226 L14 216 L4 222 L8 150 L14 62 C22 56 26 50 26 40 ' +
      'C26 24 36 10 48 6 Z" style="fill:var(--track);stroke:var(--edge)" stroke-width="1.5" stroke-linejoin="round"/>' +
    '<path d="M40 58 C38 110 36 160 35 214 L61 214 C60 160 58 110 56 58 Z" ' +
      'style="fill:var(--raised);stroke:var(--edge)" stroke-width="1" stroke-linejoin="round"/>' +
    '<rect x="36.5" y="130" width="23" height="5" rx="1" style="fill:var(--edge)"/>' +
    '<g style="fill:none;stroke:var(--edge)" stroke-width="1" stroke-linecap="round" opacity=".7">' +
      '<path d="M22 80 C20 130 17 170 14 212"/>' +
      '<path d="M74 80 C76 130 79 170 82 212"/>' +
    '</g>' +
    '<path d="M48 22 C57 22 60 32 58 44 C55 50 41 50 38 44 C36 32 39 22 48 22 Z" style="fill:var(--abyss)"/>' +
    '<circle cx="44" cy="37" r="1.7" style="fill:var(--corona)"/>' +
    '<circle cx="52" cy="37" r="1.7" style="fill:var(--corona)"/>' +
    '<circle cx="48" cy="58" r="3" style="fill:var(--edge)"/>' +
    '<use href="#sig-' + esc(hero.classId) + '" x="36" y="80" width="24" height="24" style="color:var(--corona)"/>' +
  '</svg>';
}

/* Top row of a paper-doll tile: the slot icon and name, and,
   right-aligned, the upgrade arrow and/or lock icon. */
function hdTileTop(slot, showArrow, locked) {
  let right = '';
  if (showArrow) {
    right += '<span class="hd-arrow" aria-hidden="true">&#9650;</span>' +
      '<span class="hd-vh">Upgrade in your bag</span>';
  }
  if (locked) right += heroIco('ico-lock', 14);
  return '<div class="hd-tiletop">' +
    '<span class="hd-slotlabel">' + heroIco('ico-slot-' + slot, 16) + '<span>' + heroSlotLabel[slot] + '</span></span>' +
    (right ? '<span class="hd-tiletop-right">' + right + '</span>' : '') +
  '</div>';
}

/* A worn item's tile. The upgrade arrow uses heroBestUpgrade, same
   rule as H4's Equip upgrades button. */
function hdWornTile(hero, slot, item) {
  const r = RARITIES[item.rarity];
  const showArrow = heroBestUpgrade(hero, slot) !== null;
  const chain = r.chain
    ? '<span style="color:var(--r-set);flex:0 0 auto;margin-right:4px">' + heroIco('ico-chain', 13) + '</span>'
    : '';
  return '<button class="card-tap hd-tile" data-act="item" data-item="equip:' + slot + '" style="' +
    'border:' + r.border + ' var(--r-' + item.rarity + ')">' +
    hdTileTop(slot, showArrow, !!item.locked) +
    '<div class="hd-itemname rar-' + item.rarity + '">' + chain +
      '<span class="hd-clamp2">' + esc(item.name) + '</span>' +
    '</div>' +
  '</button>';
}

/* The best bag item for an empty slot: for relics, the first relic
   in the bag; otherwise the item with the highest heroPowerDeltaSafe.
   Returns { item, idx, count } or null. Used only for the empty-slot
   tile's own candidate, not the H4 upgrade list (which never suggests
   relics at all). */
function hdBestCandidate(hero, slot) {
  let best = null, bestIdx = -1, bestGain = -Infinity, count = 0;
  hero.inventory.forEach(function (item, idx) {
    if (item.slot !== slot || !canEquip(hero, item)) return;
    count++;
    if (slot === 'relic') {
      if (best === null) { best = item; bestIdx = idx; }
      return;
    }
    const gain = heroPowerDeltaSafe(hero, item);
    if (best === null || gain > bestGain) { best = item; bestIdx = idx; bestGain = gain; }
  });
  return best ? { item: best, idx: bestIdx, count: count } : null;
}

/* An empty slot's tile: dashed border, "Empty", and, if the bag
   holds a candidate, "N in your bag" plus a tap target that opens it. */
function hdEmptyTile(hero, slot) {
  const top = hdTileTop(slot, false, false);
  const cand = hdBestCandidate(hero, slot);
  if (cand) {
    return '<button class="card-tap hd-tile hd-tile-empty" data-act="item" data-item="inv:' + cand.idx + '" ' +
      'style="border:1px dashed var(--edge)">' +
      top +
      '<div>' +
        '<div class="hd-itemname" style="color:var(--ash);font-weight:500">Empty</div>' +
        '<div class="hd-bagnote">&#9650; ' + fmtNum(cand.count) + ' in your bag</div>' +
      '</div>' +
    '</button>';
  }
  return '<div class="hd-tile hd-tile-empty" style="border:1px dashed var(--edge)">' +
    top +
    '<div class="hd-itemname" style="color:var(--ash);font-weight:500">Empty</div>' +
  '</div>';
}

function hdSlotTile(hero, slot) {
  const item = hero.equipment[slot];
  return item ? hdWornTile(hero, slot, item) : hdEmptyTile(hero, slot);
}

/* Left column head-to-foot, the figure in the centre spanning all
   three rows, right column hands-and-neck - placed by nth-child in
   hero-gear.css, so the markup order below IS the layout order. */
function hdDoll(hero) {
  let html = '<div class="hd-doll">';
  html += hdSlotTile(hero, 'helm');
  html += hdSlotTile(hero, 'armor');
  html += hdSlotTile(hero, 'boots');
  html += '<div class="hd-figure" aria-hidden="true">' + hdSilhouette(hero) + '</div>';
  html += hdSlotTile(hero, 'weapon');
  html += hdSlotTile(hero, 'gloves');
  html += hdSlotTile(hero, 'relic');
  html += '</div>';
  return html;
}

/* ---- H4: Equip upgrades ---- */

/* Which rows of the current Equip upgrades sheet are ticked, keyed
   by slot. Reset every time the sheet is opened. */
let hdTicked = {};

function hdTickedItems(list) {
  return list.filter(function (e) { return !!hdTicked[e.slot]; }).map(function (e) { return e.item; });
}

function hdUpgradesSummary(hero, tickedItems) {
  const before = Math.round(heroStats(hero).power);
  const after = Math.round(heroStatsWithSwaps(hero, tickedItems).power);
  const diff = after - before;
  let diffHtml;
  if (diff === 0) {
    diffHtml = '<span style="color:var(--ash)">&mdash;</span>';
  } else {
    const up = diff > 0;
    diffHtml = '<span style="color:var(--' + (up ? 'corona' : 'blood-light') + ')">' +
      (up ? '&#9650; ' : '&#9660; ') + fmtNum(Math.abs(diff)) + '</span>';
  }
  return '<div class="hd-upsummary">Power ' + fmtNum(before) + ' &rarr; ' + fmtNum(after) + ' ' + diffHtml + '</div>';
}

function hdUpgradeRow(entry, ticked) {
  const item = entry.item;
  const sub = entry.replaced
    ? 'Replaces ' + esc(entry.replaced.name)
    : 'Fills your empty ' + esc(heroSlotLabel[entry.slot]) + ' slot';
  const losses = entry.losses.map(function (l) {
    return '<div class="hd-uploss">&#9660; ' + esc(l) + '</div>';
  }).join('');
  return '<button role="checkbox" aria-checked="' + (ticked ? 'true' : 'false') + '" ' +
      'data-act="hd-toggle" data-slot="' + esc(entry.slot) + '" class="hd-uprow">' +
    '<span class="hd-checkbox' + (ticked ? ' hd-checked' : '') + '" aria-hidden="true">' +
      (ticked ? '&#10003;' : '') +
    '</span>' +
    '<span class="hd-uprow-body">' +
      '<div class="rar-' + item.rarity + '" style="font-weight:600">' + esc(item.name) + '</div>' +
      '<div class="hd-upsub">' + sub + '</div>' +
      '<div class="hd-upgain">&#9650; ' + fmtPct(entry.gainPct) + ' Power</div>' +
      losses +
    '</span>' +
  '</button>';
}

function hdUpgradesBody(hero, list) {
  return hdUpgradesSummary(hero, hdTickedItems(list)) +
    '<div class="hd-uprows">' +
      list.map(function (e) { return hdUpgradeRow(e, !!hdTicked[e.slot]); }).join('') +
    '</div>';
}

function hdUpgradesFoot(list) {
  const n = hdTickedItems(list).length;
  return '<button class="btn btn-primary" style="width:100%" data-act="hd-go"' +
    (n === 0 ? ' disabled' : '') + '>Equip ' + fmtNum(n) + '</button>';
}

HERO_ACTS.upgrades = function (hero) {
  if (hero.descent) return; // rules unchanged: no equipping during a descent
  const list = heroUpgradeList(hero);
  if (!list.length) return;

  hdTicked = {};
  list.forEach(function (e) { hdTicked[e.slot] = e.losses.length === 0; });

  const sheetNode = openSheet({
    title: 'Equip upgrades',
    body: hdUpgradesBody(hero, list),
    foot: hdUpgradesFoot(list),
    onAct: function (act, node) {
      if (act === 'hd-toggle') {
        const slot = node.dataset.slot;
        hdTicked[slot] = !hdTicked[slot];
        const fresh = heroUpgradeList(hero);
        sheetNode.querySelector('.sheet-body').innerHTML = hdUpgradesBody(hero, fresh);
        sheetNode.querySelector('.sheet-foot').innerHTML = hdUpgradesFoot(fresh);
        return;
      }
      if (act === 'hd-go') {
        const fresh = heroUpgradeList(hero);
        const items = hdTickedItems(fresh);
        if (!items.length) return;
        const res = heroApplyUpgrades(hero, items);
        if (res.done > 0) toast('Equipped ' + fmtNum(res.done) + (res.done === 1 ? ' item.' : ' items.'));
        else toast(res.reason || 'Nothing to equip.');
        closeSheet();
        refresh();
      }
    }
  });
};

function hdUpgradesButton(hero) {
  if (hero.descent) return '';
  const list = heroUpgradeList(hero);
  if (!list.length) return '';
  return '<button class="btn hd-upgrades-btn" data-act="upgrades">' +
    '<span style="color:var(--corona)">&#9650;</span>&nbsp;Equip upgrades (' + fmtNum(list.length) + ')' +
  '</button>';
}

/* ---- H5: the set tracker ---- */

function hdSetBonusLine(n, bonus, active, worn) {
  const need = Math.max(0, n - worn);
  const status = active
    ? '<span class="hd-set-active">&#10003; Active</span>'
    : '<span class="hd-set-need">Needs ' + fmtNum(need) + ' more</span>';
  return '<div class="small hd-setbonus"><span class="hd-setbonus-text">' +
    fmtNum(n) + ' pieces: ' + esc(bonus.text) + '</span> ' + status + '</div>';
}

/* For each piece not currently worn: a link into the bag, a plain
   mention of the Vault, or, gathered into one line, everything still
   unfound. */
function hdSetMissingLines(hero, s) {
  const stillToFind = [];
  let html = '';
  s.pieces.forEach(function (piece) {
    const eq = hero.equipment[piece.slot];
    if (eq && eq.setId === s.id && eq.name === piece.name) return; // worn

    let bagIdx = -1;
    for (let i = 0; i < hero.inventory.length; i++) {
      const it = hero.inventory[i];
      if (it.setId === s.id && it.name === piece.name) { bagIdx = i; break; }
    }
    if (bagIdx >= 0) {
      html += '<div class="small hd-setmissing">In your bag: ' +
        '<button class="hd-baglink" data-act="item" data-item="inv:' + bagIdx + '">' + esc(piece.name) + '</button>' +
      '</div>';
      return;
    }

    const inVault = (hero.vault || []).some(function (it) { return it.setId === s.id && it.name === piece.name; });
    if (inVault) {
      html += '<div class="small hd-setmissing hd-setmissing-vault">In the Vault: ' + esc(piece.name) + '</div>';
      return;
    }

    stillToFind.push(piece.name);
  });
  if (stillToFind.length) {
    html += '<div class="small hd-setmissing hd-setmissing-vault">Still to find: ' + esc(stillToFind.join(', ')) + '</div>';
  }
  return html;
}

function hdSetCard(hero, id, worn) {
  const s = SETS[id];
  const total = s.pieces.length;
  return '<div class="card hd-setcard">' +
    '<div class="row-between">' +
      '<span class="row hd-setname" style="gap:6px;color:var(--r-set);font-weight:600;min-width:0">' +
        heroIco('ico-chain', 16) +
        '<span class="hd-ellip">' + esc(s.name) + '</span>' +
      '</span>' +
      '<span class="small" style="color:var(--ash);flex:0 0 auto">' + fmtNum(worn) + ' of ' + fmtNum(total) + ' worn</span>' +
    '</div>' +
    hdSetBonusLine(2, s.bonus2, heroHasSetBonus(hero, id, 2), worn) +
    hdSetBonusLine(3, s.bonus3, heroHasSetBonus(hero, id, 3), worn) +
    hdSetMissingLines(hero, s) +
  '</div>';
}

function hdSetTracker(hero) {
  const counts = equippedSetCounts(hero);
  const ids = Object.keys(counts).filter(function (id) { return counts[id] > 0 && SETS[id]; });
  if (!ids.length) return '';
  return '<div class="hd-settracker">' +
    ids.map(function (id) { return hdSetCard(hero, id, counts[id]); }).join('') +
  '</div>';
}

/* ---- heroRenderGear: assembled ---- */

function heroRenderGear(hero) {
  let html = '<div class="section-title">Equipped</div>';
  html += hdDoll(hero);
  html += hdUpgradesButton(hero);
  html += hdSetTracker(hero);

  // Inventory half, unchanged from the live version: heading with slot
  // count, heroSortRow() and the list of heroInvTile rows.
  const cap = inventoryCap(hero);
  const free = inventoryFree(hero);
  const used = cap - free;

  html += '<div class="row-between" style="margin-top:20px">' +
    '<span class="section-title" style="margin:0">Inventory</span>' +
    '<span class="small muted num">' + fmtNum(used) + ' / ' + fmtNum(cap) + ' slots</span>' +
  '</div>';

  html += heroSortRow();

  const order = heroSortedIndices(hero);
  if (!order.length) {
    html += '<p class="small muted">No items yet.</p>';
  } else {
    html += '<div class="stack-s">' +
      order.map(function (idx) { return heroInvTile(hero, idx); }).join('') +
    '</div>';
  }
  return html;
}

document.addEventListener('DOMContentLoaded', boot);
</script>
