          '<button class="btn btn-block" data-act="copy">Copy to clipboard</button>';
        document.getElementById('exp').value = exportSave();
      }
      if (act === 'copy') {
        const t = document.getElementById('exp');
        t.select();
        navigator.clipboard.writeText(t.value).then(
          function () { toast('Save copied.'); },
          function () { toast('Select the text and copy it.'); }
        );
      }
      if (act === 'import') {
        io.innerHTML = '<label class="field"><span>Paste a save here</span>' +
          '<textarea id="imp"></textarea></label>' +
          '<button class="btn btn-block btn-danger" data-act="doimport">Replace my save</button>';
      }
      if (act === 'doimport') {
        const text = document.getElementById('imp').value.trim();
        let incoming;
        try { incoming = decodeSave(text); }
        catch (e) { toast('That save could not be read.'); return; }
        const who = incoming.hero ? incoming.hero.name + ', level ' + incoming.hero.level : 'no hero yet';
        confirmSheet({
          title: 'Replace your save?',
          body: 'This replaces everything with the imported save (' + esc(who) + '). It cannot be undone.',
          yes: 'Replace', danger: true,
          onYes: function () {
            state = incoming; save(); closeAllSheets();
            applyMotionSetting(); refresh(); toast('Save imported.');
          }
        });
      }
    }
  });
}

function applyMotionSetting() {
  const m = (state && state.settings && state.settings.reducedMotion) || 'system';
  const root = document.documentElement;
  if (m === 'system') root.removeAttribute('data-reduce-motion');
  else root.setAttribute('data-reduce-motion', m === 'on' ? 'yes' : 'no');
}

/* ============================================================
   SHARED ITEM RENDERING
   ============================================================ */
function rarityClass(r) { return 'rar-' + r; }

function itemBadge(item) {
  const rd = RARITIES[item.rarity];
  return '<span class="badge ' + rarityClass(item.rarity) + '">' + rd.badge + '</span>';
}

/* Rares show the rolled name with the base type beneath (SPEC 11.7). */
function itemNameHtml(item, opts) {
  opts = opts || {};
  const cls = rarityClass(item.rarity);
  let out = '<span class="' + cls + '" style="font-weight:600">' + esc(item.name) + '</span>';
  if (item.temper) out += ' <span class="' + cls + ' num">+' + item.temper + '</span>';
  if (item.rarity === 'rare' && !opts.noBase) {
    out += '<br><span class="muted small">' + esc(item.baseType) + '</span>';
  }
  return out;
}

function affixLine(a) {
  const def = AFFIXES[a.id];
  if (!def) return '';
  return def.text.replace('X', fmtNum(a.value));
}

/* SPEC 11.8 - the Power comparison. The arrow carries the meaning as well
   as the colour, so it never relies on colour alone. */
function powerArrow(delta) {
  if (!isFinite(delta)) return '';
  if (Math.abs(delta) < 0.5) return '<span class="muted small">No change to Power</span>';
  const up = delta >= 0;
  return '<span class="num small" style="color:var(--' + (up ? 'corona' : 'blood-light') + ')">' +
    (up ? '▲ ' : '▼ ') + fmtPct(Math.abs(delta)) + ' Power</span>';
}

/* ============================================================
   CHARACTER CREATION - SPEC 18.1
   ============================================================ */
const create = { names: [], picked: null, custom: '' };

function rollHeroNames(classId) {
  const lists = HERO_NAMES[classId];
  const rng = rngFrom(newSeed('names'));
  const out = [];
  let guard = 0;
  while (out.length < 4 && guard < 60) {
    guard++;
    const n = rng.pick(lists.first) + ' ' + rng.pick(lists.last);
    if (out.indexOf(n) < 0) out.push(n);
  }
  return out;
}

const NAME_RE = /^[A-Za-zÀ-ɏ' -]{1,16}$/;

function validName(s) {
  const t = String(s || '').trim();
  return t.length >= 1 && t.length <= 16 && NAME_RE.test(t);
}

function renderCreate() {
  const classes = BALANCE.phase.unlockedClasses;
  if (!create.classId) create.classId = classes[0];
  if (!create.names.length) create.names = rollHeroNames(create.classId);
  const classId = create.classId;

  return '' +
    '<div style="text-align:center;padding:10px 0 14px">' +
      '<h1 class="display" style="font-size:2.25rem;letter-spacing:.02em">Infernus</h1>' +
      '<p class="muted small" style="margin-top:4px">A dark star fell and split the earth open.</p>' +
    '</div>' +

    '<div class="section-title">Your hero</div>' +
    classes.map(function (cid) {
      const c = CLASS_CARDS[cid];
      const sel = cid === classId;
      return '<button class="card card-tap' + (sel ? ' sel' : '') + '" data-act="pickclass" ' +
        'data-class="' + cid + '" style="margin-bottom:10px">' +
        '<div class="row" style="align-items:flex-start">' +
          '<svg class="ico" style="width:44px;height:44px;color:var(--' + (sel ? 'corona' : 'ash') + ')" ' +
            'aria-hidden="true"><use href="#sig-' + cid + '"></use></svg>' +
          '<div class="grow">' +
            '<h2 style="font-size:1.25rem">' + esc(c.name) + '</h2>' +
            '<p class="small" style="margin:4px 0 6px">' + esc(c.line) + '</p>' +
            (sel ? '<p class="muted small" style="margin:0">' + esc(c.playsLike) + '</p>' : '') +
          '</div>' +
        '</div>' +
      '</button>';
    }).join('') +

    '<div class="section-title">Their name</div>' +
    '<div class="stack-s">' +
      create.names.map(function (n, i) {
        const sel = create.picked === n ? ' sel' : '';
        return '<button class="card card-tap' + sel + '" data-act="pickname" data-i="' + i + '" ' +
          'style="padding:12px 14px"><span style="font-size:1.125rem;font-weight:600">' +
          esc(n) + '</span></button>';
      }).join('') +
    '</div>' +
    '<button class="btn btn-ghost btn-block btn-sm" data-act="reroll" style="margin-top:8px">' +
      'Reroll names</button>' +

    '<label class="field" style="margin-top:14px">' +
      '<span>Or name them yourself</span>' +
      '<input id="custom-name" maxlength="16" placeholder="1-16 letters" ' +
        'value="' + esc(create.custom) + '" autocomplete="off">' +
    '</label>' +

    // Not a sticky dock: creation is a short form and the button belongs at its end.
    '<div style="margin:18px 0 calc(14px + var(--sab))">' +
      '<button class="btn btn-primary btn-block btn-lg" data-act="begin">Begin the descent</button>' +
    '</div>';
}

const CLASS_CARDS = {
  juggernaut: { name: 'Juggernaut', line: 'Bends HP. Endures what would kill anyone else.',
    playsLike: 'Fewer, deeper, safer descents. Suits players who check in rarely.' },
  nightblade: { name: 'Nightblade', line: 'Bends time. In and out before the dark notices.',
    playsLike: 'Many fast descents, crits and gold. Suits players who check in often.' },
  shadowmancer: { name: 'Shadowmancer', line: 'Bends risk. Bargains with the thing below.',
    playsLike: 'Shapes omens, trades HP for loot and lets thralls take the hits. Suits players who like to plan every path.' }
};

function createAct(act, node) {
  if (act === 'pickclass') {
    create.classId = node.dataset.class;
    create.names = rollHeroNames(create.classId);   // names belong to the class
    create.picked = null;
    refresh();
  }
  if (act === 'pickname') {
    create.picked = create.names[parseInt(node.dataset.i, 10)];
    create.custom = '';
    refresh();
  }
  if (act === 'reroll') {
    create.names = rollHeroNames('juggernaut');
    create.picked = null;
    refresh();
  }
  if (act === 'begin') {
    const field = el('custom-name');
    const typed = field ? field.value.trim() : '';
    const name = typed || create.picked;
    if (!name) { toast('Pick a name or type one.'); return; }
    if (!validName(name)) { toast('Letters, spaces, apostrophes and hyphens. Up to 16.'); return; }
    beginHero(name, create.classId || 'juggernaut');
  }
}

/* SPEC 5.4 - a new hero starts with common, item level 1 gear in every
   class slot, no relic, no gold and full HP. */
function beginHero(name, classId) {
  const hero = freshHero(name, classId);
  const rng = rngFrom(newSeed('starter'));
  for (const slot of ['weapon', 'helm', 'armor', 'gloves', 'boots']) {
    hero.equipment[slot] = rollItem(rng, {
      floor: 1, ilvl: 1, classId: classId, rarity: 'common', slot: slot
    });
    hero.equipment[slot].isNew = false;
  }
  // SPEC 15.4 - the heirloom passes to every new hero, already equipped.
  if (state.account.heirloom) {
    const h = JSON.parse(JSON.stringify(state.account.heirloom));
    h.heirloom = true;
    h.locked = true;
    if (!h.originalIlvl) h.originalIlvl = h.ilvl;
    h.ilvl = heirloomLevelFor(hero, h);
    h.isNew = false;
    hero.equipment.relic = h;
  }

  state.hero = hero;
  const st = heroStats(hero);
  setHp(hero, st.maxHp);
  restockMarket(hero);
  save();

  ui.tab = 'descend';
  refresh();
  showStoryCard('act1', function () { refresh(); });
}

/* ============================================================
   THE DESCEND TAB - SPEC 19.2, 7.6, 7.7
   ============================================================ */
const descendUi = { floor: null, path: 0, logOpen: false };

function selectedFloor(hero) {
  const cap = maxSelectableFloor(hero);
  if (descendUi.floor === null) descendUi.floor = Math.min(hero.deepest, cap);
  descendUi.floor = clamp(descendUi.floor, 1, cap);
  return descendUi.floor;
}

function omenChip(id) {
  const o = OMENS[id];
  if (!o) return '';
  const typeWord = o.type.charAt(0).toUpperCase() + o.type.slice(1);
  return '<span class="chip chip-' + o.type + '">' +
    '<span class="tiny" style="opacity:.8">' + typeWord + '</span> ' +
    esc(o.name) + '</span>';
}

function riskLabel(risk) {
  const r = RISK_LABELS[risk];
  return '<span class="risk ' + r.cls + '">' + icon(r.icon) + r.word + '</span>';
}

/* SPEC 7.6 - the forecast HP bar: kept / might keep / certainly spent. */
function forecastBar(fc) {
  const maxHp = Math.max(fc.maxHp, 1);
  const a = clamp(fc.hp - fc.max, 0, fc.hp);
  const b = clamp(fc.hp - fc.min, 0, fc.hp);
  const pc = function (v) { return (clamp(v, 0, maxHp) / maxHp * 100) + '%'; };
  return '<div class="hpbar">' +
    '<div class="seg seg-kept"  style="left:0;width:' + pc(a) + '"></div>' +
    '<div class="seg seg-maybe" style="left:' + pc(a) + ';width:' + pc(b - a) + '"></div>' +
    '<div class="seg seg-spent" style="left:' + pc(b) + ';width:' + pc(fc.hp - b) + '"></div>' +
  '</div>';
}

function renderForecast(hero, fc) {
  const invWarn = fc.inventoryWarning
    ? '<p class="small" style="color:var(--brass);margin:8px 0 0">' + icon('ico-risky', '') +
      ' Fewer than ' + BALANCE.forecast.lowInventoryWarn + ' inventory slots free</p>'
    : '';

  return '<div class="panel stack" style="margin-top:10px">' +
    '<div class="row-between">' + riskLabel(fc.risk) +
      '<span class="small num muted">' + icon('ico-clock') + ' ' + fmtTime(fc.time) + '</span>' +
    '</div>' +

    forecastBar(fc) +
    '<p class="small num" style="margin:0">After this descent: ' +
      fmtNum(fc.after.min) + ' to ' + fmtNum(fc.after.max) + ' HP</p>' +
    '<p class="tiny muted" style="margin:-4px 0 0">Costs ' + fmtNum(fc.min) + ' to ' +
      fmtNum(fc.max) + ' HP, likely ' + fmtNum(fc.expected) + '</p>' +

    // SPEC 7.6: one chip each - type word, name and effect.
    (fc.omens.length ? '<div class="stack-s">' + fc.omens.map(function (id) {
      const o = OMENS[id];
      if (!o) return '';
      const typeWord = o.type.charAt(0).toUpperCase() + o.type.slice(1);
      return '<div class="chip chip-' + o.type + '" style="display:flex;border-radius:8px;' +
        'align-items:flex-start;padding:7px 10px">' +
        '<span class="tiny" style="opacity:.8;flex:0 0 auto">' + typeWord + '</span>' +
        '<span class="grow" style="white-space:normal">' + esc(o.name) +
          ' <span class="muted tiny">' + esc(o.text) + '</span></span>' +
      '</div>';
    }).join('') + '</div>' : '') +

    '<div class="divider" style="margin:4px 0"></div>' +

    '<div class="row wrap" style="gap:14px">' +
      '<span class="small num">' + icon('ico-coin') + ' ' + fmtNum(fc.gold.lo) + '-' + fmtNum(fc.gold.hi) + '</span>' +
      '<span class="small num">' + fmtNum(fc.xp) + ' XP</span>' +
      '<span class="small num">' + fc.items.lo + '-' + fc.items.hi + ' items</span>' +
      (fc.rareOddsUp ? '<span class="small" style="color:var(--r-rare)">Rare odds up</span>' : '') +
    '</div>' +
    invWarn +
  '</div>';
}

function renderRiteRow(hero) {
  const slots = hero.riteSlots || [];
  const any = slots.some(function (s) { return !!s; });
  if (!any) return '';
  return '<div class="section-title">Rites</div>' +
    '<div class="row wrap" style="gap:8px">' +
      slots.map(function (rid) {
        if (!rid) return '';
        const s = riteState(hero, rid);
        if (!s) return '';
        let label, cls = '';
        if (s.primed) { label = 'Primed'; cls = ' chip-pact'; }
        else if (s.activeUntil > now()) { label = fmtTime(s.activeUntil - now()) + ' left'; cls = ' chip-boon'; }
        else if (s.cooldown > 0) { label = fmtTime(s.cooldown); }
        else { label = 'Ready'; cls = ' chip-boon'; }
        return '<button class="chip' + cls + '" data-act="rite" data-rite="' + rid + '" ' +
          'style="min-height:44px">' + esc(s.node.name) +
          ' <span class="num tiny" style="opacity:.85">' + label + '</span></button>';
      }).join('') +
    '</div>';
}

/* Pillar 9: a named Horror's twist is shown on its path before the player
   commits, alongside the "A Horror Stirs" omen chip. */
function pathHorrorLine(path) {
  const enc = (path.encounters || []).find(function (e) { return e.kind === 'horror'; });
  const id = horrorIdOf(enc);
  if (!id) return '';
  return '<p class="small" style="margin:8px 0 0">' +
    '<span style="font-weight:600">' + esc(HORRORS[id].name) + '</span>' +
    '<span class="muted"> · ' + esc(HORRORS[id].twist) + '</span>' +
  '</p>';
}

/* Every floor the hero may pick, in labelled bands: the four acts, then the
   named strata, then The Unnamed Deep in tens.
   Returns [{ label, floors:[n,...] }]. */
function floorBands(cap) {
  const bands = [];
  for (const a of ACTS) {
    if (a.minFloor > cap) break;
    const floors = [];
    for (let f = a.minFloor; f <= Math.min(a.maxFloor, cap); f++) floors.push(f);
    if (floors.length) bands.push({ label: a.display, floors: floors });
  }
  const below = ACTS[ACTS.length - 1].maxFloor;
  for (let start = below + 1; start <= cap; start += 10) {
    const end = Math.min(start + 9, cap);
    const floors = [];
    for (let f = start; f <= end; f++) floors.push(f);
    // A named stratum is labelled by name; The Unnamed Deep repeats, so its
    // bands carry their floor range to tell them apart.
    const s = stratumForFloor(start);
    const label = s && s !== UNNAMED_DEEP
      ? s.name
      : UNNAMED_DEEP.name + ' · ' + fmtNum(start) + '–' + fmtNum(end);
    bands.push({ label: label, floors: floors });
  }
  return bands;
}

/* Stepping one floor at a time is fine for a nudge and miserable for a
   journey - a hero fifty floors down had fifty taps to reach a Guardian.
   Tapping the floor number opens this instead: every floor at once,
   grouped, with the Guardians marked and the current one highlighted. */
/* The Wandering Horror waiting on one of a floor's paths, or null. It only
   reads paths already rolled. A floor's paths are set the first time it is
   viewed and saved so a reload can't change them; rolling every floor early
   just to find its Horrors would save all of them, which at floor 120 grows
   the save about eighty-fold (5 KB to 390 KB) and makes Export unwieldy. */
function floorHorror(hero, f) {
  const fl = hero.floors && hero.floors[String(f)];
  if (!fl || !fl.paths) return null;
  for (const p of fl.paths) {
    const enc = (p.encounters || []).find(function (e) { return e.kind === 'horror'; });
    if (enc) {
      const id = horrorIdOf(enc);
      return id ? HORRORS[id].name : 'A Wandering Horror';
    }
  }
  return null;
}

function openFloorPicker(hero) {
  const cap = maxSelectableFloor(hero);
  const current = selectedFloor(hero);

  const body = floorBands(cap).map(function (band) {
    return '<div class="section-title">' + esc(band.label) + '</div>' +
      '<div class="floor-grid">' +
        band.floors.map(function (f) {
          const gd = guardianOnFloor(f);
          const horror = gd ? null : floorHorror(hero, f);   // never both: Guardian floors carry no Horror
          const cls = 'floor-tile' + (gd ? ' boss' : '') + (f === current ? ' sel' : '');
          return '<button type="button" class="' + cls + '" data-act="floorpick" data-f="' + f + '"' +
            (f === current ? ' aria-current="true"' : '') +
            ' aria-label="Floor ' + f + (gd ? ', ' + esc(GUARDIAN_NAMES[gd.id]) : '') +
              (horror ? ', ' + esc(horror) + ' waits here' : '') + '">' +
            '<span>' + fmtNum(f) + '</span>' +
            (gd ? '<span style="color:var(--blood-light)">' + icon('ico-boss') + '</span>' : '') +
            (horror ? '<span style="color:var(--corona)">' + icon('ico-horror') + '</span>' : '') +
          '</button>';
        }).join('') +
      '</div>';
  }).join('');

  openSheet({
    title: 'Choose a floor',
    body: '<p class="tiny muted" style="margin:0 0 10px">You can return to any floor you have reached. ' +
      'Guardian floors are outlined in red. An eye marks a floor with a Wandering Horror on one of its paths. ' +
      'A floor’s paths are set the first time you view it, so floors you haven’t looked at yet show no eye.</p>' +
      body,

    /* The sheet carries its own dispatcher: delegate() is bound to #view,
       and sheets live outside it. */
    onAct: function (act, node) {
      if (act !== 'floorpick') return;
      const picked = clamp(parseInt(node.dataset.f, 10) || 1, 1, maxSelectableFloor(hero));
      closeSheet();
      if (picked !== descendUi.floor) { descendUi.floor = picked; descendUi.path = 0; }
      refresh();
      maybeShowActCard(descendUi.floor);
    },

    // Open on the floor they are standing on rather than at the top.
    after: function (layer) {
      const sel = layer.querySelector('.floor-tile.sel');
      if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: 'center' });
    }
  });
}

function renderTownDescend(hero) {
  const cap = maxSelectableFloor(hero);
  const f = selectedFloor(hero);
  const act = actForFloor(f);
  const gd = guardianOnFloor(f);
  const paths = getFloorPaths(hero, f);
  if (descendUi.path >= paths.length) descendUi.path = 0;

  const fallen = hero.fallenUntil > now();
  // The pit never ends, so there is no longer a phase-end message.
  const atPhaseEnd = false;

  let html = '';

  // ---- floor stepper ----
  html += '<div class="card">' +
    '<div class="row-between">' +
      '<button class="btn btn-ghost" data-act="floor" data-d="-1" aria-label="Previous floor" ' +
        (f <= 1 ? 'disabled' : '') + ' style="width:44px;padding:0">' + icon('ico-chevron-left') + '</button>' +
      '<button type="button" class="grow" data-act="floorpick-open" ' +
        'style="text-align:center;background:none;border:0;padding:4px 0;min-height:44px;color:inherit" ' +
        'aria-label="Choose a floor. Currently floor ' + f + '">' +
        '<div class="display" style="font-size:1.75rem;line-height:1.1">Floor ' + f + '</div>' +
        '<div class="display" style="font-size:1rem;color:var(--ash)">' + esc(floorLabel(f)) + '</div>' +
        (cap > 1 ? '<div class="tiny" style="color:var(--corona);margin-top:2px">Tap to choose</div>' : '') +
      '</button>' +
      '<button class="btn btn-ghost" data-act="floor" data-d="1" aria-label="Next floor" ' +
        (f >= cap ? 'disabled' : '') + ' style="width:44px;padding:0">' + icon('ico-chevron-right') + '</button>' +
    '</div>' +
    '<div class="row-between small" style="margin-top:10px">' +
      '<span class="muted">Danger <span class="num" style="color:var(--bone)">' + fmtNum(dangerOf(f)) + '</span></span>' +
      (gd ? '<span class="risk risk-deadly">' + icon('ico-boss') + esc(GUARDIAN_NAMES[gd.id]) + '</span>' : '') +
    '</div>' +
    // A Deep Guardian has no story card, so it is introduced here: one line
    // of who it is, and the stat it tests.
    (gd && gd.deep
      ? '<p class="small muted" style="margin:8px 0 0">' + esc(DEEP_GUARDIANS[gd.base].line) +
        ' It tests your ' + esc(GUARDIAN_TEST_TEXT[gd.factor]) + '.</p>'
      : '') +
  '</div>';

  html += renderNextGoals(hero);

  if (fallen) {
    html += '<div class="card" style="margin-top:10px;border-color:var(--blood-light)">' +
      '<div class="risk risk-deadly">' + icon('ico-deadly') + 'Fallen</div>' +
      '<p class="small" style="margin:8px 0 0">You cannot descend for ' +
        '<span class="num">' + fmtTime(hero.fallenUntil - now()) + '</span>. ' +
        'The Last Chapel can revive you sooner.</p>' +
    '</div>';
  }

  // ---- path cards ----
  html += '<div class="section-title">Paths</div>';
  const forecasts = paths.map(function (p, i) { return forecast(hero, f, i); });

  html += paths.map(function (p, i) {
    const fc = forecasts[i];
    const sel = i === descendUi.path ? ' sel' : '';
    return '<button class="card card-tap' + sel + '" data-act="path" data-i="' + i + '">' +
      '<div class="row-between">' +
        '<span style="font-size:1.125rem;font-weight:600">' + esc(p.name) + '</span>' +
        (fc ? riskLabel(fc.risk) : '') +
      '</div>' +
      (p.omens.length ? '<div class="chips" style="margin-top:8px">' +
        p.omens.map(omenChip).join('') + '</div>' : '') +
      pathHorrorLine(p) +
    '</button>';
  }).join('');

  const fc = forecasts[descendUi.path];
  if (fc) html += renderForecast(hero, fc);

  // ---- reroll ----
  const cost = rerollCost(hero, f);
  html += '<button class="btn btn-ghost btn-block btn-sm" data-act="reroll-paths" style="margin-top:10px"' +
    (hero.gold < cost ? ' disabled' : '') + '>' +
    'Reroll paths &middot; <span class="num">' + fmtNum(cost) + '</span> gold</button>';

  // The Shadowmancer's free reroll (SPEC 5.1).
  if (hero.classId === 'shadowmancer') {
    const ready = freeRerollReady(hero);
    html += '<button class="btn btn-ghost btn-block btn-sm" data-act="free-reroll" style="margin-top:8px"' +
      (ready ? '' : ' disabled') + '>' +
      (ready ? 'Free reroll' : 'Free reroll in <span class="num">' +
        fmtTime(hero.freeRerollReadyAt - now()) + '</span>') + '</button>';
  }

  // ---- rites ----
  html += renderRiteRow(hero);

  // ---- the descent queue (SPEC 16.2) ----
  if (hasUnlock('queue')) {
    html += '<div class="section-title">Descent queue</div>';
    if (hero.queue) {
      html += '<div class="card"><div class="row-between">' +
        '<span class="small">Floor ' + fmtNum(hero.queue.floor) + ', ' +
          fmtNum(hero.queue.left) + ' left, stops below ' + fmtPct(hero.queue.threshold) + ' HP</span>' +
        '<button class="btn btn-sm btn-ghost" data-act="queue-cancel">Cancel</button>' +
      '</div></div>';
    } else {
      html += '<button class="btn btn-ghost btn-block btn-sm" data-act="queue-open">' +
        'Queue descents on floor ' + fmtNum(f) + '</button>';
    }
  }

  // ---- Ascension is offered right after the god's first kill (SPEC 15.1) ----
  if (canAscend(hero)) {
    html += '<div class="card" style="margin-top:12px;border-color:var(--corona)">' +
      '<div class="row-between">' +
        '<div><div class="small" style="color:var(--corona)">Ascension is open</div>' +
        '<div class="tiny muted">Retire this hero and leave a blessing behind.</div></div>' +
        '<button class="btn btn-sm" data-act="ascend">Ascend</button>' +
      '</div></div>';
  }

  // ---- descend ----
  const blocked = fallen || !fc;
  html += '<div class="dock">' +
    '<button class="btn btn-primary btn-block btn-lg" data-act="descend"' +
      (blocked ? ' disabled' : '') + '>' +
      (fallen ? 'Fallen' : 'Descend') + '</button>' +
  '</div>';

  return html;
}

/* ---- the live view, SPEC 7.7 ---- */
/* ============================================================
   THE LIVE DESCENT - SPEC 7.7, SCOPES-DESCENT D0-D6
   The card redraws itself each time an encounter resolves (D0). Nothing
   else on the screen is rebuilt then, so a retreat hold already under way
   is never cancelled by a redraw. Between resolutions, once a second, only
   the parts driven by the clock move: the time left, the time bar and the
   bar across the current fight.
   ============================================================ */

/* The encounter being fought now, by the clock. Encounters run back to back,
   so this is normally the first unresolved one; in the moment between an
   encounter's end and the next settle the clock can be a step ahead. */
function liveCurrentIndex(d) {
  const t = now();
  for (let i = d.resolved; i < d.timeline.length; i++) {
    if (t < d.timeline[i].endsAt) return i;
  }
  return d.timeline.length - 1;
}

const LIVE_KIND_WORD = { pack: 'pack', elite: 'elite', horror: 'Wandering Horror', guardian: 'Guardian' };

function liveFightPct(enc) {
  return clamp((now() - enc.startsAt) / Math.max(enc.endsAt - enc.startsAt, 1), 0, 1) * 100;
}

/* The track (liveTrackHtml, liveTrackTick) is SCOPES-DESCENT D5, further down. */

/* D1 - what the hero is fighting now, and what comes next. The crits and HP
   costs of fights still to come are already decided by the seed; showing
   them would spoil each one before it lands, so they stay hidden. */
/* An encounter's kind as a small tag in its track colour, with its word. */
function liveKindChip(e) {
  return '<span class="kind-chip kind-' + e.kind + '">' + esc(LIVE_KIND_WORD[e.kind] || e.kind) + '</span>';
}

function liveNowHtml(d) {
  const i = liveCurrentIndex(d);
  const cur = d.timeline[i];
  if (!cur) return '';
  const next = d.timeline[i + 1];
  return '<div class="live-tile" style="margin-top:12px">' +
    '<div class="live-label">Fighting</div>' +
    '<div class="row-between" style="gap:8px;margin-top:4px">' +
      '<span style="font-weight:700;min-width:0">' + esc(cur.name) + '</span>' + liveKindChip(cur) +
    '</div>' +
    '<div class="bar bar-thin" style="margin-top:8px"><div class="bar-fill" id="live-now-fill" ' +
      'data-i="' + i + '" style="width:' + liveFightPct(cur) + '%;background:var(--bone)"></div></div>' +
    (next ? '<div class="row-between small" style="gap:8px;margin-top:8px">' +
      '<span style="min-width:0"><span class="muted">Next · </span>' + esc(next.name) + '</span>' +
      liveKindChip(next) + '</div>' : '') +
  '</div>';
}

/* D6 - a Guardian or Wandering Horror is next: say so before it arrives. */
function liveBossBannerHtml(d) {
  const next = d.timeline[liveCurrentIndex(d) + 1];
  if (!next || (next.kind !== 'guardian' && next.kind !== 'horror')) return '';
  let text;
  if (next.kind === 'horror') {
    const id = horrorIdOf(next);
    const twist = id ? HORRORS[id].twist : '';
    text = next.name + ' stirs' + (twist ? ': ' + twist.charAt(0).toLowerCase() + twist.slice(1) : '') + '.';
  } else {
    const deep = isDeepGuardian(next.guardianId) ? DEEP_GUARDIANS[deepBaseId(next.guardianId)] : null;
    text = next.name + ' waits' + (deep ? '. It tests your ' + GUARDIAN_TEST_TEXT[deep.test] : '') + '.';
  }
  return '<div class="panel small row" style="margin-top:10px;gap:8px;align-items:flex-start;' +
      'border-left:3px solid var(--blood-light)">' +
    '<span style="color:var(--blood-light);flex:0 0 auto;display:inline-flex">' + icon('ico-boss') + '</span>' +
    '<span>' + esc(text) + '</span>' +
  '</div>';
}

/* D2 - what this descent has earned so far. Items show as rarity letter
   badges with counts, because rarity is never shown by colour alone. */
/* Gold in brass with its coin and XP in corona, the colours they carry
   everywhere else in the game. Used by the haul and the retreat line alike. */
function liveGoldHtml(n) {
  return '<span class="row" style="display:inline-flex;gap:4px">' + icon('ico-coin', 'coin') +
    '<span class="num val-gold" style="font-weight:600">' + fmtNum(n) + '</span></span>';
}
function liveXpHtml(n) {
  return '<span class="val-xp" style="font-weight:600"><span class="num">' + fmtNum(n) + '</span> XP</span>';
}

function liveHaulHtml(d) {
  const R = d.rewards;
  const bits = [];
  if (R.gold) bits.push(liveGoldHtml(R.gold));
  if (R.xp) bits.push(liveXpHtml(R.xp));
  if (R.starshards) bits.push('<span class="row" style="display:inline-flex;gap:4px">' + icon('ico-star') +
    '<span class="num" style="font-weight:600">' + fmtNum(R.starshards) + '</span></span>');
  const pages = (d.lorePages || []).length;
  if (pages) bits.push('<span style="color:var(--corona)">' + fmtNum(pages) + ' lore page' + (pages === 1 ? '' : 's') + '</span>');

  const counts = {};
  for (const it of R.items) counts[it.rarity] = (counts[it.rarity] || 0) + 1;
  const badges = RARITY_ORDER.filter(function (r) { return counts[r]; }).map(function (r) {
    return '<span class="row" style="display:inline-flex;gap:3px">' + itemBadge({ rarity: r }) +
      '<span class="num">×' + fmtNum(counts[r]) + '</span></span>';
  }).join('');
  const salvaged = R.autoSalvaged && R.autoSalvaged.ash
    ? '<div class="small muted" style="margin-top:4px">+<span class="num">' + fmtNum(R.autoSalvaged.ash) + '</span> Ash from salvage</div>'
    : '';

  const head = '<div class="live-label">So far</div>';
  if (!bits.length && !badges && !salvaged) {
    return '<div class="live-section">' + head + '<div class="small muted" style="margin-top:4px">Nothing yet.</div></div>';
  }
  return '<div class="live-section">' + head +
    (bits.length ? '<div class="row wrap" style="gap:14px;margin-top:6px">' + bits.join('') + '</div>' : '') +
    (badges ? '<div class="row wrap" style="gap:10px;margin-top:8px">' + badges + '</div>' : '') +
    salvaged +
  '</div>';
}

/* D3 - how the run is going against the forecast, and what is still ahead.
   The forecast's own per-encounter maths (encounterExpectation) is run on the
   fights already over, using the HP the descent started with as the forecast
   did, and compared with the HP actually spent. What is ahead uses the
   values in effect now, so it moves when an emergency rite changes them. */
function livePace(d) {
  const L = BALANCE.live;
  const snap = d.snapshot;
  let expSoFar = 0, min = 0, max = 0, exp = 0;
  for (let i = 0; i < d.timeline.length; i++) {
    const enc = d.timeline[i];
    const done = i < d.resolved;
    const ctx = { effects: effectsAt(snap, enc.startsAt, d.emergency),
                  hp: done ? d.hpAtStart : d.hp,
                  elitesKilled: done ? 0 : d.stacks.elitesKilled };
    ctx.stats = statsAt(snap, ctx);
    const e = encounterExpectation(snap, ctx, enc, d.floor, d.seed);
    if (done) expSoFar += e.expected;
    else { min += e.min; max += e.max; exp += e.expected; }
  }
  const spent = Math.max(0, d.hpAtStart - d.hp);
  let word = null;
  if (d.resolved >= L.paceMinResolved && expSoFar > 0) {
    const r = spent / expSoFar;
    word = r < L.paceBetter ? 'better' : (r > L.paceHot ? 'hot' : 'course');
  }
  // The same thresholds as the forecast's risk label (SPEC 7.6), from here on.
  const ahead = d.resolved < d.timeline.length;
  const risk = !ahead ? null : (max < d.hp ? 'safe' : (exp < d.hp ? 'risky' : 'deadly'));
  return { spent: spent, word: word, min: min, max: max, exp: exp, risk: risk };
}

const LIVE_PACE_WORD = {
  better: { text: 'better than expected', colour: 'verdant' },
  course: { text: 'on course',            colour: 'bone' },
  hot:    { text: 'running hot',          colour: 'brass' }
};

function livePaceHtml(d, p) {
  if (!p.risk) return '';
  // The verdict and the risk label lead, in their colours; the figures follow.
  let html = '<div class="live-section small">' +
    '<div class="row-between" style="gap:8px"><span class="live-label">Pace</span>' + riskLabel(p.risk) + '</div>';
  if (p.word) {
    const w = LIVE_PACE_WORD[p.word];
    html += '<div style="margin-top:6px"><span style="font-weight:700;color:var(--' + w.colour + ')">' +
      w.text.charAt(0).toUpperCase() + w.text.slice(1) + '</span> · ' +
      '<span class="num val-loss">' + fmtNum(Math.round(p.spent)) + '</span> HP spent</div>';
  }
  html += '<div style="margin-top:4px">About <span class="num" style="font-weight:600">' + fmtNum(Math.round(p.min)) + '–' +
      fmtNum(Math.round(p.max)) + '</span> HP of fighting left. You have <span class="num" style="font-weight:600">' +
      fmtNum(Math.max(0, Math.floor(d.hp))) + '</span>.</div>';
  if (p.risk === 'deadly') {
    html += '<div style="margin-top:4px;color:var(--blood-light)">' +
      'The rest of this path is expected to cost more HP than you have.</div>';
  }
  return html + '</div>';
}

/* D4 - the stakes of the one real choice, beside the button that makes it.
   A fall halves the gold and XP gathered so far (SPEC 8.2); that is only
   mentioned once the run is going badly, so it doesn't nag on safe runs. */
function liveRetreatHtml(hero, p) {
  const d = hero.descent;
  const R = d.rewards;
  const total = d.timeline.length;
  const locket = d.snapshot.specials.the_deserters_locket && total > 0 &&
    d.resolved / total >= BALANCE.live.locketFraction;

  // What you would give up, in danger red; what you would keep, in the
  // colours the haul uses. Keeping and losing read apart at a glance.
  const losses = [];
  if (!locket) losses.push('Lose the end chest.');
  if (d.floor >= hero.deepest) losses.push('Floor ' + fmtNum(d.floor + 1) + ' stays locked.');
  const gd = d.timeline.slice(d.resolved).find(function (e) { return e.kind === 'guardian'; });
  if (gd) losses.push(gd.name + ' stays standing.');

  const keepBits = [];
  if (R.gold) keepBits.push(liveGoldHtml(R.gold));
  if (R.xp) keepBits.push(liveXpHtml(R.xp));
  if (R.items.length) keepBits.push('<span style="font-weight:600"><span class="num">' + fmtNum(R.items.length) +
    '</span> item' + (R.items.length === 1 ? '' : 's') + '</span>');

  const fall = p && (p.word === 'hot' || p.risk === 'deadly') && (R.gold || R.xp);
  return '<div class="small" style="background:var(--crypt);border-radius:var(--radius);padding:8px 10px;margin-bottom:8px">' +
    '<div class="row wrap" style="gap:4px 10px;align-items:center"><span style="font-weight:700">Retreat now keeps</span>' +
      (keepBits.length ? keepBits.join('') : '<span class="muted">nothing yet</span>') +
      (locket ? '<span style="color:var(--verdant);font-weight:600">and the end chest (Deserter’s Locket)</span>' : '') +
    '</div>' +
    (losses.length ? '<div class="val-loss" style="margin-top:4px">' + esc(losses.join(' ')) + '</div>' : '') +
    (fall ? '<div class="val-loss" style="margin-top:2px;font-weight:600">A fall would halve the gold and XP.</div>' : '') +
  '</div>';
}

/* The card itself: floor and time, the track, the fight in progress, a
   boss warning, encounters and HP, the haul, the pace, the omens. */
function liveCardHtml(hero, p) {
  const d = hero.descent;
  const st = activeStats(hero);
  const hp = Math.max(0, Math.floor(d.hp));
  // D6 - low HP says so in words as well as colour.
  const low = hp < st.maxHp * BALANCE.live.lowHpFrac;
  const hpPct = st.maxHp > 0 ? clamp(hp / st.maxHp, 0, 1) * 100 : 0;
  return '<div class="row-between">' +
      '<div><div class="display" style="font-size:1.375rem">Floor ' + d.floor + '</div>' +
        '<div class="tiny muted">' + esc(d.pathName) + '</div></div>' +
      // Time left in corona, the colour of the time bar it belongs to.
      '<div style="text-align:right">' +
        '<div class="num" id="live-left" style="color:var(--corona);font-size:1.25rem;font-weight:700">' +
          fmtTime(Math.max(0, d.endsAt - now())) + '</div>' +
        '<div class="tiny muted">left</div></div>' +
    '</div>' +
    liveTrackHtml(hero, d) +
    liveNowHtml(d) +
    liveBossBannerHtml(d) +
    // HP and encounters as two tiles. HP carries a bar in blood, the HP
    // bar's colour; below a quarter it says "Low HP" as well as turning red.
    '<div class="grid-2" style="margin-top:10px">' +
      '<div class="live-tile">' +
        '<div class="row-between" style="gap:6px"><span class="live-label"' +
          (low ? ' style="color:var(--blood-light)"' : '') + '>' + (low ? 'Low HP' : 'HP') + '</span>' +
          '<span style="color:var(--blood);display:inline-flex">' + icon('ico-hp') + '</span></div>' +
        '<div class="num" style="font-weight:700;margin-top:2px' + (low ? ';color:var(--blood-light)' : '') + '">' +
          fmtNum(hp) + '<span class="muted" style="font-weight:400"> / ' + fmtNum(st.maxHp) + '</span></div>' +
        '<div class="bar bar-thin" style="margin-top:6px"><div class="bar-fill" style="width:' + hpPct + '%"></div></div>' +
      '</div>' +
      '<div class="live-tile">' +
        '<div class="row-between" style="gap:6px"><span class="live-label">Encounters</span>' +
          '<span style="color:var(--corona);display:inline-flex">' + icon('ico-descend') + '</span></div>' +
        '<div class="num" style="font-weight:700;margin-top:2px">' + fmtNum(d.resolved) +
          '<span class="muted" style="font-weight:400"> / ' + fmtNum(d.timeline.length) + '</span></div>' +
        '<div class="bar bar-thin bar-xp" style="margin-top:6px"><div class="bar-fill" style="width:' +
          (d.timeline.length ? d.resolved / d.timeline.length * 100 : 0) + '%"></div></div>' +
      '</div>' +
    '</div>' +
    liveHaulHtml(d) +
    livePaceHtml(d, p) +
    (d.omens.length ? '<div class="chips" style="margin-top:10px">' + d.omens.map(omenChip).join('') + '</div>' : '');
}

function liveLogHtml(d) {
  const lines = d.log.slice(0, BALANCE.logVisibleLines).map(logLine).join('');
  return lines || '<p class="muted small" style="margin:0">Descending.</p>';
}
function liveLogMoreHtml(d) {
  return d.log.length > BALANCE.logVisibleLines
    ? '<button class="btn btn-ghost btn-block btn-sm" data-act="log" style="margin-top:8px">Show the whole log</button>'
    : '';
}

function renderLiveDescent(hero) {
  const d = hero.descent;
  const p = livePace(d);
  const emergency = emergencyRites(hero);

  return '<div class="card" id="live-card" data-n="' + d.resolved + '">' + liveCardHtml(hero, p) + '</div>' +

    (emergency.length ? '<div class="section-title">Emergency rites</div>' +
      '<div class="row wrap" style="gap:8px">' +
        emergency.map(function (n) {
          const s = riteState(hero, n.id);
          const ready = s.cooldown <= 0;
          return '<button class="btn btn-sm" data-act="rite" data-rite="' + n.id + '"' +
            (ready ? '' : ' disabled') + '>' + esc(n.name) +
            (ready ? '' : ' <span class="num tiny">' + fmtTime(s.cooldown) + '</span>') + '</button>';
        }).join('') +
      '</div>' : '') +

    '<div class="section-title">The descent</div>' +
    '<div class="panel" id="live-log">' + liveLogHtml(d) + '</div>' +
    '<div id="live-log-more">' + liveLogMoreHtml(d) + '</div>' +

    '<div class="dock">' +
      '<div id="live-retreat">' + liveRetreatHtml(hero, p) + '</div>' +
      '<button class="btn btn-danger btn-block btn-lg btn-hold" data-act="retreat-hold">' +
        '<span class="fill"></span><span class="lbl">Hold to retreat</span></button>' +
    '</div>';
}

/* Once a second, from the descent view's tick. D0: when an encounter has
   resolved since the card was drawn, redraw the card, the log and the retreat
   line - never the whole screen. */
function liveDescentTick(hero) {
  const d = hero.descent;
  const leftEl = el('live-left');
  if (leftEl) leftEl.textContent = fmtTime(Math.max(0, d.endsAt - now()));
  liveTrackTick(d);
  const fill = el('live-now-fill');
  if (fill) {
    const enc = d.timeline[parseInt(fill.dataset.i, 10)];
    if (enc) fill.style.width = liveFightPct(enc) + '%';
  }

  const card = el('live-card');
  if (!card || card.dataset.n === String(d.resolved)) return;
  const p = livePace(d);
  card.innerHTML = liveCardHtml(hero, p);
  card.dataset.n = String(d.resolved);
  const log = el('live-log');
  if (log) {
    log.innerHTML = liveLogHtml(d);
    // D6 - the line that just arrived glows once.
    const first = log.firstElementChild;
    if (first) first.classList.add('log-new');
  }
  const more = el('live-log-more');
  if (more) more.innerHTML = liveLogMoreHtml(d);
  const ret = el('live-retreat');
  if (ret) ret.innerHTML = liveRetreatHtml(hero, p);
}

function logLine(entry) {
  let cls = 'small';
  let text = esc(entry.text);
  if (entry.kind === 'death') cls += ' risk-deadly';
  if (entry.kind === 'save') cls += ' risk-risky';
  let items = '';
  if (entry.items && entry.items.length) {
    items = ' <span class="small">Found: ' + entry.items.map(function (i) {
      return '<span class="' + rarityClass(i.rarity) + '">' + esc(i.name) + '</span>';
    }).join(', ') + '.</span>';
  }
  let pages = '';
  if (entry.pages && entry.pages.length) {
    pages = ' <span class="small" style="color:var(--corona)">Lore page: ' +
      entry.pages.map(esc).join(', ') + '.</span>';
  }
  return '<div class="' + cls + '" style="padding:3px 0">' + text + items + pages + '</div>';
}

VIEWS.descend = {
  render: function () {
    const hero = state.hero;
    if (!hero) return renderCreate();
    if (hero.descent) return renderLiveDescent(hero);
    return renderTownDescend(hero);
  },
  tick: function () {
    const hero = state.hero;
    if (!hero || !hero.descent) return;
    liveDescentTick(hero);
  },
  after: function (host) {
    const hold = host.querySelector('[data-act="retreat-hold"]');
    if (hold) attachHold(hold, BALANCE.retreatHoldMs, function () {
      const res = retreat(state.hero);
      refresh();
      if (res) showResults(res);
    });
  },
  onAct: function (act, node) {
    const hero = state.hero;
    if (!hero) return createAct(act, node);

    if (act === 'floor') {
      descendUi.floor = clamp(selectedFloor(hero) + parseInt(node.dataset.d, 10), 1, maxSelectableFloor(hero));
      descendUi.path = 0;
      refresh();
      maybeShowActCard(descendUi.floor);
    }
    if (act === 'floorpick-open') { openFloorPicker(hero); return; }
    if (act === 'path') { descendUi.path = parseInt(node.dataset.i, 10); refresh(); }
    if (act === 'reroll-paths') {
      const f = selectedFloor(hero);
      const cost = rerollCost(hero, f);
      if (hero.gold < cost) { toast('Not enough gold.'); return; }
      hero.gold -= cost;
      hero.rerollsAt.push(now());
      hero.floors[String(f)] = rollFloorPaths(hero, f);
      descendUi.path = 0;
      save(); refresh();
    }
    if (act === 'rite') {
      const rid = node.dataset.rite;
      const gate = canInvokeRite(hero, rid);
      if (!gate.ok) { toast(gate.reason); return; }
      const n = nodeById(hero.classId, rid);
      const f = selectedFloor(hero);

      // Two instant rites act on the floor being looked at, not on the hero.
      if (rid === 'unmake') {
        const all = heroHasSetBonus(hero, 'hexbound_relics', 3);
        const res = unmakeBane(hero, f, descendUi.path, all);
        if (!res.ok) { toast(res.reason); return; }
        hero.riteReadyAt[rid] = now() + riteCooldownMs(hero, n);
        save(); refresh();
        toast(res.removed.length > 1 ? 'Every bane unmade.' : OMENS[res.removed[0]].name + ' unmade.');
        return;
      }
      if (rid === 'scry_the_deep') {
        const res = scryTheDeep(hero, f);
        hero.riteReadyAt[rid] = now() + riteCooldownMs(hero, n);
        descendUi.path = 0;
        save(); refresh();
        toast('The deep answers. ' + res.paths + ' paths.');
        return;
      }

      const res = invokeRite(hero, rid);
      if (!res.ok) { toast(res.reason); return; }
      toast(n.name + (res.kind === 'primed' ? ' is primed.' : '.'));
      refresh();
    }
    if (act === 'ascend') openAscension();
    if (act === 'queue-cancel') { queueCancel(hero); refresh(); toast('Queue cancelled.'); }
    if (act === 'queue-open') {
      const f2 = selectedFloor(hero);
      openSheet({
        title: 'Queue descents',
        body:
          '<p class="small muted">The queue takes the lowest-risk path on floor ' + fmtNum(f2) +
            ', never a Deadly one, and uses no rites. It stops if your HP falls below the ' +
            'threshold, if you fall, or if you run low on inventory space.</p>' +
          '<label class="field"><span>How many descents</span>' +
            '<input id="q-count" type="number" min="1" max="' + BALANCE.queue.maxCount +
            '" value="3"></label>' +
          '<label class="field" style="margin-top:10px"><span>Stop below this much HP</span>' +
            '<input id="q-thr" type="number" min="0" max="100" value="50"></label>',
        foot: '<button class="btn btn-primary btn-block btn-lg" data-act="go">Start the queue</button>',
        onAct: function (a) {
          if (a !== 'go') return;
          const n = parseInt(document.getElementById('q-count').value, 10) || 1;
          const t = parseInt(document.getElementById('q-thr').value, 10) || 0;
          const res = queueStart(hero, f2, n, t);
          if (!res.ok) { toast(res.reason); return; }
          closeSheet();
          settle();
          refresh();
          toast('Queue started.');
        }
      });
    }
    if (act === 'free-reroll') {
      const res = useFreeReroll(hero, selectedFloor(hero));
      if (!res.ok) { toast(res.reason); return; }
      descendUi.path = 0;
      refresh();
      toast('Paths rerolled.');
    }
    if (act === 'log') showFullLog(hero.descent);
    if (act === 'descend') {
      const f = selectedFloor(hero);
      const fc = forecast(hero, f, descendUi.path);
      if (!fc) return;
      const go = function () {
        startDescent(hero, f, descendUi.path);
        refresh();
      };
      if (fc.risk === 'deadly') {
        confirmSheet({
          title: 'This will probably kill you',
          body: 'This path is expected to cost ' + fmtNum(fc.expected) + ' HP and you have ' +
                fmtNum(fc.hp) + '. Descend anyway?',
          yes: 'Descend anyway', danger: true, onYes: go
        });
      } else go();
    }
  }
};

function showFullLog(d) {
  if (!d) return;
  openSheet({
    title: 'The descent',
    body: '<div class="stack-s">' + d.log.map(logLine).join('') + '</div>'
  });
}

        '<div class="row-between tiny muted"><span>Your totals after this</span>' +

/* Echoes from Below (SPEC 14.5): a card the first time the account reaches
   floors 50 to 100, then a pooled line every tenth floor after that. */
function echoIdFor(floor) {
  const E = BALANCE.echoes;
  if (floor < E.firstFloor || floor % E.every !== 0) return null;
  return 'echo_' + floor;
}
function maybeShowEcho(floor) {
  const id = echoIdFor(floor);
  if (!id) return false;
  if (!state.account.codex) state.account.codex = [];
  if (state.account.codex.indexOf(id) >= 0) return false;
  const E = BALANCE.echoes;

  let title, text;
  if (floor <= E.lastCard && typeof ECHOES !== 'undefined' && ECHOES[floor]) {
    title = ECHOES[floor].title;
    text = ECHOES[floor].text;
  } else if (typeof ECHO_POOL !== 'undefined' && ECHO_POOL.length) {
    // Past 100, a line from the pool, chosen by seed so it never changes.
    title = 'Floor ' + fmtNum(floor);
    text = rngFrom('echo:' + floor).pick(ECHO_POOL);
  } else {
    return false;
  }

  state.account.codex.push(id);
  save();
  openSheet({
    title: 'Echoes from Below',
    body: '<div class="stack">' +
            '<h3 class="display" style="font-size:1.4rem;margin:0">' + esc(title) + '</h3>' +
            '<p style="line-height:1.75;background:var(--raised);border-radius:var(--radius);' +
              'padding:14px;max-width:34em">' + esc(text) + '</p>' +
          '</div>',
    foot: '<button class="btn btn-primary btn-block btn-lg" data-act="ok">Continue</button>',
    onAct: function (a) { if (a === 'ok') { closeSheet(); refresh(); } }
  });
  return true;
}

/* Act cards unlock the first time a floor is viewed (SPEC 14.3). */
function maybeShowActCard(floor) {
  const map = { 11: 'act2', 21: 'act3', 31: 'act4' };
  const id = map[floor];
  if (id && STORY_CARDS[id] && state.account.codex.indexOf(id) < 0) {
    showStoryCard(id, function () { refresh(); });
    return;
  }
  maybeShowEcho(floor);
}

/* ============================================================
   RESULTS SHEET - SPEC 7.8
   ============================================================ */
function showPendingResults() {
  if (!pendingResults) return;
  const r = pendingResults;
  pendingResults = null;
  showResults(r);
}

function showResults(r) {
  if (!r) return;
  const title = r.outcome === 'clear' ? 'Floor ' + r.floor + ' cleared'
              : r.outcome === 'death' ? 'You fell'
              : 'Retreated';

  const itemsHtml = r.items.length
    ? '<div class="stack-s">' + r.items.map(function (i) {
        return '<div class="row">' + itemBadge(i) + '<span class="grow">' + itemNameHtml(i) + '</span></div>';
      }).join('') + '</div>'
    : '<p class="muted small" style="margin:0">Nothing worth carrying.</p>';

  // The first unique or set piece found leads the sheet. It stays in the
  // Found list below too, which remains the full record of the descent.
  const showcaseItem = r.items.find(function (i) {
    return i.rarity === 'unique' || i.rarity === 'set';
  });
  const showcaseHtml = showcaseItem
    ? resultsShowcaseHtml(showcaseItem, (r.firstFinds || []).indexOf(showcaseItem.id) >= 0)
    : '';

  let body = showcaseHtml +
    '<div class="row wrap" style="gap:14px;margin-bottom:12px">' +
      '<span class="small num">' + icon('ico-hp') + ' -' + fmtNum(r.hpSpent) + ' HP</span>' +
      '<span class="small num">' + icon('ico-clock') + ' ' + fmtTime(r.timeTaken) + '</span>' +
      '<span class="small num">' + icon('ico-coin') + ' ' + fmtNum(r.gold) + '</span>' +
      '<span class="small num">' + fmtNum(r.xp) + ' XP</span>' +
      (r.starshards ? '<span class="small num">' + icon('ico-star') + ' ' + fmtNum(r.starshards) + '</span>' : '') +
    '</div>';

  if (r.outcome === 'death') {
    body += '<p class="risk risk-deadly" style="margin-bottom:10px">' + icon('ico-deadly') +
      'Fell to ' + esc(r.killedBy || 'the dark') + ' on floor ' + r.floor + '.</p>' +
      '<p class="small muted">Gold and XP from this descent were halved. You are Fallen for ' +
      fmtTime(Math.max(0, r.fallenUntil - now())) + '.</p>';
  }
  if (r.levelUps > 0) {
    body += '<p class="small" style="color:var(--corona)">Level up! ' +
      (r.levelUps > 1 ? r.levelUps + ' levels. ' : '') + 'You have skill points to spend.</p>';
  }
  if (r.skillPoint) body += '<p class="small" style="color:var(--corona)">First kill: +1 skill point.</p>';
  if (r.deepFirstKill) {
    body += '<p class="small" style="color:var(--corona)">First kill of ' +
      esc(GUARDIAN_NAMES[r.deepFirstKill.id] || 'a Deep Guardian') + ': +' +
      fmtNum(r.deepFirstKill.shards) + ' Starshards.</p>';
  }
  if (r.bestiaryNew && r.bestiaryNew.length) {
    body += '<p class="small" style="color:var(--corona)">New in the Bestiary: ' +
      r.bestiaryNew.map(function (id) { return esc(HORRORS[id] ? HORRORS[id].name : id); }).join(', ') + '.</p>';
  }
  if (r.bankedTask && r.bankedTask.amount > 0) {
    const t = taskDef(r.bankedTask.id);
    body += '<p class="small muted">' + esc(t ? t.name : 'The day’s work') + ' ended when you ' +
      'descended: ' + esc(taskAmountText(r.bankedTask.reward, r.bankedTask.amount)) + '.</p>';
  }
  if (r.renown) body += '<p class="small" style="color:var(--corona)">+' + fmtNum(r.renown) + ' Renown.</p>';
  if (r.renownUnlocks && r.renownUnlocks.length) {
    body += r.renownUnlocks.map(function (u) {
      return '<p class="small" style="color:var(--corona)">Renown rank ' + u.rank + ': ' +
        esc(u.unlock.label) + ' unlocked.</p>';
    }).join('');
  }
  if (r.lorePages && r.lorePages.length) {
    body += '<p class="small">Found ' + r.lorePages.length + ' lore page' +
      (r.lorePages.length > 1 ? 's' : '') + ': ' +
      r.lorePages.map(function (id) {
        return esc((typeof LORE_PAGES !== 'undefined' && LORE_PAGES[id]) ? LORE_PAGES[id].title : id);
      }).join(', ') + '.</p>';
  }
  if (r.unlockedFloor) body += '<p class="small">Floor ' + r.unlockedFloor + ' is open.</p>';
  if (r.autoSalvaged && r.autoSalvaged.count) {
    /* Say which of the two reasons it was. Reporting a filtered item as
       one that "did not fit" reads as though the inventory were full. */
    const salvageLine = function (tally, reason) {
      if (!tally || !tally.count) return '';
      const many = tally.count > 1;
      return '<p class="small muted">' + fmtNum(tally.count) + ' item' + (many ? 's' : '') +
        ' ' + reason(many) + ' and ' + (many ? 'were' : 'was') + ' salvaged for ' +
        '<span class="num">' + fmtNum(tally.ash) + '</span> Ash' +
        (tally.shards ? ' and <span class="num">' + fmtNum(tally.shards) + '</span> Starshard' +
          (tally.shards > 1 ? 's' : '') : '') +
        '.</p>';
    };
    const lines =
      salvageLine(r.autoSalvaged.filtered, function (many) {
        return 'matched your salvage filter' + (many ? 's' : '');
      }) +
      salvageLine(r.autoSalvaged.full, function (many) {
        return 'did not fit in your inventory';
      });
    // A descent that began before the breakdown existed has only the total.
    body += lines || ('<p class="small muted">' + fmtNum(r.autoSalvaged.count) + ' item' +
      (r.autoSalvaged.count > 1 ? 's were' : ' was') + ' salvaged on the spot for ' +
      '<span class="num">' + fmtNum(r.autoSalvaged.ash) + '</span> Ash.</p>');
  }

  body += '<div class="section-title">Found</div>' + itemsHtml;

  openSheet({
    title: title,
    body: body,
    foot: '<button class="btn btn-primary btn-block btn-lg" data-act="ok">Continue</button>',
    onAct: function (a) {
      if (a !== 'ok') return;
      closeSheet();
      if (r.storyCard) showStoryCard(r.storyCard, function () { refresh(); });
      else refresh();
    }
  });
}

/* ============================================================
   WHILE YOU WERE AWAY - SPEC 19.1
   ============================================================ */
function showAway(facts) {
  const lines = [];
  if (facts.results) {
    const r = facts.results;
    lines.push(r.outcome === 'clear' ? 'You cleared floor ' + r.floor + '.'
             : r.outcome === 'death' ? 'You fell on floor ' + r.floor + '.'
             : 'Your descent on floor ' + r.floor + ' ended.');
    // Lore pages are easy to miss in a results list, so call them out here too.
    if (r.lorePages && r.lorePages.length) {
      const titles = r.lorePages.map(function (id) {
        return (typeof LORE_PAGES !== 'undefined' && LORE_PAGES[id]) ? LORE_PAGES[id].title : id;
      });
      lines.push('You found ' + (titles.length > 1 ? titles.length + ' lore pages: ' : 'a lore page: ') +
        titles.join(', ') + '.');
    }
  }
  if (facts.hpGained > 0) lines.push('You recovered ' + fmtNum(facts.hpGained) + ' HP.');
  if (facts.fallenEnded) lines.push('You are no longer Fallen.');
  if (facts.restocked) lines.push('The Market restocked.');
  if (!lines.length) lines.push('Nothing stirred while you were gone.');

  // The haul by rarity, best item named first.
  const itemsSummary = (facts.results && facts.results.items && facts.results.items.length)
    ? awayItemsSummaryHtml(facts.results.items)
    : '';

  openSheet({
    title: 'While you were away',
    body: '<p class="small muted">Away for ' + fmtTime(facts.away) + '.</p>' +
          '<div class="stack-s">' + lines.map(function (l) {
            return '<p class="small" style="margin:0">' + esc(l) + '</p>';
          }).join('') + '</div>' + itemsSummary,
    foot: '<button class="btn btn-primary btn-block btn-lg" data-act="ok">Continue</button>',
    onAct: function (a) {
      if (a !== 'ok') return;
      closeSheet();
      if (facts.results) showResults(facts.results);
    }
  });
}

/* ============================================================

   ============================================================ */
function heroRender() {
  const hero = state && state.hero;
  if (!hero) {
    return '<div class="card"><p class="muted small">No hero yet.</p></div>';
  }
  let html = heroHeader(hero) + heroSegControl();
  if (heroTab === 'stats') html += heroRenderStats(hero);
  else if (heroTab === 'skills') html += heroRenderSkills(hero);
  else html += heroRenderGear(hero);
  return html;
}

/* The status strip already carries the hero's name, level and title, so this
   header shows what the strip does not: their class, and the sigil frame
   their Mastery achievements have earned (SPEC 18.3). */
function heroHeader(hero) {
  const frame = bestFrame();
  const ring = frame
    ? 'border:2px solid ' + FRAME_COLOURS[frame] + ';border-radius:50%;padding:4px;'
    : 'padding:4px;';
  return '<div class="row" style="gap:10px;margin-bottom:14px">' +
    '<span style="' + ring + 'display:inline-flex">' +
      '<svg class="ico" style="width:26px;height:26px" aria-hidden="true">' +
        '<use href="#sig-' + esc(hero.classId) + '"></use>' +

      '<div style="font-weight:600">' + esc(heroClassName(hero.classId)) + '</div>' +

        'Floor ' + fmtNum(hero.deepest) + ' reached</div>' +

function heroSegControl() {
  const segs = [['gear', 'Gear'], ['stats', 'Stats'], ['skills', 'Skills']];

/* ============================================================
   GEAR - SPEC 11.3, 11.7, 11.8, 11.9
