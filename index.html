/* ============================================================
   THE FORGE - Craft and Rekindle, SPEC 13.2 (Renown rank 14)
   ============================================================ */

/* The Craft section: one row per equipment slot, each with its
   own Craft button, since the cost is the same regardless of
   which slot is chosen (craftCost does not take a slot). */
function town3CraftSection(hero) {
  let out = '<div class="section-title">Craft</div>';
  if (!hasUnlock('craft')) {
    out += '<p class="small muted">Opens at Renown rank ' + town2UnlockRank('craft') + '.</p>';
    return out;
  }
  const c = craftCost(hero);
  const afford = hero.gold >= c.gold && hero.ash >= c.ash && hero.starshards >= c.shards;
  out += '<p class="tiny muted">Crafts a magic or rare item, for a slot you choose, at your deepest ' +
    'floor’s item level. Uniques and sets can’t be crafted.</p>';
  out += '<p class="small muted">Cost: ' + fmtNum(c.gold) + ' gold, ' + fmtNum(c.ash) + ' Ash, ' +
    fmtNum(c.shards) + ' Starshards' + (afford ? '' : ' — not enough to craft') + '.</p>';
  out += '<div class="stack-s">';
  BALANCE.items.slots.forEach(function (slot) {
    out += '<div class="row-between panel">' +
      '<span class="small">' + esc(heroSlotLabel[slot] || slot) + '</span>' +
      '<button class="btn btn-sm' + (afford ? ' btn-primary' : '') + '" data-act="craft" data-slot="' + slot + '"' +
        (afford ? '' : ' disabled') + '>Craft</button>' +
    '</div>';
  });
  out += '</div>';
  return out;
}

/* The Rekindle section: every owned item (equipped or in the bag,
   heirlooms included - they are never filtered out) whose level is
   below the hero's deepest floor. */
function town3RekindleCandidates(hero) {
  const owned = [];
  for (const slot in hero.equipment) { if (hero.equipment[slot]) owned.push(hero.equipment[slot]); }
  hero.inventory.forEach(function (i) { owned.push(i); });
  return owned.filter(function (i) { return i.ilvl < hero.deepest; });
}

function town3RekindleSection(hero) {
  let out = '<div class="section-title">Rekindle</div>';
  if (!hasUnlock('craft')) {
    out += '<p class="small muted">Opens at Renown rank ' + town2UnlockRank('craft') + '.</p>';
    return out;
  }
  out += '<p class="tiny muted">Raises an item’s level to your deepest floor.</p>';
  const candidates = town3RekindleCandidates(hero);
  if (!candidates.length) {
    out += '<p class="small muted">Nothing below your deepest floor’s item level.</p>';
    return out;
  }
  out += '<div class="stack-s">';
  candidates.forEach(function (item) {
    const gate = canRekindle(hero, item);
    const equippedTag = townIsEquipped(hero, item) ? ' <span class="tiny muted">(equipped)</span>' : '';
    out += '<div class="row-between panel" style="' + town2RarityBorderStyle(item) + '">' +
      '<button type="button" class="row grow" data-act="detail" data-id="' + esc(item.id) + '" style="gap:8px;min-height:44px;text-align:left">' +
        townBadge(item) + town2ChainIcon(item) +
        '<div>' + town2ItemLabel(item) +
          '<div class="tiny muted">ilvl ' + fmtNum(item.ilvl) + ' → ' + fmtNum(hero.deepest) + equippedTag + '</div>' +
        '</div>' +
      '</button>';
    if (!gate.ok) {
      out += '<span class="tiny muted" style="max-width:120px;text-align:right">' + esc(gate.reason) + '</span>';
    } else {
      const cost = rekindleCost(hero, item);
      const afford = hero.gold >= cost.gold && hero.starshards >= cost.shards;
      out += '<button class="btn btn-sm' + (afford ? ' btn-primary' : '') + '" data-act="rekindle" data-id="' + esc(item.id) + '"' +
        (afford ? '' : ' disabled') + '>' +
        fmtNum(cost.shards) + ' Sh, ' + fmtNum(cost.gold) + 'g' +
      '</button>';
    }
    out += '</div>';
  });
  out += '</div>';
  return out;
}

/* Redeclares the Phase 2 townRenderForge: Salvage and Temper are
   unchanged, Reforge and Auto-salvage are unchanged, Craft and
   Rekindle are new below them. Every part now sits under its own
   section-title so the growing Forge stays scannable at 360px. */
function townRenderForge(hero) {
  let out = townHeader('The Forge', 'forge') +
    townCurrencyRow(hero, { ash: true, shards: true, sticky: true });

  // ---- Salvage ----
  out += '<div class="section-title">Salvage</div>';
  const salvageable = hero.inventory.filter(function (i) { return !i.locked; });
  if (!salvageable.length) {
    out += '<p class="small muted">Nothing unlocked to salvage.</p>';
  } else {
    out += '<div class="stack-s">';
    salvageable.forEach(function (item) {
      const y = heroSalvageYield(hero, item);
      out += '<div class="row-between panel" style="' + town2RarityBorderStyle(item) + '">' +
        '<button type="button" class="row grow" data-act="detail" data-id="' + esc(item.id) + '" style="gap:8px;min-height:44px;text-align:left">' +
          townBadge(item) + town2ChainIcon(item) +
          '<div>' + town2ItemLabel(item) + '</div>' +
        '</button>' +
        '<button class="btn btn-sm" data-act="salvage" data-id="' + esc(item.id) + '">' +
          fmtNum(y.ash) + ' Ash' + (y.shards ? ', ' + fmtNum(y.shards) + ' Starshards' : '') +
        '</button>' +
      '</div>';
    });
    out += '</div>';

    out += '<div class="stack-s" style="margin-top:10px">';
    ['common', 'magic', 'rare'].forEach(function (r) {
      out += '<button class="btn btn-sm btn-block" data-act="bulk" data-rarity="' + r + '">' +
        'Salvage all unlocked ' + RARITIES[r].name.toLowerCase() + ' and below' +
      '</button>';
    });
    out += '</div>';
  }

  // ---- Temper ----
  out += '<div class="section-title">Temper</div>' +
    '<p class="tiny muted">Each level adds 8% to base stats, up to +' + BALANCE.items.temperMax + '.</p>';
  const owned = [];
  for (const slot in hero.equipment) { if (hero.equipment[slot]) owned.push(hero.equipment[slot]); }
  hero.inventory.forEach(function (i) { owned.push(i); });
  if (!owned.length) {
    out += '<p class="small muted">No items to temper.</p>';
  } else {
    out += '<div class="stack-s">';
    owned.forEach(function (item) {
      const c = temperCost(item);
      const equippedTag = townIsEquipped(hero, item) ? ' <span class="tiny muted">(equipped)</span>' : '';
      out += '<div class="row-between panel" style="' + town2RarityBorderStyle(item) + '">' +
        '<button type="button" class="row grow" data-act="detail" data-id="' + esc(item.id) + '" style="gap:8px;min-height:44px;text-align:left">' +
          townBadge(item) + town2ChainIcon(item) +
          '<div>' + town2ItemLabel(item) + '<div class="tiny muted">+' + (item.temper || 0) + equippedTag + '</div></div>' +
        '</button>';
      if (!c) {
        out += '<span class="small muted">+' + BALANCE.items.temperMax + ', maximum</span>';
      } else {
        const afford = hero.gold >= c.gold && hero.ash >= c.ash && hero.starshards >= c.shards;
        out += '<button class="btn btn-sm" data-act="temper" data-id="' + esc(item.id) + '"' +
          (afford ? '' : ' disabled') + '>' +
          '+' + c.to + ': ' + fmtNum(c.gold) + 'g' +
          (c.ash ? ', ' + fmtNum(c.ash) + ' Ash' : '') +
          (c.shards ? ', ' + fmtNum(c.shards) + ' Starshards' : '') +
        '</button>';
      }
      out += '</div>';
    });
    out += '</div>';
  }

  // ---- Reforge (Renown rank 7) ----
  out += '<div class="section-title">Reforge</div>';
  if (!hasUnlock('reforge')) {
    out += '<p class="small muted">Opens at Renown rank ' + town2UnlockRank('reforge') + '.</p>';
  } else {
    const candidates = owned.filter(function (i) { return canReforge(i).ok; });
    if (!candidates.length) {
      out += '<p class="small muted">No magic or rare items to reforge.</p>';
    } else {
      out += '<p class="tiny muted">Replaces one affix with a new one. The cost doubles each time that item is reforged.</p>';
      out += '<div class="stack-s">';
      candidates.forEach(function (item) {
        const c = reforgeCost(item);
        const equippedTag = townIsEquipped(hero, item) ? ' <span class="tiny muted">(equipped)</span>' : '';
        out += '<button type="button" class="row-between panel card-tap" data-act="reforgeOpen" data-id="' + esc(item.id) + '" style="min-height:44px;width:100%;' + town2RarityBorderStyle(item) + '">' +
          '<span class="row" style="gap:8px">' +
            townBadge(item) +
            '<span>' + town2ItemLabel(item) + equippedTag + '</span>' +
          '</span>' +
          '<span class="small">' + fmtNum(c.gold) + 'g, ' + fmtNum(c.ash) + ' Ash</span>' +
        '</button>';
      });
      out += '</div>';
    }
  }

  // ---- Auto-salvage (Renown rank 3) ----
  out += '<div class="section-title">Auto-salvage</div>';
  if (!hasUnlock('autosalvage')) {
    out += '<p class="small muted">Opens at Renown rank ' + town2UnlockRank('autosalvage') + '.</p>';
  } else {
    out += '<p class="tiny muted">Uniques and sets are never auto-salvaged.</p>';
    const AS = (state.settings && state.settings.autoSalvage) || { common: false, magic: false, rare: false };
    out += '<div class="stack-s">';
    ['common', 'magic', 'rare'].forEach(function (r) {
      const on = !!AS[r];
      out += '<button type="button" class="row-between panel card-tap" data-act="autosalvage" data-rarity="' + r + '" style="min-height:44px;width:100%">' +
        '<span class="row" style="gap:8px">' + townBadge({ rarity: r }) + '<span>Auto-salvage ' + esc(RARITIES[r].name.toLowerCase()) + '</span></span>' +
        '<span class="small">' + (on ? 'On' : 'Off') + '</span>' +
      '</button>';
    });
    out += '</div>';
  }

  // ---- Craft (Renown rank 14) ----
  out += town3CraftSection(hero);

  // ---- Rekindle (Renown rank 14) ----
  out += town3RekindleSection(hero);

  return out;
}

/* One tappable tile per champion plaque: class sigil, name and

    '<span class="tiny" style="max-width:76px;overflow:hidden;' +
    'text-overflow:ellipsis;white-space:nowrap">' + esc(p.name) + '</span>' +
    '<span class="tiny muted">Asc. ' + fmtNum(p.ascension) + '</span>' +
  '</button>';
}

/* Empty string (not an empty frame) below rank 20 or with no
   champions yet, per spec. */
function town3RenderStatues() {
  if (!hasUnlock('statues')) return '';
  const champs = (state.account && state.account.champions) || [];
  if (!champs.length) return '';
  return '<div class="section-title">Town square</div>' +
    '<div class="row wrap" style="gap:10px">' +
      champs.map(function (p, idx) { return town3StatueTile(p, idx); }).join('') +
    '</div>';
}

/* Read-only plaque detail: sigil, name/title, class, Ascension,
   deepest floor, and the hero's final snapshot. */
function town3PlaqueBody(p) {
  let out = '<div class="row" style="gap:10px">' +
    '<svg class="ico" style="width:32px;height:32px" aria-hidden="true"><use href="#sig-' + esc(p.classId) + '"></use></svg>' +
    '<div class="grow">' +
      '<div style="font-weight:600">' + esc(p.name) + (p.title ? ' ' + esc(p.title) : '') + '</div>' +
      '<div class="tiny muted">' + esc(heroClassName(p.classId)) + ' · Ascension ' + fmtNum(p.ascension) + '</div>' +
    '</div>' +
  '</div>';
  out += '<div class="divider" style="margin:12px 0"></div>';
  out += '<div class="stack-s small">' +
    '<div>Deepest floor: ' + fmtNum(p.deepest) + '</div>' +
    '<div>Level: ' + fmtNum(p.level) + '</div>' +
    '<div>Days served: ' + fmtNum(p.daysServed) + '</div>' +
    '<div>Descents: ' + fmtNum(p.descents) + '</div>' +
    '<div>Times fallen: ' + fmtNum(p.deaths) + '</div>' +
  '</div>';
  if (p.equipment) {
    const rows = [];
    for (const slot in p.equipment) {
      const item = p.equipment[slot];
      if (!item) continue;
      rows.push('<div class="row panel" style="gap:8px">' + townBadge(item) + town2ChainIcon(item) +
        '<div>' + town2ItemLabel(item) + '</div></div>');
    }
    if (rows.length) {
      out += '<div class="section-title">Gear</div><div class="stack-s">' + rows.join('') + '</div>';
    }
  }
  if (p.epitaph) {
    out += '<p class="small muted" style="margin-top:12px;font-style:italic">' + esc(p.epitaph) + '</p>';
  }
  return out;
}

function town3OpenPlaque(p) {
  openSheet({
    title: esc(p.name),
    body: town3PlaqueBody(p),
    foot: '<button class="btn btn-block" data-act="close">Close</button>',
    onAct: function (a) { if (a === 'close') closeSheet(); }
  });
}

/* Redeclares the Phase 2 townRenderHub to add the statues strip
   under the place tiles (it renders nothing when there is nothing
   to show, so the hub is unchanged below rank 20 or with no
   champions yet). */
function townRenderHub(hero) {
  return '<div class="stack">' +
    townTile('chapel', 'The Last Chapel', townChapelStatus(hero), 'ico-chapel') +
    townTile('forge', 'The Forge', townForgeStatus(hero), 'ico-salvage') +
    townTile('market', 'The Market', townMarketStatus(hero), 'ico-market', hero.market.restockAt) +
    town2RenderHubTile(hero) +
  '</div>' + town3RenderStatues();
}

/* ============================================================
   THE VIEW
   ============================================================ */

VIEWS.town = {
  render: function () {
    const hero = state && state.hero;
    if (!hero) {
      return '<div class="card"><p class="muted small">No hero yet.</p></div>';
    }
    if (townPlace === 'chapel') return townRenderChapel(hero);
    if (townPlace === 'forge') return townRenderForge(hero);
    if (townPlace === 'market') return townRenderMarket(hero);
    if (townPlace === 'bounty') return town2RenderBounty(hero);
    return townRenderHub(hero);
  },

  tick: function () {
    const host = el('view');
    if (!host) return;
    const nodes = host.querySelectorAll('[data-town-cd]');
    nodes.forEach(function (n) {
      const target = parseInt(n.getAttribute('data-town-cd'), 10) || 0;
      const tmpl = n.getAttribute('data-town-cd-tmpl');
      const left = Math.max(0, target - now());
      let prefix = 'Restocks in ';
      if (tmpl === 'fallen') prefix = 'Time left: ';
      else if (tmpl === 'bounty') prefix = 'New contracts in ';
      else if (tmpl === 'blackmarket') prefix = 'Expires in ';
      else if (tmpl === 'offering') prefix = 'Ends in ';
      n.textContent = prefix + fmtTime(left);
    });
  },

  onAct: function (act, node) {
    const hero = state && state.hero;
    if (!hero) return;

    if (act === 'open') { townPlace = node.dataset.place; townMarketTab = 'buy'; refresh(); return; }
    if (act === 'back') { townPlace = null; refresh(); return; }

    if (act === 'statue') {
      const idx = parseInt(node.dataset.idx, 10);
      const p = ((state.account && state.account.champions) || [])[idx];
      if (!p) return;
      town3OpenPlaque(p);
      return;
    }

    if (act === 'heal') {
      const r = healHero(hero, parseFloat(node.dataset.frac));
      if (!r.ok) toast(r.reason); else toast('Healed ' + fmtNum(r.restored) + ' HP.');
      refresh();
      return;
    }

    if (act === 'revive') {
      const r = reviveHero(hero);
      if (!r.ok) toast(r.reason); else toast('Revived.');
      refresh();
      return;
    }

    if (act === 'respec') {
      const cost = respecCost(hero);
      confirmSheet({
        title: 'Respec your skills?',
        body: 'This refunds every skill point and empties your rite slots.' +
          (cost > 0 ? ' It costs ' + fmtNum(cost) + ' gold.' : ' It is free below level ' + BALANCE.tree.respecFreeBelowLevel + '.'),
        yes: 'Respec',
        danger: true,
        onYes: function () {
          const r = respec(hero);
          if (!r.ok) toast(r.reason); else toast('Skills reset.');
          refresh();
        }
      });
      return;
    }

    if (act === 'salvage') {
      const item = townFindInvItem(hero, node.dataset.id);
      if (!item) return;
      const r = salvageItem(hero, item);
      if (!r.ok) toast(r.reason);
      else toast('Salvaged for ' + fmtNum(r.yield.ash) + ' Ash' + (r.yield.shards ? ' and ' + fmtNum(r.yield.shards) + ' Starshards' : '') + '.');
      refresh();
      return;
    }

    if (act === 'bulk') {
      const rarity = node.dataset.rarity;
      const p = bulkSalvagePreview(hero, rarity);
      if (p.count <= 0) { toast('Nothing to salvage.'); return; }
      confirmSheet({
        title: 'Salvage ' + fmtNum(p.count) + ' item' + (p.count === 1 ? '' : 's') + '?',
        body: 'Yields ' + fmtNum(p.ash) + ' Ash' + (p.shards ? ' and ' + fmtNum(p.shards) + ' Starshards' : '') + '.',
        yes: 'Salvage',
        danger: true,
        onYes: function () {
          bulkSalvage(hero, rarity);
          refresh();
          toast('Salvaged.');
        }
      });
      return;
    }

    if (act === 'temper') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const r = temperItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Tempered to +' + r.to + '.');
      refresh();
      return;
    }

    if (act === 'detail') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      town2OpenItemDetail(hero, item);
      return;
    }

    if (act === 'reforgeOpen') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const gate = canReforge(item);
      if (!gate.ok) { toast(gate.reason); return; }
      const cost = reforgeCost(item);
      const afford = hero.gold >= cost.gold && hero.ash >= cost.ash;
      openSheet({
        title: 'Reforge',
        body:
          '<div class="stack-s">' +
            '<div class="row" style="gap:8px">' + townBadge(item) + town2ChainIcon(item) + '<div>' + town2ItemLabel(item) + '</div></div>' +
            '<p class="small muted">Pick one affix to replace. Costs ' + fmtNum(cost.gold) + ' gold and ' + fmtNum(cost.ash) + ' Ash' +
              (afford ? '.' : ' — not enough to reforge.') +
            '</p>' +
            '<div class="stack-s">' +
              item.affixes.map(function (a, i) {
                return '<button type="button" class="row-between panel card-tap" data-act="reforgePick" data-idx="' + i + '"' +
                  (afford ? '' : ' disabled') + ' style="min-height:44px;width:100%">' +
                  '<span class="small">' + esc(town2AffixText(a)) + '</span>' +
                  '<span class="tiny muted">Replace</span>' +
                '</button>';
              }).join('') +
            '</div>' +
          '</div>',
        foot: '<button class="btn btn-block" data-act="close">Cancel</button>',
        onAct: function (a, n) {
          if (a === 'close') { closeSheet(); return; }
          if (a === 'reforgePick') {
            const idx = parseInt(n.dataset.idx, 10);
            const r = reforgeAffix(hero, item, idx);
            if (!r.ok) { toast(r.reason); return; }
            toast('Reforged: ' + town2AffixText(r.from) + ' → ' + town2AffixText(r.to));
            closeSheet();
            refresh();
          }
        }
      });
      return;
    }

    if (act === 'autosalvage') {
      if (!state.settings) state.settings = {};
      if (!state.settings.autoSalvage) state.settings.autoSalvage = { common: false, magic: false, rare: false };
      const r = node.dataset.rarity;
      state.settings.autoSalvage[r] = !state.settings.autoSalvage[r];
      save();
      refresh();
      return;
    }

    if (act === 'craft') {
      const slot = node.dataset.slot;
      const r = craftItem(hero, slot);
      if (!r.ok) { toast(r.reason); return; }
      toast('Crafted ' + (town2ItemName(r.item) || r.item.baseType) + '.');
      refresh();
      town2OpenItemDetail(hero, r.item);
      return;
    }

    if (act === 'rekindle') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const r = rekindleItem(hero, item);
      if (!r.ok) { toast(r.reason); return; }
      toast('Rekindled to ilvl ' + fmtNum(r.to) + '.');
      refresh();
      return;
    }

    if (act === 'markettab') { townMarketTab = node.dataset.tab; refresh(); return; }

    if (act === 'buy') {
      const item = (hero.market.stock || []).find(function (i) { return i.id === node.dataset.id; });
      if (!item) return;
      const r = buyItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Bought ' + (town2ItemName(item) || item.baseType) + '.');
      refresh();
      return;
    }

    if (act === 'sell') {
      const item = townFindInvItem(hero, node.dataset.id);
      if (!item) return;
      const r = sellItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Sold for ' + fmtNum(r.gold) + ' gold.');
      refresh();
      return;
    }

    if (act === 'buySupply') {
      const id = node.dataset.id;
      const r = buySupply(hero, id);
      if (!r.ok) toast(r.reason); else toast('Bought ' + BALANCE.town.supplies[id].name + '.');
      refresh();
      return;
    }

    if (act === 'earlyRestock') {
      const r = buyEarlyRestock(hero);
      if (!r.ok) toast(r.reason); else toast('The Market restocked.');
      refresh();
      return;
    }

    if (act === 'buyBlackMarket') {
      const bm = hero.market.blackMarket;
      const boughtItem = bm && bm.item;
      const r = buyBlackMarket(hero);
      if (!r.ok) { toast(r.reason); return; }
      toast('Bought ' + (boughtItem ? (town2ItemName(boughtItem) || boughtItem.baseType) : 'the item') + '.');
      refresh();
      return;
    }

    if (act === 'claimContract') {
      const idx = parseInt(node.dataset.idx, 10);
      const r = claimContract(hero, idx);
      if (!r.ok) { toast(r.reason); return; }
      let msg = 'Contract complete: ' + fmtNum(r.gold) + ' gold, ' + fmtNum(r.starshards) + ' Starshard' + (r.starshards === 1 ? '' : 's');
      if (r.renown && r.renown.amount) msg += ', ' + fmtNum(r.renown.amount) + ' Renown';
      toast(msg);
      refresh();
      return;
    }
  }
};

/* ============================================================
   NEW HELPERS (hero2 prefix)
   ============================================================ */

/* Change 2: a relic has no meaningful Power, so instead of
   powerArrow(powerDelta(...)) it compares its own primary stat
   (Haste, Fortune or Recovery) against whatever relic is
   equipped now. Formatted exactly like powerArrow so the colour
   and arrow language stay consistent across the whole list. */
function hero2RelicDelta(hero, item) {
  const equipped = hero.equipment.relic;
  const statKey = item.relicStat || (equipped && equipped.relicStat);
  const label = statKey ? (heroStatLabel[statKey] || statKey) : 'stats';
  if (!statKey) return '<span class="muted small">No change to ' + esc(label) + '</span>';
  const curSt = equipped ? itemStats(equipped) : null;
  const newSt = itemStats(item);
  const curV = curSt ? (curSt[statKey] || 0) : 0;
  const newV = newSt[statKey] || 0;
  const diff = newV - curV;
  if (Math.abs(diff) < 0.05) return '<span class="muted small">No change to ' + esc(label) + '</span>';
  const up = diff >= 0;
  return '<span class="num small" style="color:var(--' + (up ? 'corona' : 'blood-light') + ')">' +
    (up ? '▲ ' : '▼ ') + fmtPct(Math.abs(diff)) + ' ' + esc(label) + '</span>';
}

/* Change 6: one compact, tappable stat cell. Value formatting
   matches the old per-row list exactly (Power/Might/Guard/Max HP
   as whole numbers, everything else as a percentage). */
function hero2StatTile(key, raw) {
  const display = (key === 'power' || heroIsCore(key)) ? fmtNum(Math.round(raw)) : fmtPct(raw);
  return '<button class="card card-tap" data-act="stat" data-stat="' + key + '" style="padding:10px 12px">' +
    '<div class="tiny muted">' + esc(heroStatLabel[key]) + '</div>' +
    '<div class="num" style="font-weight:600;margin-top:2px">' + display + '</div>' +
  '</button>';
}

/* Change 5: Sell and Salvage are destructive, so both are
   confirmed first, naming the item and what they yield. */
function hero2ConfirmSell(hero, item) {
  const price = sellPrice(hero, item);
  confirmSheet({
    title: 'Sell item',
    body: 'Sell ' + esc(item.name) + ' for ' + fmtNum(price) + ' gold?',
    yes: 'Sell',
    danger: true,
    onYes: function () {
      const res = sellItem(hero, item);
      if (!res.ok) { toast(res.reason); return; }
      toast('Sold for ' + fmtNum(res.gold) + ' gold.');
      refresh();
    }
  });
}

function hero2ConfirmSalvage(hero, item) {
  const y = heroSalvageYield(hero, item);
  confirmSheet({
    title: 'Salvage item',
    body: 'Salvage ' + esc(item.name) + ' for ' + fmtNum(y.ash) + ' Ash' +
      (y.shards ? ' and ' + fmtNum(y.shards) + ' Starshards' : '') + '?',
    yes: 'Salvage',
    danger: true,
    onYes: function () {
      const res = salvageItem(hero, item);
      if (!res.ok) { toast(res.reason); return; }
      toast('Salvaged for ' + fmtNum(res.yield.ash) + ' Ash' +
        (res.yield.shards ? ' and ' + fmtNum(res.yield.shards) + ' Starshards' : '') + '.');
      refresh();
    }
  });
}

/* ============================================================
   GEAR - redeclared: slot icons everywhere (change 1), no letter
   badge on cards but a distinct rarity border kept (change 3),
   inventory as a single-column list of bigger cards with Power
   comparison and quick Sell/Salvage (changes 2, 4, 5).
   ============================================================ */
function heroRenderGear(hero) {
  let html = '<div class="section-title">Equipped</div>';
  html += '<div class="stack-s">' +
    BALANCE.items.slots.map(function (slot) { return heroEquipRow(hero, slot); }).join('') +
  '</div>';

  const cap = inventoryCap(hero);
  const free = inventoryFree(hero);
  const used = cap - free;

  html += '<div class="row-between" style="margin-top:20px">' +
    '<span class="section-title" style="margin:0">Inventory</span>' +
    '<span class="small muted num">' + fmtNum(used) + ' / ' + fmtNum(cap) + ' slots</span>' +
  '</div>';

  html += heroSortRow();

  const order = heroSortedIndices(hero);
  if (!order.length) {
    html += '<p class="small muted">No items yet.</p>';
  } else {
    html += '<div class="stack-s">' +
      order.map(function (idx) { return heroInvTile(hero, idx); }).join('') +
    '</div>';
  }
  return html;
}

/* Change 1 + 3: the slot icon replaces nothing that was there
   before (Phase 1 had no icon here at all); the rarity border
   replaces the old letter badge as the non-colour rarity signal. */
function heroEquipRow(hero, slot) {
  const item = hero.equipment[slot];
  const slotIco = '<span style="flex:0 0 auto;color:var(--ash)">' + icon('ico-slot-' + slot) + '</span>';
  if (!item) {
    return '<div class="card row-between">' +
      '<span class="row" style="gap:10px">' + slotIco +
        '<span class="small">' + heroSlotLabel[slot] + '</span>' +
      '</span>' +
      '<span class="small" style="color:var(--ash)">Empty</span>' +
    '</div>';
  }
  const r = RARITIES[item.rarity];
  return '<button class="card card-tap row-between" data-act="item" data-item="equip:' + slot + '" style="' +
    'border:' + r.border + ' var(--r-' + item.rarity + ')">' +
    '<span class="row" style="gap:10px;min-width:0">' +
      slotIco +
      (r.chain ? '<span style="color:var(--r-' + item.rarity + ');flex:0 0 auto">' + heroIco('ico-chain', 14) + '</span>' : '') +
      '<span class="small rar-' + item.rarity + '" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600">' +
        esc(item.name) +
      '</span>' +
    '</span>' +
    '<span class="row" style="gap:6px;flex:0 0 auto">' +
      (item.locked ? heroIco('ico-lock', 16) : '') +
      '<span class="tiny muted">' + heroSlotLabel[slot] + '</span>' +
    '</span>' +
  '</button>';
}

/* A short coloured comparison badge for a one-line card: how this item
   changes Power against whatever occupies its slot. Relics have no
   meaningful Power, so they compare their own primary stat instead.
   The full figures live in the item sheet. */
function hero2CompareBadge(hero, item) {
  let delta;
  if (item.slot === 'relic') {
    const worn = hero.equipment.relic;
    const statOf = function (it) {
      if (!it || it.slot !== 'relic') return 0;
      const s = itemStats(it);
      return s[it.relicStat] || 0;
    };
    const mine = statOf(item);
    const theirs = statOf(worn);
    delta = theirs > 0 ? ((mine - theirs) / theirs) * 100 : (mine > 0 ? 100 : 0);
    if (!worn) delta = mine > 0 ? 100 : 0;
  } else {
    delta = heroPowerDeltaSafe(hero, item);
  }
  if (!isFinite(delta)) return '';
  if (Math.abs(delta) < 0.5) return '<span class="tiny muted num">&mdash;</span>';
  const up = delta >= 0;
  return '<span class="tiny num" style="color:var(--' + (up ? 'corona' : 'blood-light') + ')">' +
    (up ? '▲ ' : '▼ ') + fmtPct(Math.abs(delta)) + '</span>';
}

/* One line per item, the same height as an equipped slot row: the slot
   icon, the item's name, its slot, and how it compares. Everything else
   about the item is in its sheet, which this opens. */
function heroInvTile(hero, idx) {
  const item = hero.inventory[idx];
  const r = RARITIES[item.rarity];
  const loc = 'inv:' + idx;

  let marks = '';
  if (item.isNew) {
    marks += '<span aria-hidden="true" style="width:8px;height:8px;border-radius:50%;' +
      'background:var(--corona);flex:0 0 auto"></span>';
  }
  if (r.chain) {
    marks += '<span style="color:var(--r-' + item.rarity + ');flex:0 0 auto">' +
      heroIco('ico-chain', 14) + '</span>';
  }
  if (item.locked) {
    marks += '<span style="color:var(--ash);flex:0 0 auto">' + heroIco('ico-lock', 14) + '</span>';
  }

  return '<button class="card card-tap row-between" data-act="item" data-item="' + loc + '" style="' +
      'border:' + r.border + ' var(--r-' + item.rarity + ')">' +
    '<span class="row" style="gap:10px;min-width:0">' +
      '<span style="flex:0 0 auto;color:var(--ash)">' + icon('ico-slot-' + item.slot) + '</span>' +
      '<span class="small rar-' + item.rarity + '" style="overflow:hidden;text-overflow:ellipsis;' +
        'white-space:nowrap;font-weight:600">' + esc(item.name) + '</span>' +
      marks +
    '</span>' +
    '<span class="row" style="gap:8px;flex:0 0 auto">' +
      hero2CompareBadge(hero, item) +
      '<span class="tiny muted">' + heroSlotLabel[item.slot] + '</span>' +
    '</span>' +
  '</button>';
}

/* Item detail sheet - keeps the letter badge (change 3 exempts
   the sheet), adds the unique power/lore and set worn-count and
   bonuses (Phase 2/3 content the Phase 1 sheet never had). */
function heroOpenItemSheet(hero, item, loc) {
  if (item.isNew) { item.isNew = false; save(); refresh(); }
  const isThisEquipped = hero.equipment[item.slot] === item;
  const r = RARITIES[item.rarity];

  let body = '<div class="stack">';
  body += '<div class="row" style="gap:8px">' +
    itemBadge(item) +
    (r.chain ? heroIco('ico-chain', 16) : '') +
    '<div class="grow">' + itemNameHtml(item) + '</div>' +
  '</div>';
  body += '<div class="small muted">Item level ' + fmtNum(item.ilvl) + '</div>';

  const statLines = heroItemStatLines(itemStats(item));
  if (statLines.length) {
    body += '<div class="divider"></div><div class="stack-s">' +
      statLines.map(function (l) {
        return '<div class="row-between small"><span>' + esc(l.label) + '</span><span class="num">' + l.value + '</span></div>';
      }).join('') +
    '</div>';
  }

  if (item.affixes && item.affixes.length) {
    body += '<div class="divider"></div><div class="stack-s">' +
      item.affixes.map(function (a) {
        const def = AFFIXES[a.id];
        const text = def ? def.text.replace('X', fmtNum(a.value)) : a.id;
        return '<div class="small">' + esc(text) + '</div>';
      }).join('') +
    '</div>';
  }

  if (item.rarity === 'unique' && item.uniqueId && UNIQUES[item.uniqueId]) {
    const u = UNIQUES[item.uniqueId];
    body += '<div class="divider"></div>';
    body += '<div class="small">' + esc(u.power.text) + '</div>';
    body += '<div class="small" style="font-style:italic;color:var(--ash);margin-top:6px">' + esc(u.lore) + '</div>';
  }

  if (item.rarity === 'set' && item.setId && SETS[item.setId]) {
    const s = SETS[item.setId];
    const counts = equippedSetCounts(hero);
    const worn = counts[item.setId] || 0;
    const has2 = heroHasSetBonus(hero, item.setId, 2);
    const has3 = heroHasSetBonus(hero, item.setId, 3);
    body += '<div class="divider"></div>';
    body += '<div class="small" style="font-weight:600">' + esc(s.name) + '</div>';
    body += '<div class="tiny muted">Worn: ' + fmtNum(worn) + ' / ' + fmtNum(s.pieces.length) + '</div>';
    body += '<div class="small' + (has2 ? '' : ' muted') + '" style="margin-top:6px">(2) ' + esc(s.bonus2.text) + '</div>';
    body += '<div class="small' + (has3 ? '' : ' muted') + '" style="margin-top:4px">(3) ' + esc(s.bonus3.text) + '</div>';
  }

  // Your stats before and after, for every slot - relics included, since
  // their stats reach the hero through the same calculation.
  body += '<div class="divider"></div>';
  body += heroEquipChangeBlock(hero, item, isThisEquipped);
  body += '</div>';

  // Sell and Salvage live here now that the inventory card is a single line.
  const price = sellPrice(hero, item);
  const salv = heroSalvageYield(hero, item);
  const canDispose = !isThisEquipped && !item.locked && !item.heirloom;

  const foot = '<div class="stack-s">' +
    '<div class="btn-row">' +
      (isThisEquipped ?
        '<button class="btn" data-act="unequip">Unequip</button>' :
        '<button class="btn btn-primary" data-act="equip">Equip</button>') +
      '<button class="btn' + (item.locked ? '' : ' btn-ghost') + '" data-act="lock">' +
        icon(item.locked ? 'ico-unlock' : 'ico-lock') + (item.locked ? 'Unlock' : 'Lock') +
      '</button>' +
    '</div>' +
    '<div class="btn-row">' +
      '<button class="btn btn-sm btn-tight" data-act="sell" data-item="' + esc(loc) + '"' +
        (canDispose ? '' : ' disabled') + '><span class="btn-wrap">Sell &middot; <span class="num">' +
        fmtNum(price) + '</span> gold</span></button>' +
      '<button class="btn btn-sm btn-tight" data-act="salvage" data-item="' + esc(loc) + '"' +
        (canDispose ? '' : ' disabled') + '><span class="btn-wrap">Salvage &middot; <span class="num">' +
        fmtNum(salv.ash) + '</span> Ash' +
        (salv.shards ? ' &middot; <span class="num">' + fmtNum(salv.shards) + '</span> Starshards' : '') +
      '</span></button>' +
    '</div>' +
    (isThisEquipped
      ? '<div class="tiny muted">Unequip it first to sell or salvage it.</div>'
      : (item.locked ? '<div class="tiny muted">Locked items cannot be sold or salvaged.</div>' : '')) +
  '</div>';

  openSheet({
    title: heroSlotLabel[item.slot],
    body: body,
    foot: foot,
    onAct: function (act) { heroItemSheetAct(act, hero, item); }
  });
}

/* ============================================================
   STATS - redeclared for change 6: level/XP and the HP line stay
   at the top, then Power/Might/Guard/Max HP as a compact combat
   core, then the nine percentage stats in a dense two-column
   grid. Every stat still opens its breakdown sheet via heroStatSheet.
   ============================================================ */
/* One explanation, used both in the all-stats help sheet and at the top of
   an individual stat's sheet. */
function heroStatHelpHtml(key) {
  const help = heroStatHelp[key];
  if (!help) return '';
  return '<p class="small" style="margin:0">' + esc(help.text) + '</p>' +
    (help.cap ? '<p class="tiny muted" style="margin:4px 0 0">' + esc(help.cap) + '</p>' : '');
}

/* Every stat explained in one place. The figures belong to the tiles and to
   each stat's own sheet; this one is only about what they do. */
function heroStatsHelpSheet() {
  const group = function (title, keys) {
    return '<div class="section-title">' + esc(title) + '</div>' +
      '<div class="stack-s">' +
        keys.map(function (key) {
          return '<div class="panel">' +
            '<div style="font-weight:600">' + esc(heroStatLabel[key]) + '</div>' +
            '<div style="margin-top:4px">' + heroStatHelpHtml(key) + '</div>' +
          '</div>';
        }).join('') +
      '</div>';
  };
  openSheet({
    title: 'What the stats do',
    body:
      '<p class="tiny muted" style="margin:0 0 10px">Tap any stat to see where its number comes from.</p>' +
      group('Combat', ['power'].concat(heroCoreStats)) +
      group('Attributes', heroPercentStats)
  });
}

function heroRenderStats(hero) {
  const st = heroStats(hero);
  const hp = currentHp(hero, st);
  const xpNext = xpToNext(hero.level);

  /* One progress card. The status strip already carries HP and the hero's
     level, so this shows what it cannot: the bar toward the next level, or,
     at the cap, the bar toward the next Abyssal Rank (SPEC 4). */
  let html = '<div class="card">';
  if (isFinite(xpNext)) {
    const xpPct = xpNext > 0 ? Math.max(0, Math.min(1, hero.xp / xpNext)) * 100 : 0;
    html += '<div class="row-between"><span class="small muted">Level ' + fmtNum(hero.level) +
      ' of ' + fmtNum(BALANCE.levelCap) + '</span>' +
      '<span class="num small">' + fmtNum(hero.xp) + ' / ' + fmtNum(xpNext) + ' XP</span></div>';
    html += '<div class="bar bar-xp" style="margin-top:8px"><div class="bar-fill" style="width:' +
      xpPct + '%"></div></div>';
  } else {
    const per = abyssalPer();
    const pct = per > 0 ? Math.max(0, Math.min(1, hero.xp / per)) * 100 : 0;
    const unspent = abyssalUnspent(hero);
    html += '<div class="row-between"><span class="small muted">Abyssal Rank ' +
      fmtNum(hero.abyssal.ranks || 0) + '</span>' +
      '<span class="num small">' + fmtNum(hero.xp) + ' / ' + fmtNum(per) + ' XP</span></div>';
    html += '<div class="bar bar-xp" style="margin-top:8px"><div class="bar-fill" style="width:' +
      pct + '%"></div></div>';
    html += '<div class="small" style="margin-top:6px;color:' +
      (unspent > 0 ? 'var(--corona)' : 'var(--ash)') + '">' +
      (unspent > 0
        ? fmtNum(unspent) + ' Abyssal point' + (unspent === 1 ? '' : 's') + ' to spend'
        : 'Level 50. Every ' + fmtNum(per) + ' XP earns another rank.') +
      '</div>';
    if (unspent > 0) {
      html += '<div class="row wrap" style="gap:6px;margin-top:8px">' +
        Object.keys(BALANCE.abyssal.options).map(function (id) {
          const o = BALANCE.abyssal.options[id];
          return '<button class="btn btn-sm" data-act="abyssal" data-opt="' + id + '">+' +
            fmtPct(o.per) + ' ' + esc(o.label) + '</button>';
        }).join('') +
      '</div>';
    }
  }
  html += '</div>';
  void hp;

  /* The Combat heading carries the help button, so "what does Guard do?"
     is answered on the screen that raises the question. */
  html += '<div class="row-between" style="margin:22px 0 8px">' +
    '<span class="section-title" style="margin:0">Combat</span>' +
    '<button class="btn btn-sm btn-ghost" data-act="stathelp" aria-label="What the stats do" ' +
      'style="width:44px;padding:0">' + icon('ico-help') + '</button>' +
  '</div>';
  html += '<div class="grid-2 grid-fill-last">' +
    ['power'].concat(heroCoreStats).map(function (key) {
      return hero2StatTile(key, key === 'power' ? st.power : st[key]);
    }).join('') +
  '</div>';

  html += '<div class="section-title">Attributes</div>';
  html += '<div class="grid-2 grid-fill-last">' +
    heroPercentStats.map(function (key) { return hero2StatTile(key, st[key]); }).join('') +
  '</div>';

  return html;
}

/* ============================================================
   DISPATCH - redeclared to add 'sell' and 'salvage'; every other
   branch is unchanged from Phase 1.
   ============================================================ */
function heroOnAct(act, node, ev) {
  const hero = state && state.hero;
  if (!hero) return;

  if (act === 'seg') { heroTab = node.dataset.seg; refresh(); return; }
  if (act === 'sort') { heroSort = node.dataset.sort; refresh(); return; }
  if (act === 'abyssal') {
    // SPEC 4 - spending an Abyssal point cannot be undone, so confirm it.
    const opt = BALANCE.abyssal.options[node.dataset.opt];
    if (!opt) return;
    confirmSheet({
      title: 'Spend an Abyssal point',
      body: 'Add <strong>+' + fmtPct(opt.per) + ' ' + esc(opt.label) +
            '</strong> permanently. Abyssal points cannot be moved once spent.',
      yes: 'Spend it',
      onYes: function () {
        const res = spendAbyssal(hero, opt.id);
        if (!res.ok) { toast(res.reason); return; }
        toast('+' + fmtPct(opt.per) + ' ' + opt.label + '.');
        refresh();
      }
    });
    return;
  }
  if (act === 'item') {
    const found = heroFindItem(hero, node.dataset.item);
    if (found) heroOpenItemSheet(hero, found.item, found.loc);
    return;
  }
  if (act === 'sell') {
    const found = heroFindItem(hero, node.dataset.item);
    if (found) hero2ConfirmSell(hero, found.item);
    return;
  }
  if (act === 'salvage') {
    const found = heroFindItem(hero, node.dataset.item);
    if (found) hero2ConfirmSalvage(hero, found.item);
    return;
  }
  if (act === 'stathelp') { heroStatsHelpSheet(); return; }
  if (act === 'stat') { heroStatSheet(hero, node.dataset.stat); return; }
  if (act === 'node') { heroNodeSheet(hero, node.dataset.node); return; }
  if (act === 'riteSlot') { heroRiteSlotSheet(hero, parseInt(node.dataset.slot, 10)); return; }
}

/* ============================================================
   VIEWS.town (Town rework) - SPEC 13.2, 13.3, 11.3, 11.9, 16.1, 19.4
   COMPLETE replacement of the Phase 3 town view. This is spliced
   in after the Phase 3 file (view-town3 material already in
   index.html), so this VIEWS.town assignment wins.

   Reused as-is (not redeclared - they are already `let`/`const`/
   `function` bindings earlier in the same script, and redeclaring
   `let`/`const` would throw): the `townPlace` / `townMarketTab`
   state, `TOWN_KEEPERS`, and the helpers townCurrencyRow,
   townHeader, townBadge, townAffixLines, townFindInvItem,
   townFindOwnedItem, townIsEquipped, townChapelStatus,
   townForgeStatus, townMarketStatus, townTile, townRenderChapel,
   townRenderRespec, townRenderForge, townRenderHub (the Phase 3
   version with the champion statues strip), town2UnlockRank,
   town2ItemName, town2ItemLabel, town2RarityBorderStyle,
   town2ChainIcon, town2AffixText, town2ItemDetailBody,
   town2OpenItemDetail, town2RenderHubTile, town2RenderBounty,
   town3CraftSection, town3RekindleCandidates, town3RekindleSection,
   town3StatueTile, town3RenderStatues, town3PlaqueBody and
   town3OpenPlaque. The Chapel, Forge and Bounty Board are
   unchanged, so none of their render functions are touched here -
   only the Market changes.

   Redeclared on purpose (same name, last one wins - the whole
   point of the splice): townRenderMarket (Buy and Sell now render
   as a two-column grid, and Sell gets bulk "sell all" buttons
   mirroring the Forge's bulk salvage) and the VIEWS.town object
   itself (onAct needs one new case: `sellbulk`).

   Brand new pieces use a `town4` prefix so they can never collide
   with a same-named helper already in the file:
   - town4AffixLinesCompact(item) - a shortened one-line affix
     summary (at most 2 affixes, "+N" for the rest) for the narrow
     two-column Buy/Sell cards.
   - town4BulkSellPreview(hero, maxRarity) - there is no engine
     bulkSellPreview, so this is built from primitives the API
     docs confirm exist: it walks hero.inventory, skips anything
     locked or heirloom, skips anything above maxRarity using
     RARITY_ORDER.indexOf (exactly like bulkSalvagePreview does for
     salvage), and totals sellPrice(hero, item) for the rest. No
     price formula is reimplemented - sellPrice is called for every
     item, same as the single-sell path already does.
   ============================================================ */

/* A compact affix line for the narrow two-column Market cards:
   at most `max` affixes (default 2), then "+N" for the remainder.
   Same source data and formatting as townAffixLines, just capped
   so a 3-4 affix rare doesn't blow out a 164px-wide card. */
function town4AffixLinesCompact(item, max) {
  max = max || 2;
  if (!item.affixes || !item.affixes.length) return '';
  const parts = item.affixes.map(function (a) {
    const def = AFFIXES[a.id];
    if (!def) return '';
    return def.text.replace('X', fmtNum(a.value));
  }).filter(Boolean);
  if (!parts.length) return '';
  const shown = parts.slice(0, max);
  let text = shown.join(' · ');
  if (parts.length > max) text += ' +' + (parts.length - max);
  return '<div class="tiny muted">' + esc(text) + '</div>';
}

/* Mirrors bulkSalvagePreview(hero, maxRarity): never includes a
   locked or heirloom item, and never includes anything rarer than
   maxRarity (RARITY_ORDER.indexOf keeps uniques and sets out of
   every tier automatically, since only 'common'/'magic'/'rare' are
   ever passed in as maxRarity). Totals the real sellPrice for each
   included item - no price math is invented here. */
function town4BulkSellPreview(hero, maxRarity) {
  const limit = RARITY_ORDER.indexOf(maxRarity);
  let count = 0, gold = 0;
  const list = [];
  for (const it of hero.inventory) {
    if (it.locked || it.heirloom) continue;
    if (RARITY_ORDER.indexOf(it.rarity) > limit) continue;
    gold += sellPrice(hero, it);
    count++;
    list.push(it);
  }
  return { count: count, gold: gold, items: list };
}

/* ============================================================
   THE MARKET - SPEC 13.3
   Redeclares the Phase 2 townRenderMarket. Buy and Sell are now a
   two-column grid of smaller cards (about 164px wide at 360px, per
   #view's ~12px side padding and the 8px grid gap). Supplies, Early
   restock and the Black Market are untouched - still one full-width
   card/panel each, since those are single items with a lot of text.
   ============================================================ */
function townRenderMarket(hero) {
  let out = townHeader('The Market', 'market') + townCurrencyRow(hero);

  const left = Math.max(0, (hero.market.restockAt || 0) - now());
  out += '<p class="small muted" data-town-cd="' + hero.market.restockAt + '" data-town-cd-tmpl="market">' +
    'Restocks in ' + fmtTime(left) + '</p>';

  out += '<div class="btn-row" style="margin:10px 0">' +
    '<button class="btn btn-sm' + (townMarketTab === 'buy' ? ' btn-primary' : '') + '" data-act="markettab" data-tab="buy">Buy</button>' +
    '<button class="btn btn-sm' + (townMarketTab === 'sell' ? ' btn-primary' : '') + '" data-act="markettab" data-tab="sell">Sell</button>' +
  '</div>';

  if (townMarketTab === 'buy') {
    const stock = hero.market.stock || [];
    if (!stock.length) {
      out += '<p class="small muted">Nothing in stock.</p>';
    } else {
      out += '<div class="grid-2">';
      stock.forEach(function (item) {
        const price = buyPrice(item);
        const afford = hero.gold >= price && inventoryFree(hero) > 0;
        const delta = Math.round(powerDelta(hero, item));
        out += '<div class="card" style="padding:10px;' + town2RarityBorderStyle(item) + '">' +
          '<div class="row" style="gap:6px">' + townBadge(item) + town2ChainIcon(item) + '</div>' +
          '<div style="margin-top:6px">' + town2ItemLabel(item) + '</div>' +
          '<div class="tiny muted">ilvl ' + fmtNum(item.ilvl) + '</div>' +
          town4AffixLinesCompact(item) +
          '<div style="margin-top:4px">' + powerArrow(delta) + '</div>' +
          '<button class="btn btn-sm btn-block' + (afford ? ' btn-primary' : '') + '" data-act="buy" data-id="' + esc(item.id) + '"' +
            (afford ? '' : ' disabled') + ' style="margin-top:8px">' +
            'Buy &middot; <span class="num">' + fmtNum(price) + '</span>g' +
          '</button>' +
        '</div>';
      });
      out += '</div>';
    }
  } else {
    const sellable = hero.inventory.filter(function (i) { return !i.locked; });
    if (!sellable.length) {
      out += '<p class="small muted">Nothing unlocked to sell.</p>';
    } else {
      out += '<div class="grid-2">';
      sellable.forEach(function (item) {
        const price = sellPrice(hero, item);
        out += '<div class="card" style="padding:10px;' + town2RarityBorderStyle(item) + '">' +
          '<button type="button" class="row" data-act="detail" data-id="' + esc(item.id) + '" style="gap:6px;width:100%;text-align:left;min-height:44px">' +
            townBadge(item) + town2ChainIcon(item) +
            '<div class="grow">' + town2ItemLabel(item) + '</div>' +
          '</button>' +
          '<button class="btn btn-sm btn-block" data-act="sell" data-id="' + esc(item.id) + '" style="margin-top:8px">' +
            'Sell — ' + fmtNum(price) + 'g' +
          '</button>' +
        '</div>';
      });
      out += '</div>';

      out += '<div class="stack-s" style="margin-top:10px">';
      ['common', 'magic', 'rare'].forEach(function (r) {
        out += '<button class="btn btn-sm btn-block" data-act="sellbulk" data-rarity="' + r + '">' +
          'Sell all unlocked ' + RARITIES[r].name.toLowerCase() + ' and below' +
        '</button>';
      });
      out += '</div>';
    }
  }

  // ---- Supplies (Phase 2, always available) ----
  out += '<div class="section-title">Supplies</div>';
  out += '<div class="stack-s">';
  ['candle', 'ward', 'oil'].forEach(function (id) {
    const s = BALANCE.town.supplies[id];
    const held = (hero.supplies && hero.supplies[id]) || 0;
    const price = supplyPrice(hero, id);
    const atMax = held >= s.max;
    const afford = hero.gold >= price;
    out += '<div class="row-between panel">' +
      '<div class="grow">' +
        '<div style="font-weight:600">' + esc(s.name) + '</div>' +
        '<div class="tiny muted">' + esc(s.text) + '</div>' +
        '<div class="tiny muted">' + fmtNum(held) + ' / ' + fmtNum(s.max) + ' held</div>' +
      '</div>' +
      '<button class="btn btn-sm' + (!atMax && afford ? ' btn-primary' : '') + '" data-act="buySupply" data-id="' + id + '"' +
        (atMax || !afford ? ' disabled' : '') + '>' +
        (atMax ? 'Max' : fmtNum(price) + ' gold') +
      '</button>' +
    '</div>';
  });
  out += '</div>';

  // ---- Early restock (Phase 2, Renown rank 5) ----
  if (hasUnlock('restock')) {
    out += '<div class="section-title">Early restock</div>';
    const cost = earlyRestockCost(hero);
    const afford = hero.gold >= cost;
    out += '<button class="btn btn-block' + (afford ? ' btn-primary' : '') + '" data-act="earlyRestock"' +
      (afford ? '' : ' disabled') + '>' +
      'Restock now — ' + fmtNum(cost) + ' gold' +
    '</button>';
  }

  // ---- Black Market (Phase 2, Renown rank 12) ----
  if (hasUnlock('blackmarket')) {
    out += '<div class="section-title">Black Market</div>';
    const bm = hero.market.blackMarket;
    if (!bm || !bm.item) {
      out += '<p class="small muted">Nothing on offer. Check back after it refreshes.</p>';
    } else {
      const item = bm.item;
      const price = blackMarketPrice(item);
      const afford = hero.gold >= price && inventoryFree(hero) > 0;
      const bmLeft = Math.max(0, (bm.expiresAt || 0) - now());
      const u = item.uniqueId && UNIQUES[item.uniqueId];
      out += '<div class="card" style="' + town2RarityBorderStyle(item) + '">' +
        '<div class="row" style="gap:8px">' +
          townBadge(item) + town2ChainIcon(item) +
          '<div class="grow">' + town2ItemLabel(item) +
            '<div class="tiny muted">ilvl ' + fmtNum(item.ilvl) + '</div>' +
            townAffixLines(item) +
          '</div>' +
        '</div>';
      if (u) {
        out += '<p class="small" style="margin-top:10px">' + esc(u.power.text) + '</p>' +
          '<p class="small" style="font-style:italic;color:var(--ash);margin-top:8px">' + esc(u.lore) + '</p>';
      }
      out += '<div class="small muted" style="margin-top:10px" data-town-cd="' + (bm.expiresAt || 0) + '" data-town-cd-tmpl="blackmarket">' +
          'Expires in ' + fmtTime(bmLeft) +
        '</div>' +
        '<div style="margin-top:10px">' +
          '<button class="btn btn-block' + (afford ? ' btn-primary' : '') + '" data-act="buyBlackMarket"' +
            (afford ? '' : ' disabled') + '>Buy — ' + fmtNum(price) + ' gold</button>' +
        '</div>' +
      '</div>';
    }
  }

  return out;
}

VIEWS.town = {
  render: function () {
    const hero = state && state.hero;
    if (!hero) {
      return '<div class="card"><p class="muted small">No hero yet.</p></div>';
    }
    if (townPlace === 'chapel') return townRenderChapel(hero);
    if (townPlace === 'forge') return townRenderForge(hero);
    if (townPlace === 'market') return townRenderMarket(hero);
    if (townPlace === 'bounty') return town2RenderBounty(hero);
    return townRenderHub(hero);
  },

  tick: function () {
    const host = el('view');
    if (!host) return;
    const nodes = host.querySelectorAll('[data-town-cd]');
    nodes.forEach(function (n) {
      const target = parseInt(n.getAttribute('data-town-cd'), 10) || 0;
      const tmpl = n.getAttribute('data-town-cd-tmpl');
      const left = Math.max(0, target - now());
      let prefix = 'Restocks in ';
      if (tmpl === 'fallen') prefix = 'Time left: ';
      else if (tmpl === 'bounty') prefix = 'New contracts in ';
      else if (tmpl === 'blackmarket') prefix = 'Expires in ';
      else if (tmpl === 'offering') prefix = 'Ends in ';
      n.textContent = prefix + fmtTime(left);
    });
  },

  onAct: function (act, node) {
    const hero = state && state.hero;
    if (!hero) return;

    if (act === 'open') { townPlace = node.dataset.place; townMarketTab = 'buy'; refresh(); return; }
    if (act === 'back') { townPlace = null; refresh(); return; }

    if (act === 'statue') {
      const idx = parseInt(node.dataset.idx, 10);
      const p = ((state.account && state.account.champions) || [])[idx];
      if (!p) return;
      town3OpenPlaque(p);
      return;
    }

    if (act === 'heal') {
      const r = healHero(hero, parseFloat(node.dataset.frac));
      if (!r.ok) toast(r.reason); else toast('Healed ' + fmtNum(r.restored) + ' HP.');
      refresh();
      return;
    }

    if (act === 'revive') {
      const r = reviveHero(hero);
      if (!r.ok) toast(r.reason); else toast('Revived.');
      refresh();
      return;
    }

    if (act === 'respec') {
      const cost = respecCost(hero);
      confirmSheet({
        title: 'Respec your skills?',
        body: 'This refunds every skill point and empties your rite slots.' +
          (cost > 0 ? ' It costs ' + fmtNum(cost) + ' gold.' : ' It is free below level ' + BALANCE.tree.respecFreeBelowLevel + '.'),
        yes: 'Respec',
        danger: true,
        onYes: function () {
          const r = respec(hero);
          if (!r.ok) toast(r.reason); else toast('Skills reset.');
          refresh();
        }
      });
      return;
    }

    if (act === 'salvage') {
      const item = townFindInvItem(hero, node.dataset.id);
      if (!item) return;
      const r = salvageItem(hero, item);
      if (!r.ok) toast(r.reason);
      else toast('Salvaged for ' + fmtNum(r.yield.ash) + ' Ash' + (r.yield.shards ? ' and ' + fmtNum(r.yield.shards) + ' Starshards' : '') + '.');
      refresh();
      return;
    }

    if (act === 'bulk') {
      const rarity = node.dataset.rarity;
      const p = bulkSalvagePreview(hero, rarity);
      if (p.count <= 0) { toast('Nothing to salvage.'); return; }
      confirmSheet({
        title: 'Salvage ' + fmtNum(p.count) + ' item' + (p.count === 1 ? '' : 's') + '?',
        body: 'Yields ' + fmtNum(p.ash) + ' Ash' + (p.shards ? ' and ' + fmtNum(p.shards) + ' Starshards' : '') + '.',
        yes: 'Salvage',
        danger: true,
        onYes: function () {
          bulkSalvage(hero, rarity);
          refresh();
          toast('Salvaged.');
        }
      });
      return;
    }

    if (act === 'temper') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const r = temperItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Tempered to +' + r.to + '.');
      refresh();
      return;
    }

    if (act === 'detail') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      town2OpenItemDetail(hero, item);
      return;
    }

    if (act === 'reforgeOpen') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const gate = canReforge(item);
      if (!gate.ok) { toast(gate.reason); return; }
      const cost = reforgeCost(item);
      const afford = hero.gold >= cost.gold && hero.ash >= cost.ash;
      openSheet({
        title: 'Reforge',
        body:
          '<div class="stack-s">' +
            '<div class="row" style="gap:8px">' + townBadge(item) + town2ChainIcon(item) + '<div>' + town2ItemLabel(item) + '</div></div>' +
            '<p class="small muted">Pick one affix to replace. Costs ' + fmtNum(cost.gold) + ' gold and ' + fmtNum(cost.ash) + ' Ash' +
              (afford ? '.' : ' — not enough to reforge.') +
            '</p>' +
            '<div class="stack-s">' +
              item.affixes.map(function (a, i) {
                return '<button type="button" class="row-between panel card-tap" data-act="reforgePick" data-idx="' + i + '"' +
                  (afford ? '' : ' disabled') + ' style="min-height:44px;width:100%">' +
                  '<span class="small">' + esc(town2AffixText(a)) + '</span>' +
                  '<span class="tiny muted">Replace</span>' +
                '</button>';
              }).join('') +
            '</div>' +
          '</div>',
        foot: '<button class="btn btn-block" data-act="close">Cancel</button>',
        onAct: function (a, n) {
          if (a === 'close') { closeSheet(); return; }
          if (a === 'reforgePick') {
            const idx = parseInt(n.dataset.idx, 10);
            const r = reforgeAffix(hero, item, idx);
            if (!r.ok) { toast(r.reason); return; }
            toast('Reforged: ' + town2AffixText(r.from) + ' → ' + town2AffixText(r.to));
            closeSheet();
            refresh();
          }
        }
      });
      return;
    }

    if (act === 'autosalvage') {
      if (!state.settings) state.settings = {};
      if (!state.settings.autoSalvage) state.settings.autoSalvage = { common: false, magic: false, rare: false };
      const r = node.dataset.rarity;
      state.settings.autoSalvage[r] = !state.settings.autoSalvage[r];
      save();
      refresh();
      return;
    }

    if (act === 'craft') {
      const slot = node.dataset.slot;
      const r = craftItem(hero, slot);
      if (!r.ok) { toast(r.reason); return; }
      toast('Crafted ' + (town2ItemName(r.item) || r.item.baseType) + '.');
      refresh();
      town2OpenItemDetail(hero, r.item);
      return;
    }

    if (act === 'rekindle') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const r = rekindleItem(hero, item);
      if (!r.ok) { toast(r.reason); return; }
      toast('Rekindled to ilvl ' + fmtNum(r.to) + '.');
      refresh();
      return;
    }

    if (act === 'markettab') { townMarketTab = node.dataset.tab; refresh(); return; }

    if (act === 'buy') {
      const item = (hero.market.stock || []).find(function (i) { return i.id === node.dataset.id; });
      if (!item) return;
      const r = buyItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Bought ' + (town2ItemName(item) || item.baseType) + '.');
      refresh();
      return;
    }

    if (act === 'sell') {
      const item = townFindInvItem(hero, node.dataset.id);
      if (!item) return;
      const r = sellItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Sold for ' + fmtNum(r.gold) + ' gold.');
      refresh();
      return;
    }

    if (act === 'sellbulk') {
      const rarity = node.dataset.rarity;
      const p = town4BulkSellPreview(hero, rarity);
      if (p.count <= 0) { toast('Nothing to sell.'); return; }
      confirmSheet({
        title: 'Sell ' + fmtNum(p.count) + ' item' + (p.count === 1 ? '' : 's') + '?',
        body: 'Sells for ' + fmtNum(p.gold) + ' gold total.',
        yes: 'Sell',
        danger: true,
        onYes: function () {
          let total = 0, sold = 0;
          p.items.forEach(function (it) {
            const r = sellItem(hero, it);
            if (r.ok) { total += r.gold; sold++; }
          });
          refresh();
          toast('Sold ' + fmtNum(sold) + ' item' + (sold === 1 ? '' : 's') + ' for ' + fmtNum(total) + ' gold.');
        }
      });
      return;
    }

    if (act === 'buySupply') {
      const id = node.dataset.id;
      const r = buySupply(hero, id);
      if (!r.ok) toast(r.reason); else toast('Bought ' + BALANCE.town.supplies[id].name + '.');
      refresh();
      return;
    }

    if (act === 'earlyRestock') {
      const r = buyEarlyRestock(hero);
      if (!r.ok) toast(r.reason); else toast('The Market restocked.');
      refresh();
      return;
    }

    if (act === 'buyBlackMarket') {
      const bm = hero.market.blackMarket;
      const boughtItem = bm && bm.item;
      const r = buyBlackMarket(hero);
      if (!r.ok) { toast(r.reason); return; }
      toast('Bought ' + (boughtItem ? (town2ItemName(boughtItem) || boughtItem.baseType) : 'the item') + '.');
      refresh();
      return;
    }

    if (act === 'claimContract') {
      const idx = parseInt(node.dataset.idx, 10);
      const r = claimContract(hero, idx);
      if (!r.ok) { toast(r.reason); return; }
      let msg = 'Contract complete: ' + fmtNum(r.gold) + ' gold, ' + fmtNum(r.starshards) + ' Starshard' + (r.starshards === 1 ? '' : 's');
      if (r.renown && r.renown.amount) msg += ', ' + fmtNum(r.renown.amount) + ' Renown';
      toast(msg);
      refresh();
      return;
    }
  }
};

/* ---- Tapping a tab you are already on returns it to its top level. ----
   Declared after every view is spliced in, so it attaches to the final
   version of each. */
/* ============================================================
   VIEWS.town (Town: The Day's Work + Bounty payouts) - SPEC 13.4, 13.6, 19.4
   COMPLETE replacement of the "Town rework" VIEWS.town (view-town4
   material already in index.html), so this VIEWS.town assignment
   wins. Every existing behaviour - Chapel, Forge (Salvage, Temper,
   Reforge, auto-salvage, Craft, Rekindle), Market (Buy, Sell
   two-across, sell-all, Supplies, early restock, Black Market) and
   the champion statues - is carried over unchanged below.

   Reused as-is (not redeclared - they are already `let`/`const`/
   `function` bindings earlier in the same script, and redeclaring
   `let`/`const` would throw): the `townPlace` / `townMarketTab`
   state, `TOWN_KEEPERS`, and the helpers townCurrencyRow,
   townHeader, townBadge, townAffixLines, townFindInvItem,
   townFindOwnedItem, townIsEquipped, townChapelStatus,
   townForgeStatus, townMarketStatus, townTile, townRenderChapel,
   townRenderRespec, townRenderForge, townRenderMarket,
   town2UnlockRank, town2ItemName, town2ItemLabel,
   town2RarityBorderStyle, town2ChainIcon, town2AffixText,
   town2ItemDetailBody, town2OpenItemDetail, town2RenderHubTile,
   town3CraftSection, town3RekindleCandidates, town3RekindleSection,
   town3StatueTile, town3RenderStatues, town3PlaqueBody,
   town3OpenPlaque, town4AffixLinesCompact and town4BulkSellPreview.

   Redeclared on purpose (same name, last one wins - the whole
   point of the splice):
   - townRenderHub - adds a fifth hub tile for The Day's Work,
     after the Bounty Board tile and before the champion statues.
   - town2RenderBounty - every contract now shows its payout
     (Renown, gold, Starshard) before it is claimed, and a claimed
     contract's card gets a verdant border to match its "Claimed"
     label (SPEC 13.4).
   - the VIEWS.town object itself - render() gains the `labour`
     place, tick() gains live updates for the running job's earned
     total, its cap countdown and the hub tile's status line, and
     onAct() gains two cases: `startTask` and `collectTask`.

   Brand new pieces use a `town5` prefix so they can never collide
   with a same-named helper already in the file:
   - town5HubStatus(hero) - the hub tile's status line: the running
     job and what it has earned so far, or an idle line.
   - town5RenderHubTile(hero) - the fifth hub tile. Written by hand
     rather than through townTile() because The Day's Work has no
     single keeper (SPEC 13.6) - townTile() always looks one up in
     TOWN_KEEPERS - and because the status line needs a stable id
     (`town5-hub-status`) for tick() to update live.
   - town5TaskRateAmountText(hero, id) - taskRate(hero,id) already
     returns gold/Ash already scaled per hour, but for the rites
     job it returns a plain minute count (BALANCE.labour.tasks.rites
     .perHour is documented as "minutes off every rite cooldown"),
     not milliseconds, so passing it straight into taskAmountText
     would hand fmtTime a number 60,000x too small. This multiplies
     that one case by the existing global MINUTE constant (the same
     conversion collectTask/taskAccrued already do internally to
     the *earned* total) before handing off to taskAmountText - it
     does not touch or reimplement the payout formula itself.
   - town5JobCard(hero, id, switching) - one job's card: icon, name,
     keeper, flavour text, per-hour rate, and a Start/Switch button.
   - town5CurrentTaskCard(hero) - the running job's card: which job,
     what it has earned so far (with a live id for tick()), how long
     until the six-hour cap or that it has stopped paying (also a
     live id), and the Collect button.
   - town5RenderLabour(hero) - The Day's Work place itself.
   ============================================================ */

/* SPEC 13.6 - taskRate(hero,'rites') is a plain per-hour minute count,
   not milliseconds, so it needs the same *MINUTE conversion
   collectTask/taskAccrued already apply to the earned total before
   it can be handed to taskAmountText (which formats "rites" amounts
   with fmtTime, i.e. expects milliseconds). Gold and Ash are already
   in their natural unit and pass through untouched. */
/* taskRate now returns the same units taskAmountText expects for every
   reward, so this is a straight format. */
function town5TaskRateAmountText(hero, id) {
  const def = taskDef(id);
  if (!def) return '';
  return taskAmountText(def.reward, taskRate(hero, id));
}

/* The hub tile's status line (also reused live by tick()). */
function town5HubStatus(hero) {
  if (hero.task) {
    const def = taskDef(hero.task.id);
    if (def) return def.name + ' · ' + taskAmountText(def.reward, taskAccrued(hero));
  }
  return 'Three jobs on offer';
}

/* The fifth hub tile. Not built through townTile() because The
   Day's Work has no single keeper (SPEC 13.6 - "the three jobs are
   for keepers the town already has"), and because the status line
   needs a stable id for tick() to refresh live while a job runs. */
function town5RenderHubTile(hero) {
  const accent = townAccent('labour');
  return '<button class="card card-tap" data-act="open" data-place="labour" style="min-height:44px;' +
      'border-left:3px solid ' + accent + '">' +
    '<div class="row" style="gap:10px">' +
      '<span style="color:' + accent + ';display:inline-flex">' + icon('ico-clock') + '</span>' +
      '<div class="grow">' +
        '<div style="font-weight:600">Commissions</div>' +
        '<div class="tiny muted">Odd jobs around town</div>' +
      '</div>' +
    '</div>' +
    '<div class="divider" style="margin:10px 0 8px"></div>' +
    '<div class="small" id="town5-hub-status">' + esc(town5HubStatus(hero)) + '</div>' +
  '</button>';
}

/* Redeclares the Phase 3 townRenderHub to add The Day's Work tile
   between the Bounty Board and the champion statues strip. */
/* The hub opens on the map of Emberhold, whose cartouche carries the town's
   name; the place tiles follow unchanged, as the fully spelled-out way in. */
function townRenderHub(hero) {
  return townRenderMap(hero) +
  '<div class="stack">' +
    townTile('chapel', 'The Last Chapel', townChapelStatus(hero), 'ico-chapel') +
    townTile('forge', 'The Forge', townForgeStatus(hero), 'ico-salvage') +
    townTile('market', 'The Market', townMarketStatus(hero), 'ico-market', hero.market.restockAt) +
    town2RenderHubTile(hero) +
    town5RenderHubTile(hero) +
    townTile('vault', 'The Vault', townVaultStatus(hero), 'ico-vault') +
  '</div>' + town3RenderStatues();
}

/* ============================================================
   THE BOUNTY BOARD - SPEC 13.4
   Redeclares town2RenderBounty: every contract now shows exactly
   what it pays before it is claimed, and a claimed contract gets a
   verdant border alongside its existing "Claimed" label.
   ============================================================ */
function town2RenderBounty(hero) {
  if (!hasUnlock('bounty')) {
    return townHeader('The Bounty Board', 'bounty') +
      '<p class="small muted">Opens at Renown rank ' + town2UnlockRank('bounty') + '.</p>';
  }

  let out = townHeader('The Bounty Board', 'bounty') + townCurrencyRow(hero, { shards: true });

  const contracts = (state.account.contracts && state.account.contracts.list) || [];
  const nextAt = (state.account.contracts && state.account.contracts.nextAt) || 0;
  const left = Math.max(0, nextAt - now());
  out += '<p class="small muted" data-town-cd="' + nextAt + '" data-town-cd-tmpl="bounty">' +
    'New contracts in ' + fmtTime(left) +
  '</p>';

  if (!contracts.length) {
    out += '<p class="small muted">No contracts posted yet.</p>';
    return out;
  }

  // Same gold formula claimContract uses, so the figure shown here always
  // matches the figure paid on Claim.
  const gold = Math.round(BALANCE.contracts.goldCoef * g(hero.deepest));
  const starshards = BALANCE.contracts.starshards;
  const renown = BALANCE.renown.perContract;
  const payoutText = 'Pays ' + fmtNum(renown) + ' Renown · ' + fmtNum(gold) + ' gold · ' +
    fmtNum(starshards) + ' Starshard' + (starshards === 1 ? '' : 's');

  out += '<div class="stack-s">';
  contracts.forEach(function (c, idx) {
    const pct = c.goal > 0 ? Math.max(0, Math.min(1, c.progress / c.goal)) : 0;
    const claimedStyle = c.claimed ? ' style="border-color:var(--verdant)"' : '';
    out += '<div class="card' + (c.claimed ? ' muted' : '') + '"' + claimedStyle + '>' +
      '<div style="font-weight:600">' + esc(c.text) + '</div>' +
      '<div class="tiny muted" style="margin-top:4px">' + esc(payoutText) + '</div>';

    if (c.goal === 1) {
      out += '<div class="small' + (c.done ? '' : ' muted') + '" style="margin-top:8px">' +
        (c.done ? 'Done' : 'Not done') +
      '</div>';
    } else {
      // bar-xp fills in corona; blood is reserved for HP.
      out += '<div class="bar bar-xp" style="margin-top:8px"><div class="bar-fill" style="width:' + Math.round(pct * 100) + '%"></div></div>' +
        '<div class="tiny muted" style="margin-top:4px">' + fmtNum(Math.min(c.progress, c.goal)) + ' / ' + fmtNum(c.goal) + '</div>';
    }

    if (c.claimed) {
      out += '<div class="small" style="margin-top:10px;color:var(--verdant);font-weight:600">Claimed</div>';
    } else if (c.done) {
      out += '<div style="margin-top:10px">' +
        '<button class="btn btn-primary btn-block" data-act="claimContract" data-idx="' + idx + '">Claim</button>' +
      '</div>';
    }

    out += '</div>';
  });
  out += '</div>';

  return out;
}

/* ============================================================
   THE DAY'S WORK - SPEC 13.6
   No keeper of its own - the three jobs are for keepers the town
   already has (Vell, Brannoch, Sister Maren). One job at a time;
   starting a different job, or starting a descent, banks whatever
   the current one earned.
   ============================================================ */

/* One job's card. `switching` is true when this card is offered as
   an alternative to the job already running (label reads "Switch"
   and is not the primary button, since a job is already active). */
function town5JobCard(hero, id, switching) {
  const def = taskDef(id);
  if (!def) return '';
  const rateText = town5TaskRateAmountText(hero, id);
  return '<div class="card">' +
    '<div class="row" style="gap:10px">' +
      icon(def.icon) +
      // The job's name already names its keeper, so it is not repeated here.
      '<div class="grow" style="font-weight:600">' + esc(def.name) + '</div>' +
    '</div>' +
    '<p class="small" style="margin-top:8px">' + esc(def.text) + '</p>' +
    '<div class="small muted num" style="margin-top:4px">Pays ' + esc(rateText) + ' per hour</div>' +
    '<button class="btn btn-sm btn-block' + (switching ? '' : ' btn-primary') + '" data-act="startTask" data-id="' + esc(def.id) + '" style="margin-top:10px">' +
      (switching ? 'Switch to this' : 'Start') +
    '</button>' +
  '</div>';
}

/* The running job's card: which job, what it has earned so far
   (live via #town5-earned), how long until the six-hour cap or
   that it has already stopped paying (live via #town5-cap), and
   Collect. */
function town5CurrentTaskCard(hero) {
  const def = taskDef(hero.task.id);
  if (!def) return '';
  const accrued = taskAccrued(hero);
  const atCap = taskAtCap(hero);
  const capIn = taskCapIn(hero);
  const earnedText = 'Earned so far: ' + taskAmountText(def.reward, accrued);
  const capText = atCap
    ? 'This job has stopped paying. Collect to bank it.'
    : 'Stops paying in ' + fmtTime(capIn) + '.';

  return '<div class="card" style="border-color:var(--corona)">' +
    '<div class="row" style="gap:10px">' +
      icon(def.icon) +
      '<div class="grow">' +
        '<div style="font-weight:600">' + esc(def.name) + '</div>' +
        '<div class="tiny muted">' + esc(def.keeper) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="divider" style="margin:10px 0 8px"></div>' +
    '<div class="small num" id="town5-earned">' + esc(earnedText) + '</div>' +
    '<div class="small muted" id="town5-cap" style="margin-top:4px">' + esc(capText) + '</div>' +
    '<button class="btn btn-primary btn-block" data-act="collectTask" style="margin-top:10px">Collect</button>' +
  '</div>';
}

function town5RenderLabour(hero) {
  let out = townHeader('Commissions', 'labour');
  out += '<p class="small muted">Wages for waiting out your HP between descents — a fraction of what a ' +
    'descent pays. Starting a descent ends the current job and banks what it earned.</p>';

  if (hero.task) {
    out += town5CurrentTaskCard(hero);
    out += '<div class="section-title">Switch to a different job</div>';
    out += '<p class="tiny muted">Starting a different job banks what this one earned first — nothing is lost.</p>';
  } else {
    out += '<div class="section-title">Available work</div>';
  }

  out += '<div class="stack-s">';
  ['gold', 'ash', 'rites'].forEach(function (id) {
    if (hero.task && hero.task.id === id) return; // already shown above as the running job
    out += town5JobCard(hero, id, !!hero.task);
  });
  out += '</div>';

  return out;
}

/* ============================================================
   THE VIEW
   ============================================================ */

VIEWS.town = {
  render: function () {
    const hero = state && state.hero;
    if (!hero) {
      return '<div class="card"><p class="muted small">No hero yet.</p></div>';
    }
    if (townPlace === 'chapel') return townRenderChapel(hero);
    if (townPlace === 'forge') return townRenderForge(hero);
    if (townPlace === 'market') return townRenderMarket(hero);
    if (townPlace === 'bounty') return town2RenderBounty(hero);
    if (townPlace === 'labour') return town5RenderLabour(hero);
    if (townPlace === 'vault') return townRenderVault(hero);
    return townRenderHub(hero);
  },

  tick: function () {
    const host = el('view');
    if (!host) return;
    const nodes = host.querySelectorAll('[data-town-cd]');
    nodes.forEach(function (n) {
      const target = parseInt(n.getAttribute('data-town-cd'), 10) || 0;
      const tmpl = n.getAttribute('data-town-cd-tmpl');
      const left = Math.max(0, target - now());
      let prefix = 'Restocks in ';
      if (tmpl === 'fallen') prefix = 'Time left: ';
      else if (tmpl === 'bounty') prefix = 'New contracts in ';
      else if (tmpl === 'blackmarket') prefix = 'Expires in ';
      else if (tmpl === 'offering') prefix = 'Ends in ';
      n.textContent = prefix + fmtTime(left);
    });

    // The Day's Work: re-render only the running figures, never state.
    const hero = state && state.hero;
    if (hero && hero.task) {
      const def = taskDef(hero.task.id);
      if (def) {
        const accrued = taskAccrued(hero);
        const hubStatus = el('town5-hub-status');
        if (hubStatus) hubStatus.textContent = town5HubStatus(hero);

        const earnedEl = el('town5-earned');
        if (earnedEl) earnedEl.textContent = 'Earned so far: ' + taskAmountText(def.reward, accrued);

        const capEl = el('town5-cap');
        if (capEl) {
          capEl.textContent = taskAtCap(hero)
            ? 'This job has stopped paying. Collect to bank it.'
            : 'Stops paying in ' + fmtTime(taskCapIn(hero)) + '.';
        }
      }
    }
  },

  onAct: function (act, node) {
    const hero = state && state.hero;
    if (!hero) return;

    if (act === 'open') { townPlace = node.dataset.place; townMarketTab = 'buy'; refresh(); return; }
    if (act === 'back') { townPlace = null; refresh(); return; }

    if (act === 'statue') {
      const idx = parseInt(node.dataset.idx, 10);
      const p = ((state.account && state.account.champions) || [])[idx];
      if (!p) return;
      town3OpenPlaque(p);
      return;
    }

    if (act === 'heal') {
      const r = healHero(hero, parseFloat(node.dataset.frac));
      if (!r.ok) toast(r.reason); else toast('Healed ' + fmtNum(r.restored) + ' HP.');
      refresh();
      return;
    }

    if (act === 'revive') {
      const r = reviveHero(hero);
      if (!r.ok) toast(r.reason); else toast('Revived.');
      refresh();
      return;
    }

    if (act === 'respec') {
      const cost = respecCost(hero);
      confirmSheet({
        title: 'Respec your skills?',
        body: 'This refunds every skill point and empties your rite slots.' +
          (cost > 0 ? ' It costs ' + fmtNum(cost) + ' gold.' : ' It is free below level ' + BALANCE.tree.respecFreeBelowLevel + '.'),
        yes: 'Respec',
        danger: true,
        onYes: function () {
          const r = respec(hero);
          if (!r.ok) toast(r.reason); else toast('Skills reset.');
          refresh();
        }
      });
      return;
    }

    if (act === 'salvage') {
      const item = townFindInvItem(hero, node.dataset.id);
      if (!item) return;
      const r = salvageItem(hero, item);
      if (!r.ok) toast(r.reason);
      else toast('Salvaged for ' + fmtNum(r.yield.ash) + ' Ash' + (r.yield.shards ? ' and ' + fmtNum(r.yield.shards) + ' Starshards' : '') + '.');
      refresh();
      return;
    }

    if (act === 'bulk') {
      const rarity = node.dataset.rarity;
      const p = bulkSalvagePreview(hero, rarity);
      if (p.count <= 0) { toast('Nothing to salvage.'); return; }
      confirmSheet({
        title: 'Salvage ' + fmtNum(p.count) + ' item' + (p.count === 1 ? '' : 's') + '?',
        body: 'Yields ' + fmtNum(p.ash) + ' Ash' + (p.shards ? ' and ' + fmtNum(p.shards) + ' Starshards' : '') + '.',
        yes: 'Salvage',
        danger: true,
        onYes: function () {
          bulkSalvage(hero, rarity);
          refresh();
          toast('Salvaged.');
        }
      });
      return;
    }
