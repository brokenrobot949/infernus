}/* ============================================================
   TOKENS  (CLAUDE.md palette - these are the only colours)
   ============================================================ */
:root{
  --abyss:#15121A;
  --crypt:#1E1A24;
  --raised:#29232F;
  --track:#332C3A;
  --edge:#766B82;
  --bone:#E9E3D8;
  --ash:#ABA3B1;
  --corona:#AE93FF;
  --blood:#D84A45;
  --blood-light:#FF7A70;
  --brass:#D2B06A;

  --r-common:#CFC8BE;
  --r-magic:#86A8FF;
  --r-rare:#EFD45E;
  --r-unique:#EE9657;
  --r-set:#6FCF83;

  /* A general "done" green, for states like a claimed contract. Shares its
     value with the set rarity, but is a separate token so rarity colours
     stay reserved for items. */
  --verdant:#6FCF83;

  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);

  --tab-h:58px;

  /* System UI stack for all reading text. */
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* Display face. Grenze Gotisch is not embedded yet; the fallback stack stands alone for now. */
  --font-display:"Grenze Gotisch","Palatino Linotype",Palatino,Georgia,serif;

  --ease:cubic-bezier(.2,.7,.3,1);
  --dur:180ms;
  --radius:10px;
}

@media (prefers-reduced-motion:reduce){ :root{ --dur:0ms; } }
:root[data-reduce-motion="yes"]{ --dur:0ms; }
:root[data-reduce-motion="no"]{ --dur:180ms; }

/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; padding:0; height:100%; }
html{ font-size:100%; -webkit-text-size-adjust:100%; }
body{
  background:var(--abyss);
  color:var(--bone);
  font-family:var(--font-ui);
  font-size:1rem;
  line-height:1.45;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
svg{ display:block; }
h1,h2,h3,h4{ margin:0; font-weight:600; }
p{ margin:0 0 .75em; }
ul{ margin:0; padding:0; list-style:none; }
:focus-visible{ outline:2px solid var(--corona); outline-offset:2px; border-radius:4px; }
::selection{ background:var(--corona); color:var(--abyss); }

.num{ font-variant-numeric:tabular-nums; }
.display{ font-family:var(--font-display); font-weight:400; letter-spacing:.01em; }
.sr{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.muted{ color:var(--ash); }
.small{ font-size:.875rem; }
.tiny{ font-size:.75rem; }

/* ============================================================
   APP SHELL  - portrait, one column, max 480, centred
   ============================================================ */
#app{
  position:fixed; inset:0;
  max-width:480px; margin:0 auto;
  display:flex; flex-direction:column;
  background:var(--abyss);
  overflow:hidden;
}

/* ---- status strip ---- */
#strip{
  flex:0 0 auto;
  padding:calc(var(--sat) + 8px) calc(12px + var(--sar)) 8px calc(12px + var(--sal));
  background:var(--crypt);
  border-bottom:1px solid var(--track);
}
.strip-row{ display:flex; align-items:center; gap:10px; }
.strip-row + .strip-row{ margin-top:6px; }
.strip-hp{ flex:1 1 auto; min-width:0; }
.strip-meta{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
.strip-stat{ display:flex; align-items:center; gap:5px; font-size:.875rem; }
.strip-stat .ico{ width:15px; height:15px; }
#strip-settings,#strip-help{
  flex:0 0 auto; width:44px; height:44px; margin:-8px 0;
  display:grid; place-items:center; color:var(--ash); border-radius:8px;
}
#strip-settings{ margin-right:-10px; }
#strip-settings:active,#strip-help:active{ background:var(--raised); }

/* ---- main view ---- */
#view{
  flex:1 1 auto; min-height:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:14px calc(12px + var(--sar)) 14px calc(12px + var(--sal));
}

/* ---- primary action dock ----
   A view marks its primary action with .dock; renderView lifts it into #dock,
   a fixed footer between the view and the tab bar, outside the scrolling
   area, so it stays put while the page scrolls. */
#dock{
  flex:0 0 auto;
  padding:10px calc(12px + var(--sar)) 10px calc(12px + var(--sal));
  background:var(--abyss);
  border-top:1px solid var(--track);
}
#dock[hidden]{ display:none; }

/* ---- tab bar ---- */
#tabs{
  flex:0 0 auto;
  display:grid; grid-template-columns:repeat(4,1fr);
  background:var(--crypt);
  border-top:1px solid var(--track);
  padding-bottom:var(--sab);
}
.tab{
  position:relative;
  min-height:var(--tab-h);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  color:var(--ash); font-size:.75rem; letter-spacing:.02em;   /* 12px floor */
  padding:6px 2px;
}
.tab .ico{ width:24px; height:24px; }
.tab[aria-current="page"]{ color:var(--corona); }
.tab .tab-dot{
  position:absolute; top:8px; left:calc(50% + 9px);
  width:7px; height:7px; border-radius:50%; background:var(--corona);
}

/* ============================================================
   PRIMITIVES
   ============================================================ */
.card{
  background:var(--crypt);
  border:1px solid var(--track);
  border-radius:var(--radius);
  padding:14px;
}
.card + .card{ margin-top:10px; }
.card-tap{ display:block; width:100%; text-align:left; }
.card-tap:active{ background:var(--raised); }
.card.sel{ border-color:var(--corona); box-shadow:inset 0 0 0 1px var(--corona); }

.panel{ background:var(--raised); border-radius:var(--radius); padding:12px; }

/* Two across. Cards carry a top margin when they stack in normal flow, and
   inside a grid that margin pushed every card after the first down by 10px
   and stretched its neighbour taller to match, so one column read as bigger
   than the other. The grid cancels it. With .grid-fill-last, an odd final
   card spans the full width instead of leaving a hole. */
/* A resource bar that stays put while the page scrolls under it, for screens
   where what you can afford matters all the way down. The negative side
   margins cancel #view's padding so the bar spans the full width and nothing
   shows through beside it. */
.res-sticky{
  /* top is -14px, not 0, because #view carries 14px of top padding: a sticky
     offset of 0 pins the bar that far down and leaves a strip of the page
     scrolling past above it. The bar's own padding keeps the text clear. */
  position:sticky; top:-14px; z-index:5;
  margin:0 calc(-12px - var(--sar)) 10px calc(-12px - var(--sal));
  padding:12px calc(12px + var(--sar)) 10px calc(12px + var(--sal));
  background:var(--abyss);
  border-bottom:1px solid var(--track);
}

/* The floor picker's grid. Five across at 360px still leaves every tile
   comfortably past the 44px minimum. */
.floor-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
.floor-tile{
  /* A fixed height, not a minimum: the Guardian tiles carry an extra icon,
     and without this their whole row stood taller than the others. */
  height:54px; padding:4px 2px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  background:var(--crypt); border:1px solid var(--track); border-radius:var(--radius);
  color:var(--bone); font-variant-numeric:tabular-nums; font-size:1rem;
}
.floor-tile:active{ background:var(--raised); }
.floor-tile.boss{ border-color:var(--blood-light); }
.floor-tile.sel{ border-color:var(--corona); box-shadow:inset 0 0 0 1px var(--corona); color:var(--corona); }
.floor-tile .ico{ width:12px; height:12px; }

.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.grid-2 > .card{ margin-top:0; }
.grid-fill-last > :last-child:nth-child(odd){ grid-column:1 / -1; }

.row{ display:flex; align-items:center; gap:10px; }
/* Indents a row that has no leading icon so it lines up with rows that do
   (a 20px icon plus the row's 10px gap). */
.row-indent{ padding-left:30px; }
.row-between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
.wrap{ flex-wrap:wrap; }
.grow{ flex:1 1 auto; min-width:0; }
.stack > * + *{ margin-top:10px; }
.stack-s > * + *{ margin-top:6px; }
.divider{ height:1px; background:var(--track); margin:12px 0; }

/* Section headings read as headings, not as labels: bone rather than ash,
   heavier, a touch larger, and with more air above so one section stops
   before the next begins. */
.section-title{
  font-size:.8125rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--bone); font-weight:700; margin:22px 0 8px;
}
.section-title:first-child{ margin-top:0; }

/* ---- buttons ---- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:44px; padding:0 16px;
  border-radius:var(--radius);
  border:1px solid var(--edge);
  background:var(--raised); color:var(--bone);
  font-size:1rem; font-weight:500;
  transition:transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.btn:active{ transform:scale(.985); background:var(--track); }
.btn-primary{ background:var(--corona); color:var(--abyss); border-color:var(--corona); font-weight:600; }
.btn-primary:active{ background:#9c7ff5; }
.btn-danger{ border-color:var(--blood-light); color:var(--blood-light); }
.btn-ghost{ background:none; border-color:var(--track); color:var(--ash); }
.btn-block{ display:flex; width:100%; }
.btn-lg{ min-height:56px; font-size:1.0625rem; }
.btn-sm{ min-height:44px; padding:0 12px; font-size:.875rem; }
.btn[disabled]{ opacity:.42; pointer-events:none; }
.btn .ico{ width:18px; height:18px; }

.btn-row{ display:flex; gap:8px; }
.btn-row > *{ flex:1 1 0; min-width:0; }
/* For a button whose label carries numbers that can grow (a salvage yield
   with Starshards, say). The label wraps onto a second line instead of
   running past the screen edge. It has to be one span: a bare run of text
   and numbers would become several flex items and the button's gap would
   scatter the words. */
.btn-tight{ padding:4px 8px; }
.btn-wrap{ min-width:0; white-space:normal; text-align:center; line-height:1.25; }

/* hold-to-confirm */
.btn-hold{ position:relative; overflow:hidden; touch-action:none; }
.btn-hold .fill{
  position:absolute; inset:0 auto 0 0; width:0;
  background:var(--blood); opacity:.45; pointer-events:none;
}
.btn-hold .lbl{ position:relative; display:inline-flex; align-items:center; gap:8px; }

/* ---- chips ---- */
.chip{
  display:inline-flex; align-items:center; gap:6px;
  min-height:28px; padding:3px 10px;
  border-radius:999px;
  background:var(--raised); border:1px solid var(--track);
  font-size:.8125rem; color:var(--bone);
  max-width:100%;
}
.chip .ico{ width:14px; height:14px; }
.chip-boon{ border-color:var(--r-set); color:var(--r-set); }
.chip-bane{ border-color:var(--blood-light); color:var(--blood-light); }
.chip-pact{ border-color:var(--brass); color:var(--brass); }
.chip-horror{ border-color:var(--corona); color:var(--corona); }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }

/* ---- risk labels (icon + word, never colour alone) ---- */
.risk{ display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:.875rem; }
.risk .ico{ width:16px; height:16px; }
.risk-safe{ color:var(--bone); }
.risk-risky{ color:var(--brass); }
.risk-deadly{ color:var(--blood-light); }

/* ---- bars ---- */
.bar{
  position:relative; height:10px; border-radius:999px;
  background:var(--track); overflow:hidden;
}
.bar-fill{ position:absolute; inset:0 auto 0 0; background:var(--blood); border-radius:999px; }
.bar-lg{ height:14px; }
.bar-xp .bar-fill{ background:var(--corona); }

/* forecast HP bar: kept / maybe / spent */
.hpbar{ position:relative; height:14px; border-radius:999px; background:var(--track); overflow:hidden; }
.hpbar .seg{ position:absolute; top:0; bottom:0; }
.hpbar .seg-kept{ background:var(--blood); }
.hpbar .seg-maybe{ background:var(--blood); opacity:.6; }
.hpbar .seg-spent{
  background-color:var(--blood);
  background-image:repeating-linear-gradient(135deg,rgba(21,18,26,.85) 0 3px,rgba(21,18,26,0) 3px 7px);
}

/* ---- rarity ---- */
.rar-common{ color:var(--r-common); }
.rar-magic{ color:var(--r-magic); }
.rar-rare{ color:var(--r-rare); }
.rar-unique{ color:var(--r-unique); }
.rar-set{ color:var(--r-set); }
.badge{
  display:inline-grid; place-items:center;
  width:20px; height:20px;
  border-radius:4px; font-size:.75rem; font-weight:700; line-height:1;  /* 12px floor */
  border:1px solid currentColor;
}

/* ---- drop reveals: the results sheet's showcase for a unique or set piece ---- */
.showcase-card{
  background:var(--crypt); border-radius:var(--radius);
  padding:18px 16px; margin-bottom:14px; text-align:center;
}
.showcase-row{ display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:6px; }
.showcase-name{ font-size:1.25rem; font-weight:700; line-height:1.3; margin:2px 0; word-break:break-word; }
.showcase-slot{ font-size:.875rem; color:var(--ash); }
.showcase-power{ font-size:.875rem; color:var(--bone); line-height:1.5; margin:8px 0 0; }
.showcase-new{ font-size:.875rem; font-weight:600; color:var(--corona); margin-top:10px; }
/* One pulse in the item's rarity colour (--glow, set per item). Its length
   comes from --dur, which is 0ms under reduced motion, so it vanishes there
   and the rarity border is left as the static highlight. */
.showcase-glow{ animation:showcase-pulse calc(var(--dur) * 5) var(--ease) 1 both; }
@keyframes showcase-pulse{
  0%   { box-shadow:0 0 0 0 var(--glow, transparent); }
  35%  { box-shadow:0 0 26px 4px var(--glow, transparent); }
  100% { box-shadow:0 0 0 0 var(--glow, transparent); }
}
/* Marks a unique or set find in the descent log. */
.ico-mark{ width:14px; height:14px; vertical-align:-0.15em; margin-right:1px; }

/* ---- the live descent log (SCOPES-DESCENT D6) ---- */
.log-tag{
  display:inline-block; padding:0 5px; border-radius:4px;
  border:1px solid var(--corona); color:var(--corona);
  font-size:.75rem; font-weight:700; line-height:1.5; vertical-align:.05em;
}
.log-level{ color:var(--corona); font-weight:600; }
/* The line that just arrived glows once. Its length comes from --dur, which
   is 0ms under reduced motion, so there it simply appears. */
.log-new{ animation:log-arrive calc(var(--dur) * 6) var(--ease) 1 both; border-radius:4px; }
@keyframes log-arrive{
  0%   { background:var(--track); box-shadow:inset 3px 0 0 var(--corona); }   /* the log sits on raised */
  100% { background:transparent;   box-shadow:inset 3px 0 0 transparent; }
}

/* CLAUDE.md gives the coin icon brass. Nothing applied it, so the coin was
   grey everywhere, the status strip included. */
.ico.coin{ color:var(--brass); }

/* ---- the live descent card: sections, and colour that means something ----
   Gold is brass (the coin's colour), XP is corona (the XP bar's), HP is blood
   (the HP bar's) and HP lost is danger red. An encounter's kind carries the
   same colour as its mark on the track - elites brass, Horrors corona,
   Guardians danger red - and always its word too, never colour alone. */
.live-label{ font-size:.75rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ash); }
.live-section{ margin-top:12px; padding-top:12px; border-top:1px solid var(--track); }
.live-tile{ background:var(--raised); border-radius:var(--radius); padding:10px 12px; }
.kind-chip{
  display:inline-flex; align-items:center; min-height:22px; padding:0 8px;
  border-radius:999px; border:1px solid var(--edge); color:var(--ash);
  font-size:.75rem; font-weight:600; white-space:nowrap; vertical-align:middle;
}
.kind-elite{ color:var(--brass); border-color:var(--brass); }
.kind-horror{ color:var(--corona); border-color:var(--corona); }
.kind-guardian{ color:var(--blood-light); border-color:var(--blood-light); }
.val-gold{ color:var(--brass); }
.val-xp{ color:var(--corona); }
.val-loss{ color:var(--blood-light); }
.bar-thin{ height:6px; }

/* ---- the live descent track (SCOPES-DESCENT D5) ----
   Pending marks are hollow and resolved ones filled: shape carries the
   difference, not colour. Resolved marks sit on the corona fill, where bone
   alone is under 3:1, so they are ringed in abyss. Loot pips are plain -
   rarity is shown by the haul's letter badges, never by colour here. */
.live-track{ overflow:visible; }
.track-pack{
  position:absolute; transform:translate(-50%,-50%);
  width:6px; height:6px; border-radius:50%;
  background:transparent; border:1px solid var(--edge);
}
.track-pack.resolved{ background:var(--bone); border-color:var(--abyss); }
.track-elite{
  position:absolute; transform:translate(-50%,-50%) rotate(45deg);
  width:8px; height:8px;
  background:transparent; border:1px solid var(--edge);
}
.track-elite.resolved{ background:var(--bone); border-color:var(--abyss); }
/* Kinds carry their colour, as in the floor picker and the "Fighting" tag. */
.track-elite{ border-color:var(--brass); }
.track-elite.resolved{ background:var(--brass); border-color:var(--abyss); }
.track-boss{
  position:absolute; transform:translate(-50%,-50%);
  width:16px; height:16px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:var(--abyss); border:1px solid var(--edge);
  color:var(--edge); opacity:.7; box-sizing:border-box;
}
.track-boss .ico{ width:11px; height:11px; }
.track-boss.resolved{ border:2px solid var(--bone); color:var(--bone); opacity:1; }
/* ---- the map of Emberhold (SCOPES-TOWNMAP) ---- */
.tmap{ position:relative; margin:0 0 12px; }
.tmap svg{ display:block; width:100%; height:auto; }
/* A place's tap target, invisible until pressed; it then lights in the
   place's accent, the colour of its tile. */
.tmap-hit{
  position:absolute; padding:0; border:0; border-radius:12px; background:none;
  cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.tmap-hit::after{
  content:''; position:absolute; inset:0; border-radius:inherit;
  background:var(--accent); opacity:0; transition:opacity var(--dur) var(--ease);
}
.tmap-hit:active{ box-shadow:inset 0 0 0 2px var(--accent); }
.tmap-hit:active::after{ opacity:.14; }
.tmap-hit:focus-visible{ outline:2px solid var(--corona); outline-offset:-2px; }

/* The map's movement: the Chapel's and Forge's light breathe, the pit's glow
   swells slowly, and embers drift up out of the Breach. These are loops of
   several seconds, so rather than --dur they follow the same motion setting
   through --ambient: paused, they are a still picture. */
:root{ --ambient:running; }
@media (prefers-reduced-motion:reduce){ :root{ --ambient:paused; } }
:root[data-reduce-motion="yes"]{ --ambient:paused; }
:root[data-reduce-motion="no"]{ --ambient:running; }
.tm-breathe{ animation:tm-breathe 4.4s ease-in-out infinite; animation-play-state:var(--ambient); }
.tm-breathe.tm-quick{ animation-duration:3.2s; }
.tm-breathe.tm-slow{ animation-duration:6s; }
@keyframes tm-breathe{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
.tm-ember{ opacity:0; animation:tm-ember 7s linear infinite; animation-play-state:var(--ambient); }
@keyframes tm-ember{
  0%   { transform:translate(0,0); opacity:0; }
  12%  { opacity:.9; }
  70%  { opacity:.5; }
  100% { transform:translate(6px,-48px); opacity:0; }
}

.track-boss.is-horror{ color:var(--corona); border-color:var(--corona); }
.track-boss.is-guardian{ color:var(--blood-light); border-color:var(--blood-light); }
.track-crit{
  position:absolute; top:0; transform:translate(-50%,0);
  color:var(--brass); pointer-events:none;
}
.track-crit .ico{ width:8px; height:8px; }
.track-pip{
  position:absolute; top:29px; transform:translate(-50%,0);
  width:3px; height:3px; border-radius:50%;
  background:var(--ash); pointer-events:none;
}
.track-hero{
  position:absolute; transform:translate(-50%,-50%);
  width:2px; height:22px; border-radius:1px;
  background:var(--corona); pointer-events:none;
  transition:left var(--dur) linear;
}

/* CLAUDE.md: every tap target is at least 44px tall. */
button[data-act]{ min-height:44px; }
#tabs .tab{ min-height:var(--tab-h); }
/* ...and the primary action, 56px (the rule above would otherwise win). */
button.btn-lg[data-act]{ min-height:56px; }

/* ---- icons ---- */
/* inline-block so an icon sits inside a run of text instead of breaking the line */
.ico{ width:20px; height:20px; fill:currentColor; flex:0 0 auto;
      display:inline-block; vertical-align:-0.15em; }

/* ============================================================
   BOTTOM SHEETS
   ============================================================ */
#sheets{ position:fixed; inset:0; z-index:40; pointer-events:none; }
#sheets:empty{ display:none; }
.sheet-back{
  position:absolute; inset:0;
  background:rgba(8,6,11,.66);
  opacity:0; transition:opacity var(--dur) var(--ease);
  pointer-events:auto;
}
.sheet{
  position:absolute; left:50%; bottom:0;
  width:100%; max-width:480px;
  transform:translate(-50%,100%);
  transition:transform var(--dur) var(--ease);
  background:var(--raised);
  border-radius:16px 16px 0 0;
  border-top:1px solid var(--edge);
  max-height:88%;
  display:flex; flex-direction:column;
  pointer-events:auto;
  will-change:transform;
}
.sheet-open .sheet-back{ opacity:1; }
.sheet-open .sheet{ transform:translate(-50%,0); }
.sheet-grip{ flex:0 0 auto; padding:8px 0 4px; display:grid; place-items:center; touch-action:none; }
.sheet-grip i{ display:block; width:38px; height:4px; border-radius:999px; background:var(--edge); }
.sheet-head{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:4px 14px 10px;
}
.sheet-head h2{ font-size:1.125rem; flex:1 1 auto; min-width:0; }
.sheet-close{ width:44px; height:44px; margin:-10px -10px -10px 0; display:grid; place-items:center; color:var(--ash); border-radius:8px; }
.sheet-close:active{ background:var(--track); }
.sheet-body{
  flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding:0 14px 14px;
}
.sheet-foot{
  flex:0 0 auto; padding:10px 14px calc(12px + var(--sab));
  border-top:1px solid var(--track); background:var(--raised);
}

/* ============================================================
   TOASTS
   ============================================================ */
#toasts{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(var(--tab-h) + var(--sab) + 12px);
  z-index:60; width:100%; max-width:456px;
  display:flex; flex-direction:column; gap:8px; align-items:center;
  pointer-events:none; padding:0 12px;
}
.toast{
  background:var(--raised); border:1px solid var(--edge);
  border-radius:999px; padding:9px 16px; font-size:.875rem;
  box-shadow:0 6px 20px rgba(0,0,0,.45);
  animation:toast-in var(--dur) var(--ease);
}
@keyframes toast-in{ from{ opacity:0; transform:translateY(6px); } }

/* ============================================================
   DEBUG PANEL  (?debug=1 only)
   ============================================================ */
#debug-fab{
  position:fixed; right:calc(10px + var(--sar));
  bottom:calc(var(--tab-h) + var(--sab) + 14px);
  z-index:50;
  width:48px; height:48px; border-radius:50%;
  background:var(--corona); color:var(--abyss);
  display:grid; place-items:center; font-weight:700; font-size:.75rem;
  box-shadow:0 4px 16px rgba(0,0,0,.5);
}
.dbg-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(92px,1fr)); gap:8px; }
.dbg-out{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.75rem; line-height:1.5; white-space:pre-wrap; word-break:break-word;
  background:var(--crypt); border:1px solid var(--track); border-radius:8px; padding:10px;
  max-height:300px; overflow:auto;
}
.field{ display:block; }
.field > span{ display:block; font-size:.75rem; color:var(--ash); margin-bottom:4px; }
.field input,.field select,.field textarea{
  width:100%; min-height:44px; padding:8px 10px;
  background:var(--crypt); border:1px solid var(--edge); border-radius:8px;
  color:var(--bone);
}
.field textarea{ min-height:120px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.75rem; }
/* ============================================================
   Infernus — Hero tab rework, part "banner" (X = banner)
   SCOPES-HERO.md H1, H2 (page-button half), H6, H7. SPEC.md §19.3.
   Prefixes: .hb- (banner), .hs- (stats).
   ============================================================ */

/* H1: the sigil, its frame ring and the glow behind it only. Border
   colour is set inline per hero (FRAME_COLOURS[bestFrame()] or --track). */
.hb-sigil-wrap{ position:relative; width:64px; height:64px; flex:0 0 auto; }
.hb-sigil-glow{
  position:absolute; inset:-11px; border-radius:50%;
  background:radial-gradient(circle, rgba(174,147,255,.38) 0%, rgba(174,147,255,0) 72%);
  pointer-events:none;
}
.hb-sigil-ring{
  position:relative; width:64px; height:64px; border-radius:50%;
  border:2px solid var(--track); background:var(--raised);
  display:flex; align-items:center; justify-content:center;
}

/* H1: the level / Abyssal-rank bar, slimmer than the default .bar-xp
   now that it sits in the banner rather than its own Stats card. */
.hb-bar-slim{ height:6px; }

/* H2: the reminder dot (Gear, Stats) and count pill (Skills) on the
   segmented control. Colours are set inline so they can flip to abyss
   shades on the active (corona-background) button. */
.hb-dot{ display:inline-block; width:6px; height:6px; border-radius:50%; margin-left:5px; vertical-align:middle; }
.hb-pill{
  display:inline-grid; place-items:center; min-width:20px; height:18px; padding:0 6px;
  border-radius:999px; font-size:.75rem; font-weight:700; margin-left:6px; line-height:1;
}

/* H7: the Power stacked bar and its two-column legend. */
.hs-stackbar{ display:flex; height:12px; border-radius:6px; overflow:hidden; gap:2px; margin-top:14px; }
.hs-legend{ display:grid; grid-template-columns:1fr 1fr; gap:9px 12px; margin-top:14px; }
.hs-legend-item{ display:flex; align-items:center; gap:8px; font-size:.875rem; min-width:0; }
.hs-legend-sw{ width:10px; height:10px; border-radius:2px; flex:0 0 auto; }

/* H6: compact stat tiles. Background/border/tap state come from the
   existing .card/.card-tap classes; these only size the two text rows.
   Colour is bone by default (inherited from body) and ash via the
   existing .muted utility when a tile dims. */
.hs-stat-label{ font-size:.875rem; }
.hs-stat-value{ font-size:1.125rem; font-weight:700; margin-top:4px; }
/* ============================================================
   HERO TAB REWORK - Skills page (SCOPES-HERO.md H8, H9, H10)
   Every selector below is prefixed .ht-. Palette tokens only.
   ============================================================ */

/* ---- H9: the points bar ---- */
.ht-sp-pill{
  background:var(--corona); color:var(--abyss); font-weight:700;
  font-size:.8125rem; padding:4px 10px; border-radius:999px; line-height:1.4;
}

/* ---- H10: rite slot cards ---- */
.ht-rite-card{ min-height:52px; padding:10px 12px; }
/* Edge, not track: the empty slot is a control, and control borders need 3:1. */
.ht-rite-dashed{ border:1px dashed var(--edge) !important; }

/* ---- H8: branch tabs ---- */
.ht-branch-tab{
  flex:1 1 0; min-width:0; min-height:44px; padding:7px 6px;
  border-radius:var(--radius); border:1px solid var(--edge);
  background:var(--raised); text-align:center; color:var(--ash);
  position:relative;
}
.ht-branch-tab-active{ border:2px solid var(--corona); color:var(--corona); }
.ht-branch-dot{
  position:absolute; top:6px; right:6px; width:7px; height:7px;
  border-radius:50%; background:var(--corona);
}
.ht-branch-name{
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ---- legend line ---- */
.ht-legend2{
  display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center;
  margin-top:12px; color:var(--ash); font-size:.75rem;
}
.ht-legend2 .row{ gap:5px; }

/* ---- the tree ---- */
.ht-tree{ position:relative; margin-top:12px; }
.ht-tree-line{
  position:absolute; left:50%; top:0; bottom:0; width:2px;
  background:var(--track); transform:translateX(-50%); z-index:0;
}
.ht-trow{ position:relative; display:flex; gap:12px; z-index:1; }
.ht-trow + .ht-gate{ margin-top:10px; }
.ht-gate + .ht-trow{ margin-top:10px; }
.ht-trow + .ht-trow{ margin-top:10px; }

.ht-gate{ position:relative; z-index:1; display:flex; justify-content:center; }
.ht-gate-pill{
  background:var(--raised); border-radius:999px; padding:4px 10px 4px 8px;
  font-size:.75rem; color:var(--ash); display:inline-flex; align-items:center; gap:5px;
}

/* ---- node card ---- */
.ht-node{
  background:var(--crypt); border-radius:10px; padding:8px;
  display:flex; gap:8px; position:relative; flex:1 1 0; min-width:0;
  text-align:left;
}
.ht-node-solo{ flex:0 1 65%; margin:0 auto; }
.ht-node-shape{
  width:28px; height:28px; flex:0 0 auto;
  display:flex; align-items:center; justify-content:center; position:relative;
}
.ht-node-body{ min-width:0; }
.ht-node-name{ font-size:.875rem; font-weight:600; color:var(--bone); }
.ht-node-effect{ font-size:.75rem; color:var(--ash); margin-top:2px; line-height:1.3; }
.ht-clamp2{
  display:-webkit-box; -webkit-line-clamp:2; line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden;
}
.ht-pips{ display:flex; gap:3px; margin-top:6px; }
.ht-pip{ width:6px; height:6px; border-radius:50%; box-sizing:border-box; flex:0 0 auto; }
.ht-pip-on{ background:var(--corona); }
.ht-pip-off{ border:1.5px solid var(--edge); }

.ht-node-badge{
  position:absolute; top:-7px; right:-7px; width:18px; height:18px; border-radius:50%;
  background:var(--corona); color:var(--abyss);
  display:flex; align-items:center; justify-content:center;
  font-size:.75rem; font-weight:700; line-height:1;
}
.ht-node-lock{
  position:absolute; top:6px; right:6px; width:13px; height:13px; color:var(--ash);
}
.ht-node-check{
  position:absolute; bottom:-1px; right:-1px; width:12px; height:12px;
  color:var(--corona); background:var(--crypt); border-radius:50%;
  padding:1px; box-sizing:border-box;
}
/* HERO TAB REWORK - GEAR PART (X = gear). SCOPES-HERO H3/H4/H5. */

/* ---- H3: paper doll ---- */
.hd-doll{
  display:grid;
  grid-template-columns:1fr 96px 1fr;
  grid-auto-rows:minmax(72px,auto);
  gap:8px;
}
/* Left column head-to-foot, figure spanning all 3 rows, right column
   hands-and-neck. The markup order (helm, armor, boots, figure, weapon,
   gloves, relic) is fixed, so nth-child placement is safe. */
.hd-doll > :nth-child(1){ grid-column:1; grid-row:1; }
.hd-doll > :nth-child(2){ grid-column:1; grid-row:2; }
.hd-doll > :nth-child(3){ grid-column:1; grid-row:3; }
.hd-doll > :nth-child(4){ grid-column:2; grid-row:1 / 4; }
.hd-doll > :nth-child(5){ grid-column:3; grid-row:1; }
.hd-doll > :nth-child(6){ grid-column:3; grid-row:2; }
.hd-doll > :nth-child(7){ grid-column:3; grid-row:3; }

.hd-tile{
  background:var(--crypt);
  border-radius:var(--radius);
  padding:8px;
  min-height:72px;
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.hd-tile-empty{ justify-content:flex-start; gap:8px; }

.hd-tiletop{ display:flex; align-items:flex-start; justify-content:space-between; gap:4px; }
.hd-slotlabel{ display:flex; align-items:center; gap:4px; color:var(--ash); font-size:.75rem; min-width:0; }
.hd-slotlabel .ico{ flex:0 0 auto; }
.hd-tiletop-right{ display:flex; align-items:center; gap:6px; flex:0 0 auto; color:var(--ash); }
.hd-arrow{ color:var(--corona); font-size:.8125rem; font-weight:700; line-height:1; }

.hd-itemname{
  display:flex; align-items:flex-start; gap:4px;
  font-size:.875rem; font-weight:600; line-height:1.25; margin-top:4px;
}
.hd-clamp2{
  flex:1 1 auto; min-width:0;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.hd-bagnote{ font-size:.75rem; color:var(--corona); margin-top:2px; }

.hd-figure{ display:flex; align-items:center; justify-content:center; min-width:0; }
.hd-figure svg{ width:100%; height:100%; display:block; }

/* Visually hidden but still read by a screen reader. */
.hd-vh{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
}

/* ---- H4: Equip upgrades ---- */
/* Two classes so this beats the base game's `button[data-act]{min-height:44px}`
   rule (id,class,type = 0,0,1,1) on specificity (0,0,2,0), not just source order. */
.btn.hd-upgrades-btn{ width:100%; min-height:48px; margin-top:10px; }

.hd-upsummary{ font-size:1rem; font-weight:600; color:var(--bone); margin-bottom:12px; }
.hd-uprows > * + *{ margin-top:8px; }
.hd-uprow{
  display:flex; align-items:flex-start; gap:10px; width:100%;
  min-height:44px; padding:10px;
  border-radius:var(--radius); border:1px solid var(--track);
  background:var(--crypt); text-align:left;
}
.hd-checkbox{
  width:20px; height:20px; flex:0 0 auto; margin-top:2px;
  border-radius:4px; border:2px solid var(--edge);
  display:flex; align-items:center; justify-content:center;
  font-size:.8125rem; font-weight:700; color:transparent;
}
.hd-checked{ border-color:var(--corona); background:var(--corona); color:var(--abyss); }
.hd-uprow-body{ flex:1 1 auto; min-width:0; }
.hd-upsub{ font-size:.875rem; color:var(--ash); margin-top:2px; }
.hd-upgain{ font-size:.875rem; color:var(--corona); font-weight:600; margin-top:4px; }
.hd-uploss{ font-size:.875rem; color:var(--blood-light); margin-top:2px; }

/* ---- H5: set tracker ---- */
.hd-settracker{ margin-top:14px; }
.hd-setcard{ line-height:1.4; }
.hd-ellip{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hd-setbonus{ margin-top:8px; }
.hd-set-active{ color:var(--r-set); font-weight:600; white-space:nowrap; }
.hd-set-need{ color:var(--ash); white-space:nowrap; }
.hd-setmissing{ margin-top:8px; font-size:.875rem; }
.hd-setmissing-vault{ color:var(--ash); }
.hd-baglink{
  display:inline-flex; align-items:center; min-height:44px;
  color:var(--corona); font-weight:600; font-size:.875rem;
  vertical-align:middle;
}
</style>

/* ============================================================
   THE CLOCK - SPEC 20. One source of time for the whole game.
   Every piece of progress is derived from stored timestamps,
   never from counting ticks, because phones freeze background tabs.
   ============================================================ */
let DEBUG_OFFSET = 0;
try {
  DEBUG_OFFSET = parseInt(localStorage.getItem(BALANCE.debug.offsetKey) || '0', 10) || 0;
} catch (e) { DEBUG_OFFSET = 0; }

function now() { return Date.now() + DEBUG_OFFSET; }

function setDebugOffset(ms) {
  DEBUG_OFFSET = ms;
  try { localStorage.setItem(BALANCE.debug.offsetKey, String(ms)); } catch (e) {}
}
function addDebugOffset(ms) { setDebugOffset(DEBUG_OFFSET + ms); }

/* Elapsed time between two stamps. Time never runs backward (SPEC 20). */
function elapsed(since, until) {
  const t = (until === undefined ? now() : until) - since;
  return t > 0 ? t : 0;
}

const MINUTE = 60 * 1000;
const HOUR = 60 * MINUTE;
const DAY = 24 * HOUR;

/* ============================================================
   SEEDED RANDOMNESS - SPEC/CLAUDE.md.
   cyrb53 hashes a seed string, mulberry32 generates.
   Gameplay outcomes NEVER use Math.random.
   ============================================================ */
function cyrb53(str, seed) {
  let h1 = 0xdeadbeef ^ (seed || 0), h2 = 0x41c6ce57 ^ (seed || 0);
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return 4294967296 * (2097151 & h2) + (h1 >>> 0);
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* A small PRNG object built from a seed string. Deterministic and replayable. */
function rngFrom(seedStr) {
  const next = mulberry32(cyrb53(String(seedStr), 0) >>> 0);
  return {
    next,
    float(lo, hi) { return lo + next() * (hi - lo); },
    int(lo, hi) { return Math.floor(lo + next() * (hi - lo + 1)); },   // inclusive
    chance(p) { return next() < p; },
    pick(arr) { return arr[Math.floor(next() * arr.length)]; },
    weighted(entries) {
      // entries: [ [value, weight], ... ]
      let total = 0;
      for (const e of entries) total += e[1];
      if (total <= 0) return entries.length ? entries[0][0] : null;
      let r = next() * total;
      for (const e of entries) { r -= e[1]; if (r < 0) return e[0]; }
      return entries[entries.length - 1][0];
    },
    shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(next() * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    }
  };
}

/* A fresh seed string for something that is being rolled now. */
function newSeed(tag) {
  return tag + '-' + now().toString(36) + '-' + Math.floor(Math.random() * 0xffffff).toString(36);
}

/* ============================================================
   MATH HELPERS
   ============================================================ */
function g(x) { return Math.pow(BALANCE.growth, x - 1); }
function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
function bandValue(bands, floor) {
  for (const b of bands) if (floor <= b.max) return b;
  return bands[bands.length - 1];
}

/* ============================================================
   FORMATTING - SPEC 19.6. Every number goes through fmtNum,
   every duration through fmtTime.
   ============================================================ */
function fmtNum(n) {
  if (n === null || n === undefined || !isFinite(n)) return '0';
  const neg = n < 0;
  let v = Math.abs(n);
  let out;

  if (v < 10000) {
    out = Math.floor(v).toLocaleString('en-US');
  } else if (v < 1e15) {
    const units = [ [1e12, 'T'], [1e9, 'B'], [1e6, 'M'], [1e3, 'K'] ];
    let unit = 'K', div = 1e3;
    for (const u of units) { if (v >= u[0]) { div = u[0]; unit = u[1]; break; } }
    const scaled = v / div;
    // three significant digits, trailing zeros dropped
    const decimals = scaled >= 100 ? 0 : (scaled >= 10 ? 1 : 2);
    out = String(parseFloat(scaled.toFixed(decimals))) + unit;
  } else {
    out = v.toExponential(2);                       // three significant digits
    out = out.replace(/e\+?/, 'e');
  }
  return (neg ? '-' : '') + out;
}

/* Durations. Countdowns round up.
   Seconds are shown below two minutes, so the short descents on floors 1-3
   read precisely instead of rounding to "2m" (SPEC 19.6). */
const SECONDS_BELOW = 120;

function fmtTime(ms) {
  if (!isFinite(ms) || ms < 0) ms = 0;
  const totalSec = Math.ceil(ms / 1000);
  if (totalSec < SECONDS_BELOW) return totalSec + 's';
  const totalMin = Math.ceil(ms / MINUTE);
  if (totalMin < 60) return totalMin + 'm';
  const totalHours = ms / HOUR;
  if (totalHours < 24) {
    const h = Math.floor(ms / HOUR);
    const m = Math.ceil((ms - h * HOUR) / MINUTE);
    if (m === 60) return (h + 1) + 'h';
    return m > 0 ? h + 'h ' + m + 'm' : h + 'h';
  }
  const d = Math.floor(ms / DAY);
  const h = Math.ceil((ms - d * DAY) / HOUR);
  if (h === 24) return (d + 1) + 'd';
  return h > 0 ? d + 'd ' + h + 'h' : d + 'd';
}

/* Percentages: whole numbers, or one decimal below 10%. Takes 0-1 or a
   percent number depending on `asFraction`. */
function fmtPct(v, asFraction) {
  let p = asFraction ? v * 100 : v;
  if (!isFinite(p)) p = 0;
  const abs = Math.abs(p);
  const s = abs < 10 ? String(parseFloat(p.toFixed(1))) : String(Math.round(p));
  return s + '%';
}

function fmtSigned(n) { return (n >= 0 ? '+' : '') + fmtNum(n); }

function esc(s) {

    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

function h(html) {

}

/* Event delegation: one listener per root, actions declared with data-act. */
function delegate(root, handler) {
  root.addEventListener('click', function (ev) {
    const target = ev.target.closest('[data-act]');
    if (!target || !root.contains(target)) return;
    handler(target.dataset.act, target, ev);
  });
}

      if (h.oilPrimed === undefined) h.oilPrimed = false;
      if (h.task === undefined) h.task = null;          // SPEC 13.6
      if (!h.abyssal) h.abyssal = { ranks: 0, spent: {} };
      if (!h.abyssal.spent) h.abyssal.spent = {};
      // An heirloom needs its own ceiling remembered (SPEC 15.4).

        if (it && it.heirloom && it.originalIlvl === undefined) it.originalIlvl = it.ilvl;
      };
      for (const slot in (h.equipment || {})) fix(h.equipment[slot]);
      for (const it of (h.inventory || [])) fix(it);
    }
    if (acct.heirloom && acct.heirloom.originalIlvl === undefined) {
      acct.heirloom.originalIlvl = acct.heirloom.ilvl;
    }
    return s;
  },

  /* Until now the Hollow Warden's first-kill unique and anything bought from
     the Black Market never reached the Armory. The code is fixed, but an
     existing save still has the gap, so rebuild the Armory from every item
     the account can still see: worn, carried, the heirloom, and the gear on
     each champion's plaque. Uniques already sold or salvaged cannot be
     recovered - nothing recorded them at the time. */
  3: function (s) {
    const acct = s.account || (s.account = {});
    if (!Array.isArray(acct.armory)) acct.armory = [];

    const note = function (it) {
      if (!it) return;
      const id = it.uniqueId || (it.rarity === 'set' ? it.name : null);
      if (id && acct.armory.indexOf(id) < 0) acct.armory.push(id);
    };
    const sweep = function (owner) {
      if (!owner) return;
      for (const slot in (owner.equipment || {})) note(owner.equipment[slot]);
      for (const it of (owner.inventory || [])) note(it);
    };

    sweep(s.hero);
    note(acct.heirloom);
    for (const champ of (acct.champions || [])) sweep(champ);
    return s;
  },

  /* Phase 3 added the Chapel Offering: a timed town buff bought with gold.
     Saves from before it have no `offering` field on the hero. Nothing to
     do with account.blessings, the Ascension legacy, which already existed
     and needs no migration. Idempotent: it only fills a missing field. */
  4: function (s) {
    if (s.hero && s.hero.offering === undefined) s.hero.offering = null;
    return s;
  },

  /* Phase 3 added the Vault, a per-hero stash beside the inventory. Saves
     from before it have neither field. Idempotent: it only fills gaps. */
  5: function (s) {
    if (s.hero) {
      if (!Array.isArray(s.hero.vault)) s.hero.vault = [];
      if (s.hero.vaultUpgrades === undefined) s.hero.vaultUpgrades = 0;
    }
    return s;
  }
};

function migrate(save) {
  let v = save.version || 1;
  while (v < BALANCE.save.version) {
    const step = MIGRATIONS[v + 1];
    if (!step) { v = BALANCE.save.version; break; }
    save = step(save);
    v = v + 1;
    save.version = v;
  }
  save.version = BALANCE.save.version;
  return save;
}

let state = null;
let saveTimer = null;

function load() {
  let raw = null;
  try { raw = localStorage.getItem(BALANCE.save.key); } catch (e) { raw = null; }
  if (!raw) { state = freshSave(); return false; }
  try {
    const parsed = JSON.parse(raw);
    state = migrate(parsed);
    return true;
  } catch (e) {
    console.error('Save could not be read; starting fresh.', e);
    state = freshSave();
    return false;
  }
}

function save() {
  if (!state) return;
  if (typeof SIMULATING !== 'undefined' && SIMULATING) return;   // the simulator never writes
  state.savedAt = now();
  try {
    localStorage.setItem(BALANCE.save.key, JSON.stringify(state));
  } catch (e) {
    console.error('Save failed', e);
  }
}

function startAutosave() {
  if (saveTimer) clearInterval(saveTimer);
  saveTimer = setInterval(save, BALANCE.save.autosaveMs);
  window.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') save();
  });
  window.addEventListener('pagehide', save);
}

/* ---- Export and Import (SPEC 20). Base64 of the UTF-8 JSON. ---- */
function exportSave() {
  save();
  const json = JSON.stringify(state);
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function decodeSave(text) {
  const bin = atob(String(text).replace(/\s+/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const json = new TextDecoder().decode(bytes);
  const parsed = JSON.parse(json);
  if (typeof parsed !== 'object' || parsed === null || typeof parsed.version !== 'number') {
    throw new Error('That does not look like an Infernus save.');
  }
  return migrate(parsed);
}

/* ============================================================
   HERO STATS - SPEC 3
   Two kinds of stat:
     CORE    - might, guard, maxHp. A base value, then percent bonuses.
     PERCENT - haste, fortune, recovery, crit, goldFind, itemFind,
               xpBonus, eliteBoss, riteCd. These start at 0 and
               accumulate in percentage points, so "+6% Recovery"
               means +6 points, not x1.06.
   ============================================================ */
const CORE_STATS = ['might', 'guard', 'maxHp'];
const PERCENT_STATS = ['haste', 'fortune', 'recovery', 'crit', 'goldFind',
                       'itemFind', 'xpBonus', 'eliteBoss', 'riteCd'];

function emptyStats() {
  const s = { might: 0, guard: 0, maxHp: 0 };
  for (const p of PERCENT_STATS) s[p] = 0;
  return s;
}

/* Affix id -> which stat it feeds and how. */
const AFFIX_TARGETS = {
  might_pct:  { stat: 'might',    mode: 'pct' },
  guard_pct:  { stat: 'guard',    mode: 'pct' },
  max_hp:     { stat: 'maxHp',    mode: 'flat' },
  haste:      { stat: 'haste',    mode: 'points' },
  fortune:    { stat: 'fortune',  mode: 'points' },
  gold_find:  { stat: 'goldFind', mode: 'points' },
  item_find:  { stat: 'itemFind', mode: 'points' },
  recovery:   { stat: 'recovery', mode: 'points' },
  crit:       { stat: 'crit',     mode: 'points' },
  elite_boss: { stat: 'eliteBoss', mode: 'points' },
  rite_cd:    { stat: 'riteCd',   mode: 'points' }
};

/* ---- SPEC 11.2: an item's base stats, computed from its stored fields ---- */
function itemBase(item) {
  const out = { might: 0, guard: 0, maxHp: 0, haste: 0, fortune: 0, recovery: 0 };
  if (!item) return out;
  const s = g(item.ilvl);
  const mult = (RARITY_BASE_MULT[item.rarity] || 1) * (1 + BALANCE.items.temperStep * (item.temper || 0));

  if (item.slot === 'relic') {
    const def = RELIC_STATS[item.relicStat];
    if (def) out[def.stat] = (def.base + def.perIlvl * item.ilvl) * mult;
    return out;
  }
  const bases = SLOT_BASES[item.slot] || {};
  for (const k in bases) out[k] = bases[k] * s * mult;
  return out;
}

/* Floor band index for an item level, SPEC 11.6 */
function bandIndex(floor) {
  for (const b of AFFIX_BANDS) if (floor >= b.minFloor && floor <= b.maxFloor) return b.index;
  return AFFIX_BANDS[AFFIX_BANDS.length - 1].index;
}

/* ---- Gather every modifier an item contributes ---- */
function applyItemToBuckets(item, flat, pct, points) {
  if (!item) return;
  const base = itemBase(item);
  flat.might += base.might || 0;
  flat.guard += base.guard || 0;
  flat.maxHp += base.maxHp || 0;
  points.haste += base.haste || 0;
  points.fortune += base.fortune || 0;
  points.recovery += base.recovery || 0;

  for (const a of (item.affixes || [])) {
    const t = AFFIX_TARGETS[a.id];
    if (!t) continue;
    if (t.mode === 'flat') flat[t.stat] += a.value;
    else if (t.mode === 'pct') pct[t.stat] += a.value;
    else points[t.stat] += a.value;
  }
}

/* ---- Learned passive/keystone effects, SPEC 10 ---- */
function nodeById(classId, nodeId) {
  const tree = TREES[classId];
  if (!tree) return null;
  for (const br of tree.branches) for (const n of br.nodes) if (n.id === nodeId) return n;
  return null;
}
function branchOfNode(classId, nodeId) {
  const tree = TREES[classId];
  if (!tree) return null;
  for (const br of tree.branches) for (const n of br.nodes) if (n.id === nodeId) return br;
  return null;
}

/* Every effect currently in force, as { effect, rank } pairs.
   `context` controls which rite effects count:
     - passives always count
     - a rite's effects count only when it is active (timed) or primed */
function activeEffects(hero, opts) {
  opts = opts || {};
  const out = [];
  const tree = TREES[hero.classId];
  if (!tree) return out;
  const t = opts.at === undefined ? now() : opts.at;

  for (const br of tree.branches) {
    for (const n of br.nodes) {
      const rank = effectiveRank(hero, n);
      if (rank <= 0) continue;

      if (n.type === 'rite') {
        if (opts.excludeRites) continue;
        // A rite contributes only while it is active or primed for this descent.
        const timed = (hero.timed || []).find(function (x) { return x.riteId === n.id; });
        const isTimed = timed && t >= timed.startsAt && t < timed.endsAt;
        const isPrimed = (hero.primed || []).some(function (x) { return x.riteId === n.id; });
        const forced = opts.forceRites && opts.forceRites.indexOf(n.id) >= 0;
        if (!isTimed && !isPrimed && !forced) continue;
      }
      for (const e of (n.effects || [])) out.push({ e: e, rank: rank, node: n });
    }
  }
  return out;
}

/* Sum an effect's magnitude at a rank. */
function effAmount(entry) {
  const e = entry.e;
  if (e.per !== undefined) return e.per * entry.rank;
  if (e.value !== undefined) return e.value;
  return 0;
}

/* ---- SPEC 3.2: the calculation order ----
   heroBuckets does steps 1-3 and keeps the parts separate, so a descent
   can re-finalise the same hero with extra mid-descent bonuses (Warcry's
   window, Bloodlust's stacks, Blood Fury's missing HP) without rebuilding
   everything. finalizeStats does steps 4-5. */
function heroBuckets(hero, opts) {
  opts = opts || {};
  const cls = BALANCE.classes[hero.classId] || BALANCE.classes.juggernaut;
  const L = hero.level;

  // 1. level base
  const flat = {
    might: BALANCE.base.might * g(L),
    guard: BALANCE.base.guard * g(L),
    maxHp: BALANCE.base.maxHp * g(L)
  };
  const pct = { might: 0, guard: 0, maxHp: 0 };
  const points = {};
  for (const p of PERCENT_STATS) points[p] = 0;
  points.crit = cls.crit;                     // class base crit chance

  // 2. flat values from equipped items
  for (const slot of BALANCE.items.slots) applyItemToBuckets(hero.equipment[slot], flat, pct, points);

  /* Debug-only hook: the simulator's par hero (SPEC 21.1) needs exact Might,
     Guard and Max HP before class multipliers. Never set on a real hero. */
  if (hero.simFlat) { for (const k in hero.simFlat) flat[k] += hero.simFlat[k]; }
  if (hero.simPoints) { for (const k in hero.simPoints) points[k] += hero.simPoints[k]; }

  // Blessings from ascended champions (SPEC 15.3), account-wide.
  const bl = (state && state.account && state.account.blessings) || {};
  pct.maxHp += bl.maxHp || 0;
  points.haste += bl.haste || 0;
  points.itemFind += bl.itemFind || 0;
  points.xpBonus += bl.xpGold || 0;
  points.goldFind += bl.xpGold || 0;

  // Abyssal Ranks (SPEC 4) - one point each, spent across six options.
  const spent = (hero.abyssal && hero.abyssal.spent) || {};
  for (const id in spent) {
    const opt = BALANCE.abyssal.options[id];
    if (!opt) continue;
    const amount = opt.per * spent[id];
    if (CORE_STATS.indexOf(opt.stat) >= 0) pct[opt.stat] += amount;
    else points[opt.stat] += amount;
  }

  // 3. percent bonuses from passives, rites and set bonuses
  const effects = activeEffects(hero, opts).concat(gearEffects(hero));
  const multipliers = [];
  for (const entry of effects) {
    const e = entry.e;
    if (e.k === 'stat_pct') {
      const amt = effAmount(entry);
      if (CORE_STATS.indexOf(e.stat) >= 0) pct[e.stat] += amt;
      else points[e.stat] += amt;
    } else if (e.k === 'crit') {
      points.crit += effAmount(entry);
    } else if (e.k === 'stat_mult') {
      multipliers.push({ stat: e.stat, value: e.value });
    }
  }
  return { flat: flat, pct: pct, points: points, cls: cls, multipliers: multipliers, effects: effects };
}

/* Steps 4-5. extraPct / extraPoints let the descent add temporary bonuses. */
function finalizeStats(b, extraPct, extraPoints) {
  const st = emptyStats();
  for (const c of CORE_STATS) {
    const extra = (extraPct && extraPct[c]) || 0;
    st[c] = b.flat[c] * (1 + (b.pct[c] + extra) / 100);
  }
  for (const p of PERCENT_STATS) st[p] = b.points[p] + ((extraPoints && extraPoints[p]) || 0);

  // 4. class multipliers
  st.might *= b.cls.might;
  st.guard *= b.cls.guard;
  st.maxHp *= b.cls.maxHp;

  // 5. keystone multipliers
  for (const m of b.multipliers) st[m.stat] *= m.value;

  st.crit = clamp(st.crit, 0, BALANCE.caps.crit * 100);
  st.maxHp = Math.max(1, Math.floor(st.maxHp));
  st.power = powerOf(st);
  return st;
}

function heroStats(hero, opts) { return finalizeStats(heroBuckets(hero, opts)); }

function powerOf(st) {
  return Math.pow(Math.max(st.guard, 0.0001), BALANCE.power.guardExp) *
         Math.pow(Math.max(st.might, 0.0001), BALANCE.power.mightExp);
}

/* ============================================================
   LEVELS AND XP - SPEC 4
   ============================================================ */
function parWeight(L) {
  const early = BALANCE.xp.parWeightEarly;
  return L <= early.length ? early[L - 1] : BALANCE.xp.parWeightLate;
}
function xpToNext(L) {
  if (L >= BALANCE.levelCap) return Infinity;
  const pace = Math.max(1, BALANCE.xp.paceBase + BALANCE.xp.pacePerLevel * L);
  return Math.round(BALANCE.xp.coef * g(L) * parWeight(L) * pace);
}

/* Adds XP, returns the number of levels gained. Extra XP carries over. */
function grantXp(hero, amount) {
  let gained = 0;
  hero.xp += amount;
  while (hero.level < BALANCE.levelCap && hero.xp >= xpToNext(hero.level)) {
    hero.xp -= xpToNext(hero.level);
    hero.level += 1;
    gained += 1;
    syncHeirloom(hero);          // the heirloom's level follows the hero
  }
  // SPEC 4 - at the cap, every xpToNext(50) XP earns an Abyssal Rank instead.
  if (hero.level >= BALANCE.levelCap) {
    const per = xpToNext(BALANCE.levelCap - 1);
    while (hero.xp >= per) {
      hero.xp -= per;
      hero.abyssal.ranks = (hero.abyssal.ranks || 0) + 1;
    }
  }
  return gained;
}

/* ---- Abyssal Ranks, SPEC 4 ---- */
function abyssalSpent(hero) {
  let n = 0;
  for (const k in (hero.abyssal.spent || {})) n += hero.abyssal.spent[k];
  return n;
}
function abyssalUnspent(hero) { return (hero.abyssal.ranks || 0) - abyssalSpent(hero); }

function spendAbyssal(hero, optionId) {
  const opt = BALANCE.abyssal.options[optionId];
  if (!opt) return { ok: false, reason: 'No such option.' };
  if (abyssalUnspent(hero) <= 0) return { ok: false, reason: 'No Abyssal points to spend.' };
  if (!hero.abyssal.spent) hero.abyssal.spent = {};
  hero.abyssal.spent[optionId] = (hero.abyssal.spent[optionId] || 0) + 1;
  save();
  return { ok: true };
}

/* XP needed for the next Abyssal Rank, for the UI. */
function abyssalPer() { return xpToNext(BALANCE.levelCap - 1); }

/* Skill points: 1 per level from 2, plus 1 per first Guardian kill. */
function totalSkillPoints(hero) {
  let pts = hero.level - 1;
  for (const gid in (hero.guardianKills || {})) {
    if (hero.guardianKills[gid] > 0) pts += BALANCE.guardians[gid] ? BALANCE.guardians[gid].skillPoint : 0;
  }
  return pts;
}
function spentSkillPoints(hero) {
  let n = 0;
  for (const k in hero.skills) n += hero.skills[k];
  return n;
}
function unspentSkillPoints(hero) { return totalSkillPoints(hero) - spentSkillPoints(hero); }

/* ============================================================
   HP AND REGENERATION - SPEC 8.1
   Rate per hour: parHP(L) / 6 x (1 + Recovery), doubled below level 10.
   HP is stored as a value plus the stamp it was set at.
   ============================================================ */
function regenRatePerHour(level, recoveryPct) {
  let rate = BALANCE.floor.parHpCoef * g(level) / BALANCE.hp.regenHours * (1 + recoveryPct / 100);
  if (level < BALANCE.hp.youngLevel) rate *= BALANCE.hp.youngMult;
  return rate;
}
function regenPerHour(hero, st) { return regenRatePerHour(hero.level, st.recovery); }
function regenPerMs(hero, st) { return regenPerHour(hero, st) / HOUR; }

/* Extra regeneration time earned from a Vigil of the Flame across the
   window [from, to]. HP is stored as a value plus the stamp it was written
   at, so regeneration is worked out over that whole window at once - and a
   two-hour Offering usually covers only part of it, because it was made
   partway through or ran out while the phone was asleep. Multiplying the
   rate would hand the player double for the entire window or, worse, hand
   them nothing at all for an Offering that expired while they were away.
   Counting only the overlap is the honest sum. */
function offeringRegenBonusMs(hero, from, to) {
  const b = hero && hero.offering;
  if (!b) return 0;
  const def = offeringDef(b.id);
  if (!def || def.effect.k !== 'town_regen_mult') return 0;
  const start = b.from === undefined ? b.until - BALANCE.town.offerings.durationMs : b.from;
  const lo = Math.max(from, start);
  const hi = Math.min(to, b.until);
  if (hi <= lo) return 0;
  return (hi - lo) * (def.effect.value - 1);
}

/* HP right now. Regeneration happens only in town, and only when not Fallen. */
function currentHp(hero, st) {
  if (!hero) return 0;
  if (hero.descent) return clamp(Math.floor(hero.descent.hp), 0, st.maxHp);
  if (hero.fallenUntil > now()) return clamp(Math.floor(hero.hp), 0, st.maxHp);
  const gainedMs = elapsed(hero.hpAt) + offeringRegenBonusMs(hero, hero.hpAt, now());
  return clamp(Math.floor(hero.hp + regenPerMs(hero, st) * gainedMs), 0, st.maxHp);
}

/* With a Vigil running, the hero fills at the doubled rate until it ends
   and at the ordinary rate after, so the countdown is worked out in two
   stretches rather than one. */
function timeToFullHp(hero, st) {
  const hp = currentHp(hero, st);
  if (hp >= st.maxHp) return 0;
  const rate = regenPerMs(hero, st);
  if (rate <= 0) return Infinity;
  let need = st.maxHp - hp;

  const b = activeOffering(hero);
  const mult = offeringMult(hero, 'town_regen_mult');
  if (b && mult > 1) {
    const boostedMs = Math.max(0, b.until - now());
    const boostedGain = rate * mult * boostedMs;
    if (boostedGain >= need) return need / (rate * mult);
    need -= boostedGain;
    return boostedMs + need / rate;
  }
  return need / rate;
}

/* Write HP down at this moment, so later regeneration starts from here. */
function setHp(hero, value, at) {
  hero.hp = Math.max(0, Math.floor(value));
  hero.hpAt = at === undefined ? now() : at;
}

/* ============================================================
   ITEMS - SPEC 11
   ============================================================ */
function rarityWeightsFor(floor) {
  for (const b of RARITY_WEIGHTS) if (floor >= b.minFloor && floor <= b.maxFloor) return b.weights;
  return RARITY_WEIGHTS[RARITY_WEIGHTS.length - 1].weights;
}

/* SPEC 11.5 step 1. `find` is (item find + Fortune) as a fraction.
   `mults` optionally multiplies named rarity weights (Starfall Surge etc.). */
function pickRarity(rng, floor, find, mults, allowed) {
  const base = rarityWeightsFor(floor);
  const entries = [];
  for (const r in base) {
    if (allowed && allowed.indexOf(r) < 0) continue;
    let w = base[r];
    if (r === 'rare' || r === 'unique' || r === 'set') {
      w *= (1 + find);
      if (mults && mults[r]) w *= mults[r];
    }
    if (w > 0) entries.push([r, w]);
  }
  if (!entries.length) return 'common';
  return rng.weighted(entries);
}

const RARITY_ORDER = ['common', 'magic', 'rare', 'unique', 'set'];
function rarityAtLeast(r, min) {
  return RARITY_ORDER.indexOf(r) >= RARITY_ORDER.indexOf(min);
}

/* Roll one item. SPEC 11.5 */
function rollItem(rng, opts) {
  const floor = opts.floor;
  const ilvl = opts.ilvl === undefined ? floor : opts.ilvl;
  const classId = opts.classId;
  const find = opts.find || 0;

  // 1. rarity
  let rarity;
  const allowed = opts.allowed || PHASE1_RARITIES;
  if (opts.rarity) {
    rarity = opts.rarity;
  } else {
    rarity = pickRarity(rng, floor, find, opts.rarityMults, allowed);
    if (opts.minRarity) {
      // "at least rare" repeats the pick until it lands on rare or better
      let guard = 0;
      while (!rarityAtLeast(rarity, opts.minRarity) && guard < 200) {
        rarity = pickRarity(rng, floor, find, opts.rarityMults, allowed);
        guard++;
      }
      if (!rarityAtLeast(rarity, opts.minRarity)) rarity = opts.minRarity;
    }
  }

  // 2. slot. A unique or set drop takes an item from the class pool instead
  //    of rolling a slot (SPEC 11.5 step 2).
  if (rarity === 'unique' || rarity === 'set') {
    const built = rollNamedItem(rng, rarity, classId, ilvl);
    if (built) return built;
    rarity = 'rare';               // no pool for this class (the simulator's neutral hero)
  }
  const slot = opts.slot || rng.pick(BALANCE.items.slots);

  // 3. base type
  // The simulator's class-neutral hero borrows a name pool; names are cosmetic.
  const typePool = BASE_TYPES[classId] || BASE_TYPES.juggernaut;
  const baseType = slot === 'relic'
    ? rng.pick(RELIC_TYPES)
    : rng.pick(typePool[slot]);

  const item = {
    id: 'i' + Math.floor(rng.next() * 1e9).toString(36) + ilvl.toString(36),
    slot: slot,
    classId: slot === 'relic' ? null : classId,
    baseType: baseType,
    name: '',
    rarity: rarity,
    ilvl: ilvl,
    temper: 0,
    relicStat: slot === 'relic' ? rng.pick(Object.keys(RELIC_STATS)) : null,
    affixes: [],
    uniqueId: null,
    setId: null,
    reforges: 0,
    locked: false,
    heirloom: false,
    isNew: true
  };

  // 4. affixes
  const rd = RARITIES[rarity];
  if (rd && rd.affixMax > 0) {
    const count = rng.int(rd.affixMin, rd.affixMax);
    item.affixes = rollAffixes(rng, slot, ilvl, count, rarity, classId);
  }

  // 5. name
  item.name = itemName(rng, item);
  return item;
}

/* Every rarity can drop from Phase 2 on. The floor bands in RARITY_WEIGHTS
   already keep uniques and sets off floors 1-10. */
const PHASE1_RARITIES = ['common', 'magic', 'rare', 'unique', 'set'];

/* SPEC 12 - a unique drop picks evenly among the class's six uniques;
   a set drop picks evenly among its nine set pieces. */
function uniquesForClass(classId) {
  const out = [];
  for (const id in UNIQUES) if (UNIQUES[id].classId === classId) out.push(UNIQUES[id]);
  return out;
}
function setPiecesForClass(classId) {
  const out = [];
  for (const sid in SETS) {
    const s = SETS[sid];
    if (s.classId !== classId) continue;
    for (const p of s.pieces) out.push({ piece: p, set: s });
  }
  return out;
}

/* Uniques and set pieces list their own affixes, rolled in the upper half
   of their floor band (SPEC 12). */
function fixedAffixes(rng, ids, ilvl) {
  const out = [];
  for (const id of ids || []) {
    const def = AFFIXES[id];
    if (!def) continue;
    out.push({ id: id, value: rollAffixValue(rng, def, ilvl, true) });
  }
  return out;
}

function lastWord(s) {
  const parts = String(s).trim().split(' ');
  return parts[parts.length - 1];
}

/* A relic's base stat is one of Haste, Fortune or Recovery (SPEC 11.2).
   For a named relic, take whichever its own affixes point at. */
function relicStatForAffixes(affixIds) {
  for (const id of affixIds || []) {
    if (id === 'haste' || id === 'fortune' || id === 'recovery') return id;
  }
  return 'recovery';
}

/* Build one unique or set piece, picked evenly from the class's pool.
   Returns null when that class has no pool (the simulator's neutral hero). */
function rollNamedItem(rng, rarity, classId, ilvl) {
  if (rarity === 'unique') {
    const pool = uniquesForClass(classId);
    if (!pool.length) return null;
    const u = rng.pick(pool);
    return {
      id: 'i' + Math.floor(rng.next() * 1e9).toString(36) + ilvl.toString(36),
      slot: u.slot, classId: classId, baseType: u.baseType, name: u.name,
      rarity: 'unique', ilvl: ilvl, temper: 0,
      relicStat: u.slot === 'relic' ? relicStatForAffixes(u.affixes) : null,
      affixes: fixedAffixes(rng, u.affixes, ilvl),
      uniqueId: u.id, setId: null,
      reforges: 0, locked: false, heirloom: false, isNew: true
    };
  }
  const pool = setPiecesForClass(classId);
  if (!pool.length) return null;
  const pick = rng.pick(pool);
  const p = pick.piece;
  return {
    id: 'i' + Math.floor(rng.next() * 1e9).toString(36) + ilvl.toString(36),
    slot: p.slot, classId: classId, baseType: lastWord(p.name), name: p.name,
    rarity: 'set', ilvl: ilvl, temper: 0,
    relicStat: p.slot === 'relic' ? relicStatForAffixes(p.affixes) : null,
    affixes: fixedAffixes(rng, p.affixes, ilvl),
    uniqueId: null, setId: pick.set.id,
    reforges: 0, locked: false, heirloom: false, isNew: true
  };
}

/* `rarity` gates affixes with a minimum rarity (skill_rank is rare and better). */
function affixPool(slot, floor, rarity) {
  const out = [];
  for (const id in AFFIXES) {
    const a = AFFIXES[id];
    if (a.slots.indexOf(slot) < 0) continue;
    const bi = bandIndex(floor);
    if (!a.bands[bi]) continue;                        // not available in this band
    if (a.minRarity && (!rarity || !rarityAtLeast(rarity, a.minRarity))) continue;
    out.push(a);
  }
  return out;
}

/* The minor passives a skill_rank affix can name, for one class (SPEC 11.6). */
function minorPassivesOf(classId) {
  const tree = TREES[classId];
  const out = [];
  if (!tree) return out;
  for (const br of tree.branches) {
    for (const n of br.nodes) if (n.type === 'minor') out.push(n);
  }
  return out;
}

function rollAffixes(rng, slot, ilvl, count, rarity, classId) {
  const pool = affixPool(slot, ilvl, rarity);
  const chosen = [];
  const used = {};
  let guard = 0;
  while (chosen.length < count && guard < 200 && chosen.length < pool.length) {
    guard++;
    const a = rng.pick(pool);
    if (!a || used[a.id]) continue;
    used[a.id] = true;
    const affix = { id: a.id, value: rollAffixValue(rng, a, ilvl) };
    // skill_rank names one minor passive from the hero's class.
    if (a.id === 'skill_rank') {
      const minors = minorPassivesOf(classId);
      if (!minors.length) continue;
      affix.node = rng.pick(minors).id;
      affix.value = 1;
    }
    chosen.push(affix);
  }
  return chosen;
}

/* A node's rank including any skill_rank affixes. It only adds a rank while
   the passive already has one, and may exceed its maximum by 1 (SPEC 11.6). */
function effectiveRank(hero, node) {
  const base = hero.skills[node.id] || 0;
  if (base <= 0) return 0;
  let bonus = 0;
  for (const it of equippedItems(hero)) {
    for (const a of (it.affixes || [])) {
      if (a.id === 'skill_rank' && a.node === node.id) bonus += a.value || 1;
    }
  }
  if (!bonus) return base;
  return Math.min(base + bonus, node.maxRank + 1);
}

/* Values roll uniformly within the item's floor band (SPEC 11.6).
   Percent affixes land on whole numbers; scaled affixes (max_hp) are
   multiplied by s = g(i) first. `upperHalf` is for uniques and sets. */
function rollAffixValue(rng, affix, ilvl, upperHalf) {
  const band = affix.bands[bandIndex(ilvl)];
  if (!band) return 0;
  let lo = band[0], hi = band[1];
  if (upperHalf) lo = (lo + hi) / 2;
  let v = rng.float(lo, hi);
  if (affix.scaled) v *= g(ilvl);
  return Math.max(1, Math.round(v));
}

/* SPEC 11.7 */
function itemName(rng, item) {
  if (item.rarity === 'common') return item.baseType;
  if (item.rarity === 'magic') {
    const first = item.affixes[0];
    const word = first && AFFIXES[first.id] ? AFFIXES[first.id].word : 'Ruin';
    return item.baseType + ' of ' + word;
  }
  if (item.rarity === 'rare') {
    return rng.pick(RARE_PREFIXES) + ' ' + rng.pick(RARE_SUFFIXES);
  }
  return item.baseType;
}

/* Every stat an item gives, for display and comparison. */
function itemStats(item) {
  const st = emptyStats();
  if (!item) return st;
  const base = itemBase(item);
  const flat = { might: base.might || 0, guard: base.guard || 0, maxHp: base.maxHp || 0 };
  const pct = { might: 0, guard: 0, maxHp: 0 };
  const points = {};
  for (const p of PERCENT_STATS) points[p] = 0;
  points.haste += base.haste || 0;
  points.fortune += base.fortune || 0;
  points.recovery += base.recovery || 0;
  for (const a of (item.affixes || [])) {
    const t = AFFIX_TARGETS[a.id];
    if (!t) continue;
    if (t.mode === 'flat') flat[t.stat] += a.value;
    else if (t.mode === 'pct') pct[t.stat] += a.value;
    else points[t.stat] += a.value;
  }
  for (const c of CORE_STATS) { st[c] = flat[c]; st[c + 'Pct'] = pct[c]; }
  for (const p of PERCENT_STATS) st[p] = points[p];
  return st;
}

/* Power change from swapping an item in, SPEC 11.8. */
function powerDelta(hero, candidate) {
  const before = heroStats(hero);
  const clone = JSON.parse(JSON.stringify(hero));
  clone.equipment[candidate.slot] = candidate;
  const after = heroStats(clone);
  if (before.power <= 0) return 0;
  return (after.power - before.power) / before.power * 100;
}

/* ============================================================
   FLOORS - SPEC 6.1, 6.2, 6.3
   ============================================================ */
const GUARDIAN_NAMES = {
  warden: 'The Hollow Warden',
  vael: 'High Cantor Vael',
  champion: 'The First Champion',
  god: 'The Thing That Fell'
};

/* SPEC 9.2 - each Wandering Horror takes a name by seed. */
/* The eight named Wandering Horrors (SPEC 9.2, SCOPES.md 3). The order is
   fixed: a Horror is picked from HORROR_NAMES by index, so reordering would
   change which Horror an existing seed rolls. Twist numbers are in
   BALANCE.horrorFx. */
const HORROR_ORDER = ['hulk', 'worms', 'stag', 'smolder', 'friar', 'chainwraith', 'bellmaw', 'rot'];
const HORRORS = {
  hulk:        { id:'hulk',        name:'The Wailing Hulk',
                 twist:'Costs 40% more HP; drops a third item',
                 lore:'You hear it floors before you see it. The miners took the sound for the mountain settling.' },
  worms:       { id:'worms',       name:'Mother of Worms',
                 twist:'Costs 20% less, but her brood comes first: two extra packs',
                 lore:'Where she has passed, the floor keeps moving for hours. Nothing she leaves behind stays small.' },
  stag:        { id:'stag',        name:'The Glass Stag',
                 twist:'Takes half the time; unique and set weights ×4',
                 lore:'It crosses the black glass without a sound and leaves no mark on it. Those who follow it come back carrying something.' },
  smolder:     { id:'smolder',     name:'Old Smolder',
                 twist:'Gold ×3',
                 lore:'It was burning before the town had a name, and it has never once run short of fuel.' },
  friar:       { id:'friar',       name:'The Faceless Friar',
                 twist:'Drops a missing lore page for the act, if one is missing',
                 lore:'It carries pages it did not write, and gives them up only when it has no hands left to hold them.' },
  chainwraith: { id:'chainwraith', name:'The Chainwraith',
                 twist:"Can't be crit; drops 2 Starshards",
                 lore:'It is made of links never forged for anything living to wear. It does not flinch, because there is nothing in it to flinch.' },
  bellmaw:     { id:'bellmaw',     name:'The Bellmaw',
                 twist:'Costs 25% more; its items roll 5 item levels higher',
                 lore:'Its mouth rings like a struck bell. Whatever it swallows comes back up heavier than it went down.' },
  rot:         { id:'rot',         name:'Grandmother Rot',
                 twist:'Recovery lowers what it costs',
                 lore:'She is never in a hurry. What she wears away, rest puts back.' }
};
const HORROR_NAMES = HORROR_ORDER.map(function (id) { return HORRORS[id].name; });

/* A Horror's id from its name, for paths rolled before Horrors carried one. */
function horrorIdForName(name) {
  for (const id of HORROR_ORDER) if (HORRORS[id].name === name) return id;
  return null;
}
function horrorIdOf(enc) {
  if (!enc || enc.kind !== 'horror') return null;
  return enc.horrorId || horrorIdForName(enc.name);
}
/* The twist numbers for this encounter; an empty object for anything that
   is not a named Horror, so callers never need to check. */
function horrorFxOf(enc) {
  const id = horrorIdOf(enc);
  return (id && BALANCE.horrorFx[id]) || {};
}

/* ---- Deep Guardians (SCOPES.md 1) ----
   One at the bottom of each stratum below the story. `test` names the story
   Guardian whose cost maths it reuses. Past floor 100 they return in the
   same order, as distinct kills, so the endless pit keeps its milestones. */
const DEEP_GUARDIAN_ORDER = ['stonebound', 'drummer', 'onebefore', 'hush', 'hearthkeeper', 'stairwright'];
const DEEP_GUARDIANS = {
  stonebound:   { id:'stonebound',   name:'The Stonebound',    test:'warden',
                  line:'It grew into the rock instead of cutting through it.' },
  drummer:      { id:'drummer',      name:'The Drummer Below', test:'vael',
                  line:'The slow pull on the chains keeps time with something. This is what.' },
  onebefore:    { id:'onebefore',    name:'The One Before',    test:'champion',
                  line:'The marks in the glass were old when the First Champion found them. It made them.' },
  hush:         { id:'hush',         name:'The Hush',          test:'god',
                  line:'Something down here speaks. Something else keeps it quiet.' },
  hearthkeeper: { id:'hearthkeeper', name:'The Hearthkeeper',  test:'warden',
                  line:'Someone has kept a fire burning this deep for a very long time.' },
  stairwright:  { id:'stairwright',  name:'The Stairwright',   test:'vael',
                  line:'One hand cut every stair from the surface down. It is still cutting.' }
};
/* What each test asks of the hero, for the Descend tab. */
const GUARDIAN_TEST_TEXT = {
  warden: 'Guard', vael: 'Might', champion: 'Power and Recovery', god: 'Guard, Might and Recovery'
};

/* "stonebound_2" -> "stonebound". */
function deepBaseId(id) { return typeof id === 'string' ? id.replace(/_\d+$/, '') : id; }
function isDeepGuardian(id) { return !!DEEP_GUARDIANS[deepBaseId(id)]; }

/* The Deep Guardian on floor f, or null. Its name is also recorded in
   GUARDIAN_NAMES so every screen that already names Guardians by id keeps
   working without knowing about the deep ones. */
function deepGuardianOnFloor(f) {
  const D = BALANCE.deep;
  if (f < D.firstFloor || (f - D.firstFloor) % D.every !== 0) return null;
  const k = (f - D.firstFloor) / D.every;
  const base = DEEP_GUARDIAN_ORDER[k % DEEP_GUARDIAN_ORDER.length];
  const cycle = Math.floor(k / DEEP_GUARDIAN_ORDER.length) + 1;
  const id = cycle > 1 ? base + '_' + cycle : base;
  const def = DEEP_GUARDIANS[base];
  if (!GUARDIAN_NAMES[id]) GUARDIAN_NAMES[id] = cycle > 1 ? def.name + ', Returned' : def.name;
  return { id: id, base: base, floor: f, weight: D.weights[base], factor: def.test,
           storyId: null, skillPoint: 0, deep: true };
}

/* ---- Strata (SCOPES.md 1) ----
   The deep pit's answer to acts: a name for every ten floors below the story,
   and an omen that turns up more often there. Each echoes the Echo card at
   the bottom of its stratum. Past floor 100 there is only The Unnamed Deep. */
const STRATA = [
  { id:'uncut',     name:'The Uncut Stone',    minFloor:41, maxFloor:50,  signature:'twisting_tunnels' },
  { id:'pulse',     name:'The Pulse',          minFloor:51, maxFloor:60,  signature:'swarm' },
  { id:'tally',     name:'The Tally Halls',    minFloor:61, maxFloor:70,  signature:'cache_of_the_fallen' },
  { id:'listening', name:'The Listening Dark', minFloor:71, maxFloor:80,  signature:'quiet_halls' },
  { id:'warm',      name:'The Warm Galleries', minFloor:81, maxFloor:90,  signature:'wellspring' },
  { id:'stair',     name:'The Endless Stair',  minFloor:91, maxFloor:100, signature:'starfall_surge' }
];
const UNNAMED_DEEP = { id:'unnamed', name:'The Unnamed Deep', signature:null };

function stratumForFloor(f) {
  if (f <= BALANCE.deep.storyEnds) return null;
  for (const s of STRATA) if (f >= s.minFloor && f <= s.maxFloor) return s;
  return UNNAMED_DEEP;
}
/* The line under the floor number: the act on the story's floors, the
   stratum below them. Lore still follows actForFloor, where every floor
   below 40 is Act IV. */
function floorLabel(f) {
  const s = stratumForFloor(f);
  return s ? s.name : actForFloor(f).display;
}

function ascensions() { return (state && state.account && state.account.ascensions) || 0; }

/* Floors 1-10 are exempt; the increase ramps in across floors 11-20. */
function ascMult(f) {
  const A = ascensions();
  if (f <= BALANCE.floor.ascRampStart) return 1;
  const ramp = Math.min(1, (f - BALANCE.floor.ascRampStart) / BALANCE.floor.ascRampSpan);
  return 1 + BALANCE.floor.ascPerAscension * Math.min(A, BALANCE.floor.ascMaxAscensions) * ramp;
}
function rewardMult(f) { return ascMult(f); }
function dangerOf(f) { return BALANCE.floor.dangerCoef * g(f) * ascMult(f); }
function parHp(f) { return BALANCE.floor.parHpCoef * g(f); }

/* baseTime(f) in minutes. */
function baseTimeMin(f) {
  const b = bandValue(BALANCE.floor.timeBands, f);
  return b.base + b.per * (f - b.from);
}
function pathsPerFloor(f) { return bandValue(BALANCE.floor.pathBands, f).n; }
function omensPerPath(f) { return bandValue(BALANCE.floor.omenBands, f).n; }
function omenTypeWeights(f) { return bandValue(BALANCE.floor.omenTypeWeights, f).weights; }

function actForFloor(f) {
  for (const a of ACTS) if (f >= a.minFloor && f <= a.maxFloor) return a;
  return ACTS[ACTS.length - 1];
}
/* The story Guardians first, then the Deep Guardians below them. Deep ones
   are kept out of BALANCE.guardians on purpose: totalSkillPoints counts only
   what is listed there, which is what keeps them from granting points. */
function guardianOnFloor(f) {
  for (const id in BALANCE.guardians) if (BALANCE.guardians[id].floor === f) return BALANCE.guardians[id];
  return deepGuardianOnFloor(f);
}
function familiesFor(f) {
  for (const b of FAMILY_BANDS) if (f >= b.minFloor && f <= b.maxFloor) return b.families;
  return FAMILY_BANDS[FAMILY_BANDS.length - 1].families;
}

/* The deepest floor the player may choose, held at 20 for Phase 1. */
function maxSelectableFloor(hero) {
  return Math.min(hero.deepest, BALANCE.phase.maxFloor);
}

/* ============================================================
   OMENS AND PATHS - SPEC 6.3, 6.4
   ============================================================ */
function omenFx(id) { return BALANCE.omenFx[id] || {}; }

function conflicts(a, b) {
  for (const pair of OMEN_CONFLICTS) {
    if ((pair[0] === a && pair[1] === b) || (pair[1] === a && pair[0] === b)) return true;
  }
  return false;
}

/* How this hero's passives and gear bend the omen roll.
   Void Communion turns boons off, Gilded Path favours Glittering Veins,
   The Lure makes A Horror Stirs twice as likely. */
function pathRollOptions(hero) {
  const opts = { noBoons: false, gildedPath: false, horrorMult: 1, extraPaths: 0 };
  if (!hero) return opts;
  for (const entry of passiveEffects(hero)) {
    const e = entry.e;
    if (e.k !== 'special') continue;
    if (e.id === 'void_communion') opts.noBoons = true;
    if (e.id === 'gilded_path') opts.gildedPath = true;
  }
  for (const slot of BALANCE.items.slots) {
