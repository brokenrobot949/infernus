    const gd = guardianOnFloor(results.floor);
    if (gd) setRecordLow('guardian_time', results.timeTaken, hero, gd.id);
  }
}

/* ============================================================
   ACHIEVEMENTS AND TITLES - SPEC 16.3, 16.4
   Conditions are data; this evaluates them.
   ============================================================ */

/* The Armory (SPEC 17.4) remembers every unique and set piece ever found. */
/* Returns true only when this is the account's first find of the item,
   so the results sheet can say "New to the Armory". */
function recordArmory(item) {
  if (!item) return false;
  const id = item.uniqueId || (item.rarity === 'set' ? item.name : null);
  if (!id) return false;
  if (!state.account.armory) state.account.armory = [];
  if (state.account.armory.indexOf(id) < 0) { state.account.armory.push(id); return true; }
  return false;
}
function uniquesFound() {
  const found = state.account.armory || [];
  let n = 0;
  for (const id of found) if (typeof UNIQUES !== 'undefined' && UNIQUES[id]) n++;
  return n;
}

/* Is a complete set currently worn? */
function wearingFullSet(hero) {
  const counts = equippedSetCounts(hero);
  for (const id in counts) if (counts[id] >= 3) return true;
  return false;
}

/* How many of the eight named Horrors the account has killed. */
function namedHorrorsKilled() {
  let n = 0;
  for (const id of HORROR_ORDER) if (totalOf('horror:' + id) > 0) n++;
  return n;
}
/* How many of the six Deep Guardians the account has killed. Their later
   returns past floor 100 are separate kills but not separate Guardians. */
function deepGuardiansKilled() {
  let n = 0;
  for (const id of DEEP_GUARDIAN_ORDER) if (totalOf('guardian:' + id) > 0) n++;
  return n;
}

function lorePagesFound() {
  if (typeof LORE_PAGES === 'undefined') return 0;
  const seen = state.account.codex || [];
  let n = 0;
  for (const id in LORE_PAGES) if (seen.indexOf(id) >= 0) n++;
  return n;
}

/* `results` is the descent that just ended, when there is one. */
function achievementMet(check, hero, results) {
  if (!check) return false;
  const acct = state.account;
  switch (check.k) {
    case 'deepest':       return (acct.deepestEver || 1) >= check.value;
    case 'guardian_kills':return totalOf('guardian:' + check.guardian) >= check.value;
    case 'horrors':       return totalOf('horrors') >= check.value;
    case 'clear_streak':  return (hero.counters.clearStreak || 0) >= check.value;
    case 'total_gold':    return totalOf('goldEarned') >= check.value;
    case 'temper':        return hero.inventory.concat(equippedItems(hero))
                                 .some(function (i) { return (i.temper || 0) >= check.value; });
    case 'banes_cleared': return !!results && results.outcome === 'clear' &&
                                 (results.banes || 0) >= check.value;
    case 'boss_low_hp':   return !!results && results.outcome === 'clear' && results.hadBoss &&
                                 results.hpLeftPct !== undefined && results.hpLeftPct < check.value;
    case 'uniques_found': return uniquesFound() >= check.value;
    case 'full_set':      return wearingFullSet(hero);
    case 'lore_pages':    return lorePagesFound() >= check.value;
    case 'ascensions':    return (acct.ascensions || 0) >= check.value;
    case 'class_depth':   return (getRecord('deepest', check.classId) || { value: 0 }).value >= check.value;
    case 'horrors_named': return namedHorrorsKilled() >= check.value;
    case 'deep_guardians':return deepGuardiansKilled() >= check.value;
    default:              return false;
  }
}

/* Award anything newly earned. Returns the achievements granted. */
function checkAchievements(hero, results) {
  if (typeof ACHIEVEMENTS === 'undefined' || !hero) return [];
  if (!state.account.achievements) state.account.achievements = {};
  const earned = [];

  for (const id in ACHIEVEMENTS) {
    const a = ACHIEVEMENTS[id];
    if (state.account.achievements[id]) continue;
    if (!achievementMet(a.check, hero, results)) continue;

    state.account.achievements[id] = now();
    grantRenown(a.renown || 0, 'achievement');

    if (a.reward && a.reward.k === 'title') {
      if (!state.account.titles) state.account.titles = [];
      if (state.account.titles.indexOf(a.reward.title) < 0) state.account.titles.push(a.reward.title);
    }
    if (a.reward && a.reward.k === 'frame') {
      if (!state.account.frames) state.account.frames = [];
      if (state.account.frames.indexOf(a.reward.frame) < 0) state.account.frames.push(a.reward.frame);
    }
    earned.push(a);
  }
  if (earned.length) save();
  return earned;
}

/* The title the hero is wearing, for display under their name (SPEC 16.4). */
function activeTitleName() {
  const id = state.account.activeTitle;
  if (!id || typeof TITLES === 'undefined' || !TITLES[id]) return '';
  return TITLES[id].name;
}
function heroDisplayName(hero) {
  const t = activeTitleName();
  return t ? hero.name + ' ' + t : hero.name;
}

/* The best sigil frame the account has earned (SPEC 18.3). */
const FRAME_ORDER = ['iron', 'silver', 'starforged'];
const FRAME_COLOURS = { iron: 'var(--edge)', silver: 'var(--bone)', starforged: 'var(--corona)' };
function bestFrame() {
  const have = state.account.frames || [];
  let best = null;
  for (const f of FRAME_ORDER) if (have.indexOf(f) >= 0) best = f;
  return best;
}

/* ============================================================
   RENOWN - SPEC 16.1
   Account-wide. Never spent, never reset.
   ============================================================ */
function renownForRank(r) {
  if (r <= 1) return 0;
  return Math.round(BALANCE.renown.rankCoef * Math.pow(r - 1, BALANCE.renown.rankExp));
}

function renownRank(total) {
  let rank = 1;
  for (let r = 2; r <= BALANCE.renown.maxRank; r++) {
    if (total >= renownForRank(r)) rank = r; else break;
  }
  return rank;
}

function currentRenown() { return (state.account && state.account.renown) || 0; }
function currentRank() { return renownRank(currentRenown()); }

function renownProgress() {
  const total = currentRenown();
  const rank = renownRank(total);
  if (rank >= BALANCE.renown.maxRank) {
    return { rank: rank, total: total, into: 0, needed: 0, atMax: true };
  }
  const floorAt = renownForRank(rank);
  const nextAt = renownForRank(rank + 1);
  return { rank: rank, total: total, into: total - floorAt,
           needed: nextAt - floorAt, nextAt: nextAt, atMax: false };
}

/* Award Renown and report any ranks gained, so the UI can say so. */
function grantRenown(amount, reason) {
  if (!amount) return null;
  const before = currentRank();
  state.account.renown = currentRenown() + amount;
  const after = currentRank();
  const gained = [];
  for (let r = before + 1; r <= after; r++) {
    if (BALANCE.renownUnlocks[r]) gained.push({ rank: r, unlock: BALANCE.renownUnlocks[r] });
  }
  return { amount: amount, reason: reason, from: before, to: after, unlocks: gained };
}

/* Is a rank unlock available? `later: true` ranks are named but inert. */
function hasUnlock(id) {
  const rank = currentRank();
  for (const r in BALANCE.renownUnlocks) {
    const u = BALANCE.renownUnlocks[r];
    if (u.id !== id) continue;
    if (u.later) return false;
    return rank >= Number(r);
  }
  return false;
}

/* ============================================================
   CONTRACTS - SPEC 13.4
   ============================================================ */
const CONTRACT_TEMPLATES = [
  { id: 'horror',
    text: function () { return 'Defeat a Wandering Horror.'; },
    goal: function () { return 1; } },
  { id: 'pact',
    text: function () { return 'Clear a path that has a pact.'; },
    goal: function () { return 1; } },
  { id: 'deep',
    text: function (d) { return 'Clear ' + BALANCE.contracts.clearDeepCount +
      ' descents on floor ' + contractDeepFloor(d) + ' or deeper.'; },
    goal: function () { return BALANCE.contracts.clearDeepCount; } },
  { id: 'elites',
    text: function () { return 'Defeat ' + BALANCE.contracts.elites + ' elites.'; },
    goal: function () { return BALANCE.contracts.elites; } },
  { id: 'salvage',
    text: function () { return 'Salvage ' + BALANCE.contracts.salvage + ' items.'; },
    goal: function () { return BALANCE.contracts.salvage; } },
  { id: 'temper',
    text: function (d) { return 'Temper any item to +' + contractTemperTarget(d) + '.'; },
    goal: function (d) { return contractTemperTarget(d); } },
  { id: 'bloodmoon',
    text: function () { return 'Clear a path with Blood Moon.'; },
    goal: function () { return 1; } },
  { id: 'gold',
    text: function (d) { return 'Earn ' + fmtNum(contractGoldTarget(d)) + ' gold from descents.'; },
    goal: function (d) { return contractGoldTarget(d); } }
];

function contractDeepFloor(d) { return Math.max(1, d - BALANCE.contracts.clearDeepOffset); }
function contractTemperTarget(d) {
  return Math.min(BALANCE.items.temperMax,
    BALANCE.contracts.temperBase + Math.floor(d / BALANCE.contracts.temperPerTenFloors));
}
function contractGoldTarget(d) { return Math.round(BALANCE.contracts.goldTargetCoef * g(d)); }

/* Local midnight after a given moment. */
function nextLocalMidnight(from) {
  const dt = new Date(from);
  dt.setHours(24, 0, 0, 0);
  return dt.getTime();
}

function rollContracts(hero) {
  const d = hero.deepest;
  const rng = rngFrom(newSeed('contracts'));
  const picked = rng.shuffle(CONTRACT_TEMPLATES).slice(0, BALANCE.contracts.count);
  return picked.map(function (t) {
    return { id: t.id, text: t.text(d), goal: t.goal(d),
             progress: 0, done: false, claimed: false, deepest: d };
  });
}

function refreshContracts(hero) {
  if (!hasUnlock('bounty')) return false;
  const acct = state.account;
  if (!acct.contracts) acct.contracts = { list: [], refreshedAt: 0 };
  const due = !acct.contracts.list.length || now() >= (acct.contracts.nextAt || 0);
  if (!due) return false;

  acct.contracts.list = rollContracts(hero);
  acct.contracts.refreshedAt = now();
  acct.contracts.nextAt = nextLocalMidnight(now());
  save();
  return true;
}

/* Contracts advance on events, not on totals, so progress can only ever
   count things that happened after the contract was posted (SPEC 13.4). */
function contractEvent(type, data) {
  const acct = state && state.account;
  if (!acct || !acct.contracts || !acct.contracts.list.length) return;
  data = data || {};
  let changed = false;

  for (const c of acct.contracts.list) {
    if (c.claimed || c.done) continue;
    let inc = 0;

    if (type === 'horror' && c.id === 'horror') inc = 1;
    else if (type === 'elite' && c.id === 'elites') inc = 1;
    else if (type === 'salvage' && c.id === 'salvage') inc = data.count || 1;
    else if (type === 'gold' && c.id === 'gold') inc = data.amount || 0;
    else if (type === 'temper' && c.id === 'temper') {
      if ((data.level || 0) >= c.goal) { c.progress = c.goal; c.done = true; changed = true; }
      continue;
    } else if (type === 'clear') {
      if (c.id === 'pact' && data.hasPact) inc = 1;
      if (c.id === 'bloodmoon' && data.bloodMoon) inc = 1;
      if (c.id === 'deep' && data.floor >= contractDeepFloor(c.deepest)) inc = 1;
    }

    if (inc > 0) {
      c.progress += inc;
      if (c.progress >= c.goal) c.done = true;
      changed = true;
    }
  }
  if (changed) save();
}

function claimContract(hero, index) {
  const acct = state.account;
  const c = acct.contracts && acct.contracts.list[index];
  if (!c) return { ok: false, reason: 'No such contract.' };
  if (!c.done) return { ok: false, reason: 'Not finished yet.' };
  if (c.claimed) return { ok: false, reason: 'Already claimed.' };

  const gold = Math.round(BALANCE.contracts.goldCoef * g(hero.deepest));
  hero.gold += gold;
  hero.starshards += BALANCE.contracts.starshards;
  const ren = grantRenown(BALANCE.renown.perContract, 'contract');
  c.claimed = true;
  save();
  return { ok: true, gold: gold, starshards: BALANCE.contracts.starshards, renown: ren };
}

/* ============================================================
   EQUIPMENT - SPEC 11.8
   ============================================================ */
function canEquip(hero, item) {
  if (!item) return false;
  if (item.slot !== 'relic' && item.classId && item.classId !== hero.classId) return false;
  return true;
}

/* Equipping moves the old item into the inventory. If the inventory is
   full, don't swap. */
function equipItem(hero, item) {
  if (!canEquip(hero, item)) return { ok: false, reason: 'That is not for this hero.' };
  if (hero.descent) return { ok: false, reason: 'Not during a descent.' };
  const idx = hero.inventory.indexOf(item);
  const old = hero.equipment[item.slot];
  if (old && idx < 0 && inventoryFree(hero) <= 0) return { ok: false, reason: 'Inventory full' };

  if (idx >= 0) hero.inventory.splice(idx, 1);
  hero.equipment[item.slot] = item;
  item.isNew = false;
  if (old) {
    if (inventoryFree(hero) > 0) hero.inventory.push(old);
    else {
      // Cannot happen with the check above, but never drop an item on the floor.
      hero.equipment[item.slot] = old;
      hero.inventory.push(item);
      return { ok: false, reason: 'Inventory full' };
    }
  }
  save();
  return { ok: true, replaced: old };
}

function unequipItem(hero, slot) {
  const item = hero.equipment[slot];
  if (!item) return { ok: false };
  if (hero.descent) return { ok: false, reason: 'Not during a descent.' };
  if (inventoryFree(hero) <= 0) return { ok: false, reason: 'Inventory full' };
  hero.equipment[slot] = null;
  hero.inventory.push(item);
  save();
  return { ok: true };
}

function removeFromInventory(hero, item) {
  const i = hero.inventory.indexOf(item);
  if (i >= 0) hero.inventory.splice(i, 1);
}

/* ============================================================
   THE FORGE - SPEC 13.2
   ============================================================ */
function salvageItem(hero, item) {
  if (item.locked || item.heirloom) return { ok: false, reason: 'That item is locked.' };
  const y = heroSalvageYield(hero, item);
  removeFromInventory(hero, item);
  hero.ash += y.ash;
  hero.starshards += y.shards;
  contractEvent('salvage', { count: 1 });
  bumpTotal('salvaged');
  save();
  return { ok: true, yield: y };
}

/* "Salvage all unlocked [rarity] and below" */
function bulkSalvagePreview(hero, maxRarity) {
  const limit = RARITY_ORDER.indexOf(maxRarity);
  let count = 0, ash = 0, shards = 0;
  const list = [];
  for (const it of hero.inventory) {
    if (it.locked || it.heirloom) continue;
    if (RARITY_ORDER.indexOf(it.rarity) > limit) continue;
    const y = heroSalvageYield(hero, it);
    count++; ash += y.ash; shards += y.shards;
    list.push(it);
  }
  return { count: count, ash: ash, shards: shards, items: list };
}
function bulkSalvage(hero, maxRarity) {
  const p = bulkSalvagePreview(hero, maxRarity);
  for (const it of p.items) removeFromInventory(hero, it);
  hero.ash += p.ash;
  hero.starshards += p.shards;
  contractEvent('salvage', { count: p.count });
  bumpTotal('salvaged', p.count);
  save();
  return p;
}

function temperCost(item) {
  const t = item.temper || 0;
  if (t >= BALANCE.items.temperMax) return null;
  const T = BALANCE.town.temper;
  const next = t + 1;
  const ashMult = 1 + Math.floor(item.ilvl / T.ashIlvlStep);
  return {
    gold: Math.round(T.goldCoef * g(item.ilvl) * next),
    ash: T.ashCoef * next * ashMult,
    shards: next >= T.shardsFromLevel ? next - 5 : 0,
    to: next
  };
}
function temperItem(hero, item) {
  const c = temperCost(item);
  if (!c) return { ok: false, reason: 'Already at +' + BALANCE.items.temperMax + '.' };
  if (hero.gold < c.gold) return { ok: false, reason: 'Not enough gold.' };
  if (hero.ash < c.ash) return { ok: false, reason: 'Not enough Ash.' };
  if (hero.starshards < c.shards) return { ok: false, reason: 'Not enough Starshards.' };
  hero.gold -= c.gold; hero.ash -= c.ash; hero.starshards -= c.shards;
  item.temper = c.to;
  contractEvent('temper', { level: c.to });
  save();
  return { ok: true, to: c.to };
}

/* Reforge (Renown rank 7, SPEC 13.2): replace one chosen affix on a magic
   or rare item with a new one allowed on the slot and not already on it. */
function reforgeCost(item) {
  return {
    gold: Math.round(BALANCE.town.reforge.goldCoef * g(item.ilvl) *
          Math.pow(BALANCE.town.reforge.growth, item.reforges || 0)),
    ash: BALANCE.town.reforge.ash
  };
}

function canReforge(item) {
  if (!hasUnlock('reforge')) return { ok: false, reason: 'Reforge opens at Renown rank 7.' };
  if (item.rarity !== 'magic' && item.rarity !== 'rare') {
    return { ok: false, reason: 'Only magic and rare items can be reforged.' };
  }
  if (!item.affixes || !item.affixes.length) return { ok: false, reason: 'That item has no affixes.' };
  return { ok: true };
}

function reforgeAffix(hero, item, affixIndex) {
  const gate = canReforge(item);
  if (!gate.ok) return gate;
  const c = reforgeCost(item);
  if (hero.gold < c.gold) return { ok: false, reason: 'Not enough gold.' };
  if (hero.ash < c.ash) return { ok: false, reason: 'Not enough Ash.' };
  const old = item.affixes[affixIndex];
  if (!old) return { ok: false, reason: 'No such affix.' };

  const taken = item.affixes.map(function (a) { return a.id; });
  const pool = affixPool(item.slot, item.ilvl, item.rarity).filter(function (a) {
    return taken.indexOf(a.id) < 0;
  });
  if (!pool.length) return { ok: false, reason: 'No other affix can go on that item.' };

  const rng = rngFrom(newSeed('reforge'));
  const pick = rng.pick(pool);
  hero.gold -= c.gold;
  hero.ash -= c.ash;
  item.affixes[affixIndex] = { id: pick.id, value: rollAffixValue(rng, pick, item.ilvl) };
  item.reforges = (item.reforges || 0) + 1;
  if (item.rarity === 'magic') item.name = itemName(rng, item);
  save();
  return { ok: true, from: old, to: item.affixes[affixIndex] };
}

/* Craft (Renown rank 14, SPEC 13.2): a magic or rare item in a chosen slot
   at the deepest floor's item level. Uniques and sets can't be crafted. */
function craftCost(hero) {
  const C = BALANCE.town.craft;
  return { gold: Math.round(C.goldCoef * g(hero.deepest)), ash: C.ash, shards: C.shards };
}
function craftItem(hero, slot) {
  if (!hasUnlock('craft')) return { ok: false, reason: 'Craft opens at Renown rank 14.' };
  if (BALANCE.items.slots.indexOf(slot) < 0) return { ok: false, reason: 'No such slot.' };
  if (inventoryFree(hero) <= 0) return { ok: false, reason: 'Inventory full' };
  const c = craftCost(hero);
  if (hero.gold < c.gold) return { ok: false, reason: 'Not enough gold.' };
  if (hero.ash < c.ash) return { ok: false, reason: 'Not enough Ash.' };
  if (hero.starshards < c.shards) return { ok: false, reason: 'Not enough Starshards.' };

  const rng = rngFrom(newSeed('craft'));
  const rarity = rng.next() < BALANCE.town.craft.magicChance ? 'magic' : 'rare';
  const item = rollItem(rng, { floor: hero.deepest, ilvl: hero.deepest,
                               classId: hero.classId, slot: slot, rarity: rarity });
  hero.gold -= c.gold; hero.ash -= c.ash; hero.starshards -= c.shards;
  recordArmory(item);
  hero.inventory.push(item);
  save();
  return { ok: true, item: item };
}

/* Rekindle (Renown rank 14, SPEC 13.2): raise any item's level to the deepest
   floor. Heirlooms keep their own ceiling, so raise that too. */
function rekindleCost(hero, item) {
  const R = BALANCE.town.rekindle;
  return {
    shards: R.shardsBase + Math.floor(Math.max(0, hero.deepest - item.ilvl) / R.shardsPerFloors),
    gold: Math.round(R.goldCoef * g(hero.deepest))
  };
}
function canRekindle(hero, item) {
  if (!hasUnlock('craft')) return { ok: false, reason: 'Rekindle opens at Renown rank 14.' };
  if (item.ilvl >= hero.deepest) return { ok: false, reason: 'Already at your deepest floor.' };
  return { ok: true };
}
function rekindleItem(hero, item) {
  const gate = canRekindle(hero, item);
  if (!gate.ok) return gate;
  const c = rekindleCost(hero, item);
  if (hero.gold < c.gold) return { ok: false, reason: 'Not enough gold.' };
  if (hero.starshards < c.shards) return { ok: false, reason: 'Not enough Starshards.' };
  hero.gold -= c.gold; hero.starshards -= c.shards;
  item.ilvl = hero.deepest;
  if (item.heirloom) item.originalIlvl = item.ilvl;
  save();
  return { ok: true, to: item.ilvl };
}

/* ============================================================
   THE MARKET - SPEC 13.3
   ============================================================ */
function marketIlvl(hero) { return Math.max(1, hero.deepest - BALANCE.town.market.ilvlOffset); }

function rollMarketStock(hero) {
  const M = BALANCE.town.market;
  const ilvl = marketIlvl(hero);
  const rng = rngFrom(newSeed('market'));
  const stock = [];
  for (let i = 0; i < M.stockCount; i++) {
    const rarity = rng.next() < M.magicChance ? 'magic' : 'rare';
    stock.push(rollItem(rng, { floor: ilvl, ilvl: ilvl, classId: hero.classId, rarity: rarity }));
  }
  return stock;
}

function restockMarket(hero) {
  if (!hero.market) hero.market = { stock: [], restockAt: 0, blackMarket: null };
  if (!hero.market.stock.length || hero.market.restockAt <= now()) {
    hero.market.stock = rollMarketStock(hero);
    hero.market.restockAt = now() + BALANCE.town.market.restockMs;
    save();
    return true;
  }
  return false;
}

/* Early restock (Renown rank 5, SPEC 13.3). */
function earlyRestockCost(hero) {
  return Math.round(BALANCE.town.market.earlyRestockCoef * g(hero.deepest));
}
function buyEarlyRestock(hero) {
  if (!hasUnlock('restock')) return { ok: false, reason: 'Early restocks open at Renown rank 5.' };
  const cost = earlyRestockCost(hero);
  if (hero.gold < cost) return { ok: false, reason: 'Not enough gold.' };
  hero.gold -= cost;
  hero.market.stock = rollMarketStock(hero);
  hero.market.restockAt = now() + BALANCE.town.market.restockMs;
  save();
  return { ok: true, gold: cost };
}

/* The Black Market (Renown rank 12, SPEC 13.3): one unique for the hero's
   class, replaced every 24 hours. */
function refreshBlackMarket(hero) {
  if (!hasUnlock('blackmarket')) return false;
  if (!hero.market) return false;
  const bm = hero.market.blackMarket;
  if (bm && bm.expiresAt > now()) return false;
  const ilvl = marketIlvl(hero);
  const item = rollNamedItem(rngFrom(newSeed('blackmarket')), 'unique', hero.classId, ilvl);
  if (!item) return false;
  hero.market.blackMarket = { item: item, expiresAt: now() + BALANCE.town.market.blackMarketMs };
  save();
  return true;
}
function blackMarketPrice(item) {
  return Math.round(BALANCE.town.market.blackMarketCoef * g(item.ilvl));
}
function buyBlackMarket(hero) {
  const bm = hero.market && hero.market.blackMarket;
  if (!bm || !bm.item) return { ok: false, reason: 'Nothing on offer.' };
  const price = blackMarketPrice(bm.item);
  if (hero.gold < price) return { ok: false, reason: 'Not enough gold.' };
  if (inventoryFree(hero) <= 0) return { ok: false, reason: 'Inventory full' };
  hero.gold -= price;
  bm.item.isNew = true;
  recordArmory(bm.item);            // a bought unique still counts as found
  hero.inventory.push(bm.item);
  hero.market.blackMarket = { item: null, expiresAt: bm.expiresAt };
  save();
  return { ok: true };
}

/* ---- Supplies (SPEC 13.3) ---- */
function supplyPrice(hero, id) {
  const s = BALANCE.town.supplies[id];
  return s ? Math.round(s.coef * g(hero.deepest)) : 0;
}
function buySupply(hero, id) {
  const s = BALANCE.town.supplies[id];
  if (!s) return { ok: false, reason: 'No such supply.' };
  if ((hero.supplies[id] || 0) >= s.max) return { ok: false, reason: 'You cannot carry more.' };
  const price = supplyPrice(hero, id);
  if (hero.gold < price) return { ok: false, reason: 'Not enough gold.' };
  hero.gold -= price;
  hero.supplies[id] = (hero.supplies[id] || 0) + 1;
  save();
  return { ok: true, gold: price };
}

/* A Seer's Candle rerolls a floor's paths for free. */
function useCandle(hero, floor) {
  if ((hero.supplies.candle || 0) <= 0) return { ok: false, reason: 'No Seer’s Candle.' };
  hero.supplies.candle--;
  hero.floors[String(floor)] = rollFloorPaths(hero, floor);
  save();
  return { ok: true };
}

/* Lantern Oil gives +20% time reduction on the next descent. */
function useLanternOil(hero) {
  if ((hero.supplies.oil || 0) <= 0) return { ok: false, reason: 'No Lantern Oil.' };
  if (hero.oilPrimed) return { ok: false, reason: 'Already lit.' };
  hero.supplies.oil--;
  hero.oilPrimed = true;
  save();
  return { ok: true };
}

function buyPrice(item) {
  const M = BALANCE.town.market;
  const base = item.rarity === 'rare' ? M.priceRare : M.priceMagic;
  return Math.round(base * g(item.ilvl));
}
function sellPrice(hero, item) {
  const M = BALANCE.town.market;
  let base = M.sell[item.rarity] || 0;
  // Fence (Nightblade, Phase 2) raises this.
  let bonus = 0;
  for (const entry of passiveEffects(hero)) {
    if (entry.e.k === 'sell_bonus') bonus += effAmount(entry);
  }
  // Coinshade's Favour (Chapel Offering) lifts this while it lasts.
  return Math.round(base * g(item.ilvl) * (1 + bonus / 100) * offeringMult(hero, 'sell_price_mult'));
}

function buyItem(hero, item) {
  const price = buyPrice(item);
  if (hero.gold < price) return { ok: false, reason: 'Not enough gold.' };
  if (inventoryFree(hero) <= 0) return { ok: false, reason: 'Inventory full' };
  hero.gold -= price;
  const i = hero.market.stock.indexOf(item);
  if (i >= 0) hero.market.stock.splice(i, 1);
  item.isNew = true;
  recordArmory(item);
  hero.inventory.push(item);
  save();
  return { ok: true };
}
function sellItem(hero, item) {
  if (item.locked || item.heirloom) return { ok: false, reason: 'That item is locked.' };
  const price = sellPrice(hero, item);
  removeFromInventory(hero, item);
  hero.gold += price;
  save();
  return { ok: true, gold: price };
}

/* ============================================================
   THE LAST CHAPEL - SPEC 13.1
   ============================================================ */
function healsInWindow(hero) {
  const cutoff = now() - BALANCE.town.heal.windowMs;
  hero.healsAt = (hero.healsAt || []).filter(function (t) { return t > cutoff; });
  return hero.healsAt.length;
}

function healCostMultiplier(hero) {
  let mult = 1;
  for (const entry of passiveEffects(hero)) {
    if (entry.e.k === 'heal_cost_mult') mult *= entry.e.value;
  }
  return mult;
}

/* `fraction` is 0.25, 0.5 or 1. Cost uses the percent ACTUALLY restored. */
function healQuote(hero, fraction) {
  const H = BALANCE.town.heal;
  const st = heroStats(hero);
  const hp = currentHp(hero, st);
  const target = fraction >= 1 ? st.maxHp : Math.min(st.maxHp, hp + st.maxHp * fraction);
  const restored = Math.max(0, target - hp);
  const restoredPct = st.maxHp > 0 ? restored / st.maxHp * 100 : 0;
  const gold = Math.round(
    restoredPct * H.coef * g(hero.deepest) *
    Math.pow(H.growth, healsInWindow(hero)) * healCostMultiplier(hero)
  );
  return { restored: Math.round(restored), restoredPct: restoredPct, gold: gold, target: Math.round(target) };
}

function canHeal(hero) {
  if (hero.descent) return { ok: false, reason: 'Not during a descent.' };
  if (hero.fallenUntil > now()) return { ok: false, reason: 'Not while Fallen.' };
  for (const entry of passiveEffects(hero)) {
    if (entry.e.k === 'no_heal') return { ok: false, reason: 'The Chapel will not heal you.' };
  }
  return { ok: true };
}

function healHero(hero, fraction) {
  const gate = canHeal(hero);
  if (!gate.ok) return gate;
  const q = healQuote(hero, fraction);
  if (q.restored <= 0) return { ok: false, reason: 'Already at full HP.' };
  if (hero.gold < q.gold) return { ok: false, reason: 'Not enough gold.' };
  hero.gold -= q.gold;
  setHp(hero, q.target);
  hero.healsAt.push(now());
  save();
  return { ok: true, restored: q.restored, gold: q.gold };
}

function reviveCost(hero) { return Math.round(BALANCE.hp.reviveCoef * g(hero.deepest)); }

function reviveHero(hero) {
  if (!(hero.fallenUntil > now())) return { ok: false, reason: 'You are not Fallen.' };
  const cost = reviveCost(hero);
  if (hero.gold < cost) return { ok: false, reason: 'Not enough gold.' };
  hero.gold -= cost;
  hero.fallenUntil = 0;
  // Revive ends Fallen immediately "with the same HP" it would have had.
  const st = heroStats(hero);
  setHp(hero, st.maxHp * fallenRestoreFraction(hero));
  save();
  return { ok: true, gold: cost };
}

function respecCost(hero) {
  if (hero.level < BALANCE.tree.respecFreeBelowLevel) return 0;
  return Math.round(BALANCE.tree.respecCoef * g(hero.level));
}
function respec(hero) {
  if (hero.descent) return { ok: false, reason: 'Not during a descent.' };
  const cost = respecCost(hero);
  if (hero.gold < cost) return { ok: false, reason: 'Not enough gold.' };
  hero.gold -= cost;
  hero.skills = {};
  hero.riteSlots = [null, null, null];
  hero.primed = [];
  hero.timed = [];
  save();
  return { ok: true, gold: cost };
}

/* ============================================================
   SKILL TREE - SPEC 10.1, 10.2
   ============================================================ */
function pointsInBranch(hero, branchId) {
  const tree = TREES[hero.classId];
  if (!tree) return 0;
  const br = tree.branches.find(function (b) { return b.id === branchId; });
  if (!br) return 0;
  let n = 0;
  for (const node of br.nodes) n += hero.skills[node.id] || 0;
  return n;
}

function rowOpen(hero, branchId, row) {
  const need = BALANCE.tree.rowRequirements[row] || 0;
  return pointsInBranch(hero, branchId) >= need;
}

function canLearn(hero, nodeId) {
  const node = nodeById(hero.classId, nodeId);
  if (!node) return { ok: false, reason: 'Unknown node.' };
  const rank = hero.skills[nodeId] || 0;
  if (rank >= node.maxRank) return { ok: false, reason: 'Already at maximum rank.' };
  if (unspentSkillPoints(hero) <= 0) return { ok: false, reason: 'No skill points left.' };
  const br = branchOfNode(hero.classId, nodeId);
  if (!rowOpen(hero, br.id, node.row)) {
    return { ok: false, reason: 'Needs ' + BALANCE.tree.rowRequirements[node.row] + ' points in ' + br.name + '.' };
  }
  return { ok: true };
}

function learnNode(hero, nodeId) {
  const gate = canLearn(hero, nodeId);
  if (!gate.ok) return gate;
  hero.skills[nodeId] = (hero.skills[nodeId] || 0) + 1;
  // A newly learned rite drops into the first empty slot, for convenience.
  const node = nodeById(hero.classId, nodeId);
  if (node.type === 'rite' && hero.riteSlots.indexOf(nodeId) < 0) {
    const empty = hero.riteSlots.indexOf(null);
    if (empty >= 0) hero.riteSlots[empty] = nodeId;
  }
  save();
  return { ok: true };
}

/* ---- Rites, SPEC 10.2 ---- */
function learnedRites(hero) {
  return riteNodesFor(hero).filter(function (n) { return (hero.skills[n.id] || 0) > 0; });
}

function riteCooldownMs(hero, node) {
  let hours = node.rite.cooldownH;
  let pct = 0;
  for (const entry of passiveEffects(hero)) {
    const e = entry.e;
    if (e.k === 'rite_cd_mod' && e.riteId === node.id) hours += e.hours;
    // Quick Rites and the like: a percentage off named rites.
    if (e.k === 'rite_cd_pct' && (e.riteIds || []).indexOf(node.id) >= 0) pct += e.value;
  }
  hours = Math.max(0, hours) * (1 + pct / 100);
  const st = heroStats(hero);
  const red = Math.min(st.riteCd / 100, BALANCE.caps.riteCd);
  return Math.max(0, hours) * HOUR * (1 - red);
}

function riteReadyIn(hero, riteId) {
  const at = hero.riteReadyAt[riteId] || 0;
  return Math.max(0, at - now());
}

function riteState(hero, riteId) {
  const node = nodeById(hero.classId, riteId);
  if (!node) return null;
  const cd = riteReadyIn(hero, riteId);
  const primed = (hero.primed || []).some(function (p) { return p.riteId === riteId; });
  const window = (hero.timed || []).find(function (t) { return t.riteId === riteId && t.endsAt > now(); });
  return {
    node: node,
    ready: cd <= 0 && !primed && !window,
    cooldown: cd,
    primed: primed,
    activeUntil: window ? window.endsAt : 0
  };
}

function canInvokeRite(hero, riteId) {
  const s = riteState(hero, riteId);
  if (!s) return { ok: false, reason: 'Unknown rite.' };
  if (hero.riteSlots.indexOf(riteId) < 0) return { ok: false, reason: 'That rite is not slotted.' };
  if (s.cooldown > 0) return { ok: false, reason: 'Recharging: ' + fmtTime(s.cooldown) + '.' };
  if (s.primed) return { ok: false, reason: 'Already primed.' };
  if (s.activeUntil > now()) return { ok: false, reason: 'Already active.' };
  const kind = s.node.rite.kind;
  if (kind === 'emergency') {
    if (s.node.rite.midDescentOnly && !hero.descent) return { ok: false, reason: 'Only during a descent.' };
  } else if (hero.descent) {
    return { ok: false, reason: 'Only emergency rites work mid-descent.' };
  }
  return { ok: true };
}

function invokeRite(hero, riteId) {
  const gate = canInvokeRite(hero, riteId);
  if (!gate.ok) return gate;
  const node = nodeById(hero.classId, riteId);
  const kind = node.rite.kind;
  const t = now();

  if (kind === 'primed') {
    // Lingering Curse and Marrowborn Rite make their rite last two descents.
    let uses = 1;
    const sp = gearSpecials(hero);
    const passives = {};
    for (const entry of passiveEffects(hero)) {
      if (entry.e.k === 'special') passives[entry.e.id] = true;
    }
    if (riteId === 'hex_of_frailty' && passives.lingering_curse) uses = 2;
    if (riteId === 'raise_thralls' && sp.marrowborn_rite_3) uses = 2;
    hero.primed.push({ riteId: riteId, usesLeft: uses, data: {} });
  } else if (kind === 'timed') {
    hero.timed = (hero.timed || []).filter(function (w) { return w.endsAt > t; });
    hero.timed.push({ riteId: riteId, startsAt: t, endsAt: t + node.rite.durationH * HOUR });
  } else if (kind === 'emergency' || kind === 'instant') {
    applyImmediateRite(hero, node, t);
  }

  hero.riteReadyAt[riteId] = t + riteCooldownMs(hero, node);
  save();
  return { ok: true, kind: kind };
}

/* Emergency and instant rites act at once, in town or mid-descent. */
function applyImmediateRite(hero, node, t) {
  const st = heroStats(hero);

  // Corpse Harvest: restore 3% of Max HP for each encounter already cleared.
  if (node.id === 'corpse_harvest' && hero.descent) {
    const d = hero.descent;
    const amount = st.maxHp * 0.03 * d.resolved;
    d.hp = Math.min(d.hp + amount, st.maxHp);
    d.log.unshift({ t: t, text: node.name + '. +' + fmtNum(Math.round(amount)) + ' HP.', kind: 'rite' });
    return;
  }

  // Dark Bargain: take the HP now, and prime the chest bonus for the next descent.
  // Regalia of the Choir, 3 pieces, halves what it costs.
  if (node.id === 'dark_bargain') {
    const frac = gearSpecials(hero).regalia_of_the_choir_3 ? 0.15 : 0.30;
    const taken = Math.floor(currentHp(hero, st) * frac);
    setHp(hero, Math.max(1, currentHp(hero, st) - taken));
    hero.primed.push({ riteId: node.id, usesLeft: 1, data: { hpTaken: taken } });
    return;
  }

  for (const e of (node.effects || [])) {
    if (e.k === 'restore_hp') {
      const amount = st.maxHp * e.value;
      if (hero.descent) {
        hero.descent.hp = Math.min(hero.descent.hp + amount, st.maxHp);
        hero.descent.emergency.push({ riteId: node.id, at: t, effects: [] });
        hero.descent.log.unshift({ t: t, text: node.name + '. +' + fmtNum(Math.round(amount)) + ' HP.', kind: 'rite' });
      } else {
        setHp(hero, currentHp(hero, st) + amount);
      }
    }
  }
  // Any stat-changing emergency rite applies to later encounters.
  const statEffects = (node.effects || []).filter(function (e) {
    return e.k !== 'restore_hp' && e.k !== 'special';
  });
  if (hero.descent && statEffects.length) {
    hero.descent.emergency.push({
      riteId: node.id, at: t,
      effects: statEffects.map(function (e) { return { e: e, rank: hero.skills[node.id] || 1, node: node.id }; })
    });
  }
}

/* ---- Instant rites that act on the floor the player is looking at ---- */

/* Unmake removes one bane from the selected path. Hexbound Relics' 3-piece
   bonus removes every bane instead. Crown of the Eclipsed forbids both. */
function unmakeBane(hero, floor, pathIndex, all) {
  for (const slot of BALANCE.items.slots) {
    const it = hero.equipment[slot];
    if (it && it.uniqueId === 'crown_of_the_eclipsed') {
      return { ok: false, reason: 'Crown of the Eclipsed will not let banes be removed.' };
    }
  }
  const paths = getFloorPaths(hero, floor);
  const path = paths[pathIndex];
  if (!path) return { ok: false, reason: 'No path selected.' };
  const banes = path.omens.filter(function (id) { return OMENS[id] && OMENS[id].type === 'bane'; });
  if (!banes.length) return { ok: false, reason: 'That path has no banes.' };

  const removed = all ? banes.slice() : [banes[0]];
  path.omens = path.omens.filter(function (id) { return removed.indexOf(id) < 0; });
  // The encounter list depends on the omens, so re-derive it.
  path.encounters = rollEncounters(path.seed, floor, path.omens);
  save();
  return { ok: true, removed: removed };
}

/* Scry the Deep rerolls the floor's paths for free and adds one extra,
   to a maximum of four, until they next reroll. */
function scryTheDeep(hero, floor) {
  hero.floors[String(floor)] = rollFloorPaths(hero, floor, 1);
  save();
  return { ok: true, paths: hero.floors[String(floor)].paths.length };
}

/* The Shadowmancer's free path reroll, recharging 24 hours after use (SPEC 5.1). */
function freeRerollReady(hero) {
  return hero.classId === 'shadowmancer' && (hero.freeRerollReadyAt || 0) <= now();
}
function useFreeReroll(hero, floor) {
  if (!freeRerollReady(hero)) return { ok: false, reason: 'Not ready yet.' };
  hero.freeRerollReadyAt = now() + DAY;
  hero.floors[String(floor)] = rollFloorPaths(hero, floor);
  save();
  return { ok: true };
}

function emergencyRites(hero) {
  return learnedRites(hero).filter(function (n) {
    return n.rite.kind === 'emergency' && hero.riteSlots.indexOf(n.id) >= 0;
  });
}

/* ============================================================
   SIMULATOR - SPEC 21.1
   Runs the real engine: the same snapshot, timeline, cost and
   reward functions the game uses.
   ============================================================ */
let SIMULATING = false;

/* The default hero: at par for that floor (SPEC 21.1). */
function parHero(floor, classId) {
  const hero = freshHero('Par', classId || 'neutral');
  hero.level = Math.min(floor, BALANCE.levelCap);
  const L = hero.level;
  const D = dangerOf(floor);
  hero.simFlat = {
    might: D - BALANCE.base.might * g(L),
    guard: D - BALANCE.base.guard * g(L),
    maxHp: parHp(floor) - BALANCE.base.maxHp * g(L)
  };
  hero.simPoints = { recovery: floor >= 21 ? 25 : 0 };
  hero.slotsOverride = 100000;
  hero.deepest = floor;
  return hero;
}

function percentile(sorted, p) {
  if (!sorted.length) return 0;
  const i = clamp(Math.floor(p * (sorted.length - 1)), 0, sorted.length - 1);
  return sorted[i];
}

function simulate(opts) {
  const runs = opts.runs || BALANCE.debug.simDefaultRuns;
  const floor = opts.floor;
  const wasSim = SIMULATING;
  SIMULATING = true;

  const costPct = [], durations = [], golds = [], xps = [], itemCounts = [];
  const rarityCounts = { common: 0, magic: 0, rare: 0, unique: 0, set: 0 };
  let deaths = 0, clears = 0;

  /* Simulated descents run the real engine, and the real engine records
     things on the account as it goes: the Armory, lifetime totals, contract
     progress. save() is already blocked while simulating, but the changes
     would sit in memory and the next real save would keep them - simulated
     uniques in the Armory, inflated totals feeding achievements. So the
     simulator works on a throwaway copy and the real state is put back. */
  const savedState = state;
  state = JSON.parse(JSON.stringify(savedState));
  try {
    for (let i = 0; i < runs; i++) {
      const hero = opts.makeHero();
      hero.floors = {};
      hero.inventory = [];
      const seed = 'sim:' + (opts.tag || 'n') + ':' + floor + ':' + i;
      const omens = opts.randomOmens ? rollOmens(rngFrom(seed + ':omens'), floor, false) : [];
      const encounters = rollEncounters(seed, floor, omens);
      if (opts.pathType === 'horror' && !guardianOnFloor(floor)) {
        encounters.push({ kind: 'horror', weight: BALANCE.encounters.weights.horror, name: 'A Wandering Horror' });
      }
      const path = { name: 'Simulated', seed: seed, omens: omens, encounters: encounters };
      hero.floors[String(floor)] = { paths: [path], rolledAt: now() };

      const st = heroStats(hero);
      setHp(hero, st.maxHp);

      const d = startDescent(hero, floor, 0);
      if (!d) continue;

      let died = false;
      while (d.resolved < d.timeline.length) {
        const enc = d.timeline[d.resolved];
        const outcome = applyEncounter(hero, d, enc);
        d.resolved++;
        if (outcome === 'death') { died = true; break; }
        if (outcome === 'saved') break;
      }

      const spent = d.hpAtStart - Math.max(d.hp, 0);
      costPct.push(spent / st.maxHp * 100);
      durations.push(d.duration);
      golds.push(d.rewards.gold);
      xps.push(d.rewards.xp);

      if (died) { deaths++; }
      else {
        clears++;
        const ctx = { effects: effectsAt(d.snapshot, d.endsAt, []), hp: d.hp, elitesKilled: d.stacks.elitesKilled };
        ctx.stats = statsAt(d.snapshot, ctx);
        const chest = chestRewards(d.snapshot, ctx, floor, d.seed);
        for (const it of chest) d.rewards.items.push(it);
      }
      itemCounts.push(d.rewards.items.length);
      for (const it of d.rewards.items) rarityCounts[it.rarity] = (rarityCounts[it.rarity] || 0) + 1;

      hero.descent = null;
    }
  } finally {
    SIMULATING = wasSim;
    state = savedState;
  }

  const mean = function (a) { return a.length ? a.reduce(function (x, y) { return x + y; }, 0) / a.length : 0; };
  const sortedCost = costPct.slice().sort(function (a, b) { return a - b; });

  return {
    runs: runs,
    floor: floor,
    meanCostPct: mean(costPct),
    p90CostPct: percentile(sortedCost, 0.90),
    deathRate: deaths / runs * 100,
    meanDuration: mean(durations),
    meanGold: mean(golds),
    meanXp: mean(xps),
    meanItems: mean(itemCounts),
    rarityCounts: rarityCounts,
    clears: clears
  };
}

/* Par descents per level (SPEC 21.1 pace table). */
function paceTable() {
  const rows = [];
  for (let L = 1; L <= BALANCE.levelCap; L++) {
    let floor = Math.min(L, BALANCE.phase.maxFloor);
    // Every path on a Guardian floor ends with the Guardian, so a "normal"
    // path cannot exist there. Measure the pace one floor up instead.
    if (guardianOnFloor(floor)) floor = Math.max(1, floor - 1);
    const sim = simulate({ floor: floor, runs: 40, tag: 'pace' + L, makeHero: function () {
      const x = parHero(floor, 'neutral'); x.level = L; return x;
    } });
    const need = xpToNext(L);
    rows.push({ level: L, xpPerDescent: sim.meanXp, xpToNext: need,
                descents: sim.meanXp > 0 ? need / sim.meanXp : Infinity,
                target: Math.max(1, BALANCE.xp.paceBase + BALANCE.xp.pacePerLevel * L) });
  }
  return rows;
}

/* ============================================================
   UI KERNEL - SPEC 19.1
   One render pass per state change; a 1s tick only re-renders,
   it never advances game state (CLAUDE.md, one clock).
   ============================================================ */
const TAB_LIST = [
  { id: 'descend', label: 'Descend', icon: 'ico-descend' },
  { id: 'hero',    label: 'Hero',    icon: 'ico-hero' },
  { id: 'town',    label: 'Town',    icon: 'ico-town' },
  { id: 'halls',   label: 'Halls',   icon: 'ico-halls' }
];

/* Each view: { render() -> html string, tick?(), after?() } */
const VIEWS = {};

const ui = {
  tab: 'descend',
  activeTick: null,
  tickTimer: null,
  screen: null        // when set (e.g. 'create'), it replaces the whole shell
};

function setTab(id) {
  // Tapping the tab you are already on takes you back to that tab's top
  // level, which is how the Town tab escapes the Chapel, Forge and so on.
  if (ui.tab === id) {
    const v = VIEWS[id];
    if (v && v.reset) { v.reset(); refresh(); el('view').scrollTop = 0; }
    return;
  }
  ui.tab = id;
  refresh();
  el('view').scrollTop = 0;
}

/* Full refresh after any state change. Settling first means every render
   reads state that is already caught up to now(). */
function refresh() {
  settle();
  // Character creation is a flow of its own: no status strip, no tabs.
  const hasHero = !!(state && state.hero);
  el('strip').style.display = hasHero ? '' : 'none';
  el('tabs').style.display = hasHero ? '' : 'none';
  renderStrip();
  renderTabs();
  renderView();
}

function renderView() {
  const host = el('view');
  const view = VIEWS[ui.tab];
  if (!view) { host.innerHTML = ''; ui.activeTick = null; mountDock(host); return; }
  host.innerHTML = view.render();
  ui.activeTick = view.tick || null;
  if (view.after) view.after(host);
  mountDock(host);
}

/* Moves the view's .dock, if it has one, into the fixed footer. It moves after
   view.after, so handlers attached there (the retreat hold) travel with it. */
function mountDock(host) {
  const slot = el('dock');
  const dock = host.querySelector('.dock');
  slot.textContent = '';
  if (dock) slot.appendChild(dock);
  slot.hidden = !dock;
}

function renderTabs() {
  const host = el('tabs');
  host.innerHTML = TAB_LIST.map(function (t) {
    const cur = t.id === ui.tab;
    return '<button class="tab" data-act="tab" data-tab="' + t.id + '"' +
      (cur ? ' aria-current="page"' : '') + '>' +
      icon(t.icon) + '<span>' + t.label + '</span></button>';
  }).join('');
}

/* The stats to SHOW right now. During a descent these come from the
   snapshot, because a level-up mid-descent grants its skill point at once
   but must not change stats until the descent ends (SPEC 4). */
function activeStats(hero) {
  if (hero.descent) {
    const d = hero.descent;
    const ctx = { effects: effectsAt(d.snapshot, now(), d.emergency),
                  hp: d.hp, elitesKilled: d.stacks.elitesKilled };
    return statsAt(d.snapshot, ctx);
  }
  return heroStats(hero);
}

function renderStrip() {
  const host = el('strip');
  const hero = state && state.hero;
  if (!hero) { host.innerHTML = ''; return; }

  const st = activeStats(hero);
  const hp = currentHp ? currentHp(hero, st) : 0;
  const pct = st.maxHp > 0 ? clamp(hp / st.maxHp, 0, 1) : 0;

  let statusLine;
  if (hero.fallenUntil > now()) {
    statusLine = '<span class="risk risk-deadly">' + icon('ico-deadly') +
      'Fallen: ' + fmtTime(hero.fallenUntil - now()) + ' left</span>';
  } else if (hero.descent) {
    // HP does not regenerate during a descent, so a "full in" estimate would lie.
    statusLine = '<span class="muted">Descending</span>';
  } else if (hp >= st.maxHp) {
    statusLine = '<span class="muted">Full HP</span>';
  } else {
    const ms = timeToFullHp ? timeToFullHp(hero, st) : 0;
    statusLine = '<span class="muted">Full in ' + fmtTime(ms) + '</span>';
  }

  let descentChip = '';
  if (hero.descent) {
    const left = Math.max(0, hero.descent.endsAt - now());
    descentChip = '<button class="chip chip-pact" data-act="tab" data-tab="descend">' +
      icon('ico-descend') + 'Floor ' + hero.descent.floor + ', ' + fmtTime(left) + ' left</button>';
  }

  host.innerHTML =
    // Who the hero is, above their HP.
    '<div class="strip-row">' +
      '<div class="grow" style="min-width:0">' +
        '<span class="small" style="font-weight:600">' + esc(hero.name) + '</span>' +
        '<span class="tiny muted"> &middot; Level <span class="num">' + fmtNum(hero.level) + '</span>' +
          (activeTitleName() ? ' &middot; ' + esc(activeTitleName()) : '') + '</span>' +
      '</div>' +
      '<button id="strip-help" data-act="help" aria-label="How to play">' + icon('ico-help') + '</button>' +
      '<button id="strip-settings" data-act="settings" aria-label="Settings">' + icon('ico-settings') + '</button>' +
    '</div>' +
    '<div class="strip-row">' +
      '<div class="strip-hp">' +
        '<div class="row" style="gap:8px">' +
          '<div class="bar bar-lg grow"><div class="bar-fill" style="width:' + (pct * 100) + '%"></div></div>' +
          '<span class="num small" style="flex:0 0 auto">' + fmtNum(hp) + ' / ' + fmtNum(st.maxHp) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div class="strip-row strip-meta">' +
      '<span class="strip-stat num">' + icon('ico-coin', 'coin') + '<span>' + fmtNum(hero.gold) + '</span></span>' +
      '<span class="strip-stat small">' + statusLine + '</span>' +
      descentChip +
    '</div>';
}

/* The tick only re-renders. All progress comes from timestamps. */
function startTick() {
  if (ui.tickTimer) clearInterval(ui.tickTimer);
  ui.tickTimer = setInterval(function () {
    const before = state.hero && state.hero.descent;
    settle();
    const after = state.hero && state.hero.descent;
    const justEnded = before && !after;

    if (document.visibilityState === 'hidden') {
      // SPEC 19.1 - say so in the tab title.
      if (justEnded) document.title = 'Descent complete';
      return;
    }
    if (justEnded) { refresh(); showPendingResults(); return; }
    renderStrip();
    if (ui.activeTick) ui.activeTick();
  }, 1000);

  // Catch up the moment the tab comes back, and set the title when it doesn't.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible') return;
    document.title = 'Infernus';
    const hadDescent = state.hero && state.hero.descent;
    refresh();
    if (hadDescent && state.hero && !state.hero.descent) showPendingResults();
  });
}

/* ============================================================
   BOTTOM SHEETS - SPEC 19.1
   ============================================================ */
let sheetStack = [];

function openSheet(opts) {
  const host = el('sheets');
  const node = h(
    '<div class="sheet-layer">' +
      '<div class="sheet-back" data-sheet-close="1"></div>' +
      '<section class="sheet" role="dialog" aria-modal="true">' +
        '<div class="sheet-grip"><i></i></div>' +
        '<header class="sheet-head">' +
          '<h2>' + esc(opts.title || '') + '</h2>' +
          '<button class="sheet-close" data-sheet-close="1" aria-label="Close">' + icon('ico-close') + '</button>' +
        '</header>' +
        '<div class="sheet-body">' + (opts.body || '') + '</div>' +
        (opts.foot ? '<footer class="sheet-foot">' + opts.foot + '</footer>' : '') +
      '</section>' +
    '</div>'
  );
  host.appendChild(node);
  const entry = { node: node, onClose: opts.onClose || null, id: opts.id || null };
  sheetStack.push(entry);

  // force layout, then animate in
  void node.offsetHeight;
  host.classList.add('sheet-open');
  node.classList.add('sheet-open');

  node.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-sheet-close]')) { closeSheet(); return; }
    const act = ev.target.closest('[data-act]');
    if (act && opts.onAct) opts.onAct(act.dataset.act, act, ev);
  });

  // swipe down to close
  attachSheetDrag(node);
  if (opts.after) opts.after(node);
  return node;
}

function closeSheet() {
  const entry = sheetStack.pop();
  if (!entry) return;
  entry.node.classList.remove('sheet-open');
  const node = entry.node;
  const delay = getComputedStyle(document.documentElement).getPropertyValue('--dur').trim() === '0ms' ? 0 : 200;
  setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, delay);
  if (entry.onClose) entry.onClose();
}

function closeAllSheets() { while (sheetStack.length) closeSheet(); }

function attachSheetDrag(layer) {
  const sheet = layer.querySelector('.sheet');
  const grip = layer.querySelector('.sheet-grip');
  let startY = 0, dy = 0, dragging = false;
  function down(ev) {
    dragging = true; dy = 0;
    startY = (ev.touches ? ev.touches[0].clientY : ev.clientY);
    sheet.style.transition = 'none';
  }
  function move(ev) {
    if (!dragging) return;
    const y = (ev.touches ? ev.touches[0].clientY : ev.clientY);
    dy = Math.max(0, y - startY);
    sheet.style.transform = 'translate(-50%,' + dy + 'px)';
  }
  function up() {
    if (!dragging) return;
    dragging = false;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if (dy > 70) closeSheet();
  }
  grip.addEventListener('touchstart', down, { passive: true });
  grip.addEventListener('touchmove', move, { passive: true });
  grip.addEventListener('touchend', up);
  grip.addEventListener('mousedown', down);
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
}

/* A confirm sheet. onYes runs when confirmed. */
function confirmSheet(opts) {
  openSheet({
    title: opts.title,
    body: '<p>' + (opts.body || '') + '</p>' + (opts.extra || ''),
    foot: '<div class="btn-row">' +
            '<button class="btn" data-act="no">Cancel</button>' +
            '<button class="btn ' + (opts.danger ? 'btn-danger' : 'btn-primary') + '" data-act="yes">' +
              esc(opts.yes || 'Confirm') + '</button>' +
          '</div>',
    onAct: function (act) {
      if (act === 'no') closeSheet();
      if (act === 'yes') { closeSheet(); if (opts.onYes) opts.onYes(); }
    }
  });
}

/* ============================================================
   HOLD-TO-CONFIRM  (Retreat, SPEC 7.7)
   ============================================================ */
function attachHold(btn, ms, onDone) {
  const fill = btn.querySelector('.fill');
  let raf = null, start = 0;
  function step() {
    const p = clamp((performance.now() - start) / ms, 0, 1);
    if (fill) fill.style.width = (p * 100) + '%';
    if (p >= 1) { stop(); onDone(); return; }
    raf = requestAnimationFrame(step);
  }
  function begin(ev) {
    ev.preventDefault();
    start = performance.now();
    raf = requestAnimationFrame(step);
  }
  function stop() {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    if (fill) fill.style.width = '0%';
  }
  btn.addEventListener('pointerdown', begin);
  btn.addEventListener('pointerup', stop);
  btn.addEventListener('pointercancel', stop);
  btn.addEventListener('pointerleave', stop);
}

function helpFooter() {
  const last = helpPage >= HELP_PAGES.length - 1;

      '<button class="btn" data-act="back"' + (helpPage === 0 ? ' disabled' : '') + '>Back</button>' +
      '<button class="btn btn-primary" data-act="next">' + (last ? 'Done' : 'Next') + '</button>' +

}

function helpBody() {
  const p = HELP_PAGES[helpPage];
  // Plain type, not the display face: CLAUDE.md reserves that for the game's

  return '<div class="stack">' +
      '<h3 style="font-size:1.125rem;margin:0">' + esc(p.title) + '</h3>' +
      p.body.split('\n\n').map(function (para, i) {
        return '<p style="line-height:1.7;margin:' + (i ? '14px' : '0') + ' 0 0">' +
          esc(para) + '</p>';

      // depends on colour alone.
      '<div class="row" style="gap:6px;margin-top:4px" aria-hidden="true">' +
        HELP_PAGES.map(function (_, i) {
          return '<i style="width:7px;height:7px;border-radius:50%;background:' +
            (i === helpPage ? 'var(--corona)' : 'var(--track)') + '"></i>';
        }).join('') +

    '</div>';

function openHelp() {
  helpPage = 0;
  // Queries are scoped to this sheet's own layer: a closing sheet lingers for
  // its animation, so a document-wide lookup could find the wrong one.
  let layer = null;
  layer = openSheet({
    title: 'How to play',
    body: '<div class="help-body">' + helpBody() + '</div>',
    foot: '<div class="help-foot">' + helpFooter() + '</div>',
    onAct: function (act) {
      if (act === 'back' && helpPage > 0) helpPage--;
      else if (act === 'next') {
        if (helpPage >= HELP_PAGES.length - 1) { closeSheet(); return; }
        helpPage++;
      } else return;
      // Redraw in place so the sheet does not animate out and back in.
      if (!layer) return;
      const b = layer.querySelector('.help-body');
      const f = layer.querySelector('.help-foot');
      if (b) b.innerHTML = helpBody();
      if (f) f.innerHTML = helpFooter();
    }
  });
}
