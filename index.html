    const it = hero.equipment[slot];
    if (it && it.uniqueId === 'the_lure') opts.horrorMult = 2;
  }
  return opts;
}

function rollOmens(rng, f, allowHorror, opts) {
  opts = opts || {};
  const slots = omensPerPath(f);
  const chosen = [];

  // 1. From floor 5, on floors without a Guardian, a 1-in-6 chance of A Horror Stirs.
  const horrorChance = Math.min(1, BALANCE.floor.horrorChance * (opts.horrorMult || 1));
  if (allowHorror && f >= BALANCE.floor.horrorMinFloor && !guardianOnFloor(f) &&
      rng.chance(horrorChance)) {
    chosen.push('a_horror_stirs');
  }

  const weights = omenTypeWeights(f);
  // Below the story, each stratum's signature omen turns up more often.
  const stratum = stratumForFloor(f);
  const signature = stratum ? stratum.signature : null;
  let guard = 0;
  while (chosen.length < slots && guard < 400) {
    guard++;
    const types = [['bane', weights.bane], ['pact', weights.pact]];
    if (!opts.noBoons) types.push(['boon', weights.boon]);
    const type = rng.weighted(types);

    let id;
    if (type === 'boon' && opts.gildedPath) {
      // Gilded Path: Glittering Veins is twice as likely among boons.
      id = rng.weighted(OMENS_BY_TYPE.boon.map(function (b) {
        return [b, b === 'glittering_veins' ? 2 : 1];
      }));
    } else if (signature && OMENS_BY_TYPE[type].indexOf(signature) >= 0) {
      id = rng.weighted(OMENS_BY_TYPE[type].map(function (o) {
        return [o, o === signature ? BALANCE.deep.signatureWeight : 1];
      }));
    } else {
      id = rng.pick(OMENS_BY_TYPE[type]);
    }

    if (chosen.indexOf(id) >= 0) continue;                       // duplicate
    if (chosen.some(function (c) { return conflicts(c, id); })) continue;   // conflict
    chosen.push(id);
  }
  return chosen;
}

/* Merge every omen effect on a path into one object. */
function mergeFx(omenIds) {
  const fx = { gold: 1, item: 1, cost: 1, timeRed: 0, timeInc: 0, regen: 0,
               rarityMult: 1, packMult: 1, extraElite: 0, chestMinRarity: null, horror: false };
  for (const id of omenIds || []) {
    const o = omenFx(id);
    if (o.gold) fx.gold *= o.gold;
    if (o.item) fx.item *= o.item;
    if (o.cost) fx.cost *= o.cost;
    if (o.timeRed) fx.timeRed += o.timeRed;
    if (o.timeInc) fx.timeInc += o.timeInc;
    if (o.regen) fx.regen = Math.max(fx.regen, o.regen);
    if (o.rarityMult) fx.rarityMult *= o.rarityMult;
    if (o.packMult) fx.packMult *= o.packMult;
    if (o.extraElite) fx.extraElite += o.extraElite;
    if (o.chestMinRarity) fx.chestMinRarity = o.chestMinRarity;
    if (o.horror) fx.horror = true;
  }
  return fx;
}

/* SPEC 7.2 - generated from the path's seed when the path is rolled. */
function rollEncounters(seed, f, omenIds) {
  const rng = rngFrom(seed + ':encounters');
  const fx = mergeFx(omenIds);
  const E = BALANCE.encounters;

  let packs = f <= E.packsShallowMaxFloor
    ? E.packsShallowBase + f
    : rng.int(E.packsDeepMin, E.packsDeepMax);
  packs = Math.ceil(packs * fx.packMult);

  let elites;
  if (f <= E.elitesNoneMaxFloor) elites = 0;
  else if (f <= E.elitesOneMaxFloor) elites = 1;
  else elites = rng.int(E.elitesDeepMin, E.elitesDeepMax);
  elites += fx.extraElite;

  const families = familiesFor(f);
  const list = [];
  for (let i = 0; i < packs; i++) {
    list.push({ kind: 'pack', family: rng.pick(families), weight: E.weights.pack });
  }
  for (let i = 0; i < elites; i++) {
    list.push({ kind: 'elite', family: rng.pick(families), weight: E.weights.elite });
  }
  const shuffled = rng.shuffle(list);

  // A boss is always last.
  const gd = guardianOnFloor(f);
  if (gd) {
    shuffled.push({ kind: 'guardian', guardianId: gd.id, weight: gd.weight });
  } else if (fx.horror) {
    const hname = rngFrom(seed + ':horrorname').pick(HORROR_NAMES);
    const hid = horrorIdForName(hname);
    // Mother of Worms brings her brood: extra packs just before her. They
    // come from their own stream, so every other path rolls exactly as it did.
    const brood = (BALANCE.horrorFx[hid] && BALANCE.horrorFx[hid].brood) || 0;
    const brng = rngFrom(seed + ':brood');
    for (let i = 0; i < brood; i++) {
      shuffled.push({ kind: 'pack', family: brng.pick(families), weight: E.weights.pack });
    }
    shuffled.push({ kind: 'horror', weight: E.weights.horror, name: hname, horrorId: hid });
  }

  for (const e of shuffled) e.name = encounterName(e);
  return shuffled;
}

function encounterName(enc) {
  if (enc.kind === 'guardian') return GUARDIAN_NAMES[enc.guardianId] || 'Guardian';
  if (enc.kind === 'horror') return enc.name || 'A Wandering Horror';
  const fam = FAMILIES[enc.family];
  if (!fam) return 'Something in the dark';
  return enc.kind === 'elite' ? fam.elite : fam.pack;
}

/* Roll every path on a floor. Saved so reloading never rerolls (CLAUDE.md). */
function rollFloorPaths(hero, f, extraPaths) {
  const opts = pathRollOptions(hero);
  // Scry the Deep can add one extra path, to a maximum of four (SPEC 10.5).
  const count = Math.min(pathsPerFloor(f) + (extraPaths || 0), 4);
  const rng = rngFrom(newSeed('floor' + f));
  const names = rng.shuffle(PATH_NAMES).slice(0, count);
  const paths = [];
  for (let i = 0; i < count; i++) {
    const seed = newSeed('path' + f + '-' + i);
    const prng = rngFrom(seed + ':omens');
    const omens = rollOmens(prng, f, true, opts);
    paths.push({
      name: names[i] || PATH_NAMES[i % PATH_NAMES.length],
      seed: seed,
      omens: omens,
      encounters: rollEncounters(seed, f, omens)
    });
  }

  applyMagpieSwap(hero, paths, f, rng);
  return { paths: paths, rolledAt: now() };
}

/* Magpie's Finery, 3 pieces (SPEC 12.2): when a floor's paths roll and none
   has Glittering Veins, one path chosen by seed swaps an omen for it - its
   Barren Depths if it has one, otherwise any omen except A Horror Stirs.
   If no path can swap, nothing changes. */
function applyMagpieSwap(hero, paths, floor, rng) {
  if (!hero || !gearSpecials(hero).magpies_finery_3) return;
  if (paths.some(function (p) { return p.omens.indexOf('glittering_veins') >= 0; })) return;

  const candidates = paths.filter(function (p) {
    return p.omens.some(function (id) { return id !== 'a_horror_stirs'; });
  });
  if (!candidates.length) return;

  const path = rng.pick(candidates);
  let target = path.omens.indexOf('barren_depths');
  if (target < 0) {
    target = path.omens.findIndex(function (id) { return id !== 'a_horror_stirs'; });
  }
  if (target < 0) return;

  const swapped = path.omens.slice();
  swapped[target] = 'glittering_veins';
  for (const id of swapped) {
    if (id !== 'glittering_veins' && conflicts(id, 'glittering_veins')) return;
  }
  path.omens = swapped;
  path.encounters = rollEncounters(path.seed, floor, path.omens);
}

/* Paths are rolled the first time the floor is viewed, then saved. */
function getFloorPaths(hero, f) {
  const key = String(f);
  if (!hero.floors[key] || !hero.floors[key].paths || !hero.floors[key].paths.length) {
    hero.floors[key] = rollFloorPaths(hero, f);
    save();
  }
  return hero.floors[key].paths;
}

/* When a descent on a floor ends, however it ends, its paths are discarded. */
function discardFloorPaths(hero, f) {
  delete hero.floors[String(f)];
}

function rerollsInWindow(hero) {
  const cutoff = now() - BALANCE.floor.rerollWindowMs;
  hero.rerollsAt = (hero.rerollsAt || []).filter(function (t) { return t > cutoff; });
  return hero.rerollsAt.length;
}
function rerollCost(hero, f) {
  let discount = 0;                                  // Omen Reader (SPEC 10.5)
  for (const entry of passiveEffects(hero)) {
    if (entry.e.k === 'reroll_cost_red') discount += effAmount(entry);
  }
  const base = BALANCE.floor.rerollCoef * g(f) *
    Math.pow(BALANCE.floor.rerollGrowth, rerollsInWindow(hero));
  return Math.max(0, Math.round(base * (1 - Math.min(discount, 90) / 100)));
}

/* ============================================================
   THE SNAPSHOT - SPEC 7.1
   Everything the engine needs, frozen when the descent starts.
   ============================================================ */
function riteNodesFor(hero) {
  const tree = TREES[hero.classId];
  const out = [];
  if (!tree) return out;
  for (const br of tree.branches) for (const n of br.nodes) if (n.type === 'rite') out.push(n);
  return out;
}

/* ============================================================
   UNIQUES AND SETS - SPEC 12
   Every unique power and set bonus is a data-driven modifier on the rule
   it names. Powers that need engine code declare themselves through
   `specials`, exactly as skill nodes do.
   ============================================================ */
function equippedItems(hero) {
  const out = [];
  for (const slot of BALANCE.items.slots) {
    if (hero.equipment[slot]) out.push(hero.equipment[slot]);
  }
  return out;
}

/* setId -> how many of its pieces are worn. */
function equippedSetCounts(hero) {
  const counts = {};
  for (const it of equippedItems(hero)) {
    if (it.setId) counts[it.setId] = (counts[it.setId] || 0) + 1;
  }
  return counts;
}

function heroHasSetBonus(hero, setId, pieces) {
  return (equippedSetCounts(hero)[setId] || 0) >= pieces;
}

/* Every effect granted by equipped uniques and active set bonuses,
   in the same { e, rank, node } shape the skill tree uses. */
function gearEffects(hero) {
  const out = [];
  if (typeof SETS !== 'undefined') {
    const counts = equippedSetCounts(hero);
    for (const setId in counts) {
      const set = SETS[setId];
      if (!set) continue;
      // The 3-piece bonus adds to the 2-piece bonus, it does not replace it.
      if (counts[setId] >= 2 && set.bonus2) {
        for (const e of (set.bonus2.effects || [])) out.push({ e: e, rank: 1, node: setId + '_2' });
      }
      if (counts[setId] >= 3 && set.bonus3) {
        for (const e of (set.bonus3.effects || [])) out.push({ e: e, rank: 1, node: setId + '_3' });
      }
    }
  }
  return out;
}

/* Unique powers and set bonuses that need engine code, as special ids. */
function gearSpecials(hero) {
  const out = {};
  for (const it of equippedItems(hero)) {
    if (it.uniqueId) out[it.uniqueId] = true;
  }
  const counts = equippedSetCounts(hero);
  for (const setId in counts) {
    if (counts[setId] >= 2) out[setId + '_2'] = true;
    if (counts[setId] >= 3) out[setId + '_3'] = true;
  }
  for (const entry of gearEffects(hero)) {
    if (entry.e.k === 'special') out[entry.e.id] = true;
  }
  return out;
}

/* Learned passive effects only - rites are handled separately. */
function passiveEffects(hero) {
  const out = [];
  const tree = TREES[hero.classId];
  if (!tree) return out;
  for (const br of tree.branches) {
    for (const n of br.nodes) {
      const rank = effectiveRank(hero, n);
      if (rank <= 0 || n.type === 'rite') continue;
      for (const e of (n.effects || [])) out.push({ e: e, rank: rank, node: n.id });
    }
  }
  // Set bonuses behave like passives.
  out.push.apply(out, gearEffects(hero));
  return out;
}

function riteEffectList(hero, riteId) {
  const n = nodeById(hero.classId, riteId);
  if (!n) return [];
  const rank = hero.skills[riteId] || 0;
  if (rank <= 0) return [];
  return (n.effects || []).map(function (e) { return { e: e, rank: rank, node: riteId }; });
}

function buildSnapshot(hero, floor, path, startAt, opts) {
  opts = opts || {};
  // Buckets exclude every rite; rites are layered on per encounter.
  const buckets = heroBuckets(hero, { excludeRites: true });

  // Primed rites that apply to this descent are consumed now (SPEC 7.1, 10.2).
  const primed = [];
  const remaining = [];
  let darkBargainHp = 0;
  const hasBoss = path.encounters.some(function (e) { return e.kind === 'guardian' || e.kind === 'horror'; });
  for (const p of (hero.primed || [])) {
    const node = nodeById(hero.classId, p.riteId);
    const waitsForBoss = node && (node.effects || []).some(function (e) {
      return e.k === 'special' && e.id === 'skullsplitter';
    });
    if (waitsForBoss && !hasBoss) { remaining.push(p); continue; }
    primed.push(p.riteId);
    // Lingering Curse and Marrowborn Rite make their rite last two descents.
    if ((p.usesLeft || 1) > 1) remaining.push({ riteId: p.riteId, usesLeft: p.usesLeft - 1, data: p.data });
    if (p.data && p.data.hpTaken) darkBargainHp = p.data.hpTaken;
  }
  // The forecast previews a descent without consuming anything.
  // Lantern Oil is consumed by the descent it speeds up (SPEC 13.3).
  if (!opts.preview) { hero.primed = remaining; hero.oilPrimed = false; }

  // Timed rite windows still running.
  const windows = [];
  for (const t of (hero.timed || [])) {
    if (t.endsAt <= startAt) continue;
    windows.push({ riteId: t.riteId, startsAt: t.startsAt, endsAt: t.endsAt,
                   effects: riteEffectList(hero, t.riteId) });
  }

  const specials = gearSpecials(hero);
  for (const entry of passiveEffects(hero)) {
    if (entry.e.k === 'special') specials[entry.e.id] = true;
  }
  for (const rid of primed) {
    for (const entry of riteEffectList(hero, rid)) {
      if (entry.e.k === 'special') specials[entry.e.id] = true;
    }
  }

  const passives = passiveEffects(hero);
  const primedEffects = [];
  for (const rid of primed) primedEffects.push.apply(primedEffects, riteEffectList(hero, rid));

  // Regeneration during a descent: use the highest source that applies (SPEC 8.1).
  const fx = mergeFx(path.omens);

  // Pact Scholar softens the HP cost increase that pacts carry (SPEC 10.5).
  let pactSoften = 0;
  for (const entry of passiveEffects(hero)) {
    if (entry.e.k === 'special' && entry.e.id === 'pact_scholar') {
      pactSoften += 5 * (hero.skills[entry.node] || 0);
    }
  }
  if (pactSoften > 0) {
    let pactExcess = 0;
    for (const id of path.omens) {
      const o = OMENS[id], f2 = omenFx(id);
      if (o && o.type === 'pact' && f2.cost && f2.cost > 1) pactExcess += (f2.cost - 1);
    }
    if (pactExcess > 0) {
      const softened = Math.max(0, pactExcess - pactSoften / 100);
      // Rebuild the cost multiplier with the pact portion reduced.
      fx.cost = fx.cost / (1 + pactExcess) * (1 + softened);
    }
  }
  let regenFrac = fx.regen;
  for (const entry of passives.concat(primedEffects)) {
    if (entry.e.k === 'regen_in_descent') regenFrac = Math.max(regenFrac, entry.e.value);
  }

  // Danger reduction that applies to the whole descent, so it shapes the
  // timeline too. Scoped reductions are applied per encounter instead.
  let dangerRed = 0;
  for (const entry of passives.concat(primedEffects)) {
    const e = entry.e;
    if (e.k === 'danger_red' && (!e.scope || e.scope === 'all')) dangerRed += effAmount(entry);
  }

  return {
    classId: hero.classId,
    level: hero.level,
    buckets: buckets,
    passives: passives,
    primed: primed,
    primedEffects: primedEffects,
    windows: windows,
    specials: specials,
    omens: path.omens.slice(),
    fx: fx,
    regenFrac: regenFrac,
    dangerRed: dangerRed,
    startAt: startAt,
    // Filled in once the timeline exists. Powers that check a descent's
    // length use its duration when it starts (SPEC 12).
    durationMs: 0,
    timeRedFrac: 0,
    hpAtStart: 0,
    startedBelowHalf: false,
    darkBargainHp: darkBargainHp,
    oilRed: hero.oilPrimed ? 20 : 0,
    bossesSlain: (hero.counters && hero.counters.bossesSlain) || 0,
    fellSinceClear: !!(hero.counters && hero.counters.fellSinceClear)
  };
}

/* Moonscorn turns Blood Moon's penalty into a bounty (SPEC 12.1). */
function applyMoonscorn(snap) {
  if (!snap.specials.moonscorn) return;
  if (snap.omens.indexOf('blood_moon') < 0) return;
  const bm = omenFx('blood_moon');
  if (bm.cost) snap.fx.cost /= bm.cost;         // undo the HP cost increase
  snap.moonscornBonus = 50;                      // +50% gold find and item find
}

/* Every effect in force at time t, given emergency rites already invoked. */
function effectsAt(snap, t, emergency) {
  const list = snap.passives.concat(snap.primedEffects);
  for (const w of snap.windows) {
    if (t >= w.startsAt && t < w.endsAt) list.push.apply(list, w.effects);
  }
  for (const em of (emergency || [])) {
    if (em.at <= t && em.effects) list.push.apply(list, em.effects);
  }
  return list;
}

/* Stats at a moment in the descent, including in-descent buffs. */
function statsAt(snap, ctx) {
  const extraPct = { might: 0, guard: 0, maxHp: 0 };
  const extraPoints = {};
  for (const p of PERCENT_STATS) extraPoints[p] = 0;

  for (const entry of ctx.effects) {
    const e = entry.e;
    if (e.k === 'stat_pct') {
      const amt = effAmount(entry);
      if (CORE_STATS.indexOf(e.stat) >= 0) extraPct[e.stat] += amt;
      else extraPoints[e.stat] += amt;
    } else if (e.k === 'crit') {
      extraPoints.crit += effAmount(entry);
    }
  }

  // Bloodlust: +5% Might per elite killed, max +25%.
  if (snap.specials.bloodlust) {
    extraPct.might += Math.min(ctx.elitesKilled * 5, 25);
  }
  // Twist the Knife: +2% Might per crit so far, max +20%.
  if (snap.specials.twist_the_knife) {
    extraPct.might += Math.min((ctx.crits || 0) * 2, 20);
  }
  // Blood Fury: +1% Might for every 2% of Max HP missing, max +50%.
  if (snap.specials.blood_fury) {
    const baseSt = finalizeStats(snap.buckets, extraPct, extraPoints);
    const missingPct = clamp((1 - ctx.hp / baseSt.maxHp) * 100, 0, 100);
    extraPct.might += Math.min(missingPct / 2, 50);
  }
  // Gravebell: +0.1% Might for every boss this hero has slain, max +25%.
  if (snap.specials.gravebell) {
    extraPct.might += Math.min((snap.bossesSlain || 0) * 0.1, 25);
  }
  // Twice-Broken: after the hero falls, +15% Might and Guard until they next clear.
  if (snap.specials.twice_broken && snap.fellSinceClear) {
    extraPct.might += 15;
    extraPct.guard += 15;
  }
  // Gilded Edge: +1% Might for every 4% Fortune. Fortune must be settled first.
  if (snap.specials.gilded_edge) {
    const baseSt = finalizeStats(snap.buckets, extraPct, extraPoints);
    extraPct.might += baseSt.fortune / 4;
  }
  return finalizeStats(snap.buckets, extraPct, extraPoints);
}

/* Rites that hit only the NEXT matching encounter, not every one of them
   (Skullsplitter, Death Mark). Their cost reduction is spent on first use. */
const ONE_SHOT_RITES = { skullsplitter: 'boss', death_mark: 'eliteBoss' };

function oneShotPending(snap, ctx, enc) {
  const out = [];
  for (const id in ONE_SHOT_RITES) {
    if (!snap.specials[id]) continue;
    if (ctx.consumed && ctx.consumed[id]) continue;
    if (scopeMatches(ONE_SHOT_RITES[id], enc)) out.push(id);
  }
  return out;
}

/* Does an effect's scope cover this encounter? "Boss" means a Guardian
   or a Wandering Horror. */
function scopeMatches(scope, enc) {
  const kind = enc.kind;
  const isElite = kind === 'elite';
  const isBoss = kind === 'guardian' || kind === 'horror';
  if (!scope || scope === 'all') return true;
  if (scope === 'pack') return kind === 'pack';
  if (scope === 'elite') return isElite;
  if (scope === 'boss') return isBoss;
  if (scope === 'eliteBoss') return isElite || isBoss;
  return false;
}

/* The cost-reduction total for one encounter (SPEC 7.4). */
function costReductionFor(snap, ctx, enc, st) {
  let total = 0;
  const isElite = enc.kind === 'elite';
  const isBoss = enc.kind === 'guardian' || enc.kind === 'horror';

  const pending = oneShotPending(snap, ctx, enc);
  for (const entry of ctx.effects) {
    const e = entry.e;
    // A one-shot rite's reduction only counts on the encounter it is spent on.
    if (ONE_SHOT_RITES[entry.node] && pending.indexOf(entry.node) < 0) continue;
    if (e.k === 'cost_red' && scopeMatches(e.scope, enc)) total += effAmount(entry);
    if (e.k === 'cost_red_cond' && scopeMatches(e.scope, enc)) {
      if (e.cond === 'hp_below_50' && ctx.hp < st.maxHp * 0.5) total += effAmount(entry);
      if (e.cond === 'hp_below_30' && ctx.hp < st.maxHp * 0.3) total += effAmount(entry);
    }
  }
  // The elite and boss cost reduction stat joins the total for those encounters.
  if (isElite || isBoss) total += st.eliteBoss;

  // ---- unique powers that cut HP cost (SPEC 12) ----
  const sp = snap.specials;
  // Anvilheart: encounters starting below 30% HP cost 25% less.
  if (sp.anvilheart && ctx.hp < st.maxHp * 0.3) total += 25;
  // Stonestride Greaves: descents lasting 45 minutes or longer cost 20% less.
  if (sp.stonestride_greaves && snap.durationMs >= 45 * MINUTE) total += 20;
  // Last Candle: descents shorter than 20 minutes cost 15% less.
  if (sp.last_candle && snap.durationMs > 0 && snap.durationMs < 20 * MINUTE) total += 15;
  // Windthief Jerkin: cost falls by one-fifth of the descent's time reduction.
  if (sp.windthief_jerkin) total += (snap.timeRedFrac || 0) * 100 / 5;

  return total / 100;
}

/* Danger reduction for one encounter (SPEC 7.4, capped at 40%).
   `all`-scope reductions also shape the timeline; narrower ones do not. */
function dangerReductionFor(snap, ctx, enc) {
  let total = snap.dangerRed;                    // the all-scope total, from the snapshot
  if (enc) {
    for (const entry of ctx.effects) {
      const e = entry.e;
      if (e.k !== 'danger_red') continue;
      if (!e.scope || e.scope === 'all') continue;   // already counted
      if (scopeMatches(e.scope, enc)) total += effAmount(entry);
    }
  }
  return Math.min(total / 100, BALANCE.caps.dangerRed);
}

/* ============================================================
   TIMELINE - SPEC 7.3
   ============================================================ */
/* Time is decided once, when the descent starts, so these read every effect
   in force at that moment - including a timed rite window the descent starts
   inside (Quicksilver, SPEC 10.4). */
function timeEffectsAt(snap, startAt) {
  return effectsAt(snap, startAt, []);
}
function timeReductionOf(snap, st, startAt) {
  let red = st.haste + snap.fx.timeRed + (snap.buckets.cls.timeRed * 100) + (snap.oilRed || 0);
  for (const entry of timeEffectsAt(snap, startAt === undefined ? snap.startAt : startAt)) {
    if (entry.e.k === 'time_red') red += effAmount(entry);
  }
  return red;
}
function timeIncreaseOf(snap, startAt) {
  let inc = snap.fx.timeInc + (snap.buckets.cls.timeInc * 100);
  for (const entry of timeEffectsAt(snap, startAt === undefined ? snap.startAt : startAt)) {
    if (entry.e.k === 'time_inc') inc += effAmount(entry);
  }
  return inc;
}
function timeRedCap(snap) {
  return snap.specials.phantom ? BALANCE.caps.timeRedPhantom : BALANCE.caps.timeRed;
}

function buildTimeline(snap, floor, path, startAt) {
  applyMoonscorn(snap);
  const st = statsAt(snap, { effects: effectsAt(snap, startAt, []), hp: 1e9, elitesKilled: 0 });
  const D = dangerOf(floor) * (1 - Math.min(snap.dangerRed / 100, BALANCE.caps.dangerRed));

  const mightTerm = clamp(Math.sqrt(D / Math.max(st.might, 0.0001)),
                          BALANCE.time.mightClampLo, BALANCE.time.mightClampHi);
  const inc = timeIncreaseOf(snap, startAt) / 100;
  const red = Math.min(timeReductionOf(snap, st, startAt) / 100, timeRedCap(snap));
  const duration = baseTimeMin(floor) * mightTerm * (1 + inc) * (1 - red) * MINUTE;
  snap.durationMs = duration;
  snap.timeRedFrac = red;                 // Windthief Jerkin reads this

  const all = path.encounters;
  const slot = duration / Math.max(all.length, 1);

  // Vanish removes the first 25% of encounters, never the boss.
  // Ghoststep Treads raise that to 40%.
  let skip = 0;
  if (snap.specials.vanish) {
    const frac = snap.specials.ghoststep_treads
      ? BALANCE.time.vanishFractionGhoststep : BALANCE.time.vanishFraction;
    skip = Math.min(Math.floor(all.length * frac), all.length - 1);
  }

  const timeline = [];
  let t = startAt;
  for (let i = skip; i < all.length; i++) {
    const enc = all[i];
    const critRng = rngFrom(path.seed + ':crit:' + i);
    const critStats = statsAt(snap, { effects: effectsAt(snap, t, []), hp: 1e9, elitesKilled: 0 });
    let critChance = clamp(critStats.crit / 100, 0, BALANCE.caps.crit);
    // Killing Edge halves the crit chance against packs.
    if (snap.specials.killing_edge && enc.kind === 'pack') critChance /= 2;
    let crit = critRng.next() < critChance;
    // The Smiling Mask: the first three encounters of every descent always crit.
    if (snap.specials.smiling_mask && timeline.length < 3) crit = true;
    // A named Horror's twist: the Chainwraith can't be crit (that outranks
    // the Mask), and the Glass Stag passes in half the time.
    const hfx = horrorFxOf(enc);
    if (hfx.noCrit) crit = false;
    const len = slot * (crit ? BALANCE.time.critSlotMult : 1) * (hfx.timeMult || 1);
    timeline.push({
      index: i,
      kind: enc.kind,
      name: enc.name,
      family: enc.family || null,
      guardianId: enc.guardianId || null,
      horrorId: horrorIdOf(enc),
      weight: enc.weight,
      startsAt: t,
      endsAt: t + len,
      crit: crit
    });
    t += len;
  }
  return { timeline: timeline, duration: duration, plannedEnd: t };
}

/* ============================================================
   RESOLVING AN ENCOUNTER - SPEC 7.4
   ============================================================ */
function guardianFactor(gid, D, st) {
  const M = BALANCE.guardianMath;
  const rec = 1 + st.recovery / 100;
  const P = st.power;
  // A Deep Guardian takes the test of the story Guardian it is modelled on.
  const test = isDeepGuardian(gid) ? DEEP_GUARDIANS[deepBaseId(gid)].test : gid;
  if (test === 'warden') return D / Math.max(st.guard, 0.0001);
  if (test === 'vael') return (D / P) * clamp(D / Math.max(st.might, 0.0001), M.vaelClampLo, M.vaelClampHi);
  if (test === 'champion') return (D / P) * M.championMult / rec;
  if (test === 'god') return Math.sqrt(D / Math.max(st.guard, 0.0001)) *
                             Math.sqrt(D / Math.max(st.might, 0.0001)) * M.godMult / rec;
  return D / P;
}

/* `roll` lets the forecast force 0.85 / 1.0 / 1.15 instead of a seeded roll. */
function encounterCost(snap, ctx, enc, floor, seed, opts) {
  opts = opts || {};
  const st = ctx.stats;
  const D = dangerOf(floor) * (1 - dangerReductionFor(snap, ctx, enc));
  const atPar = parHp(floor) * BALANCE.cost.atParCoef * enc.weight;

  const hfx = horrorFxOf(enc);
  let factor = enc.guardianId
    ? guardianFactor(enc.guardianId, D, st)
    : D / Math.max(st.power, 0.0001);
  // Grandmother Rot: Recovery lowers her cost. At 0% Recovery she costs what
  // any Horror does, so she is never harsher than the baseline.
  if (hfx.recoveryTest) factor /= (1 + st.recovery / 100);

  let cost = atPar * factor;
  if (floor <= BALANCE.cost.shallowMaxFloor) cost *= BALANCE.cost.shallowMult;
  cost *= snap.fx.cost;
  if (hfx.costMult) cost *= hfx.costMult;
  cost *= (1 - Math.min(costReductionFor(snap, ctx, enc, st), BALANCE.caps.costRed));

  // crit multiplier, adjustable by nodes (Vital Strikes, Opportunist - Phase 2)
  const useCrit = opts.forceNoCrit ? false : enc.crit;
  if (useCrit) cost *= critCostMultiplier(snap, ctx, enc);

  const thrall = Math.min(thrallAbsorption(snap, ctx, enc), BALANCE.caps.thrall);
  cost *= (1 - thrall);

  let roll;
  if (opts.roll !== undefined) roll = opts.roll;
  else roll = rngFrom(seed + ':cost:' + enc.index).float(BALANCE.cost.rollLo, BALANCE.cost.rollHi);
  cost *= roll;

  const floorCost = Math.ceil(atPar * BALANCE.cost.floorFraction);
  return Math.max(Math.round(cost), floorCost);
}

function critCostMultiplier(snap, ctx, enc) {
  let mult = BALANCE.cost.critMult;                 // 0.7 by default
  // Opportunist and the like: crits against a scope cut cost by a set amount
  // instead of the default. The most generous matching rule wins.
  for (const entry of ctx.effects) {
    const e = entry.e;
    if (e.k === 'crit_cost_scope' && scopeMatches(e.scope, enc)) {
      mult = Math.min(mult, 1 - e.value / 100);
    }
  }
  // Vital Strikes: crits cut cost by this many more percentage points.
  for (const entry of ctx.effects) {
    if (entry.e.k === 'crit_cost_bonus') mult -= effAmount(entry) / 100;
  }
  // Killing Edge cuts a further 35% off a crit against a boss.
  if (snap.specials.killing_edge && scopeMatches('boss', enc)) mult *= (1 - 0.35);
  return clamp(mult, 0.05, 1);
}

function thrallAbsorption(snap, ctx, enc) {
  let a = 0;
  for (const entry of ctx.effects) {
    const e = entry.e;
    if (e.k === 'thrall' && scopeMatches(e.scope, enc)) a += effAmount(entry) / 100;
  }
  // The Ninth Thrall: an extra 15% absorbed from elites and bosses.
  if (snap.specials.the_ninth_thrall && scopeMatches('eliteBoss', enc)) a += 0.15;
  // Legion of Ash: thralls always absorb at least 30%.
  if (snap.specials.legion_of_ash) a = Math.max(a, 0.30);
  return a;
}

/* ============================================================
   REWARDS - SPEC 7.5
   ============================================================ */
function encounterRewards(snap, ctx, enc, floor, seed) {
  const st = ctx.stats;
  const rng = rngFrom(seed + ':loot:' + enc.index);
  const R = BALANCE.rewards;
  const bonus = descentFindBonus(snap, ctx);
  const findFrac = (st.itemFind + st.fortune + bonus.itemFind) / 100;
  const goldFrac = (st.goldFind + st.fortune + bonus.goldFind) / 100;

  let goldMult = snap.fx.gold;
  for (const entry of ctx.effects) {
    const e = entry.e;
    if (e.k === 'gold_mult' && scopeMatches(e.scope, enc)) goldMult *= e.value;
  }
  // Clean Kill doubles a crit's gold.
  if (snap.specials.clean_kill && enc.crit) goldMult *= 2;
  const hfx = horrorFxOf(enc);
  if (hfx.goldMult) goldMult *= hfx.goldMult;          // Old Smolder

  const gold = Math.round(
    R.goldCoef * g(floor) * enc.weight * (1 + goldFrac) *
    goldMult * rewardMult(floor) * rng.float(R.goldRollLo, R.goldRollHi)
  );
  const xp = Math.round(
    R.xpCoef * g(floor) * enc.weight * (1 + st.xpBonus / 100) * rewardMult(floor)
  );

  const dropMult = (1 + findFrac) * snap.fx.item * rewardMult(floor);
  const items = [];
  const rarityMults = rarityMultsFor(snap, ctx, enc);
  // The Bellmaw's items roll higher than the floor they came from.
  const dropIlvl = floor + (hfx.ilvlBonus || 0);
  function drop(opts) {
    items.push(rollItem(rng, Object.assign({
      floor: floor, ilvl: dropIlvl, classId: snap.classId,
      find: findFrac, rarityMults: rarityMults
    }, opts || {})));
  }

  if (enc.kind === 'pack') {
    if (rng.next() < Math.min(R.drops.packChance * dropMult, 1)) drop();
  } else if (enc.kind === 'elite') {
    for (let i = 0; i < R.drops.eliteCount; i++) drop();
    if (rng.next() < Math.min(R.drops.eliteExtraChance * dropMult, 1)) drop();
  } else if (enc.kind === 'horror' || enc.kind === 'guardian') {
    let n = enc.kind === 'horror' ? R.drops.horrorCount : R.drops.guardianCount;
    // The Lure: Wandering Horrors drop one extra item.
    if (enc.kind === 'horror' && snap.specials.the_lure) n += 1;
    n += hfx.extraItems || 0;                            // The Wailing Hulk
    for (let i = 0; i < n; i++) drop(i === 0 ? { minRarity: 'rare' } : {});
  }
  // Lightfinger Bracers: a crit against an elite drops one extra item.
  if (snap.specials.lightfinger_bracers && enc.crit && enc.kind === 'elite') drop();

  // Eye of the Dark Star: from floor 11, each rare has a 10% chance to
  // become a unique instead.
  if (snap.specials.eye_of_the_dark_star && floor >= 11) {
    for (let i = 0; i < items.length; i++) {
      if (items[i].rarity !== 'rare') continue;
      if (rng.next() >= 0.10) continue;
      const swapped = rollNamedItem(rng, 'unique', snap.classId, items[i].ilvl);
      if (swapped) items[i] = swapped;
    }
  }

  let starshards = 0;
  if (enc.kind === 'horror') starshards = rng.int(R.starshards.horror[0], R.starshards.horror[1]) +
                                          (hfx.starshards || 0);   // The Chainwraith
  if (enc.kind === 'guardian') starshards = rng.int(R.starshards.guardian[0], R.starshards.guardian[1]);
  if (starshards > 0) {
    for (const entry of ctx.effects) {
      if (entry.e.k === 'starshard_bonus') starshards += effAmount(entry);   // Starshard Sense
    }
  }

  return { gold: gold, xp: xp, items: items, starshards: starshards };
}

/* Find bonuses that apply only to this descent (Bane Harvest, Void Communion,
   Martyr's Vestments and the like), on top of the hero's permanent stats. */
function descentFindBonus(snap, ctx) {
  const out = { goldFind: 0, itemFind: 0 };
  for (const entry of ctx.effects) {
    const e = entry.e;
    if (e.k === 'find_bonus') out[e.stat] += effAmount(entry);
  }
  // Bane Harvest and Void Communion pay per bane on the path.
  const banes = (snap.omens || []).filter(function (id) {
    return OMENS[id] && OMENS[id].type === 'bane';
  }).length;
  if (banes > 0) {
    let perBane = 0;
    if (snap.specials.bane_harvest) perBane = Math.max(perBane, 10);
    if (snap.specials.void_communion) perBane = Math.max(perBane, 50);
    out.goldFind += banes * perBane;
    out.itemFind += banes * perBane;
  }
  // Moonscorn turns Blood Moon into gold find and item find.
  if (snap.moonscornBonus) {
    out.goldFind += snap.moonscornBonus;
    out.itemFind += snap.moonscornBonus;
  }
  // Martyr's Vestments: +50% item find when the descent started below 50% HP.
  if (snap.specials.martyrs_vestments && snap.startedBelowHalf) {
    out.itemFind += 50;
  }
  // Crown of the Eclipsed pays per pact instead.
  if (snap.specials.crown_of_the_eclipsed) {
    const pacts = (snap.omens || []).filter(function (id) {
      return OMENS[id] && OMENS[id].type === 'pact';
    }).length;
    out.goldFind += pacts * 100;
    out.itemFind += pacts * 100;
  }
  return out;
}

/* ---- Lore pages, SPEC 14.4 ----
   On an act's floors, elites have a 3% chance and Wandering Horrors a 25%
   chance to drop one of that act's missing pages. A Guardian kill drops
   every page of its act that is still missing. Pages are account-wide. */
function lorePagesForAct(actId) {
  const out = [];
  if (typeof LORE_PAGES === 'undefined') return out;
  for (const id in LORE_PAGES) if (LORE_PAGES[id].act === actId) out.push(LORE_PAGES[id]);
  return out;
}
function missingLorePages(actId) {
  const seen = (state.account && state.account.codex) || [];
  return lorePagesForAct(actId).filter(function (p) { return seen.indexOf(p.id) < 0; });
}
function grantLorePage(page) {
  if (!page) return null;
  if (state.account.codex.indexOf(page.id) >= 0) return null;
  state.account.codex.push(page.id);
  return page;
}

/* Returns the pages dropped by this encounter, already recorded.

   A Guardian always yields a page, but only one. It used to hand over every
   page its act still owed, which meant the elite and Horror rolls never
   decided whether a page was found, only whether it was found early - and
   since no Guardian can be skipped, it made Keeper of Pages a second reward
   for finishing the story. One page keeps the guarantee that a Guardian is
   worth something to the Codex without settling the whole act. */
function rollLorePages(enc, floor, rng) {
  // Deep Guardians give no pages: every floor below 40 is Act IV, and a
  // Guardian every ten floors would hand that act over by itself.
  if (enc.kind === 'guardian' && isDeepGuardian(enc.guardianId)) return [];
  const act = actForFloor(floor);
  if (!act) return [];
  const missing = missingLorePages(act.id);
  if (!missing.length) return [];

  // A Guardian always yields a page, and so does the Faceless Friar.
  const guaranteed = enc.kind === 'guardian' || !!horrorFxOf(enc).lorePage;
  if (!guaranteed) {
    let chance = 0;
    if (enc.kind === 'elite') chance = BALANCE.lore.eliteChance;
    else if (enc.kind === 'horror') chance = BALANCE.lore.horrorChance;
    if (chance <= 0 || rng.next() >= chance) return [];
  }
  const got = grantLorePage(rng.pick(missing));
  return got ? [got] : [];
}

/* A keeper's line for the act the hero is currently in (SPEC 13).
   Two lines per act each; which of the two is shown is stable per day so
   the town does not chatter differently every render. */
function keeperLine(keeperId, hero) {
  if (typeof KEEPER_LINES === 'undefined') return '';
  const k = KEEPER_LINES[keeperId];
  if (!k) return '';
  const act = actForFloor(Math.max(1, hero ? hero.deepest : 1));
  const lines = k.lines && k.lines[act.id];
  if (!lines || !lines.length) return '';
  const day = Math.floor(now() / DAY);
  return lines[day % lines.length];
}

/* Every rarity-weight multiplier in force (SPEC 11.5 step 1).
   `enc` is optional: a Wandering Horror doubles unique and set weights on
   its own drops (SPEC 9.2). */
function rarityMultsFor(snap, ctx, enc) {
  const m = { rare: snap.fx.rarityMult, unique: snap.fx.rarityMult, set: snap.fx.rarityMult };
  for (const entry of ctx.effects) {
    const e = entry.e;
    if (e.k === 'rarity_mult') m[e.rarity] = (m[e.rarity] || 1) * e.value;
  }
  // Horrors double unique and set weights; the Glass Stag quadruples them.
  if (enc && enc.kind === 'horror') {
    const k = horrorFxOf(enc).namedWeightMult || 2;
    m.unique *= k; m.set *= k;
  }
  // Dark Bargain doubles the rare weight on the descent it primed.
  if (snap.specials.dark_bargain) m.rare *= 2;
  // Star-Touched and Starbound arrive as rarity_mult effects above.
  return m;
}

/* The end chest, on clears only. */
function chestRewards(snap, ctx, floor, seed) {
  const st = ctx.stats;
  const R = BALANCE.rewards;
  const rng = rngFrom(seed + ':chest');
  const bonus = descentFindBonus(snap, ctx);
  const findFrac = (st.itemFind + st.fortune + bonus.itemFind) / 100;
  const dropMult = (1 + findFrac) * snap.fx.item * rewardMult(floor);
  const rarityMults = rarityMultsFor(snap, ctx);
  const items = [];
  function drop(opts) {
    items.push(rollItem(rng, Object.assign({
      floor: floor, ilvl: floor, classId: snap.classId,
      find: findFrac, rarityMults: rarityMults
    }, opts || {})));
  }
  drop(snap.fx.chestMinRarity ? { minRarity: snap.fx.chestMinRarity } : {});

  // Pack Rat guarantees the chest's second item; otherwise it is a chance.
  if (snap.specials.pack_rat || rng.next() < Math.min(R.drops.chestExtraChance * dropMult, 1)) drop();

  // Dark Bargain adds two more to the chest it primed.
  if (snap.specials.dark_bargain) { drop(); drop(); }

  // Ransack rolls every chest item one rarity higher.
  if (snap.specials.ransack) {
    for (const it of items) bumpRarity(it, floor, rng);
  }
  return items;
}

/* Raise an item one rarity step and re-roll its affixes to suit (Ransack).
   Uniques and sets never appear on floors 1-10, so rare is the ceiling there. */
function bumpRarity(item, floor, rng) {
  const ladder = { common: 'magic', magic: 'rare', rare: 'unique' };
  const next = ladder[item.rarity];
  if (!next) return;
  const weights = rarityWeightsFor(floor);
  if (!weights[next]) return;                    // that rarity cannot drop here
  item.rarity = next;
  const rd = RARITIES[next];
  if (rd && rd.affixMax > 0) {
    item.affixes = rollAffixes(rng, item.slot, item.ilvl,
                               rng.int(rd.affixMin, rd.affixMax), item.rarity, item.classId);
    item.name = itemName(rng, item);
  }
}

/* ============================================================
   INVENTORY - SPEC 11.9
   ============================================================ */
function inventoryCap(hero) {
  if (hero.slotsOverride) return hero.slotsOverride;
  // Renown rank 16 adds 12 more slots (SPEC 16.1).
  return hasUnlock('slots') ? BALANCE.items.inventorySlotsRenown : BALANCE.items.inventorySlots;
}

/* Rite slots: 3, plus a fourth at Renown rank 9 (SPEC 10.2). */
function riteSlotCount() {
  return hasUnlock('riteslot') ? BALANCE.tree.riteSlotsRenown : BALANCE.tree.riteSlots;
}
function heroRiteSlots(hero) {
  const n = riteSlotCount();
  while (hero.riteSlots.length < n) hero.riteSlots.push(null);
  return hero.riteSlots.slice(0, n);
}
function inventoryFree(hero) { return inventoryCap(hero) - hero.inventory.length; }

function salvageYield(item) {
  const y = BALANCE.town.salvage[item.rarity] || { ash: 0, shards: 0 };
  const mult = 1 + Math.floor(item.ilvl / BALANCE.town.salvage.ashIlvlStep);
  return { ash: y.ash * mult, shards: y.shards };
}

/* Auto-salvage filters (Renown rank 3, SPEC 11.9). They never touch
   uniques or sets. */
function autoSalvages(item) {
  if (!hasUnlock('autosalvage')) return false;
  if (item.rarity === 'unique' || item.rarity === 'set') return false;
  const f = (state.settings && state.settings.autoSalvage) || {};
  return !!f[item.rarity];
}

/* Two different things salvage a drop the moment it is found, and the
   results sheet has to be able to tell the player which one happened: the
   auto-salvage filters they set themselves (SPEC 11.9), and an inventory
   with no room left. Tallied apart so neither is ever reported as the
   other. `count`, `ash` and `shards` stay as the totals. */
function freshAutoSalvage() {
  return {
    ash: 0, shards: 0, count: 0,
    filtered: { ash: 0, shards: 0, count: 0 },
    full:     { ash: 0, shards: 0, count: 0 }
  };
}

/* `res` is what addItem returned: res.auto marks the filter path. The two
   guards cover a descent already in flight in a save written before the
   breakdown existed. */
function tallyAutoSalvage(bucket, res) {
  const kind = res.auto ? 'filtered' : 'full';
  if (!bucket[kind]) bucket[kind] = { ash: 0, shards: 0, count: 0 };
  bucket.count++;
  bucket.ash += res.salvaged.ash;
  bucket.shards += res.salvaged.shards;
  bucket[kind].count++;
  bucket[kind].ash += res.salvaged.ash;
  bucket[kind].shards += res.salvaged.shards;
}

/* A drop that doesn't fit is salvaged automatically (SPEC 11.9).
   Every item the hero is ever handed passes through here, so this is where
   the Armory learns about it (SPEC 17.4) - recording it at each call site
   meant a path could be added later that quietly forgot to. */
function addItem(hero, item) {
  const firstFind = recordArmory(item);
  if (autoSalvages(item)) {
    const y = salvageYield(item);
    hero.ash += y.ash;
    hero.starshards += y.shards;
    contractEvent('salvage', { count: 1 });
    return { added: false, salvaged: y, auto: true, firstFind: firstFind };
  }
  if (inventoryFree(hero) > 0) { hero.inventory.push(item); return { added: true, firstFind: firstFind }; }
  const y = salvageYield(item);
  hero.ash += y.ash;
  hero.starshards += y.shards;
  contractEvent('salvage', { count: 1 });
  return { added: false, salvaged: y, firstFind: firstFind };
}

/* ============================================================
   DESCENTS - SPEC 7
   ============================================================ */
function canDescend(hero) {
  if (!hero) return false;
  if (hero.descent) return false;
  if (hero.fallenUntil > now()) return false;
  const st = heroStats(hero);
  return currentHp(hero, st) > 0;
}

function startDescent(hero, floor, pathIndex) {
  const paths = getFloorPaths(hero, floor);
  const path = paths[pathIndex];
  if (!path) return null;

  // Descending ends the day's work, banking whatever it earned (SPEC 13.6).
  const banked = hero.task ? collectTask(hero) : null;

  const startAt = now();
  const st0 = heroStats(hero);
  const hpAtStart = currentHp(hero, st0);

  const snap = buildSnapshot(hero, floor, path, startAt);
  snap.hpAtStart = hpAtStart;
  snap.startedBelowHalf = hpAtStart < st0.maxHp * 0.5;
  const built = buildTimeline(snap, floor, path, startAt);

  hero.descent = {
    floor: floor,
    pathIndex: pathIndex,
    pathName: path.name,
    omens: path.omens.slice(),
    seed: path.seed,
    startedAt: startAt,
    endsAt: built.plannedEnd,
    duration: built.duration,
    hpAtStart: hpAtStart,
    snapshot: snap,
    timeline: built.timeline,
    emergency: [],
    resolved: 0,
    hp: hpAtStart,
    lastTickAt: startAt,
    rewards: { gold: 0, xp: 0, items: [], starshards: 0, autoSalvaged: freshAutoSalvage() },
    stacks: { elitesKilled: 0, crits: 0 },
    levelUps: 0,
    log: []
  };
  hero.counters.descents = (hero.counters.descents || 0) + 1;
  if (banked && banked.amount > 0) hero.descent.bankedTask = banked;
  save();
  return hero.descent;
}

/* The context an encounter resolves in. */
function contextFor(hero, d, enc) {
  const effects = effectsAt(d.snapshot, enc.startsAt, d.emergency);
  if (!d.stacks.consumed) d.stacks.consumed = {};
  const ctx = {
    effects: effects,
    hp: d.hp,
    elitesKilled: d.stacks.elitesKilled,
    crits: d.stacks.crits,
    consumed: d.stacks.consumed
  };
  ctx.stats = statsAt(d.snapshot, ctx);
  return ctx;
}

/* SPEC 7.4 - resolve one encounter at its end time. */
function applyEncounter(hero, d, enc) {
  const snap = d.snapshot;

  // 1. in-descent regeneration since the previous encounter ended
  if (snap.regenFrac > 0) {
    const prevEnd = d.lastTickAt;
    const ms = Math.max(0, enc.endsAt - prevEnd);
    const stForRegen = statsAt(snap, { effects: effectsAt(snap, enc.startsAt, d.emergency), hp: d.hp, elitesKilled: d.stacks.elitesKilled });
    const gain = regenRatePerHour(snap.level, stForRegen.recovery) / HOUR * ms * snap.regenFrac;
    d.hp = Math.min(d.hp + gain, stForRegen.maxHp);
  }
  d.lastTickAt = enc.endsAt;

  const ctx = contextFor(hero, d, enc);

  // 2. cost
  const spent = oneShotPending(snap, ctx, enc);
  const cost = encounterCost(snap, ctx, enc, d.floor, d.seed);
  // A one-shot rite is spent the moment it lands on a matching encounter.
  for (const id of spent) d.stacks.consumed[id] = true;

  // 3. subtract
  d.hp -= cost;

  if (d.hp <= 0) {
    // SPEC 8.2 step 1 - a saving effect, checked in order
    const saved = trySaveFromDeath(hero, d, enc);
    if (saved) {
      d.hp = 1;
      d.log.unshift({ t: enc.endsAt, text: saved + ' ' + enc.name + ' would have killed you. You are at 1 HP.', kind: 'save' });
      return 'saved';
    }
    d.log.unshift({ t: enc.endsAt, text: 'Fell to ' + enc.name + ' on floor ' + d.floor + '.', kind: 'death', cost: cost });
    return 'death';
  }

  // 4. rewards
  const rw = encounterRewards(snap, ctx, enc, d.floor, d.seed);
  d.rewards.gold += rw.gold;
  d.rewards.xp += rw.xp;
  d.rewards.starshards += rw.starshards;
  // addItem records the Armory itself, and reports whether this was a first
  // find - a separate recordArmory call here would always pre-empt that.
  for (const it of rw.items) {
    const res = addItem(hero, it);
    if (res.added) {
      d.rewards.items.push(it);
      if (res.firstFind) {
        // A descent saved before this existed has no firstFinds field.
        if (!d.rewards.firstFinds) d.rewards.firstFinds = [];
        d.rewards.firstFinds.push(it.id);
      }
    } else {
      tallyAutoSalvage(d.rewards.autoSalvaged, res);
    }
  }

  if (enc.kind === 'elite') { d.stacks.elitesKilled++; contractEvent('elite'); }
  if (enc.crit) d.stacks.crits++;
  if (enc.kind === 'horror') {
    contractEvent('horror'); bumpTotal('horrors');
    // The Bestiary counts each named Horror, account-wide. The first kill of
    // each one pays Renown and fills its page.
    const hid = horrorIdOf(enc);
    if (hid) {
      const first = totalOf('horror:' + hid) === 0;
      bumpTotal('horror:' + hid);
      if (first) {
        const ren = grantRenown(BALANCE.bestiary.firstKillRenown, 'bestiary');
        if (!d.bestiaryNew) d.bestiaryNew = [];            // older saved descents lack it
        d.bestiaryNew.push({ id: hid, renown: ren ? ren.amount : 0, unlocks: ren ? ren.unlocks : [] });
      }
    }
  }
  if (enc.kind === 'guardian') bumpTotal('guardian:' + enc.guardianId);
  if (enc.kind === 'guardian' || enc.kind === 'horror') {
    hero.counters.bossesSlain = (hero.counters.bossesSlain || 0) + 1;
    bumpTotal('bossesSlain');
    // Bloodtithe, 3 pieces: killing a boss resets Skullsplitter's cooldown.
    if (snap.specials.bloodtithe_3 && (hero.skills.skullsplitter || 0) > 0) {
      hero.riteReadyAt.skullsplitter = 0;
    }
  }

  // ---- set bonuses that fire on a crit ----
  if (enc.crit) {
    // Duskrunner's Garb, 3 pieces: crits restore 1% of Max HP.
    if (snap.specials.duskrunners_garb_3) {
      d.hp = Math.min(d.hp + ctx.stats.maxHp * 0.01, ctx.stats.maxHp);
    }
    // Cutthroat's Kit, 3 pieces: a crit against an elite or boss takes
    // 20 minutes off every rite cooldown.
    if (snap.specials.cutthroats_kit_3 && scopeMatches('eliteBoss', enc)) {
      for (const rid in hero.riteReadyAt) {
        hero.riteReadyAt[rid] = Math.max(0, hero.riteReadyAt[rid] - 20 * MINUTE);
      }
    }
  }

  // Lore pages (SPEC 14.4) are account-wide and drop from elites,
  // Wandering Horrors and Guardian kills.
  const pages = rollLorePages(enc, d.floor, rngFrom(d.seed + ':lore:' + enc.index));
  if (pages.length) {
    d.lorePages = (d.lorePages || []).concat(pages.map(function (p) { return p.id; }));
  }

  // XP is granted as it is earned, so level-ups happen during the descent.
  const levels = grantXp(hero, rw.xp);
  d.levelUps += levels;

  // The line has a voice of its own (SCOPES-DESCENT D7), chosen by seed. The
  // crit is shown as a tag from the `crit` flag, so it isn't in the text.
  d.log.unshift({
    t: enc.endsAt,
    text: encounterVoiceLine(enc, d.seed, d.timeline) + ' -' + fmtNum(cost) + ' HP.',
    kind: enc.kind,
    crit: enc.crit,
    cost: cost,
    items: rw.items.map(function (i) { return { name: i.name, rarity: i.rarity }; }),
    // Finding a page is a story moment, so the log calls it out (SPEC 14.4).
    pages: pages.map(function (p) { return p.title; })
  });
  // A level-up mid-descent gets a line of its own (D6); stats still wait for
  // the descent to end (SPEC 4). Newest first, so it sits above the fight
  // that earned it.
  if (levels > 0) {
    d.log.unshift({ t: enc.endsAt, text: 'You reach level ' + fmtNum(hero.level) + '.', kind: 'level' });
  }
  return 'ok';
}

/* SPEC 8.2 step 1, in order: Grave Refusal, Totem of Refusal, Ward of Return. */
function trySaveFromDeath(hero, d, enc) {
  const snap = d.snapshot;
  if (snap.specials.grave_refusal) {
    const w = (snap.windows || []).find(function (x) { return x.riteId === 'grave_refusal'; });
    if (w && enc.startsAt >= w.startsAt && enc.startsAt < w.endsAt) {
      d.endedEarly = 'retreat';
      return 'Grave Refusal.';
    }
  }
  if (hero.equipment.relic && hero.equipment.relic.uniqueId === 'totem_of_refusal') {
    if (!(hero.uniqueReadyAt.totem_of_refusal > now())) {
      hero.uniqueReadyAt.totem_of_refusal = now() + DAY;
      d.endedEarly = 'retreat';
      return 'Totem of Refusal.';
    }
  }
  if (hero.supplies && hero.supplies.ward > 0) {
    hero.supplies.ward--;
    d.endedEarly = 'retreat';
    return 'Ward of Return.';
  }
  return null;
}

/* Resolve everything whose time has passed. Safe to call at any time,
   including after the game was closed for a week. */
function settleDescent(hero) {
  const d = hero.descent;
  if (!d) return null;

  while (d.resolved < d.timeline.length) {
    const enc = d.timeline[d.resolved];
    if (enc.endsAt > now()) break;
    const outcome = applyEncounter(hero, d, enc);
    d.resolved++;
    if (outcome === 'death') return endDescent(hero, 'death', enc);
    if (outcome === 'saved') return endDescent(hero, 'retreat', enc);
  }
  if (d.resolved >= d.timeline.length) return endDescent(hero, 'clear', null);
  return null;
}

function fallenDurationMs(hero, floor) {
  const H = BALANCE.hp;
  let minutes = floor <= H.fallenShallowMaxFloor
    ? H.fallenShallowMinutes
    : Math.min(H.fallenBase + floor, H.fallenCapMinutes);
  // Iron Will shortens it.
  let shorter = 0;
  for (const entry of passiveEffects(hero)) {
    if (entry.e.k === 'fallen_shorter') shorter += effAmount(entry);
  }
  minutes *= (1 - Math.min(shorter / 100, 0.9));
  return minutes * MINUTE;
}

function fallenRestoreFraction(hero) {
  let frac = BALANCE.hp.fallenRestore;
  for (const entry of passiveEffects(hero)) {
    if (entry.e.k === 'fallen_restore') frac = Math.max(frac, entry.e.value);
  }
  return frac;
}

/* SPEC 7.8 and 8.2 */
function endDescent(hero, outcome, killer) {
  const d = hero.descent;
  if (!d) return null;
  const endAt = outcome === 'clear'
    ? (d.timeline.length ? d.timeline[d.timeline.length - 1].endsAt : d.startedAt)
    : (killer ? killer.endsAt : now());

  const snap = d.snapshot;
  const ctx = { effects: effectsAt(snap, endAt, d.emergency), hp: d.hp, elitesKilled: d.stacks.elitesKilled };
  ctx.stats = statsAt(snap, ctx);

  const results = {
    outcome: outcome,
    floor: d.floor,
    pathName: d.pathName,
    omens: d.omens,
    startedAt: d.startedAt,
    endedAt: endAt,
    timeTaken: endAt - d.startedAt,
    bankedTask: d.bankedTask || null,
    hpSpent: Math.max(0, d.hpAtStart - Math.max(d.hp, 0)),
    hpLeft: Math.max(0, Math.floor(d.hp)),
    gold: d.rewards.gold,
    xp: d.rewards.xp,
    items: d.rewards.items.slice(),
    firstFinds: (d.rewards.firstFinds || []).slice(),
    starshards: d.rewards.starshards,
    autoSalvaged: d.rewards.autoSalvaged,
    levelUps: d.levelUps,
    unlockedFloor: null,
    storyCard: null,
    skillPoint: false,
    lorePages: (d.lorePages || []).slice(),
    // For achievements: how many banes the path carried, whether it ended on a
    // boss, and how much HP was left as a percentage (SPEC 16.3).
    banes: d.omens.filter(function (id) { return OMENS[id] && OMENS[id].type === 'bane'; }).length,
    hadBoss: d.timeline.some(function (e) { return e.kind === 'guardian' || e.kind === 'horror'; }),
    hpLeftPct: ctx.stats.maxHp > 0 ? (Math.max(0, d.hp) / ctx.stats.maxHp) * 100 : 0,
    killedBy: killer ? killer.name : null,
    bestiaryNew: (d.bestiaryNew || []).map(function (b) { return b.id; }),
    log: d.log.slice()
  };

  // Renown from new Bestiary pages was granted as each Horror fell; it is
  // gathered here so the results sheet reports it with the rest.
  for (const b of (d.bestiaryNew || [])) {
    if (!b.renown) continue;
    results.renown = (results.renown || 0) + b.renown;
    results.renownUnlocks = (results.renownUnlocks || []).concat(b.unlocks || []);
  }

  // The Deserter's Locket: retreating once at least 75% of the encounters
  // have resolved still opens the end chest (SPEC 12.2).
  const locketChest = outcome === 'retreat' && snap.specials.the_deserters_locket &&
    d.timeline.length > 0 && (d.resolved / d.timeline.length) >= BALANCE.live.locketFraction;

  if (outcome === 'clear' || locketChest) {
    const chest = chestRewards(snap, ctx, d.floor, d.seed);
    for (const it of chest) {
      const res = addItem(hero, it);
      if (res.added) {
        results.items.push(it);
        if (res.firstFind) results.firstFinds.push(it.id);
      } else {
        tallyAutoSalvage(results.autoSalvaged, res);
      }
    }
  }

  if (outcome === 'clear') {
    // Guardian first kills
    const gd = guardianOnFloor(d.floor);
    if (gd) {
      const prior = hero.guardianKills[gd.id] || 0;
      hero.guardianKills[gd.id] = prior + 1;
      if (prior === 0 && gd.deep) {
        // A hero's first kill of a Deep Guardian: Renown, Starshards and a
        // rare-or-better item. No skill point, no story card and no lore
        // page (SCOPES.md 1).
        const Dp = BALANCE.deep;
        const ren = grantRenown(Dp.firstKillRenown, 'first kill');
        if (ren) {
          results.renown = (results.renown || 0) + ren.amount;
          results.renownUnlocks = (results.renownUnlocks || []).concat(ren.unlocks);
        }
        const shards = Dp.firstKillShards + Math.floor(d.floor / Dp.shardsPerFloors);
        results.starshards += shards;                      // credited to the hero below
        results.deepFirstKill = { id: gd.id, shards: shards };
        const drop = rollItem(rngFrom(d.seed + ':deepfirst'),
          { floor: d.floor, ilvl: d.floor, classId: hero.classId, minRarity: 'rare' });
        const res = addItem(hero, drop);
        if (res.added) {
          results.items.push(drop);
          if (res.firstFind) results.firstFinds.push(drop.id);
        }
      } else if (prior === 0) {
        results.skillPoint = true;
        // SPEC 17.3 - the account's first kill of the First Champion dates
        // Aldric Venn's plaque.
        if (gd.id === 'champion' && !state.account.firstChampionKilledAt) {
          state.account.firstChampionKilledAt = now();
        }
        // SPEC 16.1 - each hero's first kill of a story Guardian pays Renown.
        const amount = BALANCE.renown.guardianFirstKill[gd.id] || 0;
        const ren = grantRenown(amount, 'first kill');
        if (ren) {
          results.renown = (results.renown || 0) + amount;
          results.renownUnlocks = (results.renownUnlocks || []).concat(ren.unlocks);
        }
        if (STORY_CARDS[gd.storyId] && state.account.codex.indexOf(gd.storyId) < 0) {
          state.account.codex.push(gd.storyId);
          results.storyCard = gd.storyId;
        }
        // The Hollow Warden's first kill by each hero drops a guaranteed
        // unique for that hero's class (SPEC 9.1).
        if (gd.id === 'warden') {
          const wrng = rngFrom(d.seed + ':wardenfirst');
          const drop = rollNamedItem(wrng, 'unique', hero.classId, d.floor) ||
                       rollItem(wrng, { floor: d.floor, ilvl: d.floor,
                                        classId: hero.classId, minRarity: 'rare' });
          const res = addItem(hero, drop);
          if (res.added) {
            results.items.push(drop);
            if (res.firstFind) results.firstFinds.push(drop.id);
          }
        }
      }
    }
    // unlock the next floor
    if (d.floor >= hero.deepest) {
      hero.deepest = d.floor + 1;
      results.unlockedFloor = hero.deepest;
      // SPEC 16.1 - a new deepest floor for the ACCOUNT pays Renown, once each.
      if (hero.deepest > state.account.deepestEver) {
        const newFloors = hero.deepest - state.account.deepestEver;
        state.account.deepestEver = hero.deepest;
        const amount = newFloors * BALANCE.renown.perNewDeepestFloor;
        const ren = grantRenown(amount, 'new depth');
        if (ren) {
          results.renown = (results.renown || 0) + amount;
          results.renownUnlocks = (results.renownUnlocks || []).concat(ren.unlocks);
        }
      }
    }

    // contracts that care about how this descent was cleared
    contractEvent('clear', {
      floor: d.floor,
      hasPact: d.omens.some(function (id) { return OMENS[id] && OMENS[id].type === 'pact'; }),
      bloodMoon: d.omens.indexOf('blood_moon') >= 0
    });

    hero.counters.clearStreak = (hero.counters.clearStreak || 0) + 1;
    hero.counters.fellSinceClear = false;

    // Usurer's Handwraps: clearing the descent Dark Bargain primed gives
    // back the HP it took (SPEC 12.3).
    if (snap.specials.usurers_handwraps && snap.darkBargainHp > 0) {
      d.hp = Math.min(d.hp + snap.darkBargainHp, ctx.stats.maxHp);
      results.hpLeft = Math.max(0, Math.floor(d.hp));
      results.hpSpent = Math.max(0, d.hpAtStart - Math.max(d.hp, 0));
    }
  }

  if (outcome === 'death') {
    // Items from earlier encounters are kept. Gold and XP are halved.
    results.gold = Math.floor(results.gold / 2);
    results.xp = Math.floor(results.xp / 2);
    hero.counters.deaths = (hero.counters.deaths || 0) + 1;
    hero.counters.clearStreak = 0;
    hero.counters.fellSinceClear = true;
    hero.fallenUntil = endAt + fallenDurationMs(hero, d.floor);
    results.fallenUntil = hero.fallenUntil;
    setHp(hero, 0, endAt);
  } else {
    setHp(hero, Math.max(0, Math.floor(d.hp)), endAt);
  }

  hero.gold += results.gold;
  hero.starshards += results.starshards;
  contractEvent('gold', { amount: results.gold });

  // SPEC 17.2 - records and lifetime totals, then anything newly achieved.
  recordDescent(hero, results);
  const earned = checkAchievements(hero, results);
  if (earned.length) results.achievements = earned;

  // The floor's paths reroll however the descent ended.
  discardFloorPaths(hero, d.floor);
  hero.descent = null;
  hero.lastResults = results;
  save();
  return results;
}

/* SPEC 7.7 - Retreat. Keeps everything resolved so far, no chest, no clear. */
function retreat(hero) {
  const d = hero.descent;
  if (!d) return null;
  return endDescent(hero, 'retreat', null);
}

/* ============================================================
   THE DAY'S WORK - SPEC 13.6
   One task at a time, earned while the hero's HP refills. Everything is
   derived from the start timestamp, so it accrues with the game closed,
   and it stops paying at the cap.
   ============================================================ */
function taskDef(id) { return BALANCE.labour.tasks[id] || null; }

function startTask(hero, id) {
  if (!taskDef(id)) return { ok: false, reason: 'No such work.' };
  if (hero.descent) return { ok: false, reason: 'Not while you are descending.' };
  // Switching work banks whatever the last task earned rather than losing it.
  if (hero.task) collectTask(hero);
  hero.task = { id: id, startedAt: now() };
  save();
  return { ok: true };
}

/* How long the current task has been paying, capped. */
function taskElapsed(hero) {
  if (!hero.task) return 0;
  return Math.min(elapsed(hero.task.startedAt), BALANCE.labour.capMs);
}
function taskAtCap(hero) {
  return !!hero.task && elapsed(hero.task.startedAt) >= BALANCE.labour.capMs;
}
function taskCapIn(hero) {
  if (!hero.task) return 0;
  return Math.max(0, BALANCE.labour.capMs - elapsed(hero.task.startedAt));
}

/* What the current task has earned so far. Gold and Ash are whole units;
   rite recharge is milliseconds off every cooldown. */
function taskAccrued(hero) {
  if (!hero.task) return 0;
  const def = taskDef(hero.task.id);
  if (!def) return 0;
  // Built from the SAME per-hour figure the UI shows, so the rate on screen
  // times the hours elapsed is exactly what gets paid.
  return Math.floor(taskRate(hero, hero.task.id) * (taskElapsed(hero) / HOUR));
}

/* What a task pays per hour, in the SAME units taskAccrued and
   taskAmountText use: whole gold, whole Ash, or milliseconds of rite
   recharge. Keeping one unit per reward means the UI can show the rate and
   the earnings through the same formatter. */
function taskRate(hero, id) {
  const def = taskDef(id);
  if (!def) return 0;
  if (def.reward === 'gold') return Math.round(def.perHour * g(hero.deepest));
  if (def.reward === 'ash') return def.perHour * (1 + Math.floor(hero.deepest / 10));
  return def.perHour * MINUTE;
}

/* Bank what has been earned and clear the task. */
function collectTask(hero) {
  if (!hero.task) return null;
  const def = taskDef(hero.task.id);
  const amount = taskAccrued(hero);
  const out = { id: hero.task.id, reward: def ? def.reward : null, amount: amount };

  if (def && amount > 0) {
    if (def.reward === 'gold') hero.gold += amount;
    else if (def.reward === 'ash') hero.ash += amount;
    else if (def.reward === 'rites') {
      for (const rid in hero.riteReadyAt) {
        hero.riteReadyAt[rid] = Math.max(0, hero.riteReadyAt[rid] - amount);
      }
    }
  }
  hero.task = null;
  save();
  return out;
}

/* A readable amount for whichever reward a task pays. */
function taskAmountText(reward, amount) {
  if (reward === 'gold') return fmtNum(amount) + ' gold';
  if (reward === 'ash') return fmtNum(amount) + ' Ash';
  return fmtTime(amount) + ' off every rite';
}

/* ============================================================
   THE DESCENT QUEUE - SPEC 16.2
   Renown rank 10. Queued descents also run while the game is closed,
   because settle() drives them from stored timestamps.
   ============================================================ */
function queueStart(hero, floor, count, thresholdPct) {
  if (!hasUnlock('queue')) return { ok: false, reason: 'The descent queue opens at Renown rank 10.' };
  const n = clamp(parseInt(count, 10) || 1, 1, BALANCE.queue.maxCount);
  hero.queue = { floor: floor, left: n, threshold: clamp(thresholdPct, 0, 100), stopped: null };
  save();
  return { ok: true, queue: hero.queue };
}
function queueCancel(hero) { hero.queue = null; save(); }

/* The path the queue would take: Safe before Risky, then lowest expected
   cost, never Deadly, and with no rites. */
function queuePickPath(hero, floor) {
  const paths = getFloorPaths(hero, floor);
  let best = null;
  for (let i = 0; i < paths.length; i++) {
    const fc = forecast(hero, floor, i);
    if (!fc || fc.risk === 'deadly') continue;
    const rank = fc.risk === 'safe' ? 0 : 1;
    if (!best || rank < best.rank || (rank === best.rank && fc.expected < best.expected)) {
      best = { index: i, rank: rank, expected: fc.expected };
    }
  }
  return best;
}

/* Why the queue would stop, or null to keep going (SPEC 16.2). */
function queueBlocker(hero) {
  const q = hero.queue;
  if (!q) return 'none';
  if (q.left <= 0) return 'The queue finished.';
  if (hero.fallenUntil > now()) return 'You fell.';
  if (inventoryFree(hero) < BALANCE.queue.minFreeSlots) return 'Fewer than 4 inventory slots free.';
  const st = heroStats(hero);
  const hp = currentHp(hero, st);
  if (st.maxHp > 0 && (hp / st.maxHp) * 100 < q.threshold) return 'HP below your threshold.';
  const pick = queuePickPath(hero, q.floor);
  if (!pick) return 'No path below Deadly.';
  return null;
}

/* Start the next queued descent if everything allows it. */
function queueAdvance(hero) {
  const q = hero.queue;
  if (!q || hero.descent) return false;
  const blocker = queueBlocker(hero);
  if (blocker) {
    // Any blocker ends the queue. Keep the reason so the player is told why.
    hero.queue = null;
    hero.queueMessage = blocker === 'The queue finished.' ? null : blocker;
    save();
    return false;
  }
  const pick = queuePickPath(hero, q.floor);
  q.left -= 1;
  startDescent(hero, q.floor, pick.index);
  save();
  return true;
}

/* ============================================================
   SETTLE - run before any read of hero state.
   Idempotent, and derived entirely from timestamps.
   ============================================================ */
let pendingResults = null;

function settle() {
  const hero = state && state.hero;
  if (!hero) return;

  // A descent that ran, or finished, while the game was closed. The queue then
  // starts the next one, and the loop repeats for however long we were away.
  let guard = 0;
  while (guard++ < 50) {
    if (hero.descent) {
      const res = settleDescent(hero);
      if (!res) break;                      // still running
      pendingResults = res;
    }
    if (hero.descent) break;
    if (!hero.queue) break;
    if (!queueAdvance(hero)) break;
  }

  // Fallen ending restores a fraction of Max HP and starts regeneration there.
  if (hero.fallenUntil && hero.fallenUntil <= now()) {
    const st = heroStats(hero);
    setHp(hero, st.maxHp * fallenRestoreFraction(hero), hero.fallenUntil);
    hero.fallenUntil = 0;
    save();
  }

  // Market restock (SPEC 13.3)
  restockMarket(hero);
  refreshBlackMarket(hero);

  // Contracts refresh at local midnight (SPEC 13.4).
  refreshContracts(hero);
}

/* ============================================================
   FORECAST - SPEC 7.6
   Uses the same timeline and rules the descent would use if it
   started now, so what the player sees is what they get.
   ============================================================ */
/* The forecast's view of one encounter (SPEC 7.6): its cost at the low and
   high rolls with no crit, and the expected cost after the average crit
   discount. The pre-descent forecast and the live pace (SCOPES-DESCENT D3)
   both use this, so they can never disagree. The Chainwraith can't be
   crit, so no crit discount is expected on it. */
function encounterExpectation(snap, ctx, enc, floor, seed) {
  const critChance = horrorFxOf(enc).noCrit ? 0 : clamp(ctx.stats.crit / 100, 0, BALANCE.caps.crit);
  const opts = function (roll) { return { roll: roll, forceNoCrit: true }; };
  const mid = encounterCost(snap, ctx, enc, floor, seed, opts(1.0));
  return {
    min: encounterCost(snap, ctx, enc, floor, seed, opts(BALANCE.cost.rollLo)),
    max: encounterCost(snap, ctx, enc, floor, seed, opts(BALANCE.cost.rollHi)),
    expected: mid * (1 - BALANCE.forecast.critCostFactor * critChance)
  };
}

function forecast(hero, floor, pathIndex) {
  const paths = getFloorPaths(hero, floor);
  const path = paths[pathIndex];
  if (!path) return null;

  const startAt = now();
  const st0 = heroStats(hero);
  const hp = currentHp(hero, st0);

  const snap = buildSnapshot(hero, floor, path, startAt, { preview: true });
  snap.hpAtStart = hp;
  snap.startedBelowHalf = hp < st0.maxHp * 0.5;
  const built = buildTimeline(snap, floor, path, startAt);

  let min = 0, max = 0, expected = 0;
  let expGold = 0, expXp = 0, expItems = 0, timeSaved = 0;
  const R = BALANCE.rewards;
  const slotMs = built.duration / Math.max(path.encounters.length, 1);

  for (const enc of built.timeline) {
    // HP-dependent effects use current HP (SPEC 7.6).
    const ctx = { effects: effectsAt(snap, enc.startsAt, []), hp: hp, elitesKilled: 0 };
    ctx.stats = statsAt(snap, ctx);
    // A named Horror's twist has to show in the forecast too (pillar 9):
    // the Chainwraith can't be crit, so no crit discount is expected on it.
    const hfx = horrorFxOf(enc);
    if (hfx.timeMult) timeSaved += slotMs * (1 - hfx.timeMult);

    const e = encounterExpectation(snap, ctx, enc, floor, path.seed);
    min += e.min;
    max += e.max;
    expected += e.expected;

    const st = ctx.stats;
    const goldFrac = (st.goldFind + st.fortune) / 100;
    const findFrac = (st.itemFind + st.fortune) / 100;
    expGold += R.goldCoef * g(floor) * enc.weight * (1 + goldFrac) * snap.fx.gold * rewardMult(floor) *
      (hfx.goldMult || 1);
    expXp += R.xpCoef * g(floor) * enc.weight * (1 + st.xpBonus / 100) * rewardMult(floor);

    const dropMult = (1 + findFrac) * snap.fx.item * rewardMult(floor);
    if (enc.kind === 'pack') expItems += Math.min(R.drops.packChance * dropMult, 1);
    else if (enc.kind === 'elite') expItems += R.drops.eliteCount + Math.min(R.drops.eliteExtraChance * dropMult, 1);
    else if (enc.kind === 'horror') expItems += R.drops.horrorCount + (hfx.extraItems || 0);
    else if (enc.kind === 'guardian') expItems += R.drops.guardianCount;
  }

  // The end chest, on a clear.
  const chestCtx = { effects: effectsAt(snap, startAt, []), hp: hp, elitesKilled: 0 };
  chestCtx.stats = statsAt(snap, chestCtx);
  const chestFind = (chestCtx.stats.itemFind + chestCtx.stats.fortune) / 100;
  expItems += R.drops.chestCount +
    Math.min(R.drops.chestExtraChance * (1 + chestFind) * snap.fx.item * rewardMult(floor), 1);

  const critAvg = clamp(chestCtx.stats.crit / 100, 0, BALANCE.caps.crit);
  const time = built.duration * (1 - BALANCE.forecast.critCostFactor * critAvg) - timeSaved;

  // Risk (SPEC 7.6)
  let risk;
  if (max < hp) risk = 'safe';
  else if (expected < hp) risk = 'risky';
  else risk = 'deadly';

  return {
    floor: floor,
    path: path,
    hp: hp,
    maxHp: st0.maxHp,
    min: Math.round(min),
    max: Math.round(max),
    expected: Math.round(expected),
    after: { min: Math.max(0, hp - Math.round(max)), max: Math.max(0, hp - Math.round(min)) },
    time: time,
    risk: risk,
    gold: { lo: Math.round(expGold * (1 - BALANCE.forecast.goldSpread)),
            hi: Math.round(expGold * (1 + BALANCE.forecast.goldSpread)) },
    xp: Math.round(expXp),
    items: { lo: Math.max(0, Math.round(expItems) - BALANCE.forecast.itemSpread),
             hi: Math.round(expItems) + BALANCE.forecast.itemSpread },
    rareOddsUp: snap.fx.rarityMult > 1,
    omens: path.omens.slice(),
    inventoryWarning: inventoryFree(hero) < BALANCE.forecast.lowInventoryWarn,
    encounterCount: built.timeline.length
  };
}

/* ============================================================
   ASCENSION AND LEGACY - SPEC 15
   ============================================================ */

/* A hero can Ascend once they have killed the Thing That Fell (SPEC 15.1). */
function canAscend(hero) {
  if (!hero) return false;
  if (hero.descent) return false;
  return (hero.guardianKills && hero.guardianKills.god > 0);
}

/* SPEC 15.3 - depthFactor = min(2, 1 + max(0, deepest - 40) / 40) */
function depthFactor(deepest) {
  const A = BALANCE.ascension;
  return Math.min(A.depthFactorCap, 1 + Math.max(0, deepest - A.depthFactorBase) / A.depthFactorBase);
}

/* What this hero would leave behind. Used for the preview and the grant. */
function blessingFrom(hero) {
  const A = BALANCE.ascension;
  const df = depthFactor(hero.deepest);
  return {
    xpGold: A.xpGoldPerChampion * df,
    stat: A.classBlessing[hero.classId],
    statAmount: A.classBlessingPer * df,
    depthFactor: df
  };
}

/* Blessings accumulate across champions and cap (SPEC 15.3). */
function addBlessing(hero) {
  const A = BALANCE.ascension;
  const b = blessingFrom(hero);
  const bl = state.account.blessings;
  bl.xpGold = Math.min(A.capXpGold, (bl.xpGold || 0) + b.xpGold);
  bl[b.stat] = Math.min(A.capClass, (bl[b.stat] || 0) + b.statAmount);
  return b;
}

/* SPEC 15.4 - the heirloom's level follows the hero, never exceeding its own. */
function heirloomLevelFor(hero, item) {
  return Math.max(1, Math.min(hero.level, item.originalIlvl || item.ilvl));
}
function syncHeirloom(hero) {
  for (const slot of BALANCE.items.slots) {
    const it = hero.equipment[slot];
    if (it && it.heirloom) it.ilvl = heirloomLevelFor(hero, it);
  }
  for (const it of hero.inventory) {
    if (it.heirloom) it.ilvl = heirloomLevelFor(hero, it);
  }
}

/* Relics the hero could pass on (SPEC 15.2 step 1). */
/* Worn, carried, or stored. The Vault has to count: it is where a player
   puts the relic they are saving, and leaving it out would mean stashing a
   relic quietly disqualified it from being the heirloom - losing it for
   good at the one moment that choice is made. */
function heirloomCandidates(hero) {
  const out = [];
  for (const slot of BALANCE.items.slots) {
    const it = hero.equipment[slot];
    if (it && it.slot === 'relic') out.push(it);
  }
  for (const it of hero.inventory) if (it.slot === 'relic') out.push(it);
  for (const it of (hero.vault || [])) if (it.slot === 'relic') out.push(it);
  return out;
}

/* The plaque this hero leaves in the Hall of Champions (SPEC 17.3). */
function championPlaque(hero) {
  const descents = hero.counters.descents || 0;
  const deaths = hero.counters.deaths || 0;
  const epitaph = deaths === 0
    ? 'Descended ' + fmtNum(descents) + ' times. Never fell.'
    : 'Descended ' + fmtNum(descents) + ' times. Fell ' + fmtNum(deaths) +
      '. Rose ' + fmtNum(deaths + 1) + '.';
  return {
    id: hero.id,
    name: hero.name,
    title: activeTitleName(),
    classId: hero.classId,
    ascension: (state.account.ascensions || 0) + 1,
    deepest: hero.deepest,
    level: hero.level,
    epitaph: epitaph,
    daysServed: Math.max(1, Math.round(elapsed(hero.createdAt) / DAY)),
    descents: descents,
    deaths: deaths,
    equipment: JSON.parse(JSON.stringify(hero.equipment)),
    at: now()
  };
}

/* SPEC 17.3 - the Hall holds the First Champion's plaque from the start.
   The date of return fills in once the account has killed them. */
function firstChampionPlaque() {
  const killedAt = state.account.firstChampionKilledAt;
  const date = killedAt
    ? new Date(killedAt).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' })
    : 'unknown';
  return {
    id: 'aldric_venn',
    name: 'Aldric Venn',
    title: 'the First Champion',
    classId: null,
    ascension: null,
    deepest: 30,
    level: null,
    epitaph: 'Descended soon after the fall. Date of return: ' + date + '.',
    founder: true,
    at: killedAt || 0
  };
}

/* SPEC 15.2 - the whole flow. `heirloomId` may be null. */
function ascend(hero, heirloomId) {
  if (!canAscend(hero)) return { ok: false, reason: 'This hero has not defeated the god.' };

  const plaque = championPlaque(hero);
  const blessing = addBlessing(hero);

  // Carry the chosen relic forward. One heirloom at a time (SPEC 15.4).
  let heirloom = null;
  if (heirloomId) {
    const found = heirloomCandidates(hero).find(function (i) { return i.id === heirloomId; });
    if (found) {
      heirloom = JSON.parse(JSON.stringify(found));
      heirloom.heirloom = true;
      heirloom.locked = true;
      if (!heirloom.originalIlvl) heirloom.originalIlvl = heirloom.ilvl;
      heirloom.isNew = false;
    }
  }

  state.account.champions.push(plaque);
  state.account.heirloom = heirloom;
  state.account.ascensions = (state.account.ascensions || 0) + 1;

  // SPEC 15.6 - everything hero-side resets; the account keeps the rest.
  state.hero = null;
  save();
  checkAchievements(freshHero('tmp', hero.classId), null);   // "Ascend a hero"
  save();
  return { ok: true, plaque: plaque, blessing: blessing, heirloom: heirloom };
}

/* ============================================================
   RECORDS AND LIFETIME TOTALS - SPEC 17.2
   Account-wide. Records remember who set them and when.
   ============================================================ */
const RECORD_DEFS = {
  deepest:        { id: 'deepest',        name: 'Deepest floor',            kind: 'max', unit: 'floor' },
  gold_descent:   { id: 'gold_descent',   name: 'Most gold from a descent', kind: 'max', unit: 'gold' },
  clear_streak:   { id: 'clear_streak',   name: 'Longest run without falling', kind: 'max', unit: 'clears' }
};

const TOTAL_DEFS = {
  descents:    { id: 'descents',    name: 'Descents' },
  descendMs:   { id: 'descendMs',   name: 'Time spent descending', kind: 'time' },
  bossesSlain: { id: 'bossesSlain', name: 'Bosses slain' },
  deaths:      { id: 'deaths',      name: 'Times fallen' },
  salvaged:    { id: 'salvaged',    name: 'Items salvaged' },
  goldEarned:  { id: 'goldEarned',  name: 'Gold earned' }
};

function bumpTotal(id, amount) {
  if (!state.account.totals) state.account.totals = {};
  state.account.totals[id] = (state.account.totals[id] || 0) + (amount === undefined ? 1 : amount);
}
function totalOf(id) { return (state.account.totals && state.account.totals[id]) || 0; }

/* Records keep the best value plus who set it. `key` lets one definition hold
   several records, e.g. deepest floor per class or per Guardian. */
function recordKey(id, key) { return key ? id + ':' + key : id; }

function setRecord(id, value, hero, key) {
  if (!state.account.records) state.account.records = {};
  const k = recordKey(id, key);
  const cur = state.account.records[k];
  if (cur && cur.value >= value) return false;
  state.account.records[k] = {
    value: value,
    heroName: hero ? hero.name : '',
    classId: hero ? hero.classId : null,
    at: now()
  };
  return true;
}
/* A record where lower is better, e.g. fastest Guardian clear. */
function setRecordLow(id, value, hero, key) {
  if (!state.account.records) state.account.records = {};
  const k = recordKey(id, key);
  const cur = state.account.records[k];
  if (cur && cur.value <= value) return false;
  state.account.records[k] = {
    value: value, heroName: hero ? hero.name : '',
    classId: hero ? hero.classId : null, at: now()
  };
  return true;
}
function getRecord(id, key) { return (state.account.records || {})[recordKey(id, key)] || null; }

/* Everything a finished descent contributes to records and totals. */
function recordDescent(hero, results) {
  bumpTotal('descents');
  bumpTotal('descendMs', Math.max(0, results.timeTaken));
  bumpTotal('goldEarned', results.gold);
  if (results.outcome === 'death') bumpTotal('deaths');

  setRecord('deepest', hero.deepest, hero);
  setRecord('deepest', hero.deepest, hero, hero.classId);
  setRecord('gold_descent', results.gold, hero);
  setRecord('clear_streak', hero.counters.clearStreak || 0, hero);

  // Fastest clear of each Guardian floor.
  if (results.outcome === 'clear') {
