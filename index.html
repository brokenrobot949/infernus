function heroRenderGear(hero) {
  let html = '<div class="section-title">Equipped</div>';
  html += '<div class="stack-s">' +
    BALANCE.items.slots.map(function (slot) { return heroEquipRow(hero, slot); }).join('') +
  '</div>';

  const cap = inventoryCap(hero);
  const free = inventoryFree(hero);
  const used = cap - free;

  html += '<div class="row-between" style="margin-top:20px">' +
    '<span class="section-title" style="margin:0">Inventory</span>' +
    '<span class="small muted num">' + fmtNum(used) + ' / ' + fmtNum(cap) + ' slots</span>' +
  '</div>';

  html += heroSortRow();

  const order = heroSortedIndices(hero);
  if (!order.length) {
    html += '<p class="small muted">No items yet.</p>';
  } else {
    html += '<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px">' +
      order.map(function (idx) { return heroInvTile(hero, idx); }).join('') +
    '</div>';
  }
  return html;
}

function heroEquipRow(hero, slot) {
  const item = hero.equipment[slot];
  if (!item) {
    return '<div class="card row-between">' +
      '<span class="small">' + heroSlotLabel[slot] + '</span>' +
      '<span class="small" style="color:var(--ash)">Empty</span>' +
    '</div>';
  }
  const r = RARITIES[item.rarity];
  return '<button class="card card-tap row-between" data-act="item" data-item="equip:' + slot + '">' +
    '<span class="row" style="gap:8px;min-width:0">' +
      '<span class="badge" style="color:var(--r-' + item.rarity + ');flex:0 0 auto">' + r.badge + '</span>' +
      '<span class="small rar-' + item.rarity + '" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
        esc(heroItemName(item)) +
      '</span>' +
    '</span>' +
    '<span class="row" style="gap:6px;flex:0 0 auto">' +
      (item.locked ? heroIco('ico-lock', 16) : '') +
      '<span class="tiny muted">' + heroSlotLabel[slot] + '</span>' +
    '</span>' +
  '</button>';
}

function heroSortRow() {
  const opts = [['rarity', 'Rarity'], ['slot', 'Slot'], ['newest', 'Newest'], ['power', 'Power']];
  return '<div class="row wrap" style="gap:8px;margin:10px 0">' +
    '<span class="small muted row" style="gap:4px">' + icon('ico-sort') + 'Sort</span>' +
    opts.map(function (o) {
      return '<button class="btn btn-sm' + (heroSort === o[0] ? ' btn-primary' : '') + '" data-act="sort" data-sort="' + o[0] + '">' +
        o[1] + '</button>';
    }).join('') +
  '</div>';
}

function heroPowerDeltaSafe(hero, item) {
  try { return powerDelta(hero, item); } catch (e) { return 0; }
}

/* ============================================================
   EQUIP PREVIEW - the item sheet's "what happens to me" block.
   The sheet already lists the item's own numbers. This shows the hero's:
   every stat before and after the swap, worked out by running heroStats on
   a copy of the hero with the change made. That is the same calculation
   the game uses, so percent affixes, class multipliers, set bonuses,
   keystones and caps all land exactly as they would in play. For an item
   already worn, it shows what taking it off would do instead.
   ============================================================ */
function heroEquipPreview(hero, item, removing) {
  const before = heroStats(hero);
  const clone = JSON.parse(JSON.stringify(hero));
  clone.equipment[item.slot] = removing ? null : item;
  return { before: before, after: heroStats(clone), clone: clone };
}

/* Set bonuses that would start or stop. The set block above shows what is
   active now, not what would be after the swap. */
function heroSetBonusChanges(hero, clone) {
  const was = equippedSetCounts(hero), will = equippedSetCounts(clone);
  const ids = Object.keys(was).concat(Object.keys(will)).filter(function (id, i, a) { return a.indexOf(id) === i; });
  const out = [];
  for (const id of ids) {
    const s = SETS[id];
    if (!s) continue;
    for (const n of [2, 3]) {
      const had = (was[id] || 0) >= n, has = (will[id] || 0) >= n;
      if (has && !had) out.push({ gain: true,  text: s.name + ' (' + n + '): ' + s['bonus' + n].text });
      if (had && !has) out.push({ gain: false, text: s.name + ' (' + n + '): ' + s['bonus' + n].text });
    }
  }
  return out;
}

function heroEquipChangeBlock(hero, item, removing) {
  const replaced = removing ? item : hero.equipment[item.slot];
  const p = heroEquipPreview(hero, item, removing);
  const B = p.before, A = p.after;

  let intro;
  if (removing) intro = 'If you take it off';
  else intro = 'If you equip it';
  let sub = '';
  if (!removing) {
    sub = replaced
      ? 'Replaces ' + heroItemName(replaced) + '.'
      : 'Fills your empty ' + heroSlotLabel[item.slot] + ' slot.';
  }

  // Every stat that moves, Power first. Whole numbers for the combat stats,
  // percentages for the rest; a change too small to show is left out.
  const rows = [];
  ['power'].concat(heroCoreStats, heroPercentStats).forEach(function (key) {
    const whole = key === 'power' || heroIsCore(key);
    const b = whole ? Math.round(B[key] || 0) : (B[key] || 0);
    const a = whole ? Math.round(A[key] || 0) : (A[key] || 0);
    const d = a - b;
    if (whole ? d === 0 : Math.abs(d) < 0.05) return;
    const up = d > 0;
    const fmt = whole ? fmtNum : fmtPct;
    rows.push('<div class="row-between small" style="gap:8px;align-items:baseline' +
        (key === 'power' ? ';font-weight:600' : '') + '">' +
      '<span style="min-width:0">' + esc(heroStatLabel[key]) + '</span>' +
      '<span class="num" style="white-space:nowrap;text-align:right">' +
        '<span class="muted">' + fmt(b) + ' → </span>' + fmt(a) +
        ' <span style="color:var(--' + (up ? 'corona' : 'blood-light') + ')">' +
          (up ? '▲ ' : '▼ ') + fmt(Math.abs(d)) + '</span>' +
      '</span>' +
    '</div>');
  });

  // What Power means in play: an ordinary encounter's HP cost is divided by
  // Power, so the cost changes by before / after. Guardians test other stats,
  // hence "most".
  let meaning = '';
  if (B.power > 0 && A.power > 0) {
    const change = (B.power / A.power - 1) * 100;
    if (Math.abs(change) >= 0.5) {
      meaning = '<p class="small" style="margin:6px 0 0">Most encounters would cost about ' +
        fmtPct(Math.abs(change)) + (change < 0 ? ' less' : ' more') + ' HP.</p>';
    }
  }

  // Set bonuses starting or stopping, and a unique power that would be lost.
  const extras = [];
  heroSetBonusChanges(hero, p.clone).forEach(function (c) {
    extras.push('<div class="small" style="color:var(--' + (c.gain ? 'corona' : 'blood-light') + ')">' +
      (c.gain ? '▲ Starts ' : '▼ Ends ') + esc(c.text) + '</div>');
  });
  if (replaced && replaced.rarity === 'unique' && replaced.uniqueId && UNIQUES[replaced.uniqueId]) {
    extras.push('<div class="small" style="color:var(--blood-light)">▼ Loses ' +
      esc(heroItemName(replaced)) + ': ' + esc(UNIQUES[replaced.uniqueId].power.text) + '</div>');
  }

  let html = '<div style="font-weight:600">' + esc(intro) + '</div>';
  if (sub) html += '<div class="small muted" style="margin-top:2px">' + esc(sub) + '</div>';
  if (rows.length) html += '<div class="stack-s" style="margin-top:8px">' + rows.join('') + '</div>';
  html += meaning;
  if (extras.length) html += '<div class="stack-s" style="margin-top:8px">' + extras.join('') + '</div>';
  if (!rows.length && !extras.length) {
    html += '<p class="small muted" style="margin:6px 0 0">Your stats would not change.</p>';
  }
  return html;
}

function heroSortedIndices(hero) {
  const idx = hero.inventory.map(function (_, i) { return i; });
  const slots = BALANCE.items.slots;
  idx.sort(function (a, b) {
    const ia = hero.inventory[a], ib = hero.inventory[b];
    if (heroSort === 'rarity') return RARITY_ORDER.indexOf(ib.rarity) - RARITY_ORDER.indexOf(ia.rarity);
    if (heroSort === 'slot') return slots.indexOf(ia.slot) - slots.indexOf(ib.slot);
    if (heroSort === 'newest') return (ib.isNew ? 1 : 0) - (ia.isNew ? 1 : 0);
    if (heroSort === 'power') return heroPowerDeltaSafe(hero, ib) - heroPowerDeltaSafe(hero, ia);
    return 0;
  });
  return idx;
}

function heroInvTile(hero, idx) {
  const item = hero.inventory[idx];
  const r = RARITIES[item.rarity];
  let extras = '';
  if (item.isNew) {
    extras += '<span aria-hidden="true" style="position:absolute;top:4px;right:4px;width:7px;height:7px;' +
      'border-radius:50%;background:var(--corona)"></span>';
  }
  if (item.locked) {
    extras += '<span style="position:absolute;bottom:2px;right:2px;color:var(--ash)">' + heroIco('ico-lock', 13) + '</span>';
  }
  if (r.chain) {
    extras += '<span style="position:absolute;bottom:2px;left:2px;color:var(--r-' + item.rarity + ')">' + heroIco('ico-chain', 13) + '</span>';
  }
  return '<button class="card-tap" data-act="item" data-item="inv:' + idx + '" style="' +
    'position:relative;aspect-ratio:1;min-width:48px;display:block;padding:0;' +
    'background:var(--crypt);border:' + r.border + ' var(--r-' + item.rarity + ');border-radius:var(--radius)">' +
    '<span class="badge" style="position:absolute;top:3px;left:3px;color:var(--r-' + item.rarity + ')">' + r.badge + '</span>' +
    extras +
  '</button>';
}

/* Resolve a "equip:<slot>" or "inv:<idx>" location string to its item. */
function heroFindItem(hero, loc) {
  if (!loc) return null;
  const parts = loc.split(':');
  if (parts[0] === 'equip') {
    const item = hero.equipment[parts[1]];
    return item ? { item: item, loc: loc } : null;
  }
  if (parts[0] === 'inv') {
    const item = hero.inventory[parseInt(parts[1], 10)];
    return item ? { item: item, loc: loc } : null;
  }
  return null;
}

function heroItemStatLines(st) {
  const lines = [];
  for (let i = 0; i < heroCoreStats.length; i++) {
    const c = heroCoreStats[i];
    if (st[c]) lines.push({ label: heroCoreLabel[c], value: '+' + fmtNum(st[c]) });
    const pctKey = c + 'Pct';
    if (st[pctKey]) lines.push({ label: heroCoreLabel[c] + ' %', value: '+' + fmtPct(st[pctKey]) });
  }
  for (let i = 0; i < heroPercentStats.length; i++) {
    const p = heroPercentStats[i];
    if (st[p]) lines.push({ label: heroStatLabel[p], value: '+' + fmtPct(st[p]) });
  }
  return lines;
}

function heroRelicChangeBlock(hero, item) {
  const equipped = hero.equipment.relic;
  const curSt = equipped ? itemStats(equipped) : null;
  const newSt = itemStats(item);
  const rows = [];

  function addRow(label, curV, newV, isPct) {
    const diff = newV - curV;
    if (Math.abs(diff) < 0.0001) return;
    const up = diff >= 0;
    const shown = isPct ? fmtPct(Math.abs(diff)) : fmtNum(Math.abs(diff));
    rows.push('<div class="row-between small"><span>' + esc(label) + '</span>' +
      '<span style="color:' + (up ? 'var(--corona)' : 'var(--blood-light)') + '">' +
      (up ? '▲ ' : '▼ ') + shown + '</span></div>');
  }

  for (let i = 0; i < heroPercentStats.length; i++) {
    const p = heroPercentStats[i];
    addRow(heroStatLabel[p], curSt ? (curSt[p] || 0) : 0, newSt[p] || 0, true);
  }
  for (let i = 0; i < heroCoreStats.length; i++) {
    const c = heroCoreStats[i];
    addRow(heroCoreLabel[c], curSt ? (curSt[c] || 0) : 0, newSt[c] || 0, false);
    const pk = c + 'Pct';
    addRow(heroCoreLabel[c] + ' %', curSt ? (curSt[pk] || 0) : 0, newSt[pk] || 0, true);
  }

  if (!rows.length) return '<div class="small muted">No stat change vs. equipped relic.</div>';
  return '<div class="stack-s">' + rows.join('') + '</div>';
}

function heroOpenItemSheet(hero, item, loc) {
  if (item.isNew) { item.isNew = false; save(); refresh(); }
  const r = RARITIES[item.rarity];
  const isThisEquipped = hero.equipment[item.slot] === item;
  const name = heroItemName(item);

  let body = '<div class="stack">';
  body += '<div class="row" style="gap:8px">' +
    '<span class="badge" style="color:var(--r-' + item.rarity + ')">' + r.badge + '</span>' +
    '<span style="font-size:1.0625rem" class="rar-' + item.rarity + '">' + esc(name) + '</span>' +
  '</div>';
  if (item.rarity === 'rare') {
    body += '<div class="small muted">' + esc(item.baseType) + '</div>';
  }
  body += '<div class="small muted">Item level ' + fmtNum(item.ilvl) +
    (item.temper ? ' · +' + fmtNum(item.temper) + ' temper' : '') + '</div>';

  const statLines = heroItemStatLines(itemStats(item));
  if (statLines.length) {
    body += '<div class="divider"></div><div class="stack-s">' +
      statLines.map(function (l) {
        return '<div class="row-between small"><span>' + esc(l.label) + '</span><span class="num">' + l.value + '</span></div>';
      }).join('') +
    '</div>';
  }

  if (item.affixes && item.affixes.length) {
    body += '<div class="divider"></div><div class="stack-s">' +
      item.affixes.map(function (a) {
        const def = AFFIXES[a.id];
        const text = def ? def.text.replace('X', fmtNum(a.value)) : a.id;
        return '<div class="small">' + esc(text) + '</div>';
      }).join('') +
    '</div>';
  }

  body += '<div class="divider"></div>';
  if (isThisEquipped) {
    body += '<div class="small muted">Currently equipped.</div>';
  } else if (item.slot === 'relic') {
    body += heroRelicChangeBlock(hero, item);
  } else {
    const delta = powerDelta(hero, item);
    const up = delta >= 0;
    body += '<div style="color:' + (up ? 'var(--corona)' : 'var(--blood-light)') + ';font-weight:600">' +
      (up ? '▲ ' : '▼ ') + fmtPct(Math.abs(delta)) + ' Power' +
    '</div>';
  }
  body += '</div>';

  const foot = '<div class="btn-row">' +
    (isThisEquipped ?
      '<button class="btn" data-act="unequip">Unequip</button>' :
      '<button class="btn btn-primary" data-act="equip">Equip</button>') +
    '<button class="btn' + (item.locked ? '' : ' btn-ghost') + '" data-act="lock">' +
      icon(item.locked ? 'ico-unlock' : 'ico-lock') + (item.locked ? 'Unlock' : 'Lock') +
    '</button>' +
  '</div>';

  openSheet({
    title: heroSlotLabel[item.slot],
    body: body,
    foot: foot,
    onAct: function (act) { heroItemSheetAct(act, hero, item); }
  });
}

function heroItemSheetAct(act, hero, item) {
  if (act === 'equip') {
    const res = equipItem(hero, item);
    if (!res.ok) { toast(res.reason); return; }
    closeSheet(); refresh();
  } else if (act === 'unequip') {
    const res = unequipItem(hero, item.slot);
    if (!res.ok) { toast(res.reason); return; }
    closeSheet(); refresh();
  } else if (act === 'lock') {
    item.locked = !item.locked;
    save();
    closeSheet(); refresh();
  } else if (act === 'sell') {
    // Both are destructive, so they confirm first.
    const price = sellPrice(hero, item);
    confirmSheet({
      title: 'Sell this?',
      body: 'Sell <strong>' + esc(item.name) + '</strong> for ' + fmtNum(price) + ' gold.',
      yes: 'Sell', danger: true,
      onYes: function () {
        const res = sellItem(hero, item);
        if (!res.ok) { toast(res.reason); return; }
        toast('Sold for ' + fmtNum(res.gold) + ' gold.');
        closeAllSheets(); refresh();
      }
    });
  } else if (act === 'salvage') {
    const y = heroSalvageYield(hero, item);
    confirmSheet({
      title: 'Salvage this?',
      body: 'Break down <strong>' + esc(item.name) + '</strong> for ' + fmtNum(y.ash) + ' Ash' +
            (y.shards ? ' and ' + fmtNum(y.shards) + ' Starshards' : '') + '.',
      yes: 'Salvage', danger: true,
      onYes: function () {
        const res = salvageItem(hero, item);
        if (!res.ok) { toast(res.reason); return; }
        toast('Salvaged for ' + fmtNum(res.yield.ash) + ' Ash.');
        closeAllSheets(); refresh();
      }
    });
  }
}

/* ============================================================
   STATS - SPEC 3.1
   ============================================================ */
function heroRenderStats(hero) {
  const st = heroStats(hero);
  const hp = currentHp(hero, st);
  const xpNext = xpToNext(hero.level);

  let html = '<div class="card">';
  html += '<div class="row-between"><span class="small muted">Level</span>' +
    '<span class="num">' + fmtNum(hero.level) + ' / ' + fmtNum(BALANCE.levelCap) + '</span></div>';
  if (isFinite(xpNext)) {
    const xpPct = xpNext > 0 ? Math.max(0, Math.min(1, hero.xp / xpNext)) * 100 : 0;
    html += '<div class="bar bar-xp" style="margin-top:8px"><div class="bar-fill" style="width:' + xpPct + '%"></div></div>';
    html += '<div class="row-between small muted num" style="margin-top:4px">' +
      '<span>' + fmtNum(hero.xp) + ' / ' + fmtNum(xpNext) + '</span></div>';
  } else {
    html += '<div class="small muted" style="margin-top:8px">Maximum level reached.</div>';
  }
  html += '</div>';

  html += '<div class="card" style="margin-top:10px">';
  html += '<div class="row-between"><span class="small muted">HP</span>' +
    '<span class="num">' + fmtNum(hp) + ' / ' + fmtNum(st.maxHp) + '</span></div>';
  const hpPct = st.maxHp > 0 ? Math.max(0, Math.min(1, hp / st.maxHp)) * 100 : 0;
  html += '<div class="bar bar-lg" style="margin-top:8px"><div class="bar-fill" style="width:' + hpPct + '%"></div></div>';
  html += '<div class="small muted" style="margin-top:4px">' +
    (hp >= st.maxHp ? 'Full HP' : 'Full in ' + fmtTime(timeToFullHp(hero, st))) +
  '</div></div>';

  html += '<div class="section-title">Stats</div><div class="stack-s">';
  const order = ['power', 'might', 'guard', 'maxHp', 'haste', 'fortune', 'recovery',
                 'crit', 'goldFind', 'itemFind', 'xpBonus', 'eliteBoss', 'riteCd'];
  html += order.map(function (key) {
    const raw = key === 'power' ? st.power : st[key];
    const display = (key === 'power' || heroIsCore(key)) ? fmtNum(Math.round(raw)) : fmtPct(raw);
    return '<button class="card card-tap row-between" data-act="stat" data-stat="' + key + '">' +
      '<span class="small">' + heroStatLabel[key] + '</span>' +
      '<span class="num">' + display + '</span>' +
    '</button>';
  }).join('');
  html += '</div>';
  return html;
}

/* A throwaway clone with equipment stripped (and optionally skills too),
   used only to isolate contributions via heroStats. Never saved. */
function heroBareClone(hero, alsoStripSkills) {
  const c = JSON.parse(JSON.stringify(hero));
  c.equipment = { weapon: null, helm: null, armor: null, gloves: null, boots: null, relic: null };
  if (alsoStripSkills) c.skills = {};
  return c;
}

function heroStatOf(st, key) { return key === 'power' ? st.power : st[key]; }

function heroSheetRow(label, value) {
  return '<div class="row-between small"><span>' + esc(label) + '</span><span class="num">' + esc(value) + '</span></div>';
}

function heroStatSheet(hero, key) {
  const total = heroStats(hero);
  const bareSt = heroStats(heroBareClone(hero, true));
  const withSkillsSt = heroStats(heroBareClone(hero, false));

  const baseVal = heroStatOf(bareSt, key);
  const withSkillsVal = heroStatOf(withSkillsSt, key);
  const totalVal = heroStatOf(total, key);
  const skillsNet = withSkillsVal - baseVal;
  const gearNet = totalVal - withSkillsVal;

  const fmt = function (n) { return (key === 'power' || heroIsCore(key)) ? fmtNum(Math.round(n)) : fmtPct(n); };
  const signed = function (n) { return (n >= 0 ? '+' : '') + fmt(n); };

  const cls = BALANCE.classes[hero.classId];
  let baseLabel = 'Base (level ' + fmtNum(hero.level) + ')';
  if (heroIsCore(key) && cls && cls[key] !== undefined && cls[key] !== 1) {
    baseLabel += ' — includes ' + heroClassName(hero.classId) + ' ' +
      (cls[key] > 1 ? '+' : '') + fmtPct((cls[key] - 1) * 100);
  }

  let rows = heroSheetRow(baseLabel, fmt(baseVal));
  rows += heroSheetRow('From skills', signed(skillsNet));
  rows += heroSheetRow('From equipped gear', signed(gearNet));

  let gearDetail = '';
  if (key !== 'power') {
    const lines = [];
    for (let i = 0; i < BALANCE.items.slots.length; i++) {
      const slot = BALANCE.items.slots[i];
      const item = hero.equipment[slot];
      if (!item) continue;
      const ist = itemStats(item);
      const flatV = ist[key] || 0;
      if (flatV) lines.push(heroSheetRow(heroItemName(item), '+' + (heroIsCore(key) ? fmtNum(flatV) : fmtPct(flatV))));
      if (heroIsCore(key)) {
        const pctV = ist[key + 'Pct'] || 0;
        if (pctV) lines.push(heroSheetRow(heroItemName(item) + ' %', '+' + fmtPct(pctV)));
      }
    }
    if (lines.length) {
      gearDetail = '<div class="section-title">Gear detail (before multipliers)</div><div class="stack-s">' +
        lines.join('') + '</div>';
    }
  }

  // What it does comes before where the number came from.
  const help = heroStatHelpHtml(key);
  const body = (help ? '<div class="panel" style="margin-bottom:12px">' + help + '</div>' : '') +
    '<div class="stack-s">' + rows + '</div>' +
    '<div class="divider"></div>' +
    '<div class="stack-s">' + heroSheetRow('Total', fmt(totalVal)) + '</div>' +
    gearDetail;

  openSheet({ title: heroStatLabel[key], body: body });
}

/* ============================================================
   SKILLS - SPEC 10.1, 10.2
   ============================================================ */
function heroTypeTag(type) {
  return { minor: 'MIN', notable: 'NOT', rite: 'RIT', keystone: 'KEY' }[type] || type.toUpperCase();
}
function heroTypeLabel(type) {
  return { minor: 'Minor passive', notable: 'Notable', rite: 'Rite', keystone: 'Keystone' }[type] || type;
}
function heroRiteKindLabel(kind) {
  return { primed: 'Primed rite', timed: 'Timed rite', emergency: 'Emergency rite', instant: 'Instant rite' }[kind] || kind;
}

function heroRenderSkills(hero) {
  const tree = TREES[hero.classId];
  if (!tree) return '<div class="card"><p class="small muted">No skill tree for this class yet.</p></div>';

  const pts = unspentSkillPoints(hero);
  let html = '<div class="card row-between">' +
    '<span class="small">Skill points</span>' +
    '<span class="num" style="font-weight:600">' + fmtNum(pts) + (pts === 1 ? ' point to spend' : ' points to spend') + '</span>' +
  '</div>';

  html += '<div class="row" style="gap:8px;align-items:flex-start;margin-top:12px">' +
    tree.branches.map(function (br) { return heroBranchColumn(hero, br); }).join('') +
  '</div>';

  html += heroRiteSlotsBlock(hero);
  return html;
}

function heroBranchColumn(hero, br) {
  let col = '<div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px">';
  col += '<div style="text-align:center">' +
    '<div class="tiny" style="font-weight:600">' + esc(br.name) + '</div>' +
    '<div class="tiny muted">' + esc(br.blurb) + '</div>' +
  '</div>';
  for (let row = 1; row <= 6; row++) {
    const nodes = br.nodes.filter(function (n) { return n.row === row; });
    if (!nodes.length) continue;
    // Stacked, not side by side: at 360px three branches x two nodes leaves
    // 51px per tile, which breaks names mid-word. Stacking gives each tile
    // the full column width and still keeps the rows aligned across branches.
    col += '<div style="display:flex;flex-direction:column;gap:4px">' +
      nodes.map(function (n) { return heroNodeTile(hero, br, n); }).join('') +
    '</div>';
  }
  col += '</div>';
  return col;
}

function heroNodeTile(hero, br, node) {
  const rank = hero.skills[node.id] || 0;
  const maxed = rank >= node.maxRank;
  const open = rowOpen(hero, br.id, node.row);
  const gate = canLearn(hero, node.id);

  let borderWidth = '1px', borderStyle = 'solid', borderColor = 'var(--edge)';
  let stateLabel = '', stateColor = 'var(--ash)';
  let opacity = '1';

  if (maxed) {
    borderWidth = '2px'; borderColor = 'var(--corona)';
    stateLabel = 'Maxed'; stateColor = 'var(--corona)';
  } else if (!open) {
    borderStyle = 'dashed'; opacity = '.6';
    stateLabel = 'Locked'; stateColor = 'var(--ash)';
  } else if (gate.ok) {
    borderWidth = '2px'; borderColor = 'var(--corona)';
    stateLabel = 'Learnable'; stateColor = 'var(--corona)';
  }
  if (node.type === 'keystone' && open) { borderStyle = 'double'; borderWidth = '3px'; }
  const accent = node.type === 'rite' ? 'box-shadow:inset 3px 0 0 var(--brass);' : '';

  return '<button class="card-tap" data-act="node" data-node="' + node.id + '" style="' +
    // Uniform height so rows stay aligned across the three branches, and tall
    // enough for a two-line name plus the rank and state labels.
    // Explicit height (with border-box) so a 1px, 2px or 3px state border all
    // produce the same outer height and the rows never drift apart.
    'text-align:center;padding:6px 6px;height:104px;flex:0 0 auto;min-width:0;' +
    'display:flex;flex-direction:column;justify-content:center;gap:2px;' +
    'background:var(--crypt);border-radius:var(--radius);opacity:' + opacity + ';' +
    'border:' + borderWidth + ' ' + borderStyle + ' ' + borderColor + ';' + accent + '">' +
    '<span class="tiny muted">' + heroTypeTag(node.type) + '</span>' +
    // A constant two-line box: a name that wraps must not make its tile taller
    // than its neighbours, or every row below it drifts out of alignment.
    '<span class="tiny" style="line-height:1.15;overflow-wrap:break-word;height:2.3em;' +
      'display:flex;align-items:center;justify-content:center;overflow:hidden">' +
      esc(node.name) + '</span>' +
    '<span class="tiny num">' + rank + '/' + node.maxRank + '</span>' +
    (stateLabel ? '<span class="tiny" style="color:' + stateColor + '">' + stateLabel + '</span>' : '') +
  '</button>';
}

/* Pull the first number out of a "...X% ... per rank" style text. */
function heroPerRankInfo(text) {
  if (!/per rank/i.test(text)) return null;
  const m = text.match(/-?\d+(\.\d+)?/);
  if (!m) return null;
  return { num: parseFloat(m[0]), index: m.index, length: m[0].length };
}
function heroApplyPerRank(text, info, rank) {
  const total = info.num * rank;
  const totalStr = String(Math.round(total * 100) / 100);
  let out = text.slice(0, info.index) + totalStr + text.slice(info.index + info.length);
  out = out.replace(/\s*per rank\.?/i, '');
  return out;
}

function heroFindNode(hero, nodeId) {
  const tree = TREES[hero.classId];
  if (!tree) return null;
  for (let i = 0; i < tree.branches.length; i++) {
    const br = tree.branches[i];
    for (let j = 0; j < br.nodes.length; j++) {
      if (br.nodes[j].id === nodeId) return { node: br.nodes[j], branch: br };
    }
  }
  return null;
}

function heroNodeSheet(hero, nodeId) {
  const found = heroFindNode(hero, nodeId);
  if (!found) return;
  const node = found.node, branch = found.branch;
  const rank = hero.skills[nodeId] || 0;
  const gate = canLearn(hero, nodeId);
  const req = BALANCE.tree.rowRequirements[node.row] || 0;

  const perRank = heroPerRankInfo(node.text);
  let nowLine, nextLine = null;
  if (perRank) {
    nowLine = rank > 0 ? heroApplyPerRank(node.text, perRank, rank) : 'Not learned yet.';
    if (rank < node.maxRank) nextLine = heroApplyPerRank(node.text, perRank, rank + 1);
  } else {
    nowLine = rank > 0 ? node.text : 'Not learned yet.';
    if (rank === 0 && node.maxRank === 1) nextLine = node.text;
  }

  let body = '<div class="stack-s">';
  body += heroSheetRow('Type', heroTypeLabel(node.type));
  body += heroSheetRow('Rank', rank + ' / ' + node.maxRank);
  body += heroSheetRow('Row requirement', req > 0 ? 'Needs ' + fmtNum(req) + ' in ' + branch.name : 'None');
  body += '</div><div class="divider"></div>';
  body += '<div class="small"><strong>Effect now:</strong> ' + esc(nowLine) + '</div>';
  if (nextLine) body += '<div class="small" style="margin-top:6px"><strong>At next rank:</strong> ' + esc(nextLine) + '</div>';
  if (node.type === 'rite' && node.rite) {
    let riteInfo = heroRiteKindLabel(node.rite.kind);
    if (node.rite.cooldownH) riteInfo += ', cooldown ' + fmtTime(node.rite.cooldownH * 3600000);
    if (node.rite.durationH) riteInfo += ', lasts ' + fmtTime(node.rite.durationH * 3600000);
    body += '<div class="divider"></div><div class="small muted">' + esc(riteInfo) + '</div>';
  }

  const foot = '<div class="stack-s">' +
    (!gate.ok ? '<div class="tiny muted">' + esc(gate.reason || '') + '</div>' : '') +
    '<button class="btn btn-primary btn-block" data-act="learn" data-node="' + node.id + '"' +
      (gate.ok ? '' : ' disabled') + '>Learn</button>' +
  '</div>';

  openSheet({
    title: node.name,
    body: body,
    foot: foot,
    onAct: function (act) { heroNodeSheetAct(act, hero, node); }
  });
}

function heroNodeSheetAct(act, hero, node) {
  if (act === 'learn') {
    const res = learnNode(hero, node.id);
    if (!res.ok) { toast(res.reason); return; }
    closeSheet(); refresh();
  }
}

function heroRiteSlotsBlock(hero) {
  let html = '<div class="section-title">Rites</div><div class="stack-s">';
  // Renown rank 9 adds a fourth slot, so read the count rather than the array.
  const slots = heroRiteSlots(hero);
  for (let i = 0; i < slots.length; i++) {
    html += heroRiteSlotRow(hero, i, slots[i]);
  }
  html += '</div>';
  return html;
}

function heroRiteSlotRow(hero, slotIdx, riteId) {
  if (!riteId) {
    return '<button class="card card-tap row-between" data-act="riteSlot" data-slot="' + slotIdx + '">' +
      '<span class="small muted">Empty rite slot</span>' + icon('ico-plus') +
    '</button>';
  }
  const st = riteState(hero, riteId);
  if (!st) {
    return '<div class="card row-between"><span class="small muted">Unknown rite</span></div>';
  }
  let statusText, statusColor = 'var(--bone)';
  if (st.primed) { statusText = 'Primed'; statusColor = 'var(--corona)'; }
  else if (st.activeUntil && st.activeUntil > now()) {
    statusText = 'Active, ' + fmtTime(st.activeUntil - now()) + ' left'; statusColor = 'var(--corona)';
  } else if (st.cooldown > 0) {
    statusText = 'Recharging, ' + fmtTime(st.cooldown) + ' left'; statusColor = 'var(--ash)';
  } else if (st.ready) {
    statusText = 'Ready'; statusColor = 'var(--bone)';
  } else {
    statusText = 'Not ready'; statusColor = 'var(--ash)';
  }

  return '<button class="card card-tap row-between" data-act="riteSlot" data-slot="' + slotIdx + '">' +
    '<span class="small">' + esc(st.node.name) + '</span>' +
    '<span class="small" style="color:' + statusColor + '">' + esc(statusText) + '</span>' +
  '</button>';
}

function heroRiteSlotSheet(hero, slotIdx) {
  const riteId = hero.riteSlots[slotIdx];
  if (riteId) {
    const st = riteState(hero, riteId);
    openSheet({
      title: st && st.node ? st.node.name : 'Rite',
      body: '<p class="small muted">Remove this rite from its slot? Rites are invoked from the Descend tab.</p>',
      foot: '<button class="btn btn-danger btn-block" data-act="clearRite">Clear slot</button>',
      onAct: function (act) { heroRiteSlotSheetAct(act, hero, slotIdx, null); }
    });
    return;
  }
  const learned = learnedRites(hero);
  const available = learned.filter(function (n) { return hero.riteSlots.indexOf(n.id) < 0; });
  let body;
  if (!available.length) {
    body = '<p class="small muted">No learned rites available. Learn a rite in the skill tree first.</p>';
  } else {
    body = '<div class="stack-s">' + available.map(function (n) {
      return '<button class="card card-tap" data-act="pickRite" data-node="' + n.id + '">' +
        '<span class="small">' + esc(n.name) + '</span>' +
      '</button>';
    }).join('') + '</div>';
  }
  openSheet({
    title: 'Slot a rite',
    body: body,
    onAct: function (act, node) { heroRiteSlotSheetAct(act, hero, slotIdx, node); }
  });
}

function heroRiteSlotSheetAct(act, hero, slotIdx, node) {
  if (act === 'clearRite') {
    hero.riteSlots[slotIdx] = null;
    save();
    closeSheet(); refresh();
  } else if (act === 'pickRite') {
    const nodeId = node.dataset.node;
    const existingIdx = hero.riteSlots.indexOf(nodeId);
    if (existingIdx >= 0) hero.riteSlots[existingIdx] = null;
    hero.riteSlots[slotIdx] = nodeId;
    save();
    closeSheet(); refresh();
  }
}

/* ============================================================
   DISPATCH
   ============================================================ */
function heroOnAct(act, node, ev) {
  const hero = state && state.hero;
  if (!hero) return;

  if (act === 'seg') { heroTab = node.dataset.seg; refresh(); return; }
  if (act === 'sort') { heroSort = node.dataset.sort; refresh(); return; }
  if (act === 'item') {
    const found = heroFindItem(hero, node.dataset.item);
    if (found) heroOpenItemSheet(hero, found.item, found.loc);
    return;
  }
  if (act === 'stathelp') { heroStatsHelpSheet(); return; }
  if (act === 'stat') { heroStatSheet(hero, node.dataset.stat); return; }
  if (act === 'node') { heroNodeSheet(hero, node.dataset.node); return; }
  if (act === 'riteSlot') { heroRiteSlotSheet(hero, parseInt(node.dataset.slot, 10)); return; }
}

VIEWS.hero = {
  render: heroRender,
  onAct: heroOnAct
};
/* ============================================================
   VIEWS.town - SPEC 13, 19.4
   Three places in Phase 1: the Last Chapel, the Forge, the Market.
   ============================================================ */

/* Which place is open. null = the hub grid. */
let townPlace = null;
let townMarketTab = 'buy';

const TOWN_KEEPERS = {
  chapel: 'Sister Maren',
  forge: 'Brannoch',
  market: 'Vell'
};

/* Each place in town carries its own accent, on its hub tile and again at
   the top of its page, so the hub reads as five different doors instead of
   one card repeated five times. Palette tokens only (CLAUDE.md). */
const TOWN_ACCENTS = {
  chapel: 'corona',
  forge: 'brass',
  market: 'bone',
  bounty: 'blood-light',
  labour: 'ash'
};
function townAccent(place) { return 'var(--' + (TOWN_ACCENTS[place] || 'edge') + ')'; }

/* ---- small shared helpers ---- */

/* `opts.sticky` keeps the row visible while the page scrolls under it. */
function townCurrencyRow(hero, opts) {
  opts = opts || {};
  let out = '<div class="row wrap small num' + (opts.sticky ? ' res-sticky' : '') + '" style="gap:14px">' +
    '<span class="row" style="gap:4px">' + icon('ico-coin', 'coin') + fmtNum(hero.gold) + '</span>';
  if (opts.ash) out += '<span class="row" style="gap:4px">' + icon('ico-ash') + fmtNum(hero.ash) + ' Ash</span>';
  if (opts.shards) out += '<span class="row" style="gap:4px">' + icon('ico-star') + fmtNum(hero.starshards) + ' Starshards</span>';
  out += '</div>';
  return out;
}

/* `place` is optional: when given, the title carries that place's accent and
   the header sits on a hairline of the same colour, so a page looks like the
   tile it was opened from. */
function townHeader(title, place) {
  const accent = place ? townAccent(place) : '';
  return '<div class="row-between" style="margin-bottom:12px' +
      (accent ? ';padding-bottom:10px;border-bottom:1px solid ' + accent : '') + '">' +
    '<button class="btn btn-sm btn-ghost" data-act="back">' + icon('ico-chevron-left') + '<span>Town</span></button>' +
    '<h2 style="font-size:1.25rem;margin:0' + (accent ? ';color:' + accent : '') + '">' + esc(title) + '</h2>' +
    '<span style="width:44px;flex:0 0 auto"></span>' +
  '</div>';
}

function townItemLabel(item) {
  if (item.rarity === 'rare') {
    return '<div style="font-weight:600">' + esc(item.name) + '</div>' +
      '<div class="tiny muted">' + esc(item.baseType) + '</div>';
  }
  return '<div style="font-weight:600">' + esc(item.baseType) + '</div>';
}

function townAffixLines(item) {
  if (!item.affixes || !item.affixes.length) return '';
  const parts = item.affixes.map(function (a) {
    const def = AFFIXES[a.id];
    if (!def) return '';
    return def.text.replace('X', fmtNum(a.value));
  }).filter(Boolean);
  if (!parts.length) return '';
  return '<div class="tiny muted">' + esc(parts.join(' · ')) + '</div>';
}

function townBadge(item) {
  const r = RARITIES[item.rarity];
  if (!r) return '';
  return '<span class="badge rar-' + item.rarity + '">' + r.badge + '</span>';
}

function townFindInvItem(hero, id) {
  return hero.inventory.find(function (i) { return i.id === id; }) || null;
}

function townFindOwnedItem(hero, id) {
  for (const slot in hero.equipment) {
    if (hero.equipment[slot] && hero.equipment[slot].id === id) return hero.equipment[slot];
  }
  return townFindInvItem(hero, id);
}

function townIsEquipped(hero, item) {
  for (const slot in hero.equipment) {
    if (hero.equipment[slot] === item) return true;
  }
  return false;
}

/* ============================================================
   STATUS LINES (hub tiles)
   ============================================================ */

function townChapelStatus(hero) {
  if (hero.fallenUntil > now()) {
    return 'Revive: ' + fmtNum(reviveCost(hero)) + ' gold';
  }
  const gate = canHeal(hero);
  if (!gate.ok) return gate.reason;
  const q = healQuote(hero, 0.25);
  if (q.restored <= 0) return 'At full HP';
  return 'Heal 25%: ' + fmtNum(q.gold) + ' gold';
}

function townForgeStatus(hero) {
  return fmtNum(hero.ash) + ' Ash · ' + fmtNum(hero.starshards) + ' Starshards';
}

function townMarketStatus(hero) {
  const left = Math.max(0, (hero.market.restockAt || 0) - now());
  return 'Restocks in ' + fmtTime(left);
}

/* ============================================================
   HUB - grid of place tiles, SPEC 19.4
   ============================================================ */

function townTile(place, title, status, iconId, countdown) {
  const cdAttr = countdown ? ' data-town-cd="' + countdown + '" data-town-cd-tmpl="' + place + '"' : '';
  const accent = townAccent(place);
  return '<button class="card card-tap" data-act="open" data-place="' + place + '" style="min-height:44px;' +
      'border-left:3px solid ' + accent + '">' +

      '<span style="color:' + accent + ';display:inline-flex">' + icon(iconId) + '</span>' +
      '<div class="grow">' +

      '</div>' +

    '<div class="divider" style="margin:10px 0 8px"></div>' +
    '<div class="small"' + cdAttr + '>' + esc(status) + '</div>' +

}

function townRenderHub(hero) {
  return '<div class="stack">' +
    townTile('chapel', 'The Last Chapel', townChapelStatus(hero), 'ico-chapel') +

}

/* ============================================================
   THE LAST CHAPEL - SPEC 13.1
   ============================================================ */

function townRenderChapel(hero) {
  let out = townHeader('The Last Chapel', 'chapel') + townCurrencyRow(hero);

  if (hero.fallenUntil > now()) {
    const left = hero.fallenUntil - now();
    const cost = reviveCost(hero);
    const afford = hero.gold >= cost;
    out += '<div class="section-title">Fallen</div>' +
      '<div class="card">' +
        '<div class="risk risk-deadly">' + icon('ico-deadly') + '<span>Fallen</span></div>' +
        '<div class="small muted" style="margin-top:6px" data-town-cd="' + hero.fallenUntil + '" data-town-cd-tmpl="fallen">' +
          'Time left: ' + fmtTime(left) +
        '</div>' +
        '<div style="margin-top:14px">' +
          '<button class="btn btn-primary btn-block btn-lg" data-act="revive"' + (afford ? '' : ' disabled') + '>' +
            'Revive — ' + fmtNum(cost) + ' gold' +
          '</button>' +
        '</div>' +
      '</div>';
    out += townRenderRespec(hero);
    return out;
  }

  const gate = canHeal(hero);
  out += '<div class="section-title">Heal</div>';
  if (!gate.ok) {
    out += '<p class="small muted">' + esc(gate.reason) + '</p>';
  } else {
    out += '<p class="tiny muted">Healing costs more each time you heal within a day.</p>';
    const options = [ [0.25, 'Heal 25%'], [0.5, 'Heal 50%'], [1, 'Heal to full'] ];
    out += '<div class="stack-s">';
    options.forEach(function (opt) {
      const frac = opt[0], label = opt[1];
      const q = healQuote(hero, frac);
      const disabled = q.restored <= 0 || hero.gold < q.gold;
      out += '<div class="row-between panel">' +
        '<div>' +
          '<div style="font-weight:600">' + esc(label) + '</div>' +
          '<div class="small muted">Restores ' + fmtNum(q.restored) + ' HP</div>' +
        '</div>' +
        '<button class="btn btn-sm' + (disabled ? '' : ' btn-primary') + '" data-act="heal" data-frac="' + frac + '"' +
          (disabled ? ' disabled' : '') + '>' + fmtNum(q.gold) + ' gold</button>' +
      '</div>';
    });
    out += '</div>';
  }

  out += townRenderRespec(hero);
  return out;
}

function townRenderRespec(hero) {
  const cost = respecCost(hero);
  const free = hero.level < BALANCE.tree.respecFreeBelowLevel;
  const afford = hero.gold >= cost;
  return '<div class="section-title">Respec</div>' +
    '<div class="row-between panel">' +
      '<div>' +
        '<div style="font-weight:600">Respec your skills</div>' +
        '<div class="small muted">' + (free ? 'Free below level ' + BALANCE.tree.respecFreeBelowLevel + '.' : 'Refunds every point.') + '</div>' +
      '</div>' +
      '<button class="btn btn-sm" data-act="respec"' + (afford ? '' : ' disabled') + '>' +
        (cost > 0 ? fmtNum(cost) + ' gold' : 'Free') +
      '</button>' +
    '</div>';
}

/* ============================================================
   THE FORGE - SPEC 13.2
   ============================================================ */

function townRenderForge(hero) {
  let out = townHeader('The Forge', 'forge') +
    townCurrencyRow(hero, { ash: true, shards: true, sticky: true });

  // ---- Salvage ----
  out += '<div class="section-title">Salvage</div>';
  const salvageable = hero.inventory.filter(function (i) { return !i.locked; });

    out += '<div class="stack-s">';

      out += '<div class="row-between panel">' +

      '</div>';
    });

  hero.inventory.forEach(function (i) { owned.push(i); });
  if (!owned.length) {
    out += '<p class="small muted">No items to temper.</p>';
  } else {
    out += '<div class="stack-s">';
    owned.forEach(function (item) {
      const c = temperCost(item);
      const equippedTag = townIsEquipped(hero, item) ? ' <span class="tiny muted">(equipped)</span>' : '';

        '<div class="row" style="gap:8px">' +
          townBadge(item) +

          '+' + c.to + ': ' + fmtNum(c.gold) + 'g' +
          (c.ash ? ', ' + fmtNum(c.ash) + ' Ash' : '') +

        '</button>';
      }
      out += '</div>';
    });
    out += '</div>';
  }

  return out;
}

   THE MARKET - SPEC 13.3

function townRenderMarket(hero) {

  out += '<p class="small muted" data-town-cd="' + hero.market.restockAt + '" data-town-cd-tmpl="market">' +

        const delta = Math.round(powerDelta(hero, item));
        out += '<div class="card">' +
          '<div class="row" style="gap:8px">' +
            townBadge(item) +
            '<div class="grow">' + townItemLabel(item) +
              '<div class="tiny muted">ilvl ' + fmtNum(item.ilvl) + '</div>' +
              townAffixLines(item) +
              '<div>' + powerArrow(delta) + '</div>' +
            '</div>' +
          '</div>' +
          '<div style="margin-top:10px">' +
            '<button class="btn btn-block' + (afford ? ' btn-primary' : '') + '" data-act="buy" data-id="' + esc(item.id) + '"' +
              (afford ? '' : ' disabled') + '>Buy — ' + fmtNum(price) + ' gold</button>' +
          '</div>' +
        '</div>';
      });
      out += '</div>';
    }
  } else {
    const sellable = hero.inventory.filter(function (i) { return !i.locked; });
    if (!sellable.length) {
      out += '<p class="small muted">Nothing unlocked to sell.</p>';
    } else {
      out += '<div class="stack-s">';
      sellable.forEach(function (item) {
        const price = sellPrice(hero, item);
        out += '<div class="row-between panel">' +
          '<div class="row" style="gap:8px">' +
            townBadge(item) +
            '<div>' + townItemLabel(item) + '</div>' +
          '</div>' +
          '<button class="btn btn-sm" data-act="sell" data-id="' + esc(item.id) + '">' +
            'Sell — ' + fmtNum(price) + ' gold' +
          '</button>' +
        '</div>';
      });
      out += '</div>';
    }
  }

  return out;
}

VIEWS.town = {
  render: function () {
    const hero = state && state.hero;
    if (!hero) {
      return '<div class="card"><p class="muted small">No hero yet.</p></div>';
    }
    if (townPlace === 'chapel') return townRenderChapel(hero);
    if (townPlace === 'forge') return townRenderForge(hero);
    if (townPlace === 'market') return townRenderMarket(hero);
    return townRenderHub(hero);
  },

  tick: function () {
    const host = el('view');
    if (!host) return;
    const nodes = host.querySelectorAll('[data-town-cd]');
    nodes.forEach(function (n) {
      const target = parseInt(n.getAttribute('data-town-cd'), 10) || 0;
      const tmpl = n.getAttribute('data-town-cd-tmpl');
      const left = Math.max(0, target - now());
      n.textContent = tmpl === 'fallen' ? 'Time left: ' + fmtTime(left) : 'Restocks in ' + fmtTime(left);
    });
  },

  onAct: function (act, node) {
    const hero = state && state.hero;
    if (!hero) return;

    if (act === 'open') { townPlace = node.dataset.place; townMarketTab = 'buy'; refresh(); return; }
    if (act === 'back') { townPlace = null; refresh(); return; }

    if (act === 'heal') {
      const r = healHero(hero, parseFloat(node.dataset.frac));
      if (!r.ok) toast(r.reason); else toast('Healed ' + fmtNum(r.restored) + ' HP.');
      refresh();
      return;
    }

    if (act === 'revive') {
      const r = reviveHero(hero);
      if (!r.ok) toast(r.reason); else toast('Revived.');
      refresh();
      return;
    }

    if (act === 'respec') {
      const cost = respecCost(hero);
      confirmSheet({
        title: 'Respec your skills?',
        body: 'This refunds every skill point and empties your rite slots.' +
          (cost > 0 ? ' It costs ' + fmtNum(cost) + ' gold.' : ' It is free below level ' + BALANCE.tree.respecFreeBelowLevel + '.'),
        yes: 'Respec',
        danger: true,
        onYes: function () {
          const r = respec(hero);
          if (!r.ok) toast(r.reason); else toast('Skills reset.');
          refresh();
        }
      });
      return;
    }

    if (act === 'salvage') {
      const item = townFindInvItem(hero, node.dataset.id);
      if (!item) return;
      const r = salvageItem(hero, item);
      if (!r.ok) toast(r.reason);
      else toast('Salvaged for ' + fmtNum(r.yield.ash) + ' Ash' + (r.yield.shards ? ' and ' + fmtNum(r.yield.shards) + ' Starshards' : '') + '.');
      refresh();
      return;
    }

    if (act === 'bulk') {
      const rarity = node.dataset.rarity;
      const p = bulkSalvagePreview(hero, rarity);
      if (p.count <= 0) { toast('Nothing to salvage.'); return; }
      confirmSheet({
        title: 'Salvage ' + fmtNum(p.count) + ' item' + (p.count === 1 ? '' : 's') + '?',
        body: 'Yields ' + fmtNum(p.ash) + ' Ash' + (p.shards ? ' and ' + fmtNum(p.shards) + ' Starshards' : '') + '.',
        yes: 'Salvage',
        danger: true,
        onYes: function () {
          bulkSalvage(hero, rarity);
          refresh();
          toast('Salvaged.');
        }
      });
      return;
    }

    if (act === 'temper') {
      const item = townFindOwnedItem(hero, node.dataset.id);
      if (!item) return;
      const r = temperItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Tempered to +' + r.to + '.');
      refresh();
      return;
    }

    if (act === 'markettab') { townMarketTab = node.dataset.tab; refresh(); return; }

    if (act === 'buy') {
      const item = (hero.market.stock || []).find(function (i) { return i.id === node.dataset.id; });
      if (!item) return;
      const r = buyItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Bought ' + (item.rarity === 'rare' ? item.name : item.baseType) + '.');
      refresh();
      return;
    }

    if (act === 'sell') {
      const item = townFindInvItem(hero, node.dataset.id);
      if (!item) return;
      const r = sellItem(hero, item);
      if (!r.ok) toast(r.reason); else toast('Sold for ' + fmtNum(r.gold) + ' gold.');
      refresh();
      return;
    }
  }
};
/* ============================================================
   HALLS TAB — Codex (SPEC §17.1, §19.5)
   Phase 1: story cards only. No Records, Champions, Achievements,
   Armory or Titles (Phase 3), and no lore-page section (Phase 2).
   ============================================================ */

/* Which story cards exist in Phase 1, and how each maps to an act.
   Kept in one place, commented, so Phase 2 can extend it with lore
   pages and the rest of §14.3's cards (act3, champion, act4, god)
   without touching the render logic below.
   - An intro card is named 'act<N>' and belongs to ACTS[N-1] directly.
   - A guardian card shares its id with the BALANCE.guardians entry;
     its act is derived from the floor that guardian stands on via
     actForFloor(), so nothing about "which act" is hardcoded twice. */
const HALLS_PHASE1_CARDS = ['act1', 'warden', 'act2', 'vael'];

/* The act a given story card belongs to, derived from data rather than
   a fixed id->act table. Falls back to Act I only if a future card id
   matches neither pattern (should not happen for cards listed above). */
function hallsActForCard(cardId) {
  const introMatch = /^act(\d+)$/.exec(cardId);
  if (introMatch) return ACTS[Number(introMatch[1]) - 1] || ACTS[0];
  const gd = BALANCE.guardians[cardId];
  if (gd) return actForFloor(gd.floor);
  return ACTS[0];
}

/* A short human title for a card, e.g. "The Breach" (act1) or
   "The Hollow Warden" (warden). Derived the same way as the act
   mapping above: an intro card takes its act's name, a guardian card
   takes its act's guardian name. */
function hallsCardTitle(cardId) {
  const introMatch = /^act(\d+)$/.exec(cardId);
  if (introMatch) {
    const act = ACTS[Number(introMatch[1]) - 1];
    return act ? act.name : cardId;
  }
  const gd = BALANCE.guardians[cardId];
  if (gd) {
    const act = actForFloor(gd.floor);
    return act ? act.guardian : cardId;
  }
  return cardId;
}

/* The sheet markup shared by a freshly-unlocked card and a re-read of
   an already-seen one: act name in the title bar, the card's title and
   text as the game's most atmospheric moment, one full-width Continue
   button in the footer. */
function hallsCardSheetOpts(cardId, onAct) {
  const card = STORY_CARDS[cardId];
  const act = hallsActForCard(cardId);
  const title = hallsCardTitle(cardId);
  return {
    title: act ? act.display : '',
    body:
      '<div class="stack">' +
        // The sheet header already carries the act; only add a title when it differs.
        (act && title === act.name ? '' :
          '<h3 class="display" style="font-size:1.4rem;margin:0">' + esc(title) + '</h3>') +
        '<p style="line-height:1.75;background:var(--raised);' +
          'border-radius:var(--radius);padding:14px;max-width:34em">' +
          esc(card.text) +
        '</p>' +
      '</div>',
    // The sheet footer is already padded; a sticky dock inside it would double up.
    foot: '<button class="btn btn-primary btn-block btn-lg" data-act="continue">Continue</button>',
    onAct: onAct
  };
}

/* Shared helper: show a story card in a sheet, save it to the account
   Codex, and hand control back via onDone once the sheet is closed.
   Safe to call with no onDone. A card the account has already seen is
   skipped entirely (§14.3) and onDone runs right away. */
function showStoryCard(cardId, onDone) {
  const card = STORY_CARDS[cardId];
  if (!card) { if (onDone) onDone(); return; }

  const seen = state.account.codex.indexOf(cardId) >= 0;
  if (seen) { if (onDone) onDone(); return; }

  state.account.codex.push(cardId);
  save();

  openSheet(Object.assign(
    hallsCardSheetOpts(cardId, function (a) { if (a === 'continue') closeSheet(); }),
    { onClose: function () { if (onDone) onDone(); } }
  ));
}

/* Open the same sheet for an already-seen card (tapped from the Codex
   list). No codex write and no onDone — this is just re-reading lore
   the account already has. */
function hallsOpenSeenCard(cardId) {
  if (!STORY_CARDS[cardId]) return;
  openSheet(hallsCardSheetOpts(cardId, function (a) { if (a === 'continue') closeSheet(); }));
}

/* One row: a seen card (tappable, opens the sheet) or a locked row
   (act name + "Not yet found", no text revealed). */
function hallsCardRow(cardId) {
  const seen = state.account.codex.indexOf(cardId) >= 0;
  const act = hallsActForCard(cardId);

  if (!seen) {
    // Reveal nothing about an unfound card - not its title, not its trigger.
    return (
      '<div class="row muted" style="min-height:44px">' +
        icon('ico-lock') +
        '<div class="grow">Not yet found</div>' +
      '</div>'
    );
  }

  const title = hallsCardTitle(cardId);
  return (
    // No unlock icon on a found entry: it reads too close to the lock beside
    // it and made the list busy. The title and the chevron are the signal.
    '<button type="button" class="card-tap row row-indent" data-act="card" data-card="' + esc(cardId) + '">' +
      '<div class="grow">' +
        '<div>' + esc(title) + '</div>' +
        '<div class="muted tiny">' + esc(STORY_CARDS[cardId] ? STORY_CARDS[cardId].when : '') + '</div>' +
      '</div>' +
      icon('ico-chevron-right') +
    '</button>'
  );
}

VIEWS.halls = {
  render: function () {
    const codex = (state.account && state.account.codex) || [];
    const foundCount = HALLS_PHASE1_CARDS.filter(function (id) { return codex.indexOf(id) >= 0; }).length;

    // Group the Phase 1 cards under their acts, in ACTS order. Acts III
    // and IV have no Phase 1 cards yet, so their card list is empty —
    // still show the heading (Phase 2 fills it in), nothing beneath it.
    const sections = ACTS.map(function (act) {
      const ids = HALLS_PHASE1_CARDS.filter(function (id) {
        const a = hallsActForCard(id);
        return a && a.id === act.id;
      });
      return { act: act, ids: ids };
    });

    let html = '<div class="card">' +
      '<h2 style="font-size:1.5rem;margin:0">Codex</h2>' +
      '<p class="muted small" style="margin-top:6px">' +
        esc(foundCount + ' of ' + HALLS_PHASE1_CARDS.length + ' found') +
      '</p>' +
    '</div>';

    // Acts with no Phase 1 cards are left out entirely. An empty act heading
    // would be a placeholder for unbuilt content, which Phase 1 does not ship.
    sections.forEach(function (sec) {
      if (!sec.ids.length) return;
      html += '<h3 class="display" style="font-size:1.125rem;margin:18px 0 8px">' + esc(sec.act.display) + '</h3>';
      html += '<div class="card stack-s">' + sec.ids.map(hallsCardRow).join('') + '</div>';
    });

    return html;
  },

  onAct: function (act, node) {
    if (act === 'card') {
      const cardId = node.dataset.card;
      hallsOpenSeenCard(cardId);
    }
  }
};

/* ============================================================

const DEBUG = new URLSearchParams(location.search).get('debug') === '1';

/* The pit has no cap, but a number input needs one. This only bounds the
   debug "unlock floors up to" control. */
const DEBUG_MAX_FLOOR = 200;

function mountDebug() {
  if (!DEBUG) return;
  const fab = h('<button id="debug-fab" aria-label="Debug panel">DBG</button>');
  fab.addEventListener('click', openDebug);
  document.body.appendChild(fab);
}

/* Gold worth 10 par descents at the hero's deepest floor, measured with
   the real engine rather than guessed. */
function tenParDescentsOfGold(hero) {
  const f = Math.max(1, Math.min(hero.deepest, BALANCE.phase.maxFloor));
  const sim = simulate({ floor: f, runs: 25, tag: 'grant', makeHero: function () { return parHero(f, 'neutral'); } });
  return Math.max(10, Math.round(sim.meanGold * 10));
}

function openDebug() {

        '<label class="field grow"><span>Rarity</span><select id="dbg-rar">' + rarOpts + '</select></label>' +

      '<div class="section-title">HP</div>' +
      '<div class="dbg-grid">' +
        '<button class="btn btn-sm" data-act="hp-full">Set full</button>' +
        '<button class="btn btn-sm" data-act="hp-one">Set 1</button>' +
        '<button class="btn btn-sm btn-ghost" data-act="clear-fallen">Clear Fallen</button>' +
      '</div>'
      ) : '<p class="tiny muted" style="margin-top:10px">Grants and HP tools need a hero.</p>') +

      '<div class="divider"></div>' +
      '<div class="section-title">Simulator</div>' +
      '<div class="row" style="gap:6px">' +
        '<label class="field grow"><span>Hero</span><select id="sim-hero">' +
          '<option value="neutral">Par, class-neutral</option>' +
          '<option value="juggernaut">Par Juggernaut</option>' +

        '</select></label>' +
        '<label class="field" style="width:84px"><span>Floor</span>' +

      '<div class="row" style="gap:6px">' +
        '<label class="field grow"><span>Path</span><select id="sim-path">' +
